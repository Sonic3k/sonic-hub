name: finance-verify
# Temporary: builds angels-islands-api on the ai/finance-tags branch, boots it on a real PostgreSQL and runs the
# finance smoke tests (the existing flows, then facets and tags on a fresh start). Removed before the branch is merged.
on:
  push:
    branches: [ai/finance-tags]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: angels_islands
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - run: pip install --quiet openpyxl
      - name: Build
        run: mvn -B -f angels-islands-api/pom.xml -DskipTests package 2>&1 | grep -E "ERROR|BUILD|WARN.*finance" | head -80; test ${PIPESTATUS[0]} -eq 0
      - name: Smoke tests
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          SEPAY_API_KEY: testkey
          TZ: Asia/Ho_Chi_Minh
          B2_KEY_ID: dummy
          B2_APP_KEY: dummy
        run: |
          up() {
            PGDATABASE=$1 nohup java -jar angels-islands-api/target/angels-islands-api.jar > api-$1.log 2>&1 &
            echo $! > api.pid
            for i in $(seq 1 90); do curl -sf localhost:8080/actuator/health > /dev/null && return 0; sleep 2; done
            tail -150 api-$1.log; return 1
          }
          up angels_islands
          python3 -u .github/finance_smoke.py 2>&1 | tee smoke.log; test ${PIPESTATUS[0]} -eq 0
          kill $(cat api.pid); sleep 3
          PGPASSWORD=postgres psql -h localhost -U postgres -qc "CREATE DATABASE angels_tags"
          up angels_tags
          python3 -u .github/finance_tags_smoke.py 2>&1 | tee -a smoke.log; test ${PIPESTATUS[0]} -eq 0
      - name: Report as commit comment
        if: always()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          {
            echo "finance-verify: ${{ job.status }}"
            echo '```'
            grep -E "PASSED|Error|Traceback|assert" smoke.log 2>/dev/null | tail -10 || true
            tail -12 smoke.log 2>/dev/null || echo "(no smoke log)"
            echo '```'
            echo 'API log (errors, upgrade):'
            echo '```'
            cat api-*.log 2>/dev/null | grep -E "ERROR|Exception|FinanceSeeder|Widened" | grep -v "DEBUG\|journal_notes\|CommandAcceptance\|PSQLException: ERROR: syntax" | tail -25 | cut -c1-400 || true
            echo '```'
          } > report.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@report.md > /dev/null
