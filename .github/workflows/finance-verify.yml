name: finance-verify
# Temporary: builds angels-islands-api on the ai/finance branch, boots it on a real PostgreSQL and runs the
# finance smoke test. Removed before the branch is merged.
on:
  push:
    branches: [ai/finance]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: angels_islands
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - name: Build
        run: mvn -B -f angels-islands-api/pom.xml -DskipTests package 2>&1 | grep -E "ERROR|BUILD|WARN.*finance" | head -80; test ${PIPESTATUS[0]} -eq 0
      - name: Start API
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGDATABASE: angels_islands
          PGUSER: postgres
          PGPASSWORD: postgres
          SEPAY_API_KEY: testkey
          TZ: Asia/Ho_Chi_Minh
          B2_KEY_ID: dummy
          B2_APP_KEY: dummy
        run: |
          nohup java -jar angels-islands-api/target/angels-islands-api.jar > api.log 2>&1 &
          for i in $(seq 1 90); do curl -sf localhost:8080/actuator/health > /dev/null && break; sleep 2; done
          curl -sf localhost:8080/actuator/health || (tail -150 api.log; exit 1)
      - name: Smoke test
        run: python3 -u .github/finance_smoke.py 2>&1 | tee smoke.log; test ${PIPESTATUS[0]} -eq 0
      - name: Share the jar for local UI checks (temporary branch)
        if: success()
        run: |
          mkdir -p /tmp/jar && cd /tmp/jar
          split -b 45m "$GITHUB_WORKSPACE/angels-islands-api/target/angels-islands-api.jar" api.jar.part-
          ls -la
          git init -q && git checkout -q -b tmp/finance-jar
          git -c user.name=ci -c user.email=ci@localhost add .
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "temporary: API jar for local UI checks"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tmp/finance-jar
      - name: Report as commit comment
        if: always()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          {
            echo "finance-verify: ${{ job.status }}"
            echo '```'
            tail -45 smoke.log 2>/dev/null || echo "(no smoke log)"
            echo '```'
            echo 'API log (errors):'
            echo '```'
            grep -E "ERROR|Exception|WARN.*[Ff]inance" api.log 2>/dev/null | grep -v DEBUG | tail -25 | cut -c1-400 || true
            echo '```'
          } > report.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@report.md > /dev/null
