name: ci
on:
  push:
    branches: [main]
jobs:
  api-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - run: mvn -B -q -f angels-islands-api/pom.xml compile
  admin-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd angels-islands-admin && npm ci --silent && npx tsc --noEmit && npx vite build
