name: learn
on:
  push:
    branches: [main]
    paths: ['sonic-hub-learn/**', '.github/workflows/learn.yml']
  pull_request:
    paths: ['sonic-hub-learn/**', '.github/workflows/learn.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: learn
          POSTGRES_PASSWORD: learn
          POSTGRES_DB: learn
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U learn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: sonic-hub-learn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sonic-hub-learn/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Check content
        run: node api/dist/cli/content.js check
      - name: Tests
        run: npm run test -w @learn/api
        env:
          TEST_DATABASE_URL: postgresql://learn:learn@localhost:5432/learn

  # Loads content into the learn database and uploads media to B2 after every push to main.
  # Needs repository secrets LEARN_DATABASE_URL (Railway Postgres public URL), B2_KEY_ID, B2_APP_KEY.
  sync:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: learn-content-sync
    defaults:
      run:
        working-directory: sonic-hub-learn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sonic-hub-learn/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Sync content
        env:
          DATABASE_URL: ${{ secrets.LEARN_DATABASE_URL }}
          DATABASE_SSL: ${{ secrets.LEARN_DATABASE_SSL }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_REGION: ${{ secrets.B2_REGION }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$B2_KEY_ID" ] || [ -z "$B2_APP_KEY" ]; then
            echo "::notice title=learn content sync skipped::Add the LEARN_DATABASE_URL, B2_KEY_ID and B2_APP_KEY repository secrets to enable it."
            exit 0
          fi
          node api/dist/cli/content.js sync --media b2
