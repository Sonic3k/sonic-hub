name: learn
on:
  push:
    branches: [main]
    paths: ['sonic-hub-learn/**', '.github/workflows/learn.yml']
  pull_request:
    paths: ['sonic-hub-learn/**', '.github/workflows/learn.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: learn
          POSTGRES_PASSWORD: learn
          POSTGRES_DB: learn
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U learn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: sonic-hub-learn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sonic-hub-learn/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Check content
        run: node api/dist/cli/content.js check
      - name: Tests
        run: npm run test -w @learn/api
        env:
          TEST_DATABASE_URL: postgresql://learn:learn@localhost:5432/learn
      - name: Web app (typecheck + build)
        run: npm run build -w @learn/web
