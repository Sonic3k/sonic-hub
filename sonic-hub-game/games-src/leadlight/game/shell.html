<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a2f2c">
<title>/*__TITLE__*/</title>
<!--__ICON__-->
<!--__FONTS__-->
<style>
:root {
  --lead: #2b2830; --lead2: #46424c; --ink: #2d2426; --ink2: #6a5a58; --paper: #fbf6ec; --cream: #f4ead6;
  --brass: #b98f3c; --brass2: #e4c27a; --glow: #fff3d2; --wood: #5b3f2d; --wood2: #7a573e;
  --amber: #e2a62e; --cobalt: #2f62b4; --fen: #3f7d52; --cranberry: #be3a5e; --dunes: #d6773a; --prism: #8f78d2;
  --ruby: #c8304a; --ok: #4d9a5a;
  --title: "Federant", "Marcellus", Georgia, serif; --text: "Alegreya Sans", "Segoe UI", system-ui, sans-serif; --caps: "Alegreya Sans SC", "Alegreya Sans", system-ui, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--text); color: var(--ink); background: #3a2f2c; overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
button { font: inherit; color: inherit; }
img { -webkit-user-drag: none; user-drag: none; -webkit-touch-callout: none; }
.home { position: fixed; z-index: 60; left: 10px; top: calc(8px + var(--safe-t)); font: 500 14px var(--text); color: #fff6e4; text-decoration: none; opacity: .8; text-shadow: 0 1px 3px #0008; }
.home:hover { opacity: 1; }
@media (max-width: 640px) { .home .far { display: none; } }

/* ---------------------------------------------------------------- the room: light through a window onto a wooden table */
#room { position: fixed; inset: 0; background: #3a2f2c center / cover no-repeat; }
#room::after { content: ""; position: absolute; inset: 0; background:
  radial-gradient(120% 80% at 50% 0%, rgba(255,236,190,.20), rgba(60,40,30,.0) 60%),
  linear-gradient(180deg, rgba(40,28,24,.25), rgba(40,28,24,.55)); }
.screen { position: fixed; inset: 0; display: none; z-index: 1; }
.screen.on { display: block; animation: fadeIn .35s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ---------------------------------------------------------------- glass panels and jewels */
.plate {
  position: relative; background: linear-gradient(180deg, rgba(255,251,242,.94), rgba(247,238,220,.94));
  border: 3px solid var(--lead); border-radius: 14px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.7), inset 0 -10px 24px rgba(160,120,60,.12), 0 10px 30px rgba(20,10,10,.35);
}
.jewel {
  --c: var(--brass); position: relative; display: inline-flex; align-items: center; justify-content: center; gap: .4em;
  min-height: 44px; padding: 0 1.15em; border: 3px solid var(--lead); border-radius: 999px; cursor: pointer;
  font: 600 16px var(--text); letter-spacing: .02em; color: #fffaf0; text-shadow: 0 1px 2px rgba(0,0,0,.35);
  background: radial-gradient(120% 140% at 30% 15%, color-mix(in srgb, var(--c) 55%, white) 0%, var(--c) 45%, color-mix(in srgb, var(--c) 70%, black) 100%);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.45), inset 0 -3px 6px rgba(0,0,0,.25), 0 4px 10px rgba(20,10,10,.3);
  transition: transform .12s ease, filter .12s ease, box-shadow .12s ease;
}
.jewel:hover { filter: brightness(1.08); }
.jewel:active { transform: translateY(1px) scale(.98); }
.jewel[disabled] { filter: grayscale(.7) brightness(.85); opacity: .7; cursor: default; }
.jewel.quiet { --c: #8a7a6a; }
.jewel.go { --c: #c0662a; }
.jewel.blue { --c: var(--cobalt); }
.jewel.green { --c: var(--fen); }
.jewel.small { min-height: 36px; font-size: 14px; padding: 0 .9em; border-width: 2px; }
h1, h2, h3 { font-family: var(--title); font-weight: 400; margin: 0; letter-spacing: .01em; }
.caps { font-family: var(--caps); letter-spacing: .06em; }

/* ---------------------------------------------------------------- the front door: who is playing */
#door { display: none; }
#door.on { display: grid; place-items: center; padding: 20px; }
.door-card { width: min(560px, 94vw); padding: 26px 26px 22px; text-align: center; }
.title-glass { display: block; width: min(420px, 82vw); height: auto; margin: -6px auto 6px; filter: drop-shadow(0 6px 14px rgba(40,20,10,.35)); }
.tag { margin: 0 0 18px; color: var(--ink2); font-size: 17px; }
.players { display: grid; gap: 10px; margin: 0 0 16px; }
.player { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 2px solid var(--lead); border-radius: 12px; background: #fffdf8; cursor: pointer; text-align: left; transition: transform .12s, box-shadow .12s; }
.player:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(60,30,10,.18); }
.player .who { flex: 1; font: 600 18px var(--text); }
.player .what { color: var(--ink2); font-size: 14px; }
.player .x { border: 0; background: none; color: var(--ink2); font-size: 20px; cursor: pointer; width: 40px; height: 40px; border-radius: 50%; }
.player .x:hover { background: #0001; }
.newp { display: flex; gap: 8px; }
.newp input { flex: 1; min-width: 0; height: 44px; padding: 0 14px; border: 2px solid var(--lead); border-radius: 999px; font: 500 16px var(--text); background: #fffdf8; color: var(--ink); }
.status { min-height: 18px; margin-top: 10px; color: var(--ink2); font-size: 13px; }

/* ---------------------------------------------------------------- the menu: the atelier */
#menu.on { display: grid; place-items: center; padding: calc(44px + var(--safe-t)) 16px calc(16px + var(--safe-b)); overflow: auto; }
.menu-card { width: min(980px, 96vw); padding: 18px; display: grid; gap: 14px; }
.menu-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.menu-head h2 { flex: 1; font-size: 30px; min-width: 140px; }
.menu-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .menu-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .menu-grid .door:last-child { grid-column: span 2; } }
.door { position: relative; overflow: hidden; display: grid; align-content: end; gap: 2px; min-height: 150px; padding: 12px 14px; border: 3px solid var(--lead); border-radius: 14px 14px 12px 12px; cursor: pointer; text-align: left; color: #fffaf0; background: #554 center / cover; box-shadow: 0 6px 16px rgba(40,20,10,.25); transition: transform .15s, box-shadow .15s; }
.door::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(30,18,16,.8)); }
.door > * { position: relative; }
.door:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(40,20,10,.35); }
.door b { font: 400 22px var(--title); text-shadow: 0 2px 6px #000a; }
.door span { font-size: 14px; opacity: .94; text-shadow: 0 1px 4px #000c; line-height: 1.25; }
.door.big { min-height: 250px; padding: 18px 20px; grid-template-columns: 1fr auto; align-items: end; gap: 6px 18px; }
.door.big b { font-size: 34px; }
.door.big span { font-size: 16px; }
.door.big .who { grid-row: 1 / span 3; grid-column: 2; align-self: end; display: grid; justify-items: center; gap: 4px; }
.door.big .who .face { width: 92px; height: 92px; border-radius: 50%; border: 3px solid var(--lead); overflow: hidden; box-shadow: 0 0 0 3px rgba(255,236,190,.7), 0 6px 16px #0008; }
.door.big .who small { font: 600 12px var(--caps); letter-spacing: .06em; text-shadow: 0 1px 4px #000; }
.door .new { position: absolute; top: 10px; right: 10px; padding: 2px 9px; border-radius: 9px; font: 700 11px var(--caps); letter-spacing: .08em; color: #2a2010; background: #ffe9a8; border: 2px solid var(--lead); }
@media (max-width: 640px) { .door.big { min-height: 190px; } .door.big b { font-size: 28px; } .door.big .who .face { width: 70px; height: 70px; } .door { min-height: 120px; } .door b { font-size: 19px; } .door span { font-size: 13px; } }

/* the purse: coins and Jewels */
.purse { display: inline-flex; align-items: center; gap: 8px; }
.purse span { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px 0 6px; border: 2px solid var(--lead); border-radius: 999px; background: rgba(255,251,242,.94); font: 700 15px var(--text); color: var(--ink); box-shadow: 0 3px 8px rgba(30,15,10,.25); }
.purse i { display: inline-block; width: 22px; height: 22px; flex: none; }
.purse .coin i, i.coin { border-radius: 50%; border: 2px solid var(--lead); background: radial-gradient(circle at 35% 30%, #fff6cc, #f0c24a 45%, #b9831c); box-shadow: inset 0 0 0 2px rgba(255,240,180,.55); }
.purse .gem i, i.gem { border: 0; background: conic-gradient(from 45deg, #b9a2f2, #6a4ac0, #9a7ae8, #4a2e9a, #b9a2f2); clip-path: polygon(50% 0, 100% 38%, 82% 100%, 18% 100%, 0 38%); filter: drop-shadow(0 0 1px #2b2830); }
i.coin, i.gem { display: inline-block; width: 16px; height: 16px; vertical-align: -3px; margin: 0 2px; }
.sheet > header .purse span { background: rgba(255,251,242,.96); }

/* ---------------------------------------------------------------- sheets that list things (decks, the collection, the kiln) */
.sheet { position: fixed; inset: 0; grid-template-rows: auto 1fr; padding: calc(44px + var(--safe-t)) 14px calc(12px + var(--safe-b)); gap: 12px; }
.sheet.on { display: grid; }
.sheet > header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: #fff6e4; }
.sheet > header h2 { flex: 1; font-size: 28px; text-shadow: 0 2px 8px #0008; }
.sheet .body { min-height: 0; overflow: auto; padding: 14px; }
.ladies { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px; }
.lady { display: grid; justify-items: center; gap: 6px; padding: 10px 6px; border: 2px solid transparent; border-radius: 14px; background: none; cursor: pointer; text-align: center; }
.lady:hover { background: #fff8; }
.lady.on { border-color: var(--lead); background: #fffdf6; box-shadow: 0 4px 12px rgba(60,30,10,.18); }
.lady .face { width: 92px; height: 92px; border-radius: 50%; border: 3px solid var(--lead); overflow: hidden; background: #ddd; }
.lady .face img, .face img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lady b { font-size: 15px; line-height: 1.15; }
.lady small { color: var(--ink2); font-size: 13px; }
.tables { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.tables button { min-width: 58px; min-height: 48px; padding: 2px 6px; line-height: 1.1; border: 2px solid var(--lead); border-radius: 10px; background: #fffdf8; cursor: pointer; font: 600 15px var(--text); }
.tables button.on { background: var(--lead); color: #fff6e4; }
.split { display: grid; grid-template-columns: 1fr minmax(280px, 360px); gap: 14px; min-height: 0; }
.split > * { min-height: 0; overflow: auto; }
@media (max-width: 820px) { .split { grid-template-columns: 1fr; } }
.side-note { padding: 14px; }
.side-note h3 { font-size: 22px; margin-bottom: 4px; }
.side-note p { margin: 6px 0; color: var(--ink2); line-height: 1.35; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pick { width: 100%; height: 44px; border: 2px solid var(--lead); border-radius: 10px; background: #fffdf8; font: 500 15px var(--text); padding: 0 10px; color: var(--ink); }

/* ---------------------------------------------------------------- a card */
.card {
  --r: var(--prism); position: relative; width: var(--w, 200px); aspect-ratio: 5 / 7; border: calc(var(--w, 200px) / 66) solid var(--lead); border-radius: calc(var(--w, 200px) / 16);
  background: linear-gradient(160deg, color-mix(in srgb, var(--r) 55%, white), var(--r) 55%, color-mix(in srgb, var(--r) 70%, black));
  box-shadow: inset 0 0 0 calc(var(--w, 200px) / 100) rgba(255,255,255,.45), 0 6px 16px rgba(20,10,10,.35);
  display: grid; grid-template-rows: auto auto auto 1fr auto; padding: calc(var(--w, 200px) / 30); gap: calc(var(--w, 200px) / 60);
  font-size: calc(var(--w, 200px) / 15.5); color: var(--ink); overflow: hidden; container-type: inline-size;
}
.card .top { display: flex; align-items: center; gap: .35em; min-height: 1.6em; }
.card .cost { flex: none; width: 1.75em; height: 1.75em; border-radius: 50%; display: grid; place-items: center; font: 700 1.05em var(--text); color: #2a2010; border: .12em solid var(--lead);
  background: radial-gradient(circle at 35% 30%, #fffbe2, #f6d872 45%, #d29a26); box-shadow: 0 0 .5em rgba(255,220,120,.7); }
.card .name { flex: 1; min-width: 0; font: 400 1.02em/1.05 var(--title); color: #fffaf0; text-shadow: 0 1px 2px #0009, 0 0 6px #0004; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .pic-w { position: relative; border: .13em solid var(--lead); border-radius: 50% 50% .3em .3em / 22% 22% .3em .3em; overflow: hidden; aspect-ratio: 5 / 4; background: #ccc; }
.card .pic-w img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .line { font: 500 .72em var(--caps); color: #fffaf0; letter-spacing: .07em; text-shadow: 0 1px 2px #0008; text-align: center; }
.card .text { padding: .35em .45em; border: .1em solid rgba(43,40,48,.75); border-radius: .4em; background: linear-gradient(180deg, rgba(255,253,246,.93), rgba(245,236,218,.93)); font-size: .78em; line-height: 1.22; overflow: hidden; }
.card .stats { display: flex; justify-content: space-between; align-items: center; gap: .3em; }
.card .st { display: inline-flex; align-items: center; justify-content: center; min-width: 1.9em; height: 1.55em; padding: 0 .35em; border-radius: .8em; border: .1em solid var(--lead); font: 700 .92em var(--text); color: #fffaf0; text-shadow: 0 1px 1px #0008; }
.card .st.atk { background: linear-gradient(180deg, #e07050, #a8302a); }
.card .st.def { background: linear-gradient(180deg, #6aa0e0, #2c5aa8); }
.card .st.gl { background: linear-gradient(180deg, #f0d070, #b88820); color: #2a2010; text-shadow: none; }
.card .st.gl::before { content: "✦ "; }
.card .ed { position: absolute; right: .55em; top: 2.35em; padding: .1em .45em; border-radius: .6em; font: 600 .6em var(--caps); letter-spacing: .08em; background: rgba(255,250,235,.9); border: .1em solid var(--lead); }
.card.mini { --w: 96px; grid-template-rows: auto auto 1fr auto; }
.card.mini .text, .card.mini .line { display: none; }
.card.mini .name { font-size: .95em; }
.card.back { background: repeating-conic-gradient(from 22.5deg, #5a3f8a 0 45deg, #7a5ab0 0 90deg), #5a3f8a; }
.card.back::after { content: ""; position: absolute; inset: 12%; border: .15em solid rgba(255,240,200,.7); border-radius: 50%; box-shadow: inset 0 0 1em rgba(255,240,200,.6); }
.r0 { --r: var(--amber); } .r1 { --r: var(--cobalt); } .r2 { --r: var(--fen); } .r3 { --r: var(--cranberry); } .r4 { --r: var(--dunes); } .r5 { --r: var(--prism); }
.card.e-Gilded { box-shadow: inset 0 0 0 .2em rgba(255,226,140,.95), 0 0 14px rgba(255,210,90,.55), 0 6px 16px rgba(20,10,10,.35); }
.card.e-Obsidian { --r: #3b3156; box-shadow: inset 0 0 0 .2em rgba(200,190,255,.6), 0 0 14px rgba(150,120,255,.45), 0 6px 16px rgba(20,10,10,.35); }
img.pic { opacity: 0; transition: opacity .25s ease; }
img.pic.ready { opacity: 1; }

/* ---------------------------------------------------------------- the battle: a light table */
#battle { overflow: hidden; }
.table { --lane-h: clamp(96px, calc((100dvh - 380px) / 2), 230px); position: absolute; inset: 0; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); padding: calc(40px + var(--safe-t)) 10px calc(6px + var(--safe-b)); gap: 6px; }
.board { display: grid; gap: 6px; justify-self: center; align-self: center; width: min(100%, calc(var(--lane-h) * 4 * 0.92 + 60px)); padding: 10px; border: 3px solid var(--lead); border-radius: 18px;
  background: radial-gradient(120% 90% at 50% 50%, rgba(255,244,214,.20), rgba(40,28,30,.55) 70%), rgba(40,28,30,.5); box-shadow: 0 0 0 2px rgba(255,236,190,.25), 0 14px 40px rgba(0,0,0,.45), inset 0 0 40px rgba(255,230,170,.12); }
.bar { display: flex; align-items: center; gap: 10px; min-height: 64px; color: #fff6e4; }
.bar.them { justify-content: center; }
.hero-w { position: relative; display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; border: 2px solid var(--lead); border-radius: 999px; background: rgba(30,22,26,.72); box-shadow: 0 4px 12px #0005; cursor: pointer; }
.hero-w .face { width: 56px; height: 56px; border-radius: 50%; border: 3px solid var(--lead); overflow: hidden; background: #8888; flex: none; box-shadow: 0 0 0 2px rgba(255,236,190,.5); }
.hero-w .who b { display: block; font: 400 17px var(--title); line-height: 1.1; }
.hero-w .who small { font-size: 12px; opacity: .8; }
.hero-w .lightmini { display: none; gap: 2px; margin-top: 3px; align-items: center; font: 700 11px var(--text); color: #ffe9a8; }
.hero-w .lightmini i { width: 7px; height: 7px; border-radius: 50%; background: #3a3238; border: 1px solid var(--lead); }
.hero-w .lightmini i.on { background: #f6d872; box-shadow: 0 0 5px rgba(255,214,110,.8); }
.hpbar { position: relative; width: 120px; height: 14px; margin-top: 4px; border: 2px solid var(--lead); border-radius: 8px; background: #2a1e22; overflow: hidden; }
.hpbar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(180deg, #ff9a7a, #c8304a); transition: width .5s ease; }
.hpbar span { position: absolute; inset: 0; display: grid; place-items: center; font: 700 11px var(--text); text-shadow: 0 1px 2px #000; }
.hero-w.hit { animation: shake .45s ease; }
@keyframes shake { 0%,100% { transform: none; } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
.ability { position: relative; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--lead); display: grid; place-items: center; font: 700 14px var(--text); color: #2a2010; background: radial-gradient(circle at 35% 30%, #fff6d0, #c9a24a 60%, #8a6a2a); flex: none; }
.ability.ready { animation: pulse 1.4s ease-in-out infinite; cursor: pointer; }
.ability.wait { filter: grayscale(.6) brightness(.75); }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,220,120,.0); } 50% { box-shadow: 0 0 0 6px rgba(255,220,120,.55); } }
.light { display: flex; gap: 3px; align-items: center; }
.light i { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--lead); background: #3a3238; }
.light i.on { background: radial-gradient(circle at 35% 30%, #fffbe2, #f6d872 50%, #d29a26); box-shadow: 0 0 8px rgba(255,214,110,.8); }
.light b { margin-left: 6px; font: 700 15px var(--text); color: #ffe9a8; }
.stack { display: grid; justify-items: center; font-size: 12px; color: #f3e6cc; }
.stack .card { --w: 30px; border-width: 1px; box-shadow: 0 2px 6px #0006; }
.lanes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 100%; height: var(--lane-h); }
.lane { position: relative; border: 3px solid var(--lead); border-radius: 12px; overflow: hidden; background: #6a6070 center / cover; min-height: 0; box-shadow: inset 0 0 0 1px rgba(255,255,255,.35), 0 4px 12px #0004; transition: box-shadow .2s, transform .2s; }
.lane .land { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.lane::after { content: ""; position: absolute; inset: 0; background: radial-gradient(90% 70% at 50% 45%, rgba(255,248,225,.35), rgba(255,248,225,0) 70%); pointer-events: none; }
.lane .bslot { position: absolute; z-index: 2; top: 5px; right: 5px; width: 30%; aspect-ratio: 1; }
.them .lane .bslot { top: auto; bottom: 5px; left: 5px; right: auto; }
.lane .cslot { position: absolute; z-index: 1; inset: 15% 7% 5% 7%; display: grid; place-items: center; }
.them .lane .cslot { inset: 5% 7% 15% 7%; }
.lane.can { box-shadow: 0 0 0 3px #ffe9a8, 0 0 18px rgba(255,220,120,.85); cursor: pointer; }
.lane.can::before { content: ""; position: absolute; inset: 0; z-index: 3; background: rgba(255,240,190,.18); pointer-events: none; }
.lane.over { transform: scale(1.03); box-shadow: 0 0 0 4px #fff3c4, 0 0 26px rgba(255,220,120,1); }
.lane.fight { box-shadow: 0 0 0 4px #ff9a6a, 0 0 22px rgba(255,120,80,.9); }
.lane .tag { position: absolute; z-index: 3; left: 50%; top: 4px; transform: translateX(-50%); padding: 1px 8px; border-radius: 8px; font: 600 11px var(--caps); letter-spacing: .06em; color: #fff6e4; background: rgba(30,22,26,.6); white-space: nowrap; }
.them .lane .tag { top: auto; bottom: 4px; }
.unit { position: relative; height: 100%; max-width: 100%; aspect-ratio: 1; border: 3px solid var(--lead); border-radius: 12px 12px 10px 10px; overflow: hidden; background: #ccc; box-shadow: 0 0 0 2px rgba(255,248,225,.6), 0 6px 14px #0007; cursor: pointer; transition: transform .25s ease, filter .25s; animation: arrive .4s cubic-bezier(.2,1.4,.4,1); }
@keyframes arrive { from { transform: scale(.4) translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.unit img { width: 100%; height: 100%; object-fit: cover; display: block; }
.unit .nm { position: absolute; left: 0; right: 0; top: 0; padding: 2px 4px; font: 600 11px/1.15 var(--text); color: #fffaf0; text-align: center; background: linear-gradient(180deg, rgba(20,14,18,.75), rgba(20,14,18,0)); text-shadow: 0 1px 2px #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.unit .s { position: absolute; bottom: 3px; min-width: 26px; height: 22px; padding: 0 5px; border-radius: 11px; border: 2px solid var(--lead); display: grid; place-items: center; font: 800 13px var(--text); color: #fff; text-shadow: 0 1px 1px #000a; }
.unit .s.atk { left: 3px; background: linear-gradient(180deg, #e07050, #a8302a); }
.unit .s.hp { right: 3px; background: linear-gradient(180deg, #6aa0e0, #2c5aa8); }
.unit .s.hp.hurt { background: linear-gradient(180deg, #f08a8a, #b82a3a); }
.unit .s.gl { left: 50%; transform: translateX(-50%); bottom: 3px; background: linear-gradient(180deg, #fff0a8, #d0a030); color: #2a2010; text-shadow: none; border-color: var(--lead); cursor: pointer; animation: pulse 1.4s ease-in-out infinite; }
.unit.glinted { filter: saturate(.55) brightness(.82); }
.unit.glinted::after { content: "Glinted"; position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%) rotate(-12deg); padding: 1px 8px; border-radius: 6px; font: 700 11px var(--caps); letter-spacing: .08em; color: #2a2010; background: rgba(255,240,190,.92); border: 1px solid var(--lead); }
.unit.building { border-radius: 10px; border-width: 2px; box-shadow: 0 0 0 1px rgba(255,248,225,.6), 0 4px 10px #0007; }
.unit.building .nm { font-size: 9px; }
.unit.dying { animation: die .55s ease forwards; }
@keyframes die { to { transform: scale(.3) rotate(12deg); opacity: 0; filter: brightness(2); } }
.unit.struck { animation: struck .4s ease; }
@keyframes struck { 0%,100% { transform: none; } 30% { transform: translate(-4px, 2px) rotate(-3deg); filter: brightness(1.8) saturate(.4); } 60% { transform: translate(3px, -1px) rotate(2deg); } }
.float { position: absolute; z-index: 30; pointer-events: none; font: 800 22px var(--text); color: #fff; text-shadow: 0 2px 4px #000, 0 0 10px rgba(0,0,0,.6); animation: floatUp 1.1s ease forwards; white-space: nowrap; }
.float.heal { color: #a8f0b0; } .float.dmg { color: #ffb0a0; } .float.gold { color: #ffe08a; }
@keyframes floatUp { from { transform: translate(-50%, 0) scale(.8); opacity: 0; } 15% { opacity: 1; transform: translate(-50%, -10px) scale(1.1); } to { transform: translate(-50%, -54px) scale(1); opacity: 0; } }
.seam { display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 38px; color: #fff6e4; text-align: center; }
.caption { min-height: 22px; font: 500 16px var(--text); text-shadow: 0 1px 4px #000c; max-width: 640px; }
.phase { padding: 2px 10px; border-radius: 8px; font: 600 12px var(--caps); letter-spacing: .08em; background: rgba(30,22,26,.6); border: 1px solid rgba(255,240,200,.3); }
.you-bar { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr) auto; grid-template-areas: "me hand go"; align-items: end; gap: 10px; align-self: end; }
#bar-you { grid-area: me; } .hand { grid-area: hand; } .go-w { grid-area: go; }
.pills { display: flex; gap: 6px; font: 600 12px var(--text); color: #f3e6cc; }
.pills span { padding: 2px 8px; border-radius: 9px; background: rgba(30,22,26,.6); border: 1px solid rgba(255,240,200,.25); cursor: pointer; white-space: nowrap; }
.pickbar { position: fixed; z-index: 44; left: 8px; right: 8px; display: none; align-items: center; gap: 8px; padding: 8px 10px; border: 2px solid var(--lead); border-radius: 12px; background: rgba(255,250,240,.96); box-shadow: 0 6px 18px #0006; font-size: 13px; line-height: 1.25; }
.pickbar.on { display: flex; animation: rise .18s ease; }
.pickbar .c { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 700 13px var(--text); background: radial-gradient(circle at 35% 30%, #fffbe2, #f6d872 45%, #d29a26); border: 2px solid var(--lead); }
.pickbar .t { flex: 1; min-width: 0; }
.pickbar .t b { display: block; font: 400 15px var(--title); }
.hand { position: relative; display: flex; justify-content: center; align-items: flex-end; min-height: 150px; padding-bottom: 4px; }
.hand .card { --w: 104px; margin: 0 var(--gap, -10px); transition: transform .18s ease, box-shadow .18s, margin .18s; cursor: grab; touch-action: none; }
.hand .card:hover { transform: translateY(-14px) scale(1.04); z-index: 5; }
.hand .card.sel { transform: translateY(-22px) scale(1.06); z-index: 6; box-shadow: 0 0 0 3px #ffe9a8, 0 0 20px rgba(255,220,120,.9), 0 10px 20px #0007; }
.hand .card.no { filter: saturate(.45) brightness(.78); }
.hand .card.no .cost { background: radial-gradient(circle at 35% 30%, #eee, #aaa 50%, #777); box-shadow: none; }
.ghost { position: fixed; z-index: 80; pointer-events: none; transform-origin: 50% 60%; transition: none; will-change: transform; }
.ghost .card { --w: 112px; box-shadow: 0 18px 30px rgba(0,0,0,.45); }
.go-w { display: grid; gap: 6px; justify-items: end; padding-bottom: 10px; }
.cast-zone { position: absolute; z-index: 20; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 14px 22px; border: 3px dashed #ffe9a8; border-radius: 16px; font: 600 16px var(--text); color: #fff6e4; background: rgba(40,28,30,.6); display: none; pointer-events: none; }
.cast-zone.on { display: block; }
.cast-zone.over { background: rgba(120,90,40,.75); }

/* the card being looked at */
.inspect { position: fixed; z-index: 40; right: 14px; top: 50%; transform: translateY(-50%); display: none; gap: 10px; justify-items: center; pointer-events: none; }
.inspect.on { display: grid; }
.inspect .card { --w: 230px; }
.inspect .acts { display: flex; gap: 8px; pointer-events: auto; }
.sheet-pop { position: fixed; z-index: 45; left: 0; right: 0; bottom: 0; display: none; padding: 14px 14px calc(14px + var(--safe-b)); background: rgba(30,22,26,.82); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border-top: 3px solid var(--lead); justify-items: center; gap: 10px; animation: rise .22s ease; }
.sheet-pop.on { display: grid; }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-pop .card { --w: 210px; }
.sheet-pop .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

/* what a card is waiting for */
.prompt { position: fixed; z-index: 50; left: 50%; top: calc(46px + var(--safe-t)); transform: translateX(-50%); display: none; padding: 10px 18px; border-radius: 14px; border: 3px solid var(--lead); background: #fff6dc; font: 600 16px var(--text); box-shadow: 0 8px 20px #0006; text-align: center; max-width: 92vw; }
.prompt.on { display: block; animation: rise .2s ease; }
.modal { position: fixed; z-index: 70; inset: 0; display: none; place-items: center; padding: 16px; background: rgba(20,12,14,.55); }
.modal.on { display: grid; animation: fadeIn .2s ease; }
.modal .plate { width: min(760px, 96vw); max-height: 90dvh; overflow: auto; padding: 18px; }
.modal h3 { font-size: 24px; margin-bottom: 10px; }
.pickgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; justify-items: center; }
.pickgrid .card { --w: 112px; cursor: pointer; }
.pickgrid .card:hover { transform: translateY(-3px); }

/* ---------------------------------------------------------------- the Rose Window */
.rose { position: fixed; z-index: 55; inset: 0; display: none; place-items: center; background: radial-gradient(circle at 50% 50%, rgba(30,20,24,.25), rgba(30,20,24,.6)); }
.rose.on { display: grid; animation: fadeIn .15s ease; }
.rose-in { display: grid; justify-items: center; gap: 10px; cursor: pointer; touch-action: none; }
.rose canvas { width: min(340px, 78vw); height: min(340px, 78vw); filter: drop-shadow(0 10px 30px rgba(0,0,0,.55)); }
.rose .say { font: 400 26px var(--title); color: #fff6e4; text-shadow: 0 2px 8px #000; }
.rose .hint { font: 500 15px var(--text); color: #f3e6cc; text-shadow: 0 1px 4px #000; }
.rose .res { position: absolute; font: 400 44px var(--title); color: #fff; text-shadow: 0 3px 12px #000, 0 0 20px rgba(255,200,120,.8); animation: pop .5s cubic-bezier(.2,1.6,.4,1); pointer-events: none; }
@keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }

/* who goes first, the landscapes, the end */
.center-pop { position: fixed; z-index: 60; inset: 0; display: none; place-items: center; padding: 16px; background: rgba(20,12,14,.5); }
.center-pop.on { display: grid; animation: fadeIn .2s ease; }
.center-pop .plate { width: min(620px, 96vw); padding: 20px; text-align: center; }
.center-pop h3 { font-size: 28px; margin-bottom: 6px; }
.center-pop p { color: var(--ink2); margin: 6px 0 14px; line-height: 1.35; }
.lands { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0 16px; }
.lands button { position: relative; aspect-ratio: 3 / 2; border: 3px solid var(--lead); border-radius: 10px; overflow: hidden; padding: 0; cursor: pointer; background: #888; }
.lands button img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lands button span { position: absolute; left: 0; right: 0; bottom: 0; padding: 2px; font: 600 11px var(--caps); color: #fff; background: rgba(20,14,18,.6); }
.lands button.on { box-shadow: 0 0 0 3px #ffe9a8, 0 0 16px rgba(255,220,120,.9); transform: translateY(-2px); }
.bottle { width: 140px; height: 140px; margin: 6px auto 12px; }
.result-face { width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--lead); overflow: hidden; margin: 0 auto 10px; }
.said { font-style: italic; color: var(--ink); margin: 8px 0 16px; }

/* ---------------------------------------------------------------- decks */
.decks { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.deck-tile { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: center; padding: 10px; border: 2px solid var(--lead); border-radius: 14px; background: #fffdf8; cursor: pointer; text-align: left; }
.deck-tile:hover { box-shadow: 0 4px 12px rgba(60,30,10,.18); }
.deck-tile .face { width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--lead); overflow: hidden; }
.deck-tile b { display: block; font: 400 19px var(--title); }
.deck-tile small { color: var(--ink2); }
.deck-tile.new { place-items: center; grid-template-columns: 1fr; min-height: 88px; border-style: dashed; color: var(--ink2); font-weight: 600; }
.builder { display: grid; grid-template-columns: 1fr minmax(260px, 330px); gap: 12px; min-height: 0; }
.builder > * { min-height: 0; }
@media (max-width: 820px) { .builder { grid-template-columns: 1fr; grid-template-rows: 1fr minmax(180px, 38%); } }
.pool { display: grid; grid-template-rows: auto 1fr; gap: 8px; padding: 10px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.filters button { height: 38px; min-width: 38px; padding: 0 10px; border: 2px solid var(--lead); border-radius: 10px; background: #fffdf8; cursor: pointer; font: 600 13px var(--caps); letter-spacing: .04em; }
.filters button.on { background: var(--lead); color: #fff6e4; }
.filters input { height: 38px; flex: 1; min-width: 120px; border: 2px solid var(--lead); border-radius: 10px; padding: 0 10px; font: 500 14px var(--text); background: #fffdf8; }
.grid { overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; justify-items: center; align-content: start; padding: 4px; }
.grid .card { --w: 118px; cursor: pointer; transition: transform .12s; }
.grid .card:hover { transform: translateY(-3px); }
.grid .cell { position: relative; }
.grid .poolhead { grid-column: 1 / -1; justify-self: stretch; margin: 10px 2px 0; padding-top: 10px; border-top: 2px dashed rgba(43,40,48,.2); font: 600 14px var(--text); color: var(--ink2); }
.grid .cell .count { position: absolute; z-index: 2; right: -6px; top: -6px; min-width: 26px; height: 26px; border-radius: 13px; border: 2px solid var(--lead); background: #fff3c4; font: 700 13px var(--text); display: grid; place-items: center; }
.list { display: grid; grid-template-rows: auto auto 1fr auto; gap: 8px; padding: 10px; overflow: hidden; }
.list .rows { overflow: auto; display: grid; gap: 4px; align-content: start; }
.list .line { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; padding: 4px 8px; border: 2px solid var(--lead); border-radius: 10px; background: #fffdf8; cursor: pointer; }
.list .line .c { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 700 13px var(--text); background: radial-gradient(circle at 35% 30%, #fffbe2, #f6d872 45%, #d29a26); border: 2px solid var(--lead); }
.list .line .n { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list .line .r { width: 10px; height: 26px; border-radius: 4px; border: 1px solid var(--lead); }
.list .line.bad { border-color: var(--ruby); }
.warn { color: var(--ruby); font-weight: 600; font-size: 14px; }
.okay { color: var(--ok); font-weight: 600; font-size: 14px; }
.toggle { display: flex; align-items: center; gap: 10px; padding: 10px 0; font-size: 16px; cursor: pointer; }
.toggle input { width: 22px; height: 22px; accent-color: var(--brass); }

/* ---------------------------------------------------------------- the campaign: the land as windows */
#campaign.on { display: grid; grid-template-rows: auto auto 1fr; }
.regions { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
.regions::-webkit-scrollbar { display: none; }
.rtab { flex: 1 0 86px; display: grid; justify-items: center; gap: 4px; padding: 6px 4px; border: 2px solid rgba(43,40,48,.9); border-radius: 12px; background: rgba(36,26,30,.82); color: #fff6e4; cursor: pointer; font: 600 12px var(--caps); letter-spacing: .04em; line-height: 1.1; text-align: center; box-shadow: 0 4px 10px rgba(20,10,10,.3); }
.rtab .disc { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--lead); background: #888 center / cover; box-shadow: 0 0 0 2px rgba(255,236,190,.45); }
.rtab small { font: 700 11px var(--text); opacity: .85; }
.rtab.on { border-color: #ffe9a8; background: rgba(78,54,38,.92); box-shadow: 0 0 0 2px rgba(255,233,168,.35), 0 4px 10px rgba(20,10,10,.3); }
.rtab.locked { cursor: default; color: rgba(255,246,228,.62); }
.rtab.locked .disc { filter: grayscale(.85) brightness(.7); }
.mapwrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 360px); gap: 12px; min-height: 0; }
.map { position: relative; min-height: 0; padding: 0; overflow: hidden; border-radius: 16px; background: #554; }
.map .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.map svg.trail { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.map .trail .lead { fill: none; stroke: #2b2830; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; opacity: .75; }
.map .trail .glass { fill: none; stroke: #fff3cf; stroke-width: 4; stroke-dasharray: 2 12; stroke-linecap: round; vector-effect: non-scaling-stroke; opacity: .95; }
.map .trail .done { fill: none; stroke: #ffd86a; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.map-top { position: absolute; z-index: 3; left: 10px; right: 10px; top: 10px; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; pointer-events: none; }
.map-top > * { pointer-events: auto; }
.glasslabel { padding: 8px 12px; border: 2px solid var(--lead); border-radius: 12px; background: rgba(255,251,242,.9); box-shadow: 0 4px 12px rgba(20,10,10,.3); max-width: 460px; }
.glasslabel em { display: block; font-size: 14px; color: var(--ink2); line-height: 1.3; }
.glasslabel b { font: 700 14px var(--text); }
.road { display: inline-flex; border: 2px solid var(--lead); border-radius: 999px; overflow: hidden; background: rgba(255,251,242,.92); box-shadow: 0 4px 12px rgba(20,10,10,.3); }
.road button { height: 34px; padding: 0 14px; border: 0; background: none; font: 600 13px var(--caps); letter-spacing: .05em; cursor: pointer; color: var(--ink); }
.road button.on { background: var(--lead); color: #fff6e4; }
.road button[disabled] { opacity: .45; cursor: default; }
.map-foot { position: absolute; z-index: 3; left: 10px; right: 10px; bottom: 10px; display: flex; gap: 8px; flex-wrap: wrap; pointer-events: none; }
.map-foot span { padding: 5px 10px; border: 2px solid var(--lead); border-radius: 10px; background: rgba(255,251,242,.9); font-size: 13px; line-height: 1.25; box-shadow: 0 3px 8px rgba(20,10,10,.25); }
.map-foot span.got { background: rgba(235,248,226,.94); }
.node { position: absolute; z-index: 2; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 2px; padding: 0; border: 0; background: none; cursor: pointer; }
.node .medal { position: relative; width: var(--nd, 66px); height: var(--nd, 66px); border-radius: 50%; border: 4px solid var(--lead); overflow: hidden; background: #6a6070; box-shadow: 0 0 0 3px rgba(255,248,225,.85), 0 8px 16px rgba(10,5,5,.45); transition: transform .15s; }
.node .medal img { width: 100%; height: 100%; object-fit: cover; display: block; }
.node .medal .face { width: 100%; height: 100%; }
.node:hover .medal { transform: scale(1.07); }
.node .tag { display: flex; align-items: center; gap: 4px; padding: 1px 7px; border: 2px solid var(--lead); border-radius: 9px; background: rgba(255,251,242,.95); font: 700 12px var(--text); color: var(--ink); white-space: nowrap; box-shadow: 0 2px 6px rgba(10,5,5,.35); }
.pips { display: inline-flex; gap: 1px; }
.pips i { width: 11px; height: 11px; background: #8a8290; clip-path: polygon(50% 0, 62% 35%, 100% 38%, 70% 60%, 80% 100%, 50% 77%, 20% 100%, 30% 60%, 0 38%, 38% 35%); }
.pips i.on { background: #f2b630; }
.node.locked { cursor: default; }
.node.locked .medal { background: radial-gradient(circle at 35% 30%, #8a8494, #4a4454); box-shadow: 0 0 0 3px rgba(255,248,225,.35), 0 6px 12px rgba(10,5,5,.35); }
.node.locked .medal::after { content: ""; position: absolute; inset: 22%; border: 3px solid rgba(40,36,48,.8); border-radius: 50%; }
.node.locked .tag { opacity: .7; }
.node.next .medal { animation: beckon 1.6s ease-in-out infinite; }
@keyframes beckon { 0%,100% { box-shadow: 0 0 0 3px rgba(255,248,225,.9), 0 0 0 6px rgba(255,214,110,0), 0 8px 16px rgba(10,5,5,.45); } 50% { box-shadow: 0 0 0 3px rgba(255,248,225,.9), 0 0 0 10px rgba(255,214,110,.65), 0 8px 16px rgba(10,5,5,.45); } }
.node.sel .medal { box-shadow: 0 0 0 4px #ffe9a8, 0 0 22px rgba(255,220,120,.95), 0 8px 16px rgba(10,5,5,.45); }
.node .gift { position: absolute; top: -4px; right: -6px; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--lead); font: 700 13px var(--text); color: #2a2010; background: radial-gradient(circle at 35% 30%, #fff6cc, #f0c24a 55%, #b9831c); box-shadow: 0 0 8px rgba(255,214,110,.9); }
.node .gift.maybe { color: #fff; background: radial-gradient(circle at 35% 30%, #d8c8ff, #7a5ad0 55%, #4a2e9a); box-shadow: 0 0 8px rgba(170,140,255,.9); }
.node.encore .medal { border-color: #3a3256; box-shadow: 0 0 0 3px rgba(214,200,255,.9), 0 8px 16px rgba(10,5,5,.45); }
.table-side { overflow: auto; padding: 16px 16px 0; display: grid; gap: 12px; align-content: start; }
.sitbar { position: sticky; bottom: 0; z-index: 2; display: grid; gap: 8px; margin: 0 -16px; padding: 12px 16px 14px; background: linear-gradient(180deg, rgba(250,244,230,.94), rgba(247,238,220,.99)); border-top: 2px solid rgba(43,40,48,.18); }
.table-side .face-big { width: 120px; height: 120px; margin: 0 auto; border-radius: 50%; border: 3px solid var(--lead); overflow: hidden; box-shadow: 0 0 0 3px rgba(255,236,190,.6); }
.table-side h3 { font-size: 24px; text-align: center; }
.table-side .sub { text-align: center; color: var(--ink2); font-size: 14px; margin-top: -8px; }
.table-side .hello { font-style: italic; text-align: center; color: var(--ink); margin: 0; }
.starlist { display: grid; gap: 6px; }
.starlist div { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: center; padding: 6px 10px; border: 2px solid rgba(43,40,48,.25); border-radius: 10px; background: #fffdf8; font-size: 14px; line-height: 1.25; }
.starlist div.now { border-color: var(--lead); background: #fff6dc; }
.starlist i { width: 20px; height: 20px; background: #b8b0bc; clip-path: polygon(50% 0, 62% 35%, 100% 38%, 70% 60%, 80% 100%, 50% 77%, 20% 100%, 30% 60%, 0 38%, 38% 35%); }
.starlist i.on { background: #f2b630; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; }
.facts span { padding: 4px 10px; border-radius: 10px; background: rgba(43,40,48,.07); font-size: 13px; font-weight: 600; }
.drops { display: flex; gap: 6px; flex-wrap: wrap; }
.drops .card { --w: 64px; cursor: pointer; }
.drops .card.ghost-card { --w: 64px; }
.note { font-size: 14px; color: var(--ink2); line-height: 1.35; margin: 0; }
.note b { color: var(--ink); }
.closer { display: none; }
@media (max-width: 820px) {
  .mapwrap { grid-template-columns: minmax(0, 1fr); }
  .table-side { position: fixed; z-index: 45; left: 0; right: 0; bottom: 0; max-height: 78dvh; border-radius: 18px 18px 0 0; border-bottom: 0; padding: 14px 14px calc(16px + var(--safe-b)); transform: translateY(105%); transition: transform .25s ease; box-shadow: 0 -10px 30px rgba(0,0,0,.45); }
  .table-side.open { transform: none; }
  .closer { display: block; justify-self: center; width: 56px; height: 6px; border-radius: 3px; background: rgba(43,40,48,.35); border: 0; padding: 0; margin: -4px 0 2px; cursor: pointer; }
}

/* ---------------------------------------------------------------- after a battle: the stars, what it paid, the cards turned over */
.after { position: fixed; z-index: 75; inset: 0; display: none; place-items: center; padding: 14px; background: rgba(20,12,14,.62); overflow: auto; }
.after.on { display: grid; animation: fadeIn .25s ease; }

.tiertag { font: 700 12px var(--caps); letter-spacing: .08em; padding: 2px 10px; border-radius: 9px; border: 2px solid var(--lead); background: #fffdf8; }

.loot { display: inline-flex; gap: 8px; align-items: center; padding: 3px 10px; border-radius: 10px; background: rgba(30,22,26,.7); border: 1px solid rgba(255,240,200,.3); font: 700 13px var(--text); color: #ffe9a8; white-space: nowrap; }

.casket { position: fixed; z-index: 48; width: 46px; height: 38px; pointer-events: none; border: 3px solid var(--lead); border-radius: 12px 12px 6px 6px; background: linear-gradient(180deg, #c08a4c 0 42%, #e0b860 42% 52%, #8a5430 52%); box-shadow: 0 0 18px rgba(255,220,120,.95); transition: transform .75s cubic-bezier(.4,0,.2,1), opacity .75s; }

/* ---------------------------------------------------------------- the collection, the kiln, the chests */

.album { display: grid; gap: 18px; align-content: start; }

.cell .count.zero { background: #e8e0e4; color: var(--ink2); }

.recipes { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; align-content: start; }

.chip { padding: 3px 10px; border-radius: 10px; font: 700 12px var(--caps); letter-spacing: .05em; white-space: nowrap; border: 2px solid var(--lead); background: #f2ece2; }

.needs { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

.opening.on { display: grid; }
.opening .stage { display: grid; justify-items: center; gap: 14px; }
.opening .art { width: min(360px, 80vw); aspect-ratio: 21 / 16; border: 3px solid var(--lead); border-radius: 14px; overflow: hidden; animation: rattle .5s ease-in-out 2; }

@keyframes rattle { 0%,100% { transform: none; } 25% { transform: rotate(-3deg) scale(1.02); } 75% { transform: rotate(3deg) scale(1.02); } }

.side-sheet .closer { display: none; }
@media (max-width: 820px) {
  .side-sheet { position: fixed; z-index: 45; left: 0; right: 0; bottom: 0; max-height: 80dvh; overflow: auto; border-radius: 18px 18px 0 0; padding: 14px 14px calc(16px + var(--safe-b)); transform: translateY(105%); transition: transform .25s ease; box-shadow: 0 -10px 30px rgba(0,0,0,.45); }
  .side-sheet.open { transform: none; }
  .side-sheet .closer { display: block; justify-self: center; width: 56px; height: 6px; border-radius: 3px; background: rgba(43,40,48,.35); border: 0; padding: 0; margin: -4px auto 6px; cursor: pointer; }
}
.toast { position: fixed; z-index: 90; left: 50%; bottom: calc(24px + var(--safe-b)); transform: translateX(-50%) translateY(20px); opacity: 0; padding: 10px 18px; border-radius: 14px; border: 3px solid var(--lead); background: #fff6dc; font: 600 15px var(--text); box-shadow: 0 8px 20px #0006; transition: opacity .2s, transform .2s; pointer-events: none; max-width: 92vw; text-align: center; }

/* ---------------------------------------------------------------- the roads around the campaign */

.door.road-door { min-height: 168px; }

@media (max-width: 640px) { .menu-roads { gap: 8px; } .door.road-door { min-height: 126px; padding: 10px; } .door.road-door b { font-size: 17px; } .door.road-door span { font-size: 12px; } }
.rtab.world { flex-basis: 104px; background: rgba(54,58,78,.88); }

.rtab .disc.land { background: radial-gradient(circle at 35% 30%, #fff1c0, #e8b84a 50%, #8a5a2a); }
.map.silver { box-shadow: inset 0 0 0 3px rgba(226,232,246,.65); }

.node.bonus .medal { border-color: #6a4a12; box-shadow: 0 0 0 3px #ffe08a, 0 0 16px rgba(255,214,110,.75), 0 8px 16px rgba(10,5,5,.45); }

@keyframes glint { 0%,100% { filter: none; } 50% { filter: brightness(1.18) saturate(1.2); } }

.work { display: grid; gap: 6px; justify-items: end; }
.work button { display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px 5px 7px; border: 2px solid var(--lead); border-radius: 11px; background: rgba(255,251,242,.92); font: 600 13px var(--text); color: var(--ink); cursor: pointer; box-shadow: 0 3px 8px rgba(20,10,10,.25); }

@media (max-width: 640px) { .work button span { display: none; } .work button { padding: 4px 8px 4px 6px; } }
i.piece { display: inline-block; width: 16px; height: 16px; vertical-align: -3px; border: 2px solid var(--lead); clip-path: polygon(20% 0, 100% 12%, 86% 100%, 0 78%); }

.loot i.piece { width: 13px; height: 13px; margin-right: 2px; }
.workbar { width: min(300px, 80%); height: 12px; border: 2px solid var(--lead); border-radius: 8px; overflow: hidden; background: #e8e0d4; }
.workbar i { display: block; height: 100%; background: linear-gradient(90deg, #a8d8ff, #5a9ae8); }
.face-small { width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--lead); overflow: hidden; flex: none; box-shadow: 0 0 0 2px rgba(255,236,190,.6); }

.goldie { display: grid; gap: 10px; padding: 12px; border: 3px solid #b8861c; border-radius: 14px; background: linear-gradient(160deg, #fff6d8, #ffe9b0); box-shadow: 0 0 18px rgba(255,200,60,.45); }

.p.note.wide, .note.wide { grid-column: 1 / -1; text-align: center; }
/* the cellars */
.cellar-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); gap: 12px; align-content: start; }
.cellar.about { display: grid; grid-template-rows: none; align-content: start; gap: 8px; padding: 14px; cursor: default; background: linear-gradient(160deg, #fffaf0, #f4e8d4); }

.stages { display: grid; gap: 6px; }

/* the ladder */

/* ---------------------------------------------------------------- phones */
@media (max-width: 640px) {
  .table { padding: calc(34px + var(--safe-t)) 6px calc(4px + var(--safe-b)); gap: 4px; }
  .bar { min-height: 48px; gap: 6px; }
  .hero-w { gap: 6px; padding: 4px 10px 4px 4px; }
  .hero-w .face { width: 42px; height: 42px; border-width: 2px; }
  .hero-w .who b { font-size: 14px; }
  .hpbar { width: 84px; height: 12px; }
  .ability { width: 34px; height: 34px; font-size: 12px; }
  .light i { width: 9px; height: 9px; border-width: 1.5px; }
  .light b { font-size: 13px; }
  .lanes { gap: 5px; }
  .table { --lane-h: clamp(80px, calc((100dvh - 330px) / 2), 150px); }
  .board { padding: 6px; border-width: 2px; border-radius: 12px; width: 100%; }
  .lane { border-width: 2px; border-radius: 9px; }
  .lane .cslot { inset: 12% 6% 6% 6%; }
  .them .lane .cslot { inset: 6% 6% 12% 6%; }
  .unit { border-width: 2px; border-radius: 9px; }
  .unit .nm { font-size: 9px; }
  .unit .s { height: 18px; min-width: 20px; font-size: 11px; padding: 0 3px; }
  .hand { min-height: 100px; }
  .hand .card { --w: 70px; }
  .you-bar { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "hand hand" "me go"; gap: 4px; }
  .bar.them { justify-content: space-between; }
  .bar .light { display: none; }
  .hero-w .lightmini { display: flex; }
  .phase { display: none; }
  .lane.full .tag { display: none; }
  .hand .card .stats { display: none; }
  .seam { min-height: 34px; gap: 6px; }
  .caption { font-size: 13px; }
  .go-w .jewel { min-height: 40px; padding: 0 .8em; font-size: 14px; }
  .inspect { display: none !important; }
  .sheet > header h2 { font-size: 21px; line-height: 1.05; }
  .filters { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .filters::-webkit-scrollbar { display: none; }
  .filters button { flex: none; }
  .filters input { order: -1; flex: 0 0 150px; min-width: 150px; }
  .map-foot span { font-size: 11.5px; padding: 3px 8px; }
}
@media (min-width: 641px) { .sheet-pop { display: none !important; } }
@media (min-width: 641px) and (max-height: 760px) { .hand .card { --w: 88px; } .hand { min-height: 126px; } .bar { min-height: 52px; } }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; transition-duration: .01s !important; } }
</style>
</head>
<body>
<div id="room"></div>
<!--__HOME__-->

<section class="screen" id="door">
  <div class="plate door-card">
    <canvas class="title-glass" id="title-glass" width="840" height="220"></canvas>
    <p class="tag">/*__TAG__*/</p>
    <div class="players" id="players"></div>
    <form class="newp" id="newp" autocomplete="off"><input id="newname" maxlength="24" placeholder="A new player's name"><button class="jewel" type="submit">Begin</button></form>
    <div class="status" id="door-status"></div>
  </div>
</section>

<section class="screen" id="menu">
  <div class="plate menu-card">
    <div class="menu-head"><h2 id="menu-who"></h2><div class="purse"></div><button class="jewel small quiet" id="switch">Change player</button></div>
    <button class="door big" id="go-campaign"><b>Campaign</b><span id="go-campaign-where"></span><span id="go-campaign-next"></span><div class="who" id="go-campaign-who"></div></button>
    <div class="menu-roads">
      <button class="door road-door" id="go-mirror"><b>Mirrorside</b><span id="go-mirror-what"></span></button>
      <button class="door road-door" id="go-cellars"><b>Cellars</b><span id="go-cellars-what"></span></button>
      <button class="door road-door" id="go-ladder"><b>Ladder</b><span id="go-ladder-what"></span></button>
    </div>
    <div class="menu-grid">
      <button class="door" id="go-decks"><b>Decks</b><span>Build the decks you bring to the table.</span></button>
      <button class="door" id="go-collection"><b>Collection</b><span>Your cards and your heroes.</span></button>
      <button class="door" id="go-kiln"><b>Kiln</b><span>Fire cards from cards.</span></button>
      <button class="door" id="go-chests"><b>Chests</b><span>Coins and Jewels for a card.</span></button>
      <button class="door" id="go-options"><b>Options</b><span>The Rose Window, the pace.</span></button>
    </div>
  </div>
</section>

<section class="screen sheet" id="campaign">
  <header><button class="jewel small quiet" data-back>‹ Back</button><h2 id="region-name">Campaign</h2><div class="purse"></div></header>
  <div class="regions" id="region-tabs"></div>
  <div class="mapwrap">
    <div class="plate map" id="map"></div>
    <aside class="plate table-side" id="table-side"></aside>
  </div>
</section>

<section class="screen sheet" id="cellars">
  <header><button class="jewel small quiet" data-back>‹ Back</button><h2>Cellars</h2><div class="purse"></div></header>
  <div class="mapwrap">
    <div class="plate body cellar-list" id="cellar-list"></div>
    <aside class="plate table-side" id="cellar-side"></aside>
  </div>
</section>

<section class="screen sheet" id="ladder">
  <header><button class="jewel small quiet" data-back>‹ Back</button><h2>Ladder</h2><div class="purse"></div></header>
  <div class="mapwrap">
    <div class="plate body cup-list" id="cup-list"></div>
    <aside class="plate table-side" id="ladder-side"></aside>
  </div>
</section>

<section class="screen sheet" id="decks">
  <header><button class="jewel small quiet" data-back>‹ Back</button><h2>Decks</h2></header>
  <div class="plate body"><div class="decks" id="deck-list"></div></div>
</section>

<section class="screen sheet" id="builder">
  <header><button class="jewel small quiet" id="builder-done">‹ Done</button><h2 id="builder-title">Deck</h2></header>
  <div class="builder">
    <div class="plate pool">
      <div class="filters" id="filters"></div>
      <div class="grid" id="pool"></div>
    </div>
    <div class="plate list" id="deck-side"></div>
  </div>
</section>

<section class="screen sheet" id="options">
  <header><button class="jewel small quiet" data-back>‹ Back</button><h2>Options</h2></header>
  <div class="plate body" id="options-body"></div>
</section>

<section class="screen sheet" id="collection">
  <header><button class="jewel small quiet" data-back>‹ Back</button><h2>Collection</h2><div class="tabs" id="album-tabs"><button data-tab="cards" class="on">Cards</button><button data-tab="heroes">Heroes</button></div><div class="purse"></div></header>
  <div class="split">
    <div class="plate body"><div class="filters" id="album-filters" style="margin-bottom:12px"></div><div id="album"></div></div>
    <aside class="plate side-note side-sheet" id="album-side"></aside>
  </div>
</section>

<section class="screen sheet" id="kiln">
  <header><button class="jewel small quiet" data-back>‹ Back</button><h2>Kiln</h2><div class="purse"></div></header>
  <div class="split">
    <div class="plate body"><div class="recipes" id="recipes"></div></div>
    <aside class="plate side-note side-sheet" id="kiln-side"></aside>
  </div>
</section>

<section class="screen sheet" id="chests">
  <header><button class="jewel small quiet" data-back>‹ Back</button><h2>Chests</h2><div class="purse"></div></header>
  <div class="plate body chests-body" id="chests-body"></div>
</section>

<section class="screen" id="battle">
  <div class="table">
    <div class="bar them" id="bar-them"></div>
    <div class="board">
      <div class="lanes them" id="lanes-them"></div>
      <div class="seam"><span class="phase" id="phase"></span><span class="caption" id="caption"></span></div>
      <div class="lanes you" id="lanes-you"></div>
    </div>
    <div class="you-bar"><div id="bar-you"></div><div class="hand" id="hand"></div><div class="go-w" id="go-w"></div></div>
  </div>
  <div class="cast-zone" id="cast-zone">Drop here to cast</div>
  <div class="inspect" id="inspect"></div>
  <div class="sheet-pop" id="sheet-pop"></div>
  <div class="pickbar" id="pickbar"></div>
  <div class="prompt" id="prompt"></div>
  <div class="modal" id="discard-modal"><div class="plate"><h3 id="discard-title">Choose a card</h3><div class="pickgrid" id="discard-grid"></div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="jewel small quiet" id="discard-close">Close</button></div></div></div>
  <div class="rose" id="rose"><div class="rose-in" id="rose-in"><div class="say" id="rose-say"></div><canvas id="rose-canvas" width="680" height="680"></canvas><div class="hint" id="rose-hint">Tap to stop the Rose Window</div></div></div>
  <div class="center-pop" id="pop"><div class="plate" id="pop-in"></div></div>
</section>

<div class="after" id="after"><div class="plate after-in" id="after-in"></div></div>
<div class="opening" id="opening"><div class="stage" id="opening-stage"></div></div>
<div class="toast" id="toast"></div>
<div class="center-pop" id="ask"><div class="plate" id="ask-in"></div></div>

<script>
/*__ENGINE__*/
</script>
<script>
/*__JS__*/
</script>
</body>
</html>
