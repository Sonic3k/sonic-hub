<style>
  /* ── Lantern Line ── the Pingxi valley at the blue hour: hills going violet in the mist, the old line's bridge and
     the shophouses lit along it, and sky lanterns going up. The board is a sheet of indigo paper in a bamboo frame:
     every line drawn is a bamboo strip, every square taken lights up in the colour of whoever took it, and its
     lantern goes up into the sky. Everything painted is painted on canvases by the page itself (game/src/10-paint.js,
     20-scene.js, 50-board.js); what is set in type is Alegreya (the inscriptions), Alegreya Sans (what is read and
     pressed) and, for the few Chinese characters, a Kai brush hand. */
  :root { box-sizing: border-box; color-scheme: dark;
    --night: #101838; --deep: #0b1029; --ink: #22192a; --paper: #f4ead3; --paper-2: #e7d7b5; --paper-3: #d6c193; --rule: #b59d6c;
    --verm: #c4352b; --verm-dk: #8e1f19; --verm-hi: #e8584a; --gold: #f2bd4b; --gold-hi: #ffe7a3; --gold-dk: #a8731d;
    --red: #e0442f; --amber: #f3b23a; --indigo: #1e2b5e; --text-hi: #fff7e6; --text-lo: rgba(255, 244, 222, .78);
    --title: Alegreya, "Palatino Linotype", Palatino, Georgia, serif; --text: "Alegreya Sans", "Gill Sans", "Trebuchet MS", system-ui, sans-serif;
    --kai: "Lantern Kai", "Kaiti TC", "BiauKai", "STKaiti", "KaiTi", serif;
    --vh: 100vh; --side: 368px; --gap: 52px; --board: min(calc(100vw - var(--side) - var(--gap) - 76px), calc(var(--vh) - 92px), 820px); }
  @supports (height: 100dvh) { :root { --vh: 100dvh; } }
  *, *::before, *::after { box-sizing: inherit; }
  html { -webkit-text-size-adjust: 100%; background: var(--night) linear-gradient(#0b1230, #1a2150 32%, #3b2b5e 54%, #8c4a68 70%, #e07a52 84%, #22192a 85%) fixed; }
  body { margin: 0; min-height: var(--vh); color: var(--text-hi); font: 400 17px/1.45 var(--text); -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; } button:disabled { cursor: default; }
  :focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }

  #scene, #sky, #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  #scene { z-index: -3; } #sky { z-index: -2; } #fx { z-index: 5; }

  /* the strip above the table: the way back to the shelf, sound, the rules */
  .top { display: flex; align-items: center; gap: 8px; min-height: 54px; padding: calc(8px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px)) 0 calc(14px + env(safe-area-inset-left, 0px)); position: relative; z-index: 2; }
  .top-sp { flex: 1; }
  .home { color: var(--text-hi); text-decoration: none; font: 500 16px/1 var(--text); padding: 14px 8px; opacity: .9; text-shadow: 0 1px 3px rgba(5, 8, 30, .7); white-space: nowrap; }

  /* small paper tags hung on a string */

    background: var(--paper-tex, none), linear-gradient(175deg, #fbf3df, var(--paper) 45%, var(--paper-2)); background-size: 180px, auto; box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 -1px 0 rgba(120, 90, 40, .25) inset, 0 4px 12px rgba(5, 8, 30, .45); }
  .tag::before { content: ""; position: absolute; left: 8px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #3a2a20, #120c08); box-shadow: 0 0 0 1.5px rgba(196, 53, 43, .85); }
  .tag:hover { color: var(--verm-dk); } .tag:active { translate: 0 1px; }

  .table { display: grid; grid-template-columns: var(--board) var(--side); gap: var(--gap); justify-content: center; align-items: center; min-height: calc(var(--vh) - 62px); padding: 2px 28px calc(28px + env(safe-area-inset-bottom, 0px)); }

  /* the board: one canvas, painted by the page */

  /* what is said across the board: two at once, a run of squares, the end */
  #toast { position: absolute; left: 50%; top: 46%; translate: -50% -50%; max-width: 88%; padding: .5em 1.25em .58em; pointer-events: none; text-align: center; white-space: nowrap; border-radius: 4px;
    font: italic 800 clamp(19px, calc(var(--board) * .046), 34px)/1.15 var(--title); color: #fff6df; letter-spacing: .01em;
    background: linear-gradient(rgba(150, 30, 24, .96), rgba(112, 20, 16, .96)); border: 1.5px solid var(--gold); box-shadow: 0 0 0 4px rgba(112, 20, 16, .35), 0 16px 36px rgba(5, 8, 30, .6);
    text-shadow: 0 1px 0 rgba(0,0,0,.35); opacity: 0; scale: .9; transition: opacity .2s, scale .25s cubic-bezier(.2, 1.6, .4, 1); }

  #toast.gold { background: linear-gradient(rgba(214, 152, 36, .97), rgba(168, 112, 20, .97)); color: #2a1606; text-shadow: 0 1px 0 rgba(255,240,200,.5); }

  /* beside the board */
  .side { width: var(--side); display: flex; flex-direction: column; align-items: stretch; text-shadow: 0 1px 2px rgba(5, 8, 30, .85), 0 0 16px rgba(16, 24, 56, .7); position: relative; z-index: 1; }
  .brand { text-align: center; }
  .brand .zh { margin: 0; font: 700 21px/1 var(--kai); letter-spacing: .5em; text-indent: .5em; color: var(--gold-hi); opacity: .92; }
  .brand h1 { margin: 6px 0 0; font: italic 800 58px/.98 var(--title); letter-spacing: -.005em; color: #fff3d6; white-space: nowrap;
    text-shadow: 0 2px 0 rgba(120, 28, 20, .55), 0 0 24px rgba(255, 150, 80, .35), 0 3px 14px rgba(5, 8, 30, .8); }
  .brand .tagline { margin: 8px auto 0; max-width: 330px; font: italic 500 17px/1.35 var(--title); color: var(--text-lo); }
  .playing .brand h1 { font-size: 40px; } .playing .brand .tagline, .playing .brand .zh { display: none; }

  /* the ticket: what a game needs settling, on a card like an old Pingxi line ticket */
  #setup { margin-top: 18px; }
  .ticket { position: relative; padding: 18px 20px 18px; color: var(--ink); text-shadow: none; border-radius: 6px;
    background: var(--paper-tex, none), linear-gradient(172deg, #faf2df, var(--paper) 40%, #eee0c1); background-size: 220px, auto;
    box-shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 0 0 1px rgba(140, 105, 50, .25), 0 18px 40px rgba(4, 6, 24, .55), 0 3px 8px rgba(4, 6, 24, .35);
    -webkit-mask: radial-gradient(circle 9px at 0 92px, transparent 8.5px, #000 9px) left / 51% 100% no-repeat, radial-gradient(circle 9px at 100% 92px, transparent 8.5px, #000 9px) right / 51% 100% no-repeat;
            mask: radial-gradient(circle 9px at 0 92px, transparent 8.5px, #000 9px) left / 51% 100% no-repeat, radial-gradient(circle 9px at 100% 92px, transparent 8.5px, #000 9px) right / 51% 100% no-repeat; }
  .ticket-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding-bottom: 10px; margin-bottom: 14px; border-bottom: 1.5px dashed rgba(120, 90, 40, .45); }
  .ticket-head .line { font: 700 20px/1 var(--kai); color: var(--verm-dk); letter-spacing: .12em; }
  .ticket-head .line small { font: 700 12px/1 var(--text); letter-spacing: .16em; text-transform: uppercase; color: rgba(34, 25, 42, .62); margin-left: 6px; }
  .ticket-head .no { font: 500 12px/1 var(--text); letter-spacing: .12em; color: rgba(34, 25, 42, .55); font-variant-numeric: tabular-nums; }
  .opt { margin: 0 0 13px; padding: 0; border: 0; min-width: 0; }
  .opt > legend { display: block; width: 100%; padding: 0; margin: 0 0 6px; font: 700 12.5px/1.2 var(--text); letter-spacing: .14em; text-transform: uppercase; color: rgba(34, 25, 42, .64); }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
  .chip { position: relative; min-height: 46px; padding: 6px 10px; border-radius: 5px; border: 1.5px solid rgba(120, 90, 40, .38); color: var(--ink); font: 500 16px/1.15 var(--text);
    background: rgba(255, 252, 244, .55); display: flex; align-items: center; justify-content: center; gap: 8px; transition: border-color .15s, background .15s, color .15s; }

  .chip canvas { display: block; flex: none; }
  .chip small { display: block; font: 500 12.5px/1.15 var(--text); opacity: .72; }
  .chip .two { text-align: left; }
  /* the levels: stops along the line, and the sign of the one picked */

  .stops::before { content: ""; position: absolute; left: 10%; right: 10%; top: 22px; height: 4px; margin-top: -2px; border-radius: 2px;
    background: repeating-linear-gradient(90deg, #5a4630 0 2px, transparent 2px 9px), linear-gradient(#7d6649, #5a4630); opacity: .75; }
  .stop { position: relative; min-height: 64px; padding: 0 0 2px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 4px; color: var(--ink); }
  .stop .dot { position: relative; width: 22px; height: 22px; margin-top: 11px; border-radius: 50%; background: #fbf5e6; border: 2.5px solid #5a4630; transition: transform .2s; }
  .stop .zh { font: 700 15px/1 var(--kai); letter-spacing: .04em; color: rgba(34, 25, 42, .75); }
  .stop:hover .dot { border-color: var(--verm); }

  .stop[aria-pressed="true"] .zh { color: var(--verm-dk); }
  .stop .won { position: absolute; top: 0; right: 50%; margin-right: -24px; width: 17px; height: 17px; border-radius: 50%; border: 1.5px solid rgba(178, 30, 24, .9); color: rgba(178, 30, 24, .95);
    font: 700 9px/14px var(--kai); text-align: center; rotate: -14deg; background: rgba(255, 250, 240, .6); }
  .sign { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; margin-top: 6px; padding: 10px 12px 11px; border-radius: 4px; background: #fffdf7; border: 1.5px solid #2c2534; box-shadow: 0 2px 0 #2c2534; }
  .sign .name { font: 700 30px/1 var(--kai); letter-spacing: .14em; color: #1b1620; }
  .sign .en { font: 700 15px/1.1 var(--text); letter-spacing: .06em; color: #1b1620; }
  .sign .by { grid-column: 1 / -1; display: flex; justify-content: space-between; font: 500 12px/1.1 var(--text); color: rgba(27, 22, 32, .6); padding-top: 6px; border-top: 1px solid rgba(27, 22, 32, .25); }
  .sign canvas.stamp { grid-row: 1 / 3; grid-column: 2; width: 64px; height: 64px; }
  .cap { margin: 8px 0 0; min-height: 2.9em; font: italic 500 16px/1.35 var(--title); color: rgba(34, 25, 42, .86); }
  .go { width: 100%; min-height: 56px; margin-top: 4px; border-radius: 6px; border: 0; color: #ffefc4; font: italic 800 24px/1 var(--title); letter-spacing: .02em; text-shadow: 0 1px 0 rgba(60, 8, 4, .6);
    background: radial-gradient(120% 140% at 50% 0%, #e2584a, #b52a21 55%, #8a1c16); box-shadow: 0 0 0 1.5px #f2c96a inset, 0 0 0 4px #8a1c16, 0 1px 0 4px #c89a3c, 0 10px 22px rgba(90, 12, 8, .5); transition: filter .15s, translate .08s; }

  .seat { margin-bottom: 11px; padding: 10px; border-radius: 5px; border: 1.5px solid rgba(120, 90, 40, .38); background: rgba(255, 252, 244, .5); }
  .seat-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; font: 700 15px/1.2 var(--text); }
  .seat .who-bot { margin: 6px 0; font: 400 14.5px/1.35 var(--text); overflow-wrap: anywhere; }

  .levels { display: flex; flex-wrap: wrap; gap: 6px; }
  .levels .chip { min-height: 44px; font-size: 14.5px; }

  /* the game: two lanterns with the squares each side has taken, the race between them, and what is going on */
  #hud { margin-top: 14px; display: flex; flex-direction: column; align-items: stretch; }

  .plate { align-self: center; display: flex; align-items: baseline; gap: 10px; margin: 0 0 14px; padding: 6px 14px 7px; border-radius: 3px; background: #fffdf7; border: 1.5px solid #2c2534; box-shadow: 0 2px 0 #2c2534, 0 8px 18px rgba(4, 6, 24, .45); text-shadow: none; color: #1b1620; white-space: nowrap; }
  .plate .zh { font: 700 21px/1 var(--kai); letter-spacing: .12em; }
  .plate .en { font: 700 14px/1 var(--text); letter-spacing: .05em; }
  .plate .bd { padding-left: 10px; border-left: 1px solid rgba(27, 22, 32, .3); font: 500 13px/1 var(--text); color: rgba(27, 22, 32, .7); letter-spacing: .04em; }
  .score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; }

  .who .name { margin-top: 40px; font: 700 15px/1.2 var(--text); letter-spacing: .03em; color: var(--text-hi); max-width: 100%; text-align: center; overflow-wrap: anywhere; }
  .who.turn .name { color: var(--gold-hi); }
  .mid { padding: 0 6px 40px; text-align: center; }
  .mid .left { font: 700 26px/1 var(--title); color: var(--text-hi); font-variant-numeric: lining-nums; }
  .mid .what { display: block; font: 500 12px/1.2 var(--text); letter-spacing: .12em; text-transform: uppercase; color: var(--text-lo); }
  #meter { display: block; width: 100%; height: 26px; margin-top: 12px; }
  .status { margin: 12px 0 0; min-height: 1.2em; text-align: center; font: italic 800 28px/1.2 var(--title); color: #fff6e2; }
  .sub { margin: 4px 0 0; min-height: 2.8em; text-align: center; font: 400 16.5px/1.4 var(--text); color: var(--text-lo); }
  #prize { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 14px; margin: 10px 0 0; padding: 12px 14px; color: var(--ink); text-shadow: none; border-radius: 6px;
    background: var(--paper-tex, none), linear-gradient(172deg, #faf2df, var(--paper)); background-size: 220px, auto; box-shadow: 0 10px 26px rgba(4, 6, 24, .5); }
  #prize canvas { width: 92px; height: 92px; display: block; }
  #prize canvas.slam { animation: slam .55s cubic-bezier(.3, 1.5, .5, 1) both; }
  @keyframes slam { 0% { scale: 1.9; opacity: 0; rotate: -26deg; } 60% { opacity: 1; } 100% { scale: 1; rotate: -9deg; } }
  #prize b { display: block; font: italic 800 20px/1.15 var(--title); color: var(--verm-dk); }
  #prize span { font: 400 15px/1.35 var(--text); }
  .btns { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 10px; margin-top: 14px; }
  .btns .tag { min-height: 46px; font-size: 16px; justify-content: center; display: flex; align-items: center; }
  .btns .tag:disabled { opacity: .55; }
  .btns .tag.hot { background: radial-gradient(120% 140% at 50% 0%, #e2584a, #b52a21 55%, #8a1c16); color: #ffefc4; box-shadow: 0 0 0 1.5px #f2c96a inset, 0 6px 14px rgba(90, 12, 8, .45); }
  .btns .tag.hot::before { background: radial-gradient(circle at 40% 35%, #fff3c4, #f2bd4b); box-shadow: none; }

  /* the rules, a step at a time, each with a small board */

  .sheet { position: relative; width: min(820px, 100%); padding: 26px 28px 24px; border-radius: 8px; color: var(--ink);
    background: var(--paper-tex, none), linear-gradient(172deg, #fbf4e2, var(--paper) 40%, #ecdcb9); background-size: 240px, auto; box-shadow: 0 0 0 1px rgba(140, 105, 50, .35), 0 30px 80px rgba(3, 5, 24, .7); }
  .sheet h2 { margin: 0 52px 2px 0; font: italic 800 36px/1.1 var(--title); color: var(--verm-dk); }
  .sheet .lead { margin: 0 0 18px; font: italic 500 17px/1.4 var(--title); color: rgba(34, 25, 42, .8); }
  .steps { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px 24px; }

  .step b { color: var(--verm-dk); }
  .x { position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid rgba(120, 90, 40, .45); background: rgba(255, 252, 244, .6); color: var(--ink); font: 400 26px/1 var(--text); }
  .x:hover { border-color: var(--verm); color: var(--verm-dk); }

    .top { gap: 6px; min-height: 50px; padding-left: calc(6px + env(safe-area-inset-left, 0px)); padding-right: calc(10px + env(safe-area-inset-right, 0px)); }
    .home .far { display: none; }
    .tag { min-height: 44px; padding: 0 12px 0 20px; font-size: 15px; }
    .brand h1 { font-size: 42px; margin-top: 4px; } .brand .zh { font-size: 17px; } .brand .tagline { font-size: 16px; margin-top: 5px; }
    .playing .brand { display: none; }
    #setup { margin-top: 10px; }
    .ticket { padding: 14px 14px 14px; -webkit-mask: none; mask: none; }
    .opt { margin-bottom: 10px; }
    .chip { min-height: 46px; font-size: 15.5px; }
    .sign .name { font-size: 26px; }
    .cap { min-height: 2.7em; font-size: 15.5px; }
    #hud { margin-top: 2px; }
    .plate { margin-bottom: 6px; padding: 5px 12px 6px; } .plate .zh { font-size: 18px; }
    .go { position: sticky; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 2; }
    .score { grid-template-columns: 1fr auto 1fr; align-items: center; }
    .who { flex-direction: row; justify-content: center; gap: 10px; }
    .who[data-side="1"] { flex-direction: row-reverse; }
    .who .lamp { width: 50px; height: 61px; }
    .who .num { margin: 0; height: auto; font-size: 36px; line-height: 1; color: var(--text-hi); text-shadow: 0 1px 3px rgba(5, 8, 30, .8); }
    .who[data-side="1"] .num { color: var(--text-hi); }
    .who.turn .num { color: var(--gold-hi); }
    .who .name { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .mid { padding: 0 4px; } .mid .left { font-size: 20px; } .mid .what { font-size: 11px; letter-spacing: .08em; }
    #meter { height: 20px; margin-top: 6px; }
    .status { margin-top: 6px; font-size: 22px; } .sub { margin-top: 2px; font-size: 15.5px; min-height: 2.8em; }
    #prize { margin-top: 6px; padding: 9px 12px; } #prize canvas { width: 68px; height: 68px; } #prize b { font-size: 17px; }

    .step { grid-template-columns: 108px 1fr; gap: 12px; } .step canvas { width: 108px; height: 84px; } .step p { font-size: 15.5px; }
  }
  /* a wide, low window (a phone on its side): the board as tall as it can be, the rest beside it and smaller */
  @media (max-height: 560px) and (min-aspect-ratio: 1/1) {

    .top { min-height: 46px; padding-top: calc(2px + env(safe-area-inset-top, 0px)); }
    .home .far { display: none; }
    .tag { min-height: 44px; }
    .table { min-height: calc(var(--vh) - 48px); padding: 0 14px 6px; }
    .brand h1 { font-size: 30px; } .brand .zh, .brand .tagline { display: none; } .playing .brand { display: none; }
    #setup { margin-top: 6px; }
    .ticket { padding: 10px 12px; -webkit-mask: none; mask: none; } .ticket-head { padding-bottom: 6px; margin-bottom: 8px; }
    .opt { margin-bottom: 7px; } .opt > legend { margin-bottom: 4px; }
    .chip { min-height: 44px; font-size: 14.5px; } .sign { padding: 6px 10px; } .sign .name { font-size: 22px; } .sign canvas.stamp { width: 48px; height: 48px; }
    .cap { min-height: 2.6em; font-size: 14px; margin-top: 4px; } .stops { margin-top: 0; } .stop { min-height: 56px; }

<script id="rules">
/* ── Lantern Line: the rules ──
   Dots and boxes. One plain script, no DOM: the game page, every bot's worker and the arena under node all run this
   same file, so there is one set of rules. Everything declared here is there for a bot to use (docs/BOT_BRIEF.md).

   A square of dots, 6 × 6 (25 squares) or 8 × 8 (49 squares). The two sides, Red and Gold, take turns to draw one
   line between two dots next to each other, across or down. Whoever draws the fourth side of a square takes it, and
   must draw again; a line that takes nothing hands the turn over. When every line is drawn every square is taken,
   and whoever took more wins. Red draws first. Taking is never compulsory, and nobody ever passes. */
const RED = 0, GOLD = 1, SIDE = ['Red', 'Gold'];
const SIZES = [5, 7];                                         // squares to a row: the two boards the game is played on
const COLS = 'abcdefgh';                                      // dots are named by column letter and row number: a1 is the top left dot
const UNDO = 2;                                               // numbers kept for each move made, to take it back

/* A board of n × n squares has (n + 1) × (n + 1) dots. A dot is the number  x + (n + 1) × y, counted from the top left.
   A line (a move) is a number too:
     across, from dot (x, y) to (x + 1, y)    x + n × y                     0 … n(n + 1) − 1
     down,   from dot (x, y) to (x, y + 1)    n(n + 1) + x + (n + 1) × y    n(n + 1) … 2n(n + 1) − 1
   A square is  x + n × y, named by its top left dot: square a1 has the dots a1, b1, a2 and b2 at its corners. */
const GEO = {};
/** What a board of n × n squares looks like, worked out once for each size:
 *    n, dots (to a row: n + 1), across (how many lines run across: n(n + 1)), lines, squares
 *    lineSq[2m], lineSq[2m + 1]   the squares on either side of line m (above and below it, or left and right); −1 off the board
 *    sqLine[4s … 4s + 3]          the four sides of square s: top, right, bottom, left
 *    lineDot[2m], lineDot[2m + 1] the two dots line m joins, top or left one first */
function geometry(n) {
  if (!SIZES.includes(n)) throw new Error('the game is played on ' + SIZES.map(k => k + ' × ' + k).join(' and ') + ' squares, not ' + n);
  if (GEO[n]) return GEO[n];
  const D = n + 1, across = n * D, lines = 2 * across, squares = n * n;
  const lineSq = new Int16Array(lines * 2).fill(-1), sqLine = new Int16Array(squares * 4), lineDot = new Int16Array(lines * 2);
  for (let y = 0; y <= n; y++) for (let x = 0; x < n; x++) {
    const m = x + n * y;
    lineDot[2 * m] = x + D * y; lineDot[2 * m + 1] = x + 1 + D * y;
    if (y > 0) lineSq[2 * m] = x + n * (y - 1);
    if (y < n) lineSq[2 * m + 1] = x + n * y;
  }
  for (let y = 0; y < n; y++) for (let x = 0; x <= n; x++) {
    const m = across + x + D * y;
    lineDot[2 * m] = x + D * y; lineDot[2 * m + 1] = x + D * (y + 1);
    if (x > 0) lineSq[2 * m] = x - 1 + n * y;
    if (x < n) lineSq[2 * m + 1] = x + n * y;
  }
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const s = x + n * y;
    sqLine[4 * s] = x + n * y; sqLine[4 * s + 1] = across + x + 1 + D * y; sqLine[4 * s + 2] = x + n * (y + 1); sqLine[4 * s + 3] = across + x + D * y;
  }
  return (GEO[n] = { n, dots: D, across, lines, squares, lineSq, sqLine, lineDot });
}

/* keys for telling positions apart quickly (a bot may remember positions it has already searched): one pair a line,
   and one for Gold to move */
const MAX_LINES = 2 * 7 * 8;
const ZL = new Int32Array(MAX_LINES + 1), ZH = new Int32Array(MAX_LINES + 1);
(() => {
  let s = 0x2545F491;
  const r = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), s | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return (t ^ (t >>> 14)) | 0; };
  for (let i = 0; i <= MAX_LINES; i++) { ZL[i] = r(); ZH[i] = r(); }
})();
const Z_GOLD = MAX_LINES;

/** A new game on a board of n × n squares: 5 or 7. Red is to draw.
 *    S.line[m]    1 where line m is drawn, 0 where it is not
 *    S.sides[s]   how many of square s's four sides are drawn
 *    S.owner[s]   who took square s: RED, GOLD, or −1
 *    S.score      squares taken, [Red, Gold];   S.turn: whose move it is;   S.left: lines still to draw
 *    S.history    every line drawn, in order;   S.over: null while the game is on */
function newGame(n = SIZES[0]) {
  const g = geometry(n);
  return { n, g, line: new Uint8Array(g.lines), sides: new Uint8Array(g.squares), owner: new Int8Array(g.squares).fill(-1),
    score: [0, 0], turn: RED, left: g.lines, hl: 0, hh: 0, undo: new Int32Array(UNDO * g.lines), sp: 0, history: [], over: null };
}

/** Every move the side to play may make (every line not yet drawn), written into out from index off; returns how many. */
function gen(S, out, off = 0) {
  const L = S.line; let k = off;
  for (let m = 0; m < L.length; m++) if (!L[m]) out[k++] = m;
  return k - off;
}

/** Draws line m for the side to play without asking whether it may. Returns how many squares it took (0, 1 or 2):
 *  when it took any, the same side is to move again; when it took none, the turn has passed. Undone by unmake. */
function make(S, m) {
  const side = S.turn, LS = S.g.lineSq, a = LS[2 * m], b = LS[2 * m + 1];
  let got = 0;
  S.line[m] = 1; S.left--;
  if (a >= 0 && ++S.sides[a] === 4) { S.owner[a] = side; got++; }
  if (b >= 0 && ++S.sides[b] === 4) { S.owner[b] = side; got++; }
  S.score[side] += got;
  S.undo[S.sp] = m; S.undo[S.sp + 1] = side; S.sp += UNDO;
  S.hl ^= ZL[m]; S.hh ^= ZH[m];
  if (!got) { S.turn = 1 - side; S.hl ^= ZL[Z_GOLD]; S.hh ^= ZH[Z_GOLD]; }
  return got;
}
/** Takes the last make back. Returns the line it undrew. */
function unmake(S) {
  S.sp -= UNDO;
  const m = S.undo[S.sp], side = S.undo[S.sp + 1], LS = S.g.lineSq, a = LS[2 * m], b = LS[2 * m + 1];
  if (S.turn !== side) { S.turn = side; S.hl ^= ZL[Z_GOLD]; S.hh ^= ZH[Z_GOLD]; }
  if (a >= 0) { if (S.sides[a] === 4) { S.owner[a] = -1; S.score[side]--; } S.sides[a]--; }
  if (b >= 0) { if (S.sides[b] === 4) { S.owner[b] = -1; S.score[side]--; } S.sides[b]--; }
  S.line[m] = 0; S.left++;
  S.hl ^= ZL[m]; S.hh ^= ZH[m];
  return m;
}

/** The move made just before this position, or −1 when make has made none. */
const lastMove = S => (S.sp ? S.undo[S.sp - UNDO] : -1);
/** A position's key in two halves: the lines drawn and whose move it is. (Not the score: what is still to be won
 *  from a position does not depend on who took the squares already taken.) */
const keyLo = S => S.hl, keyHi = S => S.hh;

const legalMoves = S => { if (S.over) return []; const out = []; gen(S, out); return out; };
const isLegal = (S, m) => !S.over && Number.isInteger(m) && m >= 0 && m < S.line.length && !S.line[m];
/** How many squares line m would take for the side to play: those of its squares that already have three sides. */
function takes(S, m) { const LS = S.g.lineSq, a = LS[2 * m], b = LS[2 * m + 1]; return (a >= 0 && S.sides[a] === 3 ? 1 : 0) + (b >= 0 && S.sides[b] === 3 ? 1 : 0); }
/** Is line m safe: does neither square beside it have two sides drawn already? A safe line takes nothing and leaves
 *  no square with three sides for the other side to take. */
function isSafe(S, m) { const LS = S.g.lineSq, a = LS[2 * m], b = LS[2 * m + 1]; return (a < 0 || S.sides[a] < 2) && (b < 0 || S.sides[b] < 2); }

/* ── names ── */
const dotName = (d, n) => COLS[d % (n + 1)] + (((d / (n + 1)) | 0) + 1);
/** a line's name: its two dots, top or left one first ('a1-b1' across, 'a1-a2' down) */
const lineName = (m, n) => { const g = geometry(n); return dotName(g.lineDot[2 * m], n) + '-' + dotName(g.lineDot[2 * m + 1], n); };
/** a square's name: its top left dot */
const squareName = (s, n) => COLS[s % n] + (((s / n) | 0) + 1);
function dotAt(name, n) {
  const hit = /^([a-h])([1-8])$/.exec(String(name)); if (!hit) return -1;
  const x = COLS.indexOf(hit[1]), y = +hit[2] - 1;
  return x <= n && y <= n ? x + (n + 1) * y : -1;
}
/** The line between two dots named in either order ('b1-a1' is 'a1-b1'), or −1 when they are not next to each other. */
function lineAt(name, n) {
  const parts = String(name).split('-'); if (parts.length !== 2) return -1;
  let a = dotAt(parts[0], n), b = dotAt(parts[1], n); if (a < 0 || b < 0) return -1;
  if (a > b) { const t = a; a = b; b = t; }
  const D = n + 1, x = a % D, y = (a / D) | 0;
  if (b === a + 1 && x < n) return x + n * y;
  if (b === a + D) return n * D + x + D * y;
  return -1;
}
function squareAt(name, n) {
  const hit = /^([a-h])([1-8])$/.exec(String(name)); if (!hit) return -1;
  const x = COLS.indexOf(hit[1]), y = +hit[2] - 1;
  return x < n && y < n ? x + n * y : -1;
}

/** What a move is going to do, worked out before it is made: for the hints on the board and for showing it happen.
 *    side: who draws.  across: the line runs across (otherwise down).  from, to: its two dots, top or left first.
 *    took: the squares it takes.  again: the same side moves again (it took something and lines are left).
 *    gives: the squares it leaves with three sides when the turn passes: the other side may take them. */
function describe(S, m) {
  const g = S.g, LS = g.lineSq, side = S.turn, took = [], gives = [];
  for (const s of [LS[2 * m], LS[2 * m + 1]]) {
    if (s < 0) continue;
    if (S.sides[s] === 3) took.push(s); else if (S.sides[s] === 2) gives.push(s);
  }
  return { m, side, across: m < g.across, from: g.lineDot[2 * m], to: g.lineDot[2 * m + 1], took, again: took.length > 0 && S.left > 1, gives: took.length ? [] : gives };
}

/** Plays a move in a game. Returns what happened (see describe), or null if the move is not allowed. */
function playMove(S, m) {
  if (!isLegal(S, m)) return null;
  const ev = describe(S, m);
  make(S, m); S.history.push(m);
  if (!S.left) S.over = { winner: S.score[RED] > S.score[GOLD] ? RED : S.score[GOLD] > S.score[RED] ? GOLD : -1, score: S.score.slice() };
  ev.over = S.over;
  return ev;
}
function undoMove(S) {
  if (!S.history.length) return null;
  S.history.pop(); S.over = null;
  return unmake(S);
}
/** A game played again from its board size and its list of moves; null if the size is not one of the game's or a
 *  move is not allowed. */
function replay(n, moves) {
  if (!SIZES.includes(n) || !Array.isArray(moves)) return null;
  const S = newGame(n);
  for (const m of moves) if (!playMove(S, m)) return null;
  return S;
}

</script>
<script id="host" type="text/plain">
/* ── The bot host ──
   The last part of a bot's program. A program is three texts put end to end:

       rules.js
       const __BOT = (function () { 'use strict'; …the bot's file… ; return typeof BOT === 'undefined' ? null : BOT; })();
       host.js

   so whatever a bot declares stays its own, and it cannot trip over a name the rules use. One program to a context:
   a web worker in the game, a vm context in the arena. The host hands the bot a fresh copy of the game each time it
   is asked for a move, and checks the answer before anyone else sees it. */
const HOST = (() => {
  function rngOf(seed) {
    let s = seed >>> 0;
    return () => { s = (s + 0x6D2B79F5) >>> 0; let t = Math.imul(s ^ (s >>> 15), s | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function problem() {
    if (typeof __BOT !== 'object' || !__BOT) return 'the file does not define BOT';
    if (typeof __BOT.think !== 'function') return 'BOT.think is not a function';
    if (!Array.isArray(__BOT.levels) || !__BOT.levels.length || __BOT.levels.some(l => typeof l !== 'string' || !l)) return 'BOT.levels has to list at least one level name';
    return '';
  }
  /** Who the bot says it is: { name, author, levels }, or { error }. */
  function info() {
    const p = problem();
    return p ? { error: p } : { name: String(__BOT.name || 'Unnamed'), author: String(__BOT.author || 'unknown'), levels: __BOT.levels.slice() };
  }
  /** The bot's move in the game on the board of q.size × q.size squares with this list of moves: { move }, or
   *  { error } when it has none to give. q: size, level, timeMs (what it is asked to stay within), seed (for the
   *  random numbers it is handed). */
  function move(history, q) {
    const p = problem(); if (p) return { error: p };
    if (!__BOT.levels.includes(q.level)) return { error: 'no such level: ' + q.level };
    const S = replay(q.size, history); if (!S) return { error: 'the game handed over cannot be played through' };
    const legal = legalMoves(S); if (!legal.length) return { error: 'the game is over' };
    let m;
    try { m = __BOT.think(S, { level: q.level, size: S.n, timeMs: q.timeMs, rand: rngOf(q.seed | 0) }); }
    catch (e) { return { error: 'think threw: ' + (e && e.message ? e.message : e) }; }
    if (m !== null && typeof m === 'object' && 'move' in m) m = m.move;
    if (!legal.includes(m)) return { error: 'think returned ' + (typeof m === 'number' ? m : typeof m) + ', which is not one of the moves allowed' };
    return { move: m };
  }
  return { info, move };
})();

// in a worker: { id, ask: 'info' }  or  { id, size, history, level, timeMs, seed }  →  the answer with the same id
if (typeof WorkerGlobalScope !== 'undefined' && typeof self !== 'undefined' && self instanceof WorkerGlobalScope) {
  self.onmessage = e => { const q = e.data || {}; self.postMessage(Object.assign({ id: q.id }, q.ask === 'info' ? HOST.info() : HOST.move(q.history, q))); };
}

</script>
<script type="text/plain" data-bot="house">
/* ── The house bot ──
   The computer player the game ships with, as a bot like any other (docs/BOT_BRIEF.md). Five levels, weakest first:

   easy    takes every square it is handed, and otherwise draws more or less anywhere: it gives squares away
           without noticing.
   casual  takes every square it can, draws only safe lines while there are any, and when there are none it hands
           over as few squares as it can. It never leaves a square on purpose.
   steady  the same while safe lines are left. Once they are gone it plays the end exactly: it knows which chain to
           open first, and when to take all but two of a chain and leave the last two, so that the other side has to
           open the next one.
   sharp   steady's end, and before it, once few safe lines are left, it reckons whose turn it will be when they run
           out, and draws so that it will not be its own.
   master  reckons that from the first line: it searches ahead (alpha-beta, with a table of positions already
           searched) and judges each position by playing the safe lines out and counting the end exactly. It will
           give a square or two away early to come out right at the end.

   The end, once no safe line is left, is a set of chains (rows of squares that fall one after another) and loops.
   Whoever has to open one hands it over; whoever is handed a long one can take all of it and open the next, or take
   all but two and hand those two back, so that the other side has to open again. valueOf() counts that exactly
   for any set of chains and loops.

   Its budget is a count of positions, not a stretch of time, so it is as strong on a phone as on a laptop; the clock
   only stops it if the device is too slow to get there. It plays both boards the same way: its search is deeper on
   the 5 × 5 board, where there is less to look at.

   Everything the rules file declares is in scope here. The file is the body of a function, so these names are its own. */
const MAXL = 112, MAXS = 49, MAXPLY = 64;
const clock = typeof performance !== 'undefined' && performance.now ? () => performance.now() : () => Date.now();
const LEVEL = {
  steady: { budget: 30000, depth: 6, rollouts: 0, sacrifices: false, from: 0 },          // from: search once this few safe lines are left (0: only at the end)
  sharp: { budget: 60000, depth: 24, rollouts: 1, sacrifices: false, from: 12 },
  master: { budget: 150000, depth: 60, rollouts: 2, sacrifices: true, from: Infinity },
};
/* the orders the safe lines are played out in, to judge a position: steps through the lines, prime to how many there are */
const STRIDE = { 5: [7, 13, 11], 7: [9, 5, 13] };

/* ── small things about squares and lines ── */
/** the side of square s not yet drawn, other than `not` */
function openSide(S, s, not) { const SL = S.g.sqLine; for (let i = 4 * s; i < 4 * s + 4; i++) { const m = SL[i]; if (!S.line[m] && m !== not) return m; } return -1; }
/** the square across line m from square s, or −1 for the edge of the board */
function across(S, m, s) { const LS = S.g.lineSq; return LS[2 * m] === s ? LS[2 * m + 1] : LS[2 * m]; }
/** How many squares the other side could take one after another, if line m were drawn now and took nothing. */
function gift(S, m) {
  make(S, m);
  let given = 0, made = 0;
  for (let more = true; more;) {
    more = false;
    for (let s = 0; s < S.sides.length; s++) if (S.sides[s] === 3) { given += make(S, openSide(S, s, -1)); made++; more = true; break; }
  }
  while (made--) unmake(S);
  unmake(S);
  return given;
}
/** A square that can be taken without opening anything (its fourth side leads off the board, to a square that will
 *  not have three sides after it, or to another square it takes as well): the line that takes it, or −1. */
function freeTake(S) {
  for (let s = 0; s < S.sides.length; s++) {
    if (S.sides[s] !== 3) continue;
    const m = openSide(S, s, -1), o = across(S, m, s);
    if (o < 0 || S.sides[o] !== 2) return m;
  }
  return -1;
}
const anyToTake = S => { for (let s = 0; s < S.sides.length; s++) if (S.sides[s] === 3) return true; return false; };
function safeLines(S, out) { out.length = 0; for (let m = 0; m < S.line.length; m++) if (!S.line[m] && isSafe(S, m)) out.push(m); return out; }

/* ── the end: chains and loops ── */
const seen = new Uint8Array(MAXS), CH = [], LP = [];
/** Reads a position with nothing to take and no safe line as chains and loops of squares with two sides each, into
 *  chains and loops (their lengths). Returns how many squares are left over with fewer than two sides: junctions,
 *  where several chains meet. With none, the reading is exact. */
function structure(S, chains, loops) {
  chains.length = 0; loops.length = 0;
  const B = S.sides.length, sides = S.sides, SL = S.g.sqLine;
  let junctions = 0;

  /** The lanterns over the valley, for the window as it is now. */

/* ── Sounds: bamboo, paper catching light, and bells, synthesized with WebAudio ──
   A line is a strip of bamboo laid down: a small dry knock. A square taken is paper catching the light, a soft
   breath and a bell, and the bells of a run of squares climb the five notes of the scale one after another. */
const SFX = {
  ctx: null, on: true,
  init() { if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; } try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); } catch (e) { /* no sound here */ } },
  /** a burst of filtered noise */
  noise(t0, dur, vol, f0, f1, type = 'bandpass', q = 0.9) {
    const c = this.ctx, n = Math.max(1, Math.floor(c.sampleRate * dur)), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) { const k = i / n; d[i] = (Math.random() * 2 - 1) * Math.pow(1 - k, 1.5); }
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(), t = c.currentTime + t0;
    f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
    g.gain.value = vol; s.buffer = b; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
  },
  tone(f, t0, dur, vol = 0.07, type = 'sine', f1 = 0, attack = 0.006) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
    o.type = type; o.frequency.setValueAtTime(f, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  },
  /** a small bell: a struck tone with a bell's overtones, dying away */
  bell(t0, f, vol, len = 1.6) {
    for (const [ratio, amp, life] of [[1, 1, 1], [2.01, 0.42, 0.6], [2.76, 0.28, 0.42], [4.07, 0.14, 0.26], [0.5, 0.18, 0.8]]) this.tone(f * ratio, t0, len * life, vol * amp, 'sine', 0, 0.003);
  },
  /** the five notes of the scale, climbing: the bell of the k-th square of a run */
  note(k) { const steps = [0, 2, 4, 7, 9]; return 523.25 * Math.pow(2, (steps[k % 5] + 12 * Math.floor(k / 5)) / 12); },
  play(name, k = 0) {
    if (!this.on) return;
    this.init(); if (!this.ctx) return;
    switch (name) {
      case 'draw': { const f = 380 + Math.random() * 60; this.tone(f, 0, 0.09, 0.12, 'triangle', f * 0.7); this.noise(0, 0.035, 0.09, 2600, 1400); this.tone(f * 2.3, 0.004, 0.05, 0.03, 'sine'); break; }
      case 'take': this.noise(0, 0.32, 0.05, 500, 2600, 'bandpass', 1.2); this.tone(150, 0.02, 0.32, 0.12, 'sine', 70); this.bell(0.06, this.note(Math.min(k, 9)), 0.06); break;

      case 'stamp': this.tone(120, 0, 0.22, 0.32, 'sine', 48); this.noise(0, 0.12, 0.22, 900, 200, 'lowpass', 0.7); this.noise(0.02, 0.05, 0.08, 3000, 1500); break;
      case 'no': this.tone(180, 0, 0.12, 0.08, 'triangle', 150); break;

/* ── Asking a computer player for its move ──
   A computer player is a bot (docs/BOT_BRIEF.md) playing at one of its levels. A bot runs in a worker of its own,
   made of three texts the page carries: the rules, the bot's file kept to itself, and the host that hands it a
   fresh copy of the game and checks its answer (engine/host.js). The page carries its bots as text, each in a
   script element of type text/plain that names it; on the kit's board a bot's file is chosen from the disk instead. */
const MOVE_MS = 1000;          // what a bot is asked to stay within for a move; past three times that it has lost
const Bots = {
  files: new Map(), made: new Map(), local: new Map(), noWorker: new Set(), seq: 0,
  source(bot) { if (this.files.has(bot)) return this.files.get(bot); const el = document.querySelector(`script[data-bot="${bot}"]`); return el ? el.textContent : null; },
  program(bot) {
    const src = this.source(bot);
    return src === null ? null : document.getElementById('rules').textContent + "\nconst __BOT = (function () { 'use strict';\n" + src + "\n;return typeof BOT === 'undefined' ? null : BOT;\n})();\n" + document.getElementById('host').textContent;
  },
  /** takes a bot's file under a name; whatever ran under that name before is sent home */
  load(bot, src) { this.drop(bot, 'another file was loaded'); this.local.delete(bot); this.noWorker.delete(bot); this.files.set(bot, src); },
  /** the worker for a bot, started when it is wanted; null where none can be had */
  worker(bot) {
    let w = this.made.get(bot);
    if (w) return w;
    const text = this.noWorker.has(bot) ? null : this.program(bot);
    if (text === null) return null;
    try {
      w = { w: new Worker(URL.createObjectURL(new Blob([text], { type: 'text/javascript' }))), waiting: new Map(), answered: false };
      w.w.onmessage = e => { w.answered = true; const f = w.waiting.get(e.data.id); w.waiting.delete(e.data.id); if (f) f(e.data); };
      w.w.onerror = e => { if (e && e.preventDefault) e.preventDefault(); if (!w.answered) this.noWorker.add(bot); this.drop(bot, 'the bot stopped' + (e && e.message ? ': ' + e.message : '')); };   // one that never spoke was never allowed to start
      this.made.set(bot, w);
      return w;
    } catch (e) { this.noWorker.add(bot); return null; }
  },
  drop(bot, why) {
    const w = this.made.get(bot); if (!w) return;
    this.made.delete(bot); try { w.w.terminate(); } catch (e) { /* already gone */ }
    for (const f of w.waiting.values()) f({ error: why });
  },
  dropAll(why) { for (const bot of [...this.made.keys()]) this.drop(bot, why); },
  /** Where the browser lets no worker start (a page shown inside another, under some rules), the same three texts
   *  are run in the page itself, shut in a function of their own: the board stands still while the bot thinks, but
   *  the moves are its own. Null if the bot's file is not there or does not run. */
  inPage(bot) {
    if (!this.local.has(bot)) {
      const text = this.program(bot);
      let host = null;
      try { if (text !== null) host = new Function(text + '\n;return HOST;')(); } catch (e) { host = null; }
      this.local.set(bot, host);
    }
    return this.local.get(bot);
  },
  /** One question to a bot: q is { ask: 'info' } or { size, history, level, timeMs, seed }. Comes back with the host's
   *  answer, or { error } when the bot broke, could not be started, or did not answer within `wait` ms. */
  ask(bot, q, wait) {
    const here = () => new Promise(res => setTimeout(() => {
      const host = this.inPage(bot);
      if (!host) return res({ error: this.source(bot) === null ? 'there is no bot called ' + bot : 'the file could not be run' });
      try { res(q.ask === 'info' ? host.info() : host.move(q.history, q)); } catch (e) { res({ error: 'broke: ' + (e && e.message ? e.message : e) }); }
    }, 30));
    const w = this.worker(bot);
    if (!w) return here();
    return new Promise(res => {
      const id = ++this.seq;
      const late = setTimeout(() => this.drop(bot, `took more than ${wait} ms`), wait);
      w.waiting.set(id, a => { clearTimeout(late); if (a.error !== undefined && this.noWorker.has(bot)) here().then(res); else res(a); });
      w.w.postMessage(Object.assign({ id }, q));
    });
  },
  /** who a bot says it is: { name, author, levels } or { error } */
  info(bot) { return this.ask(bot, { ask: 'info' }, 4000); },
  /** The move of `bot` at `level` in game S: { move } when it is one of the moves allowed, else { error }. */
  async move(S, bot, level) {
    const legal = legalMoves(S), a = await this.ask(bot, { size: S.n, history: S.history.slice(), level, timeMs: MOVE_MS, seed: (Math.random() * 0x7fffffff) | 0 }, MOVE_MS * 3);
    if (a.error !== undefined) return { error: a.error };
    return Number.isInteger(a.move) && legal.includes(a.move) ? { move: a.move } : { error: 'no move came back' };
  },
};

/* ── The board on the page: laying it out, painting it, showing a line drawn and a square lit, and taking a line from
   a hand ──
   One canvas. What does not change in a game (the indigo paper, the bamboo frame, the guide marks where lines may
   go) is painted once for the board's size into View.base; the rest is painted over it every frame while anything
   moves: the squares taken, glowing; the lines, as bamboo strips; the knots where they meet; the line under a
   finger or the pointer; the ties that mark the lines of the turn before and the turn now. */
const View = {
  n: 5, size: 0, dpr: 1, m: 0, c: 0, w: 0, r: 0, base: null, sp: null,
  S: null, by: new Int8Array(112).fill(-1), tLine: new Float64Array(112), tSq: new Float64Array(49), sqSide: new Int8Array(49).fill(-1),
  hot: -1, cursor: -1, input: null, quiet: false, marks: [new Set(), new Set()], last: -1, raf: 0, until: 0, runs: 0,

  /** Lays the board out for the size it now has on the page, and paints what stays. */

  let down = -1;
  const may = () => !!View.input && !!View.S && !View.S.over;
  const hover = m => { if (m !== View.hot) { View.hot = m; box().classList.toggle('can', m >= 0); View.dirty(); } };
  window.addEventListener('pointermove', e => {
    if (!may()) { if (View.hot >= 0) hover(-1); return; }
    if (e.pointerType !== 'mouse' && down < 0) return;
    hover(View.lineAtPoint(e.clientX, e.clientY));
  }, { passive: true });
  document.addEventListener('pointerdown', e => {
    if (!may() || !e.target.closest || !e.target.closest('#boardbox')) return;
    down = e.pointerId; View.cursor = -1; hover(View.lineAtPoint(e.clientX, e.clientY));
    if (e.pointerType !== 'mouse') e.preventDefault();

  const up = e => {

    down = -1;
    const m = View.lineAtPoint(e.clientX, e.clientY);
    if (e.pointerType !== 'mouse') hover(-1);

  window.addEventListener('blur', () => hover(-1));

    const dir = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];

})();

/* ── The game on the page: the ticket that settles a game, whose turn it is, what is said about it, and the stamps ──

/** The house bot's levels, weakest first, as stops on the Pingxi line from the cat village to the end of the line:
 *  each with its name, and how that level plays. Beating the computer at a stop, on a board, presses that stop's
 *  stamp for that board. */
const STOPS = [
  { level: 'easy', zh: '猴硐', en: 'Houtong', line: 'The cat village, where nobody hurries. It takes any square it is handed, and otherwise draws more or less anywhere.' },
  { level: 'casual', zh: '大華', en: 'Dahua', line: 'A quiet halt by the river. It takes every square it can and keeps to safe lines, but never leaves one on purpose.' },
  { level: 'steady', zh: '十分', en: 'Shifen', line: 'Lanterns go up from the tracks here. It plays the end exactly: which chain to open, and when to hand the last two back.' },
  { level: 'sharp', zh: '平溪', en: 'Pingxi', line: 'The heart of the festival. It counts the safe lines before they run out, so that you are the one left to open a chain.' },
  { level: 'master', zh: '菁桐', en: 'Jingtong', line: 'The end of the line, wishes hung on bamboo. It reckons the end from the first line, and gives a square away early to win it.' },

  screen: 'setup', S: newGame(5), token: 0, note: '', armed: 0, forfeit: null, run: 0,
  cfg: { size: 5, vs: 'bot', level: 'steady', side: RED },  // what the ticket has settled on the game's page
  seat: [{ kind: 'human' }, { kind: 'human' }],             // who plays Red and who Gold in the game on the board: { kind, bot, level, name, label }
  house: [], stamps: {}, wins: {},                          // the house bot's levels; the stamps pressed, and the wins at each stop, by 'level:size'
  kit: [{ bot: '', info: null, level: '', file: '', error: '' }, { bot: '', info: null, level: '', file: '', error: '' }],

  read() { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { return {}; } },
  write(d) { try { localStorage.setItem(STORE, JSON.stringify(d)); } catch (e) { /* nowhere to keep it: the game goes on */ } },

function save() {

  Store.write({ cfg: G.cfg, sound: SFX.on, stamps: G.stamps, wins: G.wins, game: live ? { size: G.S.n, moves: G.S.history.slice(), seat: G.seat } : null });

  renderHud();

    const people = G.seat.filter(s => s.kind === 'human').length, who = people === 1 ? 'You' : SIDE[me];

    else say(people === 1 ? 'Your move' : `${who} to draw`, G.note || (S.history.length < 2 ? 'Draw a line between two dots next to each other, across or down.' : ''));

/* ── the rules, each with a small board ── */
/** A corner of a board, w × h squares, for the rules: lines drawn (h: across, v: down, by dot), squares lit (by side),
 *  and a line being drawn now, ghosted. */
function paintMini(cv, w, h, spec) {

}

/* ── wiring ── */
function renderSound() { $('#sound').textContent = SFX.on ? 'Sound on' : 'Sound off'; $('#sound').setAttribute('aria-pressed', SFX.on); }

 *  address bar coming and going) keeps the painting it has: painting it again each time would stutter. */
const Paint = { w: 0, h: 0, all(force) {

  View.fit(G.screen === 'play' ? G.S.n : G.cfg.size);

function wire() {

    if (act === 'vs') { G.cfg.vs = v; snd('draw'); renderSetup(); return save(); }
    if (act === 'level') { G.cfg.level = v; snd('draw'); renderSetup(); return save(); }

      clearTimeout(G.armed); return toSetup();
    }
  });
  $('#pick').addEventListener('change', ev => { const f = ev.target.files && ev.target.files[0]; if (f) takeFile(+ev.target.dataset.side, f); });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !$('#help').hidden) closeHelp(); });
  let again = 0;
  window.addEventListener('resize', () => { clearTimeout(again); again = setTimeout(() => Paint.all(), 140); });
  document.addEventListener('visibilitychange', () => Scene.pause(document.hidden));
}
async function boot() {
  const kept = Store.read();
  if (kept.sound === false) SFX.on = false;
  if (kept.cfg) Object.assign(G.cfg, { size: kept.cfg.size === 7 ? 7 : 5, vs: kept.cfg.vs === 'friend' ? 'friend' : 'bot', level: String(kept.cfg.level || 'steady'), side: kept.cfg.side === GOLD ? GOLD : RED });
  if (!KIT && kept.stamps && typeof kept.stamps === 'object') for (const k in kept.stamps) if (/^[a-z]+:[57]$/.test(k) && kept.stamps[k] === true) G.stamps[k] = true;
  if (!KIT && kept.wins && typeof kept.wins === 'object') for (const k in kept.wins) if (/^[a-z]+:[57]$/.test(k) && Number.isInteger(kept.wins[k]) && kept.wins[k] > 0) G.wins[k] = kept.wins[k];
  wire(); renderSound();
  const grain = paperGrain(220, 11); document.documentElement.style.setProperty('--paper-tex', `url(${grain.toDataURL()})`);
  try { await Promise.race([Promise.all([document.fonts.load('italic 800 20px Alegreya'), document.fonts.load('700 20px "Lantern Kai"', '安福'), document.fonts.load('500 16px "Alegreya Sans"')]), sleep(1500)]); } catch (e) { /* the fallback faces will do */ }
  Paint.all(true); Scene.wake();
  if (!KIT) {
    const info = await Bots.info('house');
    G.house = info.levels || [];
    if (!G.house.includes(G.cfg.level)) G.cfg.level = G.house[Math.min(2, G.house.length - 1)] || '';
  }
  const game = kept.game, S = game && Array.isArray(game.moves) && [5, 7].includes(game.size) ? replay(game.size, game.moves) : null;
  const fits = S && !S.over && Array.isArray(game.seat) && game.seat.length === 2 && game.seat.every(s => s && (s.kind === 'human' || (s.kind === 'bot' && s.bot === 'house' && G.house.includes(s.level))));
  if (fits && !KIT) startGame(game); else toSetup();
}
boot();
