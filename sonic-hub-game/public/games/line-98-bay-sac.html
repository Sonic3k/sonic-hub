<style>
  /* ── Line 98: Bảy Sắc ── Lines 98 by its own rules, in eight painted places chosen from a map.
     Everything painted is painted on canvases by the page itself (game/src). What is set in type is either a name or
     a number (Fraunces) or something to read and press (Be Vietnam Pro). The map and the sheets are paper and ink
     wherever the player is; a place's own colours (the --p- ones, set from its theme) dress only its table. */
  :root { box-sizing: border-box; color-scheme: dark;
    --title: Fraunces, "Iowan Old Style", Palatino, Georgia, serif; --text: "Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, sans-serif;
    --paper: #f6eedb; --paper-lo: #e9dcc0; --pen: #2a2440; --pen-soft: #6a6384; --seal: #c8442d; --gold: #e9c46a; --night: #1d1740;
    --p-ink: #fff; --p-soft: rgba(255,255,255,.72); --p-panel: rgba(20,22,40,.55); --p-edge: rgba(255,255,255,.2); --p-accent: #e9c46a; --p-accent-ink: #2a2440; --p-num: #fff;
    --vh: 100vh; --board: min(calc(100vw - 20px), calc(var(--vh) - 232px), 700px); --side: 0px; }
  @supports (height: 100dvh) { :root { --vh: 100dvh; } }
  *, *::before, *::after { box-sizing: inherit; }
  html { -webkit-text-size-adjust: 100%; background: var(--night); }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; color: #fff; font: 400 16px/1.42 var(--text); -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; border: 0; background: none; padding: 0; } button:disabled { cursor: default; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 6px; }
  [hidden] { display: none !important; }
  canvas { display: block; }
  .fill { position: absolute; inset: 0; width: 100%; height: 100%; }
  .screen { position: fixed; inset: 0; overflow: hidden; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* the strip along the top of both screens */
  .top { position: absolute; z-index: 5; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 8px; min-height: 52px;
    padding: calc(6px + env(safe-area-inset-top, 0px)) calc(12px + env(safe-area-inset-right, 0px)) 0 calc(12px + env(safe-area-inset-left, 0px)); pointer-events: none; }
  .top > * { pointer-events: auto; }
  .sp { flex: 1; }
  .home { color: #fff; text-decoration: none; font: 600 14.5px/1 var(--text); padding: 13px 8px; opacity: .88; white-space: nowrap; text-shadow: 0 1px 3px rgba(10,6,40,.6); }
  .home:hover { opacity: 1; }
  .chip { min-width: 42px; min-height: 42px; padding: 0 14px; border-radius: 22px; white-space: nowrap; font: 600 14px/1 var(--text); letter-spacing: .01em; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    color: var(--c-ink, #fff); background: var(--c-bg, rgba(24,18,60,.5)); border: 1px solid var(--c-edge, rgba(255,255,255,.28)); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    box-shadow: 0 1px 0 rgba(255,255,255,.12) inset, 0 4px 14px rgba(8,6,30,.22); transition: transform .12s, background-color .15s, border-color .15s; }
  .chip:hover { border-color: rgba(255,255,255,.6); } .chip:active { transform: translateY(1px) scale(.98); }
  .chip.round { padding: 0; width: 42px; }
  .chip svg { width: 20px; height: 20px; flex: none; }

  /* ── the map ── */
  #map { background: var(--night); }
  #spots { position: absolute; inset: 0; }
  .spot { position: absolute; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%; }
  .spot:focus-visible { outline-offset: 4px; border-radius: 50%; }
  .masthead { position: absolute; z-index: 4; left: calc(20px + env(safe-area-inset-left, 0px)); top: calc(58px + env(safe-area-inset-top, 0px)); pointer-events: none; text-shadow: 0 2px 0 rgba(20,12,60,.55), 0 6px 26px rgba(20,12,60,.6); }
  .masthead h1 { margin: 0; font: 600 clamp(38px, 9.6vw, 66px)/.92 var(--title); letter-spacing: -.01em; color: #fff7e0; }
  .masthead h1 em { display: block; margin: .1em 0 0 .06em; font: italic 500 .5em/1 var(--title); letter-spacing: .01em; color: var(--gold); white-space: nowrap; }
  .masthead p { margin: 9px 0 0 3px; max-width: 17em; font: 400 14px/1.35 var(--text); color: rgba(255,247,224,.84); }
  /* the rainbow beside the name: a band lights for each land where a hundred points were made */
  #bow { display: inline-block; width: 1.5em; height: .78em; margin-left: .3em; vertical-align: -.06em; pointer-events: auto; }
  #bow svg { display: block; width: 100%; height: 100%; overflow: visible; }
  #bow path { fill: none; stroke: rgba(255,255,255,.2); stroke-width: 4.6; transition: stroke .8s, filter .8s; }
  #bow path.lit { stroke: var(--c); filter: drop-shadow(0 0 3px var(--c)); }

  /* the ticket: the place the traveller stands on, and the way in */
  #ticket { position: absolute; z-index: 6; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(calc(100vw - 20px), 520px); transform: translateX(-50%);
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 4px 14px; padding: 13px 15px 13px 13px; border-radius: 18px; color: var(--pen);
    background: linear-gradient(170deg, #fffaf0, var(--paper) 45%, var(--paper-lo)); box-shadow: 0 0 0 1px rgba(42,36,64,.16), 0 1px 0 #fff inset, 0 18px 44px rgba(14,10,44,.42), 0 4px 10px rgba(14,10,44,.25); }
  #ticket::before { content: ""; position: absolute; inset: 5px; border-radius: 13px; border: 1px dashed rgba(42,36,64,.22); pointer-events: none; }
  #stamp { grid-row: 1 / 3; width: 78px; height: 78px; border-radius: 50%; }
  .tk-name { align-self: end; min-width: 0; }
  .tk-name small { display: block; font: 600 11.5px/1.2 var(--text); letter-spacing: .09em; text-transform: uppercase; color: var(--hue, var(--seal)); }
  .tk-name b { display: block; font: 600 23px/1.08 var(--title); letter-spacing: -.005em; overflow-wrap: anywhere; }
  .tk-tag { grid-column: 2; align-self: start; margin: 0; font: italic 500 14.5px/1.3 var(--title); color: var(--pen-soft); }
  .tk-side { grid-row: 1 / 3; grid-column: 3; display: flex; flex-direction: column; align-items: flex-end; gap: 7px; }
  .tk-best { display: flex; align-items: center; gap: 7px; font: 600 12.5px/1 var(--text); color: var(--pen-soft); white-space: nowrap; }
  .tk-best b { font: 600 19px/1 var(--title); color: var(--pen); font-variant-numeric: lining-nums tabular-nums; }
  .stars { display: inline-flex; gap: 2px; } .stars svg { width: 15px; height: 15px; fill: rgba(42,36,64,.16); } .stars svg.on { fill: #e2a019; filter: drop-shadow(0 1px 0 rgba(120,70,0,.35)); }
  .go { min-height: 46px; padding: 0 22px; border-radius: 13px; white-space: nowrap; font: 600 16.5px/1 var(--text); letter-spacing: .01em; color: #fff9ec;
    background: var(--hue, var(--seal)); box-shadow: 0 1px 0 rgba(255,255,255,.45) inset, 0 -2px 0 rgba(0,0,0,.18) inset, 0 6px 16px rgba(42,36,64,.3);      /* for a browser that cannot mix colours: the plain one */
    background: linear-gradient(175deg, color-mix(in srgb, var(--hue, var(--seal)) 82%, #fff), var(--hue, var(--seal)) 55%, color-mix(in srgb, var(--hue, var(--seal)) 78%, #000));
    box-shadow: 0 1px 0 rgba(255,255,255,.45) inset, 0 -2px 0 rgba(0,0,0,.18) inset, 0 6px 16px color-mix(in srgb, var(--hue, var(--seal)) 45%, transparent); text-shadow: 0 1px 1px rgba(0,0,0,.28); transition: transform .12s, filter .15s; }
  .go:hover { filter: brightness(1.06); } .go:active { transform: translateY(1px) scale(.985); }
  .tk-note { grid-column: 1 / -1; margin: 2px 2px 0; font: 400 12.5px/1.3 var(--text); color: var(--pen-soft); text-align: center; }

  /* ── a place's table ── */
  #stage { color: var(--p-ink); }
  #stage .top { position: relative; }
  #stage-in { position: absolute; inset: 0; display: grid; grid-template-rows: auto 1fr; }
  .place { margin: 0 4px; min-width: 0; font: 600 20px/1.1 var(--title); letter-spacing: -.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
  #stage .chip { --c-ink: var(--p-ink); --c-bg: var(--p-panel); --c-edge: var(--p-edge); }
  .table { display: grid; grid-template-areas: "hud" "board" "acts"; justify-content: center; align-content: center; gap: 10px; min-height: 0; padding: 4px 10px calc(12px + env(safe-area-inset-bottom, 0px)); }
  .side { display: contents; }
  .hud { grid-area: hud; width: var(--board); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 0 10px; padding: 9px 16px 8px; border-radius: 16px;
    background: var(--p-panel); border: 1px solid var(--p-edge); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: 0 1px 0 rgba(255,255,255,.1) inset, 0 8px 24px rgba(0,0,0,.2); }
  .hud .cell { display: flex; flex-direction: column; min-width: 0; }
  .hud .cell.me { align-items: flex-end; text-align: right; }
  .hud .cap { display: flex; align-items: center; gap: 5px; font: 600 11.5px/1.2 var(--text); letter-spacing: .08em; text-transform: uppercase; color: var(--p-soft); white-space: nowrap; }
  .hud .cap svg { width: 14px; height: 14px; fill: var(--p-accent); }
  .num { font: 600 34px/1.05 var(--title); font-variant-numeric: lining-nums tabular-nums; letter-spacing: -.01em; color: var(--p-num); }
  .num.rec { font-size: 25px; opacity: .92; }
  .num .led { display: block; height: .86em; width: auto; margin: .1em 0 .06em; overflow: visible; }
  .num .led path { fill: var(--p-num); opacity: .1; }
  .num .led path.on { opacity: 1; filter: drop-shadow(0 0 1.6px var(--p-num)); }
  .num .led .lead path.on { opacity: .3; filter: none; }
  .hud .cell.me .num .led { margin-left: auto; }
  .num.bump { animation: bump .32s ease-out; }
  @keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.14); } 100% { transform: scale(1); } }
  .hud .mid { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  #next { width: 126px; height: 42px; }
  .hud.no-next #next { visibility: hidden; }
  /* how far it is to the three stars */
  .track { grid-column: 1 / -1; position: relative; height: 16px; margin: 5px 2px 0; }

<script id="rules">
/* The rules of Lines 98, as the program itself plays them.

   Written from Lines 98 version 4.2 (SORCERER, Perm, 08/1998: the build the hub keeps as package lines98), read from
   its help file and from the program's own code, and held against version 5.0 (02/2004), which plays the same. What
   was read, and where each rule stands in the program, is in docs/RULES.md.

   Only the game called Lines is here: a line of five or more. The program's two other games (Squares, Blocks), its
   countdown timer, its files of saved games and its skins are left out.

   The page and the tests both run this one file. Nothing in it draws, waits or keeps time.

     const game = Lines.newGame(rnd);                 a game at its start: five balls, and the three to come
     Lines.path(game, from, to)                       the squares a ball would pass over, or null when it cannot get there
     Lines.move(game, from, to, rnd)                  one move: null when it cannot be made, otherwise what happened, in order
     Lines.stepBack(game, rnd)                        takes the last move back (one move only), false when there is none
     rnd(n)                                           a whole number from 0 to n - 1, each as likely as the others

   A square is a number from 0 to 80: row * 9 + column, counted from the top left.
   A game: { board: 81 squares, each -1 (empty) or a colour 0..6
             next:  the three balls to come, each { c: its colour, at: the square it is to come up on }
             shown: do the three to come have squares of their own? (not when fewer than three squares were free
                    as they were drawn: then only their colours are known)
             score, moves, over
             back:  what Step back returns to, or null }

   What a move answers with is a list. Each entry is one thing that happened, to be shown in that order:
     { type: 'move', colour, path }                                  the ball went along these squares
     { type: 'clear', by: 'move' | 'grow', groups: [{ colour, cells, points }] }   lines were taken off
     { type: 'grow', balls: [{ c, at, from }] }                     the three came up (from: where it was to come up,
                                                                     when the ball that moved took that square)
     { type: 'next', next, shown }                                  the three after them were drawn
     { type: 'over' }                                               the game is over */
(function (root, make) {
  if (typeof module === 'object' && module.exports) module.exports = make();
  else root.Lines = make();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';
  const N = 9, CELLS = N * N, COLOURS = 7, AT_START = 5, TO_COME = 3, SHORTEST = 5;
  const EMPTY = -1;

  const isFree = (s, at) => s.board[at] === EMPTY;
  function freeCount(s) { let n = 0; for (let i = 0; i < CELLS; i++) if (s.board[i] === EMPTY) n++; return n; }
  /** points for one colour's balls taken off together: each of them is worth four fewer than there are */
  const points = count => (count - 4) * count;

  /** Gives ball `i` of the three to come a square: any free one, each as likely as the others, that none of the
   *  balls before it has (`all`: that neither of the other two has, which is how a ball is given a new square once
   *  the one it was to come up on has been taken). */
  function place(s, i, rnd, all) {
    const open = [];
    for (let at = 0; at < CELLS; at++) {
      if (s.board[at] !== EMPTY) continue;
      let taken = false;
      for (let j = 0; j < TO_COME; j++) if (j !== i && (all || j < i) && s.next[j].at === at) taken = true;
      if (!taken) open.push(at);
    }
    s.next[i].at = open[rnd(open.length)];
  }

  /** Draws the three to come: their colours always, their squares only while three squares are free. */
  function draw(s, rnd, ev) {
    for (let i = 0; i < TO_COME; i++) s.next[i].c = rnd(COLOURS);
    s.shown = false;
    if (freeCount(s) >= TO_COME) {
      for (let i = 0; i < TO_COME; i++) place(s, i, rnd, false);
      s.shown = true;
    }
    if (ev) ev.push({ type: 'next', next: s.next.map(b => ({ c: b.c, at: b.at })), shown: s.shown });
  }

  /** Looks for lines and takes them off, a colour at a time. For each colour and each of the four ways a line can
   *  run, the longest line is looked for first (nine balls, then eight, down to five), from the top row down and
   *  from the left, and the first one found is the one taken: so a line is always taken whole, and of two separate
   *  lines of one colour running the same way only one goes at this look (the other at the next). Balls of one
   *  colour taken together are counted once each, also where two lines cross.
   *  Returns true when nothing was taken. */
  function shapes(s, rnd, ev, by) {
    const b = s.board, groups = [];
    let none = true, emptied = false;
    for (let colour = 0; colour < COLOURS && !emptied; colour++) {
      const mark = new Uint8Array(CELLS), look = [true, true, true, true];
      let count = 0;
      const hit = (x, y, way) => { const at = y * N + x; if (!mark[at]) { mark[at] = 1; count++; } look[way] = false; };
      for (let len = N; len >= SHORTEST; len--)
        for (let row = 0; row < N; row++)
          for (let col = 0; col < N; col++) {
            let n = 0, k;
            if (len + col <= N && look[0]) for (k = 0; k < len; k++) if (b[row * N + col + k] === colour) n++;      // across
            if (n === len) for (k = 0; k < len; k++) hit(col + k, row, 0);
            n = 0;
            if (len + row <= N && look[1]) for (k = 0; k < len; k++) if (b[(row + k) * N + col] === colour) n++;    // down
            if (n === len) for (k = 0; k < len; k++) hit(col, row + k, 1);
            n = 0;
            if (len + row <= N && len + col <= N && look[2]) for (k = 0; k < len; k++) if (b[(row + k) * N + col + k] === colour) n++;   // down to the right
            if (n === len) for (k = 0; k < len; k++) hit(col + k, row + k, 2);
            n = 0;
            if (len + row <= N && col - len >= -1 && look[3]) for (k = 0; k < len; k++) if (b[(row + k) * N + col - k] === colour) n++;  // down to the left
            if (n === len) for (k = 0; k < len; k++) hit(col - k, row + k, 3);
          }
      if (count > 0) {
        none = false;
        const cells = [];
        for (let at = 0; at < CELLS; at++) if (mark[at]) { cells.push(at); b[at] = EMPTY; }
        s.score += points(count);

/* ── the places ──
   Eight of them: the house where the game was first played, and seven lands, one for each colour of ball. The rules
   are the same everywhere (engine/rules.js); a place is only how the game looks, moves and sounds there.

   A place is described by one object, and the files after this one (41 to 48) add theirs with place({...}):

     id, hue            its key, and the colour it wears on the map and on its buttons
     colour             which of the seven colours it is the land of (0 red … 6 violet); null for the house
     name, tag          { vi, en }

     frame, ballR       how thick the board's frame is (a share of its side), how big a ball (a share of a square)

     backdrop(c, w, h, box)   what is behind the table. box: where the board lies in it, so that nothing that could
                              be taken for a piece is painted there
     board(c, g)        the board. g: { S: its side, pad: the frame, cell: one square } in CSS pixels, and ox, oy:
                        where the board begins in the window
     ball(c, i, r)      a ball of colour i, centred on 0,0, of radius r
     seed(c, i, r)      how a ball to come is shown where it will come up (left out: the ball itself, small)
     emblem(c, r)       what stands for it on the map (left out: the ball of its own colour)

   what moves, painted every frame:
     air                what moves in the air there, or null: { make(w, h) → things, draw(c, things, t, dt, w, h, box) }
                        (box as for the backdrop: the board hides what is painted behind it)
     over(c, g, t)      what passes over the board and the balls alike (shade, light through water)
     under(c, x, y, cell, ms, i)   the mark under the ball that is picked, ms after it was (left out: a ring)
     floor(c, b, x, y, R, k, a)    what a ball throws on the ground beside its shade (the light through a marble)
     shadow             the shade under a ball: { a, w, h, y } in shares of its radius, or null
     glow               the light a ball gives off: { r, a }, or null
     pose(b, t, p)      how a ball holds itself at time t: fills p (dx, dy in squares; sx, sy; rot; lift in squares;
                        k: its size; a; glow). b.picked, b.pickT, b.moving, b.roll (squares gone), b.phase (0..1,
                        its own) say what it is doing
     leave(b, u, p)     how a ball that was taken goes, u from 0 to 1 over leaveMs (left out: it swells and is gone)

   the bits it throws (20-fx.js), each at x, y in the board's pixels:
     trail(x, y, i, cell, k, path)   what a moving ball leaves on square k of its way
     land(x, y, i, cell)             as it stops
     burst(x, y, i, cell, n)         as it is taken, one of n
     rise(x, y, i, cell)             as it comes up

   counted in Vietnamese (đỏ, cam, vàng, lục, lam, chàm, tím). */

const placeById = id => PLACES.find(p => p.id === id) || PLACES[0];

/** A ball that hops on its square while it is picked: up, down, flat for a moment, up again.
 *  o: { ms: one hop, high: how high in squares, flat: how flat it lands, spin: turns a second while picked } */
function hopPose(o) {

/** one hop, u from 0 to 1: the first tenth and the last it is on the ground, pressed flat; between them in the air */
function hop(u, high, flat, p) {

  if (u < g) { const k = Math.sin(u / g * Math.PI); p.sy = 1 - flat * k; p.sx = 1 + flat * .7 * k; return; }

place({

/* ── Phố Đèn Lồng ── the land of red: an old street on a festival night.
   The balls are silk lanterns, each colour a lantern of its own shape, lit from inside. They sway a little on a
   board of dark lacquered wood, and one that is taken off is let go: it rises and goes out among sparks. */
(() => {
  const SILK = ['#f2463c', '#ff9330', '#ffd541', '#63d46c', '#46c9f2', '#6272f4', '#cc70f4'];

    c => { c.beginPath(); c.moveTo(0, -.84); c.quadraticCurveTo(.5, -.52, .84, 0); c.quadraticCurveTo(.5, .52, 0, .84); c.quadraticCurveTo(-.5, .52, -.84, 0); c.quadraticCurveTo(-.5, -.52, 0, -.84); },   // 3 green: the diamond

    c => { c.beginPath(); c.moveTo(0, .78); c.bezierCurveTo(-.5, .78, -1.0, .3, -.86, -.34); c.quadraticCurveTo(-.52, -.2, -.44, -.62); c.quadraticCurveTo(-.18, -.42, 0, -.86); c.quadraticCurveTo(.18, -.42, .44, -.62); c.quadraticCurveTo(.52, -.2, .86, -.34); c.bezierCurveTo(1.0, .3, .5, .78, 0, .78); },   // 6 violet: the lotus
  ];

  place({

    dress: { ink: '#fff1dc', soft: 'rgba(255,226,192,.74)', panel: 'rgba(52,12,20,.6)', edge: 'rgba(255,196,128,.3)', accent: '#ffc65e', num: '#ffe6b0' },

/* ── keeping ── */

/* ── going in and coming out: the table opens out of the place on the map, and closes back into it ── */

/* ── what is pressed ── */

function applySetting(key) {
  if (key === 'lang') { ui.words(); names(); atlas.layout(); atlas.refresh(); if (here && game) ui.next(game.next, here); }
  else if (key === 'sound') ui.words();
  else if (key === 'marks') { table.repaint(); if (here && game) ui.next(game.next, here); atlas.layout(); }
  else if (key === 'show') { if (here && game) ui.next(game.next, here); }
}
document.addEventListener('keydown', e => {
  if (e.altKey || e.metaKey) return;
  const k = e.key;
  if (ui.isOpen()) { if (k === 'Escape') { ui.close(); e.preventDefault(); } return; }
  if (!mapEl.hidden && stageEl.hidden) { if (atlas.key(k)) e.preventDefault(); return; }
  if (!here || changing) return;
  const arrows = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  if (arrows[k]) {
    let at = table.cursor(); if (at < 0) at = table.picked() >= 0 ? table.picked() : 40;
    else { const x = clamp(at % N + arrows[k][0], 0, N - 1), y = clamp(Math.floor(at / N) + arrows[k][1], 0, N - 1); at = y * N + x; }
    table.setCursor(at); $('boardbox').focus({ preventScroll: true });        // the keys are on the board now, whatever button was pressed last
    const c = game.board[at], r = Math.floor(at / N) + 1, col = at % N + 1;
    ui.say(c >= 0 ? W().sayBall(W().colours[c], r, col) : W().sayEmpty(r, col));
    e.preventDefault();
  } else if (k === 'Enter' || k === ' ') { if (e.target.closest && e.target.closest('button, a')) return; const at = table.cursor(); if (at >= 0) press(at); e.preventDefault(); }
  else if (k === 'Escape') { if (table.picked() >= 0) table.pick(-1); else goOut(); }
  else if (k === 'Backspace' || ((e.ctrlKey) && (k === 'z' || k === 'b')) || (!e.ctrlKey && (k === 'z' || k === 'u'))) { stepBack(); e.preventDefault(); }
  else if (!e.ctrlKey && k === 'n') askFresh();
  else if (!e.ctrlKey && k === 'm') goOut();
});

/* ── the frame: everything that moves, moved once ── */
let lastT = 0;
function frame(t) {
  const dt = Math.min(.05, Math.max(0, (t - lastT) / 1000)); lastT = t;
  anim.tick(t);
  if (!stageEl.hidden) {
    const still = STILL.matches;                 // for those who asked their machine for less movement: nothing sways, drifts or twinkles
    table.draw(still ? 0 : t, dt); drawAir(still ? 0 : t, still ? 0 : dt);
    if (game && !game.over && !ui.isOpen() && !changing) { clockMs += dt * 1000; ui.clock(clockMs / 1000); }
  }
  if (!mapEl.hidden) atlas.draw(STILL.matches ? 0 : t, STILL.matches ? 0 : dt);
  requestAnimationFrame(frame);
}
let resizeTimer = 0;
function relay() {
  if (!stageEl.hidden && here) { paintBackdrop(); table.layout(); if (game) ui.next(game.next, here); }
  if (!mapEl.hidden) atlas.layout();
}
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(relay, 90); });
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);

/* ── the start ── */
atlas.on.play = id => goIn(id);
ui.words();
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => {
  atlas.start(kept.at);
  requestAnimationFrame(frame);
});
/* for the scripts that take the game's pictures and try it out: nothing here is used by the page itself */
window.L98 = { kept, places: PLACES, state: () => ({ game, here: here && here.id, busy, onMap: !mapEl.hidden && stageEl.hidden }), press, goIn, goOut, settle, table, atlas, ui, anim,
  /** puts a game on the table as given (a board of 81, and optionally the three to come) */
  put(g) { game = thaw(Object.assign({ next: game.next, shown: true, score: 0, moves: 0, back: null }, g)); table.lay(game); ui.set(game.score, bestBefore); ui.next(game.next, here); counted = game.score; buttons(); save(); } };

})();
