<style>
  /* ── Wax & Wane ── a sky at dusk painted in gouache, a sea-green chart of it in a lacquer frame ruled with gold,
     and moons to play on it. Everything painted is painted on canvases by the page itself (game/src/20-art.js);
     what is set in type here is either an inscription (Marcellus) or something to read and press (Jost). */
  :root { box-sizing: border-box; color-scheme: dark;
    --night: #13244f; --ink: #141c3c; --lacquer: #1a2150; --lacquer-hi: #2b3672; --gold: #e8c36f; --gold-hi: #fbe6a8; --gold-lo: #a47c35; --moon: #f5edd8; --rim: #8ea2df;
    --title: Marcellus, "Palatino Linotype", Palatino, Georgia, serif; --text: Jost, "Century Gothic", "Avenir Next", system-ui, sans-serif;
    --vh: 100vh; --side: 344px; --gap: 60px; --board: min(calc(100vw - var(--side) - var(--gap) - 72px), calc(var(--vh) - 104px), 800px); }
  @supports (height: 100dvh) { :root { --vh: 100dvh; } }
  *, *::before, *::after { box-sizing: inherit; }
  /* the sky is painted on a canvas behind everything; until it is, the page has its colours */
  html { -webkit-text-size-adjust: 100%; background: var(--night) linear-gradient(#13244f, #213d7c 30%, #4a66a4 58%, #a898b4 78%, #efb48c 90%, #fbdda8) fixed; }
  body { margin: 0; min-height: var(--vh); color: var(--moon); font: 400 16px/1.45 var(--text); -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; } button:disabled { cursor: default; }
  :focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }
  [hidden] { display: none !important; }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -2; }
  /* a few of the sky's stars are not paint: they brighten and dim, each in its own time */
  #stars { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  #stars i { position: absolute; width: var(--d); height: var(--d); translate: -50% -50%; background: radial-gradient(#fffdf2, #fbe6a8 60%);
    clip-path: polygon(50% 0, 55% 45%, 100% 50%, 55% 55%, 50% 100%, 45% 55%, 0 50%, 45% 45%); filter: drop-shadow(0 0 4px rgba(251,230,168,.8)); animation: shine var(--t) ease-in-out var(--w) infinite; }
  @keyframes shine { 0%, 100% { opacity: .25; scale: .7; } 50% { opacity: 1; scale: 1; } }

  /* the strip above the table: the way back to the shelf, sound, the rules */
  .top { display: flex; align-items: center; gap: 8px; min-height: 54px; padding: calc(8px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px)) 0 calc(14px + env(safe-area-inset-left, 0px)); }
  .top-sp { flex: 1; }
  .home { color: var(--moon); text-decoration: none; font: 500 15px/1 var(--text); padding: 14px 8px; opacity: .86; text-shadow: 0 1px 3px rgba(8,12,40,.5); white-space: nowrap; }
  .home:hover { opacity: 1; color: var(--gold-hi); }
  .mini { min-height: 40px; padding: 0 15px; border-radius: 22px; white-space: nowrap; border: 1px solid rgba(232,195,111,.5); background: linear-gradient(rgba(43,54,114,.78), rgba(22,28,70,.82)); color: var(--moon); font: 500 14px/1 var(--text); letter-spacing: .02em;
    box-shadow: 0 1px 0 rgba(255,255,255,.12) inset, 0 3px 10px rgba(8,12,40,.3); }
  .mini:hover { border-color: var(--gold-hi); color: var(--gold-hi); }

  .table { display: grid; grid-template-columns: var(--board) var(--side); gap: var(--gap); justify-content: center; align-items: center; min-height: calc(var(--vh) - 62px); padding: 6px 28px calc(30px + env(safe-area-inset-bottom, 0px)); }

  /* the board: the painted canvas, and over it one button to a square */
  .board { position: relative; width: var(--board); aspect-ratio: 1; border-radius: calc(var(--board) * .016); touch-action: none; user-select: none; -webkit-user-select: none;
    box-shadow: 0 1px 0 rgba(255,244,210,.5), 0 28px 60px rgba(9,13,48,.5), 0 8px 18px rgba(9,13,48,.42); }
  #board { display: block; width: 100%; height: 100%; border-radius: inherit; }
  #cells { position: absolute; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); }
  .cell { position: relative; padding: 0; border: 0; background: none; border-radius: 12%; cursor: default; outline-offset: -3px; }
  .cell:focus-visible { outline: 2px solid var(--gold-hi); }
  /* where the side to move may put a disc: a small gold star */
  .cell.can { cursor: pointer; }
  .cell.can::before { content: ""; position: absolute; left: 50%; top: 50%; width: 30%; height: 30%; translate: -50% -50%; background: radial-gradient(#fff6d2, var(--gold) 70%);
    clip-path: polygon(50% 0, 57% 43%, 100% 50%, 57% 57%, 50% 100%, 43% 57%, 0 50%, 43% 43%); opacity: .9; animation: twinkle 2.6s ease-in-out infinite; animation-delay: calc(var(--i) * -0.37s); }
  @keyframes twinkle { 0%, 100% { opacity: .55; scale: .84; } 50% { opacity: 1; scale: 1.06; } }
  #cells.nudge .cell.can::before { animation: nudge .5s ease-out; }
  @keyframes nudge { 0% { scale: 1; opacity: 1; } 35% { scale: 1.9; opacity: 1; } 100% { scale: 1; opacity: .9; } }
  /* the square the pointer is on: the canvas shows the disc that would stand there, so its star goes */
  .cell.ghost::before { content: none; }
  /* the disc that was put down last */
  .cell.last::after { content: ""; position: absolute; inset: 3.5%; border-radius: 50%; border: max(1.5px, calc(var(--board) * .0026)) solid var(--gold); box-shadow: 0 0 9px rgba(232,195,111,.55); opacity: .95; }

  /* what is said across the board when a side has to miss its turn */
  #toast { position: absolute; left: 50%; top: 50%; translate: -50% -50%; max-width: 86%; padding: .62em 1.3em .7em; border-radius: 999px; pointer-events: none; text-align: center; white-space: nowrap;

<script id="rules">
/* ── Wax & Wane: the rules ──
   The rules of Othello as one plain script, no DOM: the game page, every bot's worker and the arena under node all
   run this same file, so there is one set of rules. Everything declared here is there for a bot to use
   (docs/BOT_BRIEF.md lists it).

   An 8 × 8 board, and discs that are dark on one face and light on the other. The game starts with two discs of each
   side on the four middle squares, and Dark moves first. A move puts one disc on an empty square so that, in at
   least one straight line from it (along a row, a column or a diagonal), one or more of the other side's discs stand
   in an unbroken run with one of the mover's own discs at the far end. Every disc enclosed like that, in every
   direction, is turned over; nothing else is. A side that cannot move like this passes, and may not pass otherwise.
   When neither side can move the game is over, and the side with more discs showing its face has won. */
const DARK = 0, LIGHT = 1, SIDE = ['Dark', 'Light'];
const EMPTY = 0;                                              // a square holds 0, or a disc: 1 for Dark's face up, 2 for Light's (the side + 1)
const PASS_MOVE = 64;                                         // a move is the square a disc is put on, 0 … 63, or this

/* squares are written the way Othello is written down: files a … h from left to right, ranks 1 … 8 from the top */
const sqName = s => (s === PASS_MOVE ? 'pass' : 'abcdefgh'[s & 7] + ((s >> 3) + 1));
const sqOf = name => 'abcdefgh'.indexOf(name[0]) + 8 * (+name[1] - 1);

/** DIR[d]: what one step in direction d adds to a square's number (0 up-left, 1 up, 2 up-right, 3 left, 4 right,
 *  5 down-left, 6 down, 7 down-right). RUN[s * 8 + d]: how many squares lie beyond s that way before the edge. */
const DIR = new Int8Array([-9, -8, -7, -1, 1, 7, 8, 9]);
const RUN = new Int8Array(512);
for (let s = 0; s < 64; s++) {
  const up = s >> 3, down = 7 - up, left = s & 7, right = 7 - left;
  RUN.set([Math.min(up, left), up, Math.min(up, right), left, right, Math.min(down, left), down, Math.min(down, right)], s * 8);
}

/* keys for telling positions apart quickly (a bot remembers positions it has already searched): ZL / ZH by
   square × 3 + disc, ZFL / ZFH for a disc on a square being turned over, ZTL / ZTH for whose move it is */
const ZL = new Int32Array(192), ZH = new Int32Array(192), ZFL = new Int32Array(64), ZFH = new Int32Array(64), ZT = new Int32Array(2);
(() => {
  let s = 0x9E3779B9;
  const r = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), s | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return (t ^ (t >>> 14)) | 0; };
  for (let i = 0; i < 192; i++) { ZL[i] = r(); ZH[i] = r(); }
  for (let q = 0; q < 64; q++) { ZFL[q] = ZL[q * 3 + 1] ^ ZL[q * 3 + 2]; ZFH[q] = ZH[q * 3 + 1] ^ ZH[q * 3 + 2]; }
  ZT[0] = r(); ZT[1] = r();
})();

/** A position from 64 numbers (a1 first, row by row): 0 empty, 1 a Dark disc, 2 a Light disc. */
function position(squares, turn = DARK) {
  const S = { b: Int8Array.from(squares), turn, count: [0, 0], empties: 0, hl: turn ? ZT[0] : 0, hh: turn ? ZT[1] : 0, undo: new Int8Array(2048), sp: 0, history: [], over: null };
  for (let s = 0; s < 64; s++) {
    const p = S.b[s];
    if (!p) { S.empties++; continue; }
    S.count[p - 1]++; S.hl ^= ZL[s * 3 + p]; S.hh ^= ZH[s * 3 + p];
  }
  settle(S);
  return S;
}
function newGame() {
  const b = new Int8Array(64);
  b[27] = b[36] = LIGHT + 1;                                  // d4, e5
  b[28] = b[35] = DARK + 1;                                   // e4, d5
  return position(b);
}

/** Would a disc of `side`, put on the empty square s of board b, turn anything over? */
function encloses(b, s, side) {
  const me = side + 1, foe = 2 - side;
  for (let d = 0; d < 8; d++) {
    const run = RUN[s * 8 + d];
    if (run < 2) continue;
    const step = DIR[d]; let t = s + step;
    if (b[t] !== foe) continue;
    let k = 1; t += step;
    while (k < run && b[t] === foe) { k++; t += step; }
    if (k < run && b[t] === me) return true;
  }
  return false;
}
/** Has `side` a square to put a disc on? */
function canMove(S, side) {
  const b = S.b;
  for (let s = 0; s < 64; s++) if (!b[s] && encloses(b, s, side)) return true;
  return false;
}
/** How many discs the side to play would turn over by putting one on the empty square s. */
function countFlips(S, s) {
  const b = S.b, me = S.turn + 1, foe = 3 - me; let n = 0;
  for (let d = 0; d < 8; d++) {
    const run = RUN[s * 8 + d];
    if (run < 2) continue;
    const step = DIR[d]; let t = s + step, k = 0;
    while (k < run && b[t] === foe) { k++; t += step; }
    if (k && k < run && b[t] === me) n += k;
  }
  return n;
}
/** The discs the side to play would turn over by putting one on the empty square s: their squares are written into
 *  out from index off, line by line and the nearest first. Returns how many. */
function flipsInto(S, s, out, off = 0) {
  const b = S.b, me = S.turn + 1, foe = 3 - me; let n = off;
  for (let d = 0; d < 8; d++) {
    const run = RUN[s * 8 + d];
    if (run < 2) continue;
    const step = DIR[d]; let t = s + step, k = 0;
    while (k < run && b[t] === foe) { k++; t += step; }
    if (k && k < run && b[t] === me) for (let i = 1; i <= k; i++) out[n++] = s + i * step;
  }
  return n - off;
}

/** Every move the side to play may make, written into out from index off; returns how many. A side with nowhere to
 *  put a disc has one move, the pass, as long as the other side can still move. When neither can, there are none:
 *  the game is over. */
function gen(S, out, off = 0) {
  const b = S.b, side = S.turn; let n = off;
  for (let s = 0; s < 64; s++) if (!b[s] && encloses(b, s, side)) out[n++] = s;
  if (n === off && canMove(S, 1 - side)) out[n++] = PASS_MOVE;
  return n - off;
}

/** Plays a move without asking whether it is allowed. Returns how many discs were turned over. Undone by unmake. */
function make(S, m) {
  if (S.sp + 24 > S.undo.length) { const grown = new Int8Array(S.undo.length * 2); grown.set(S.undo); S.undo = grown; }
  const u = S.undo, side = S.turn; let n = S.sp, k = 0;
  if (m !== PASS_MOVE) {
    const b = S.b, me = side + 1, foe = 3 - me;
    for (let d = 0; d < 8; d++) {
      const run = RUN[m * 8 + d];
      if (run < 2) continue;
      const step = DIR[d]; let t = m + step, j = 0;
      while (j < run && b[t] === foe) { j++; t += step; }
      if (j && j < run && b[t] === me) for (t -= step; t !== m; t -= step) { b[t] = me; u[n++] = t; S.hl ^= ZFL[t]; S.hh ^= ZFH[t]; }
    }
    k = n - S.sp;
    b[m] = me; S.hl ^= ZL[m * 3 + me]; S.hh ^= ZH[m * 3 + me];
    S.count[side] += k + 1; S.count[1 - side] -= k; S.empties--;
  }
  u[n++] = k; u[n++] = m; S.sp = n;
  S.turn = 1 - side; S.hl ^= ZT[0]; S.hh ^= ZT[1];
  return k;
}

function unmake(S) {
  const u = S.undo; let n = S.sp;
  const m = u[--n], k = u[--n], side = 1 - S.turn;
  S.turn = side; S.hl ^= ZT[0]; S.hh ^= ZT[1];
  if (m !== PASS_MOVE) {
    const b = S.b, me = side + 1, foe = 3 - me;
    for (let i = 0; i < k; i++) { const t = u[--n]; b[t] = foe; S.hl ^= ZFL[t]; S.hh ^= ZFH[t]; }
    b[m] = EMPTY; S.hl ^= ZL[m * 3 + me]; S.hh ^= ZH[m * 3 + me];
    S.count[side] -= k + 1; S.count[1 - side] += k; S.empties++;
  }
  S.sp = n;
  return m;
}

/** The move played just before this position, or −1 where make has played none. */

/* ── The house bot ──

   new       plays on a whim. It likes a move that turns a lot over, sees nothing else, and half the time does not

   crescent  looks at its own move only. It knows what a square is worth (a corner a great deal, the squares beside
             an empty corner less than nothing) and plays the best-looking one, with a shaky eye.
   quarter   looks at its move and your answer, and counts how many moves each side is left with as well as where
             the discs stand. It plays the last few moves of a game exactly.
   gibbous   four moves ahead with the full judgement below, every move, and the last eight squares exactly.
   full      searches as deep as its budget allows (iterative deepening, alpha-beta, a transposition table) and

             so it is as strong on a phone as on a laptop; the clock only stops it if the device is too slow to get

   the discs that run along an edge from it and can never be turned again, a disc beside a corner that is still

  0, 0, 12, 6, 6, 12, 0, 0,
  0, 0, -3, -3, -3, -3, 0, 0,

  6, -3, 2, 1, 1, 2, -3, 6,
  6, -3, 2, 1, 1, 2, -3, 6,

  6, 0, 12, 14, 14, 12, 0, 6,
  40, 12, 26, 20, 20, 26, 12, 40,
  30, 14, 20, 0, 0, 20, 14, 30,
  30, 14, 20, 0, 0, 20, 14, 30,
  40, 12, 26, 20, 20, 26, 12, 40,
  6, 0, 12, 14, 14, 12, 0, 6,
  90, 6, 40, 30, 30, 40, 6, 90]);

/** The position as the side to move sees it. whole: with the moves each side has and the squares at the edge of play. */

    const m = mvBuf[off + bi]; mvBuf[off + bi] = mvBuf[off + i]; mvBuf[off + i] = m; scBuf[off + bi] = scBuf[off + i];

  const off = ply * W, n = gen(S, mvBuf, off);

  if (mvBuf[off] === PASS_MOVE) { make(S, PASS_MOVE); const v = -solve(S, -beta, -alpha, ply + 1); unmake(S); return v; }

    let bi = i;

    const m = mvBuf[off + bi]; mvBuf[off + bi] = mvBuf[off + i]; mvBuf[off + i] = m; scBuf[off + bi] = scBuf[off + i];

    const v = -solve(S, -beta, -alpha, ply + 1);

  gibbous: { depth: 4, whole: true, jitter: 0, slack: 2, end: 8 },

const KIT = false;
/* ── Paint: the hand in the pictures ──
   Everything on the page that looks painted is painted here, on canvases, when the page opens: the sky, the board,
   the moons. Nothing is a photograph and nothing is fetched. A picture is built the way gouache goes on: a flat
   wash, broad strokes of nearly the same colour over it, a little grain, and lines put in by a hand that is not
   quite steady. The random numbers come from a seed, so the same picture is painted every time. */

const View = {
  canvas: null, g: null, base: null, P: null, dpr: 1, size: 0,
  disc: new Int8Array(64),      // what stands on each square, as it is shown
  acts: [],                     // discs on the move: { s, kind: 'drop' | 'turn' | 'swell', t0, dur, from, to, angle }
  raf: 0, after: null, cells: [], input: null, hover: -1, pressed: false, quiet: false,
  peek: null,                   // the move the pointer is on: { to, me, flips, t0 }

  init() {

    box.addEventListener('focusin', ev => { if (ev.target.dataset.s !== undefined && ev.target.matches(':focus-visible')) this.preview(+ev.target.dataset.s); });

  /** paints the board again at the size its box has now */
  fit() {

  /** the board as a position has it, with nothing moving */
  set(squares) { this.acts = []; this.peek = null; this.disc.set(squares); this.settle(); this.draw(performance.now()); },
  settle() { if (this.after) { const f = this.after; this.after = null; f(); } },

  still(s, disc, D, lift = 0, scale = 1, alpha = 1) {

  draw(now) {

  kick() { if (!this.raf) this.raf = requestAnimationFrame(t => this.draw(t)); },

  /** Shows a move happening: ev comes from describe() or playMove(). Comes back when the last moon has turned. */
  show(ev) {

  },
  /** the winner's discs rise and settle, in a wave from one corner */
  cheer(disc) {

  },
  say(name, arg) { if (!this.quiet) snd(name, arg); },

  /* ── a person's move ── */
  /** input: { side, legal: [squares], flips(s): the squares a disc on s would turn, pick(s), miss(s) }, or null */

/** the square of the last disc put down in a game, or −1 */
function lastDisc(S) { for (let i = S.history.length - 1; i >= 0; i--) if (S.history[i] !== PASS_MOVE) return S.history[i]; return -1; }

/* ── small boards for the rules ── */
/** A piece of the board, cols × rows squares, painted onto a canvas w wide (CSS pixels). discs: [[col, row, 1 | 2]].
 *  more: { stars: [[col, row]], ghost: [col, row, disc], rings: [[col, row]], corner: true when its top left is the board's } */
function paintScene(canvas, w, cols, rows, discs, more = {}) {
  const dpr = Math.min(2.5, window.devicePixelRatio || 1), cell = w / cols, h = cell * rows, rand = rngOf(cols * 31 + rows * 7 + discs.length);
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  const g = canvas.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const wash = g.createLinearGradient(0, 0, w, h);
  wash.addColorStop(0, tone(PAL.field, PAL.fieldHi, 0.35)); wash.addColorStop(1, tone(PAL.field, PAL.fieldLo, 0.3));

  for (let i = more.corner ? 1 : 0; i <= rows; i++) handLine(g, 0, i * cell, w, i * cell, ink(PAL.gold, 0.8), 1.2, rand, { wander: 0.4 });
  if (more.corner) { g.fillStyle = PAL.lacquer; g.fillRect(0, 0, w, 5); g.fillRect(0, 0, 5, h); g.fillStyle = PAL.gold; g.fillRect(5, 5, w, 1.6); g.fillRect(5, 5, 1.6, h); }

  const centre = (c, r) => [(c + 0.5) * cell + (more.corner ? 2.5 : 0), (r + 0.5) * cell + (more.corner ? 2.5 : 0)];
  for (const [c, r, disc] of discs) {
    const [x, y] = centre(c, r);
    g.drawImage(shadow, x - D * 0.61 + D * 0.05, y - D * 0.61 + D * 0.09, D * 1.22, D * 1.22); g.drawImage(disc === 2 ? light : dark, x - D / 2, y - D / 2, D, D);
  }
  for (const [c, r] of more.stars || []) { const [x, y] = centre(c, r); starPath(g, x, y, cell * 0.17, 0.2, 1); g.fillStyle = PAL.goldHi; g.fill(); }
  if (more.ghost) { const [x, y] = centre(more.ghost[0], more.ghost[1]); g.globalAlpha = 0.62; g.drawImage(more.ghost[2] === 2 ? light : dark, x - D / 2, y - D / 2, D, D); g.globalAlpha = 1; }

}

/* ── The game on the page: who sits where, whose turn it is, and what is said about it ──
   KIT is set by the build. The game's own page seats a person against the house bot or against a friend. The
   kit's board (KIT) carries no bot: a person sits on each side unless a bot's file is loaded for it. */
const STORE = KIT ? 'wax-and-wane-kit.v1' : 'wax-and-wane.v1';
/** what the page calls each level of the house bot, weakest first, and how that level plays */
const LEVELS = {
  new: ['New moon', 'Still finding its way. It plays whatever looks good at the moment.'],
  crescent: ['Crescent', 'It knows a corner when it sees one, and not much more.'],
  quarter: ['Half moon', 'It thinks about your answer before it moves, and keeps off the squares beside a corner.'],
  gibbous: ['Gibbous', 'It looks several moves ahead and leaves you as few moves as it can.'],
  full: ['Full moon', 'It reads deep, and plays the last moves of a game without a mistake.'],
};
const G = {
  screen: 'setup', S: newGame(), token: 0, note: '', armed: 0, forfeit: null,
  cfg: { vs: 'bot', level: '', side: DARK },                 // what the setup has settled on the game's page
  seat: [{ kind: 'human' }, { kind: 'human' }],              // who plays Dark and who Light in the game on the board: { kind, bot, level, name, label }
  house: [],                                                 // the house bot's levels
  kit: [{ bot: '', info: null, level: '', file: '', error: '' }, { bot: '', info: null, level: '', file: '', error: '' }],
  shown: [2, 2], dialRaf: 0,
};
const Store = {
  read() { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { return {}; } },
  write(d) { try { localStorage.setItem(STORE, JSON.stringify(d)); } catch (e) { /* nowhere to keep it: the game goes on */ } },
};
function save() {
  const live = G.screen === 'play' && !G.S.over && !G.forfeit && G.seat.every(s => s.kind === 'human' || s.bot === 'house');
  Store.write({ cfg: G.cfg, sound: SFX.on, game: live ? { moves: G.S.history.slice(), seat: G.seat } : null });
}
const esc = t => String(t).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);

/* ── names, and the grammar that goes with "You" ── */
function names() {
  const people = G.seat.filter(s => s.kind === 'human').length;
  return G.seat.map((s, side) => (s.kind === 'human' ? (people === 1 ? 'You' : SIDE[side]) : s.name));
}
const has = n => (n === 'You' ? 'You have' : n + ' has'), plays = n => (n === 'You' ? 'You play' : n + ' plays'), wins = n => (n === 'You' ? 'You win' : n + ' wins');
function say(status, sub) { $('#status').textContent = status; G.note = sub === undefined ? G.note : sub; $('#sub').textContent = G.note; }
let toastTimer = 0;
function toast(text, ms = 1500) { const t = $('#toast'); t.textContent = text; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), ms); }

/* ── small pictures of moons, wherever one stands for a side or a level ── */
function drawDiscs() {
  for (const c of document.querySelectorAll('canvas.disc')) {
    if (c.dataset.done) continue;
    const size = c.clientWidth || 24, px = Math.round(size * Math.min(2.5, window.devicePixelRatio || 1)), face = paintFace(px, c.dataset.side === '1', 2);
    c.width = c.height = px; c.getContext('2d').drawImage(face, 0, 0); c.dataset.done = '1';
  }
  for (const c of document.querySelectorAll('canvas.phase')) {
    if (c.dataset.done) continue;
    const px = Math.round((c.clientWidth || 38) * Math.min(2.5, window.devicePixelRatio || 1)), icon = moonIcon(px, +c.dataset.lit, 2);
    c.width = c.height = px; c.getContext('2d').drawImage(icon, 0, 0); c.dataset.done = '1';
  }
}
function paintEmblem() {
  const c = $('#emblem'), w = c.clientWidth, h = c.clientHeight;
  if (!w) return;
  const dpr = Math.min(2.5, window.devicePixelRatio || 1), g = c.getContext('2d');
  c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const px = Math.round(h * dpr), dark = paintFace(px, false, 2), light = paintFace(px, true, 2);
  // the moon filling and emptying: a crescent, a half, the full moon, a half, a crescent
  [[0.3, Math.PI, 0.68], [0.5, Math.PI, 0.82], [1, 0, 1], [0.5, 0, 0.82], [0.3, 0, 0.68]].forEach(([lit, from, size], i) => drawMoon(g, w / 2 + (i - 2) * w * 0.215, h / 2, h * size, dark, light, lit, from));
}
/** the dial moves to where the count stands, rather than jumping there */
function dialTo(dark, light, now) {
  const c = $('#dial'), size = c.clientWidth;
  if (!size) return;
  const dpr = Math.min(2.5, window.devicePixelRatio || 1);
  cancelAnimationFrame(G.dialRaf);
  if (now || REDUCED) { G.shown = [dark, light]; Dial.paint(c, size, dpr, dark, light); return; }
  const from = G.shown.slice(), t0 = performance.now();
  const step = t => {
    const k = easeIO(clamp01((t - t0) / 650));
    G.shown = [lerp(from[0], dark, k), lerp(from[1], light, k)];
    Dial.paint(c, size, dpr, G.shown[0], G.shown[1]);
    if (k < 1) G.dialRaf = requestAnimationFrame(step);
  };
  G.dialRaf = requestAnimationFrame(step);
}

/* ── the setup ── */
const plate = (act, value, label, on, more = '') => `<button type="button" class="plate" data-act="${act}" data-v="${value}" aria-pressed="${on}"${more}>${label}</button>`;
function renderSetup() {
  const c = G.cfg; let h = '';
  if (KIT) {
    for (const side of [DARK, LIGHT]) {
      const k = G.kit[side];
      h += `<div class="seat"><div class="seat-top"><span><canvas class="disc" data-side="${side}"></canvas>${SIDE[side]}${side === DARK ? ', moving first' : ''}</span>`
        + `<button type="button" class="plate small" data-act="pick" data-v="${side}">${k.bot ? 'Another file' : 'Load a bot'}</button></div>`;
      if (k.bot) {
        h += `<p class="who-bot"><b>${esc(k.info.name)}</b> by ${esc(k.info.author)}, from ${esc(k.file)}</p><div class="levels">`
          + k.info.levels.map(l => `<button type="button" class="plate" data-act="kit-level" data-side="${side}" data-v="${esc(l)}" aria-pressed="${l === k.level}">${esc(l)}</button>`).join('')
          + `<button type="button" class="plate" data-act="unseat" data-v="${side}" aria-pressed="false">A person instead</button></div>`;
      } else h += '<p class="who-bot">A person plays this side.</p>';
      if (k.error) h += `<p class="err">${esc(k.error)}</p>`;
      h += '</div>';
    }
  } else {
    h += `<fieldset class="opt"><legend>Play against</legend><div class="seg">${plate('vs', 'bot', 'The computer', c.vs === 'bot')}${plate('vs', 'friend', 'A friend', c.vs === 'friend')}</div></fieldset>`;
    if (c.vs === 'bot') {
      h += '<fieldset class="opt"><legend>How strong</legend><div class="phases">'
        + G.house.map((l, i) => plate('level', l, `<canvas class="phase" data-lit="${G.house.length > 1 ? i / (G.house.length - 1) : 1}"></canvas>`, l === c.level, ` aria-label="${esc((LEVELS[l] || [l])[0])}"`)).join('')
        + `</div><p class="cap"><b>${esc((LEVELS[c.level] || [c.level])[0])}</b><br>${esc((LEVELS[c.level] || ['', ''])[1])}</p></fieldset>`;
      h += `<fieldset class="opt"><legend>You play (Dark moves first)</legend><div class="seg">${plate('side', DARK, '<canvas class="disc" data-side="0"></canvas>Dark', c.side === DARK)}${plate('side', LIGHT, '<canvas class="disc" data-side="1"></canvas>Light', c.side === LIGHT)}</div></fieldset>`;
    } else h += '<p class="cap">Two players at this screen, turn and turn about.<br>Dark moves first.</p>';
  }
  h += '<button type="button" class="go" data-act="start">Start</button>';
  $('#setup').innerHTML = h;
  drawDiscs();
}
/** on the kit's board: a bot's file chosen for a side */
async function takeFile(side, file) {
  const k = G.kit[side], bot = 'file' + side;
  let src;
  try { src = await file.text(); } catch (e) { k.error = file.name + ' could not be read.'; return renderSetup(); }
  Bots.load(bot, src);
  const info = await Bots.info(bot);
  if (info.error) { Object.assign(k, { bot: '', info: null, level: '', error: file.name + ': ' + info.error }); Bots.files.delete(bot); }
  else Object.assign(k, { bot, info, level: info.levels[0], file: file.name, error: '' });
  renderSetup();
}
/** who will sit down, from what the setup has settled */
function seats() {
  if (KIT) return G.kit.map(k => (k.bot ? { kind: 'bot', bot: k.bot, level: k.level, name: k.info.levels.length > 1 || k.level !== k.info.name.toLowerCase() ? `${k.info.name} (${k.level})` : k.info.name } : { kind: 'human' }));
  if (G.cfg.vs === 'friend') return [{ kind: 'human' }, { kind: 'human' }];
  // a level is named for a phase of the moon and a side for a face of it, so in a game the house bot goes by neither
  const bot = { kind: 'bot', bot: 'house', level: G.cfg.level, name: 'The computer', label: 'Computer' };
  return G.cfg.side === DARK ? [{ kind: 'human' }, bot] : [bot, { kind: 'human' }];
}

/* ── the game ── */
function renderHud() {
  const S = G.S, n = names();
  for (const side of [DARK, LIGHT]) {
    $('#num' + side).textContent = S.count[side]; $('#name' + side).textContent = G.seat[side].label || n[side];
    $('#who' + side).classList.toggle('turn', !S.over && !G.forfeit && S.turn === side);
  }
  $('#dial').setAttribute('aria-label', `${n[0]} ${S.count[0]}, ${n[1]} ${S.count[1]}`);
  dialTo(S.count[0], S.count[1]);
  const done = S.over || G.forfeit;
  $('#btns').innerHTML = (done ? '<button type="button" class="plate" data-act="again">Play again</button>'
    : `<button type="button" class="plate" data-act="undo"${canUndo() ? '' : ' disabled'}>Take back</button>`)
    + `<button type="button" class="plate" data-act="new">${G.armed ? 'Leave this game?' : 'New game'}</button>`;
  View.mark(S);
}
/** is there a move of a person's to take back? */
function canUndo() { return !G.forfeit && G.S.history.some((m, i) => m !== PASS_MOVE && G.seat[i % 2].kind === 'human'); }
function startGame(kept) {
  G.token++; G.screen = 'play'; G.forfeit = null; G.armed = 0; G.note = '';
  G.seat = kept ? kept.seat : seats(); G.S = (kept && replay(kept.moves)) || newGame();
  View.quiet = false; View.setInput(null);
  document.body.classList.add('playing'); $('#setup').hidden = true; $('#hud').hidden = false; $('#toast').classList.remove('on');
  View.fit(); View.set(G.S.b); drawDiscs(); G.shown = G.S.count.slice(); dialTo(G.S.count[0], G.S.count[1], true);
  if (!kept) snd('start');
  save(); turn(G.token);
}
function toSetup() {
  G.token++; G.screen = 'setup'; G.forfeit = null; G.armed = 0;
  Bots.dropAll('the game was left'); View.setInput(null);
  document.body.classList.remove('playing'); $('#hud').hidden = true; $('#setup').hidden = false; $('#toast').classList.remove('on');
  renderSetup(); View.fit(); save(); demo(G.token);
}
/** While nothing is being played, the board plays by itself, slowly and without a sound. */
async function demo(token) {
  View.quiet = true;
  for (;;) {
    const S = newGame();
    View.set(S.b); View.mark(S);
    await sleep(1300);
    while (!S.over) {
      if (token !== G.token) return;
      const legal = legalMoves(S);
      if (legal[0] === PASS_MOVE) { playMove(S, PASS_MOVE); continue; }
      let best = legal[0], top = -99;
      for (const m of legal) {
        const edge = (m & 7) % 7 === 0, end = (m >> 3) % 7 === 0, v = countFlips(S, m) * 0.6 + (edge && end ? 9 : edge || end ? 1.5 : 0) + Math.random() * 3;
        if (v > top) { top = v; best = m; }
      }
      const ev = playMove(S, best);
      await View.show(ev);
      if (token !== G.token) return;
      View.mark(S);
      await sleep(1250);
    }
    await sleep(3200);
    if (token !== G.token) return;
  }
}

/** Whoever is to move, moves: a person is shown where, a bot is asked, a side with no move is passed over. */
async function turn(token) {
  if (token !== G.token) return;
  const S = G.S, n = names();
  if (S.over) return finish();
  const legal = legalMoves(S), me = S.turn, seat = G.seat[me];
  if (legal[0] === PASS_MOVE) {
    say(`${has(n[me])} no move`, `${plays(n[1 - me])} again.`); renderHud();
    toast(`${has(n[me])} no move`, 1250); snd('pass');
    await sleep(1400);
    if (token !== G.token) return;
    playMove(S, PASS_MOVE); save();
    return turn(token);
  }
  if (seat.kind === 'human') {
    const people = G.seat.filter(s => s.kind === 'human').length;
    say(people === 1 ? 'Your move' : `${SIDE[me]} to move`, G.note || (S.history.length < 2 ? 'A star marks every square where a disc can go.' : ''));
    View.setInput({ side: me, legal, flips: s => flipsOf(S, s), pick: s => personMoves(s, token), miss: () => { snd('no'); say($('#status').textContent, 'A disc there would enclose nothing.'); } });
    renderHud();
    return;
  }
  View.setInput(null); say(`${seat.name} is thinking…`, G.note); renderHud();
  const t0 = performance.now(), a = await Bots.move(S, seat.bot, seat.level);
  if (token !== G.token) return;
  let m = a.move;
  if (m === undefined) {
    // on the kit's board a bot that breaks has lost, as it would have in the arena; the game's own bot is helped over the move
    if (KIT) { G.forfeit = { side: me, why: a.error }; say(`${seat.name} has lost`, `Its side forfeits: ${a.error}.`); snd('no'); renderHud(); save(); return; }
    m = legal[Math.floor(Math.random() * legal.length)];
  }
  const rest = (G.seat[1 - me].kind === 'bot' ? 450 : 700) - (performance.now() - t0);
  if (rest > 0) await sleep(rest);
  if (token !== G.token) return;
  const ev = playMove(S, m);
  G.note = `${seat.name} played ${sqName(m)} and turned ${ev.flips.length}.`;
  $('#sub').textContent = G.note;
  await View.show(ev);
  if (token !== G.token) return;
  save(); turn(token);
}
async function personMoves(s, token) {
  if (token !== G.token) return;
  View.setInput(null);
  const ev = playMove(G.S, s);
  if (!ev) return turn(token);
  G.note = ''; G.armed = 0; $('#sub').textContent = '';
  await View.show(ev);
  if (token !== G.token) return;
  save(); turn(token);
}
function finish() {
  const S = G.S, o = S.over, n = names(), [dark, light] = o.discs, people = G.seat.filter(s => s.kind === 'human').length;
  View.setInput(null);
  const why = o.why === 'swept' ? `${has(n[o.loser])} no disc left.` : o.why === 'blocked' ? 'Neither side can move.' : 'The board is full.';
  if (o.winner < 0) { say(`A draw, ${dark} all`, why); snd('draw'); }
  else { say(`${wins(n[o.winner])}, ${Math.max(dark, light)} to ${Math.min(dark, light)}`, why); snd(people === 1 && G.seat[o.winner].kind !== 'human' ? 'lose' : 'win'); View.cheer(o.winner + 1); }
  toast($('#status').textContent, 2600);
  renderHud(); save();
}
function undo() {
  if (G.screen !== 'play' || !canUndo()) return;
  const S = G.S;
  G.token++; Bots.dropAll('the move was taken back');
  for (;;) { const i = S.history.length - 1; if (i < 0) break; const m = undoMove(S); if (m !== PASS_MOVE && G.seat[i % 2].kind === 'human') break; }
  G.note = ''; G.armed = 0; $('#toast').classList.remove('on');
  View.setInput(null); View.set(S.b); snd('tick');
  save(); turn(G.token);
}

/* ── the rules, each with a small board ── */
function buildHelp() {
  if ($('#steps').childElementCount) return;
  const D = 1, L = 2, steps = [
    [4, 3, [[1, 1, L], [2, 1, D], [1, 2, D], [2, 2, L]], { stars: [[1, 0], [0, 1], [3, 2]] },
      '<b>Dark moves first.</b> On your turn you put one disc on the board, your side up. A star marks every square where it can go.'],
    [4, 3, [[0, 1, D], [1, 1, L], [2, 1, L]], { ghost: [3, 1, D], rings: [[1, 1], [2, 1]] },
      'A disc has to <b>enclose</b>: in a straight line from it come one or more of the other side’s discs, and then one of your own.'],
    [4, 3, [[0, 0, D], [2, 0, D], [1, 1, L], [2, 1, L], [3, 1, L]], { ghost: [2, 2, D], rings: [[1, 1], [2, 1]] },
      'Everything you enclose <b>turns over</b> and is yours: along the row, the column and both diagonals, all at once.'],
    [4, 3, [[0, 0, D], [1, 1, L], [3, 2, L]], { corner: true },
      '<b>No move?</b> Then you miss that turn and the other side goes again. With a move to make, you have to make one.'],
    [4, 3, [[0, 0, D], [1, 0, D], [2, 0, L], [3, 0, D], [0, 1, D], [1, 1, L], [2, 1, D], [3, 1, D], [0, 2, L], [1, 2, D], [2, 2, D], [3, 2, L]], {},
      'When <b>neither side can move</b> the game is over, and whoever has more discs showing their side has won.'],
    [4, 3, [[0, 0, D], [1, 0, L], [1, 1, L], [0, 1, L], [2, 1, D]], { corner: true },
      'A disc in a <b>corner</b> can never be enclosed, so it never turns back. Corners are worth waiting for.'],
  ];
  $('#steps').innerHTML = steps.map(s => `<div class="step"><canvas aria-hidden="true"></canvas><p>${s[4]}</p></div>`).join('');
  document.querySelectorAll('#steps canvas').forEach((c, i) => paintScene(c, c.clientWidth || 132, steps[i][0], steps[i][1], steps[i][2], steps[i][3]));
}
function openHelp() { $('#help').hidden = false; buildHelp(); $('[data-act=help-close]').focus({ preventScroll: true }); $('#help').scrollTop = 0; }
function closeHelp() { $('#help').hidden = true; }

/* ── wiring ── */
function renderSound() { $('#sound').textContent = SFX.on ? 'Sound on' : 'Sound off'; $('#sound').setAttribute('aria-pressed', SFX.on); }
/** The sky is painted for the window as it is. A window that only grows or shrinks a little in height (a phone's
 *  address bar coming and going) keeps the sky it has, stretched: painting it again each time would stutter. */
const Sky = { w: 0, h: 0, paint(force) {
  const w = window.innerWidth, h = window.innerHeight;
  if (!force && w === this.w && Math.abs(h - this.h) < 140) return;
  this.w = w; this.h = h; paintSky($('#sky'), w, h, Math.min(2, window.devicePixelRatio || 1));
  // and over the paint, a handful of stars that twinkle
  const rand = rngOf(7 + Math.round(w / 40)), n = Math.max(6, Math.round(w / 150)); let html = '';
  for (let i = 0; i < n; i++) html += `<i style="left:${((i + 0.15 + rand() * 0.7) / n * 100).toFixed(1)}%;top:${(3 + Math.pow(rand(), 1.4) * 44).toFixed(1)}%;--d:${(7 + rand() * 9).toFixed(1)}px;--t:${(3.2 + rand() * 4).toFixed(1)}s;--w:${(-rand() * 6).toFixed(1)}s"></i>`;
  $('#stars').innerHTML = html;
} };
function paintAll() {
  Sky.paint(); View.fit(); paintEmblem();
  if (G.screen === 'play') dialTo(G.S.count[0], G.S.count[1], true);
}
function wire() {
  document.addEventListener('click', ev => {
    const b = ev.target.closest('[data-act]');
    if (!b) { if (ev.target.id === 'help') closeHelp(); return; }
    const act = b.dataset.act, v = b.dataset.v;
    if (act === 'sound') { SFX.on = !SFX.on; renderSound(); snd('pick'); save(); return; }
    if (act === 'help') return openHelp();
    if (act === 'help-close') return closeHelp();
    if (act === 'vs') { G.cfg.vs = v; snd('pick'); renderSetup(); return save(); }
    if (act === 'level') { G.cfg.level = v; snd('pick'); renderSetup(); return save(); }
    if (act === 'side') { G.cfg.side = +v; snd('pick'); renderSetup(); return save(); }
    if (act === 'pick') { const p = $('#pick'); p.dataset.side = v; p.value = ''; return p.click(); }
    if (act === 'kit-level') { G.kit[+b.dataset.side].level = v; snd('pick'); return renderSetup(); }
    if (act === 'unseat') { Object.assign(G.kit[+v], { bot: '', info: null, level: '', file: '', error: '' }); Bots.drop('file' + v, 'the seat was given up'); return renderSetup(); }
    if (act === 'start') return startGame();
    if (act === 'again') return startGame();
    if (act === 'undo') return undo();
    if (act === 'new') {
      // one press too many should not cost a game that is under way
      if (G.S.history.length && !G.S.over && !G.forfeit && !G.armed) { G.armed = setTimeout(() => { G.armed = 0; if (G.screen === 'play') renderHud(); }, 3200); return renderHud(); }
      clearTimeout(G.armed); return toSetup();
    }
  });
  $('#pick').addEventListener('change', ev => { const f = ev.target.files && ev.target.files[0]; if (f) takeFile(+ev.target.dataset.side, f); });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !$('#help').hidden) closeHelp(); });
  let again = 0;
  window.addEventListener('resize', () => { clearTimeout(again); again = setTimeout(paintAll, 140); });
}
async function boot() {
  const kept = Store.read();
  if (kept.sound === false) SFX.on = false;
  if (kept.cfg && !KIT) Object.assign(G.cfg, { vs: kept.cfg.vs === 'friend' ? 'friend' : 'bot', level: String(kept.cfg.level || ''), side: kept.cfg.side === LIGHT ? LIGHT : DARK });
  View.init(); wire(); renderSound();
  Sky.paint(true);
  try { await Promise.race([Promise.all([document.fonts.load('20px Marcellus'), document.fonts.load('500 16px Jost')]), sleep(1500)]); } catch (e) { /* the page's fallback faces will do */ }
  View.fit(); paintEmblem();
  if (!KIT) {
    const info = await Bots.info('house');
    G.house = info.levels || [];
    if (!G.house.includes(G.cfg.level)) G.cfg.level = G.house[Math.min(1, G.house.length - 1)] || '';
  }
  const game = kept.game, fits = game && Array.isArray(game.moves) && Array.isArray(game.seat) && game.seat.length === 2
    && game.seat.every(s => s && (s.kind === 'human' || (s.kind === 'bot' && s.bot === 'house' && G.house.includes(s.level)))) && replay(game.moves) && !replay(game.moves).over;
  if (fits && !KIT) startGame(game); else toSetup();
}
boot();

</script>
