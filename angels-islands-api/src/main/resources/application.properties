# ── Server ────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:angels_islands}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# bulk chat import inserts thousands of rows per request
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ── Admin token ───────────────────────────────────────────────────────────────
# When set: writes and private reads (chats, memory, contacts, companion, import) need X-Admin-Token.
admin.token=${ADMIN_TOKEN:}

# ── File upload ───────────────────────────────────────────────────────────────
# videos up to 1 GB (a phone screen recording, an evening at a show); the file is streamed from disk to B2, never held in memory
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:1GB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:1GB}
server.tomcat.max-swallow-size=-1

# ── B2 Storage ────────────────────────────────────────────────────────────────
storage.b2.endpoint=https://${B2_ENDPOINT:s3.us-east-005.backblazeb2.com}
storage.b2.region=${B2_REGION:us-east-005}
storage.b2.key-id=${B2_KEY_ID}
storage.b2.app-key=${B2_APP_KEY}
storage.b2.bucket=${B2_BUCKET:sonic-hub}
storage.cdn-base-url=${CDN_BASE:https://sonic-hub.b-cdn.net}
storage.prefix=angels-islands

# ── CORS ──────────────────────────────────────────────────────────────────────
spring.web.cors.allowed-origins=*

# ── Anthropic (AI extraction) ────────────────────────────────────────────────
anthropic.api-key=${ANTHROPIC_API_KEY:}

# Anthropic (chat extraction)
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-4-5}

# Companion LLM providers (OpenAI-compatible + Claude)
openai.api-key=${OPENAI_API_KEY:}
deepseek.api-key=${DEEPSEEK_API_KEY:}
together.api-key=${TOGETHER_API_KEY:}

# Telegram companion bot (separate token from sonic-hub-connector)
telegram.companion-bot-token=${TELEGRAM_COMPANION_BOT_TOKEN:}

# ── Finance ───────────────────────────────────────────────────────────────────
# Optional: when set, SePay must send "Authorization: Apikey <this>" (the API Key option in its webhook form).
finance.sepay.api-key=${SEPAY_API_KEY:}

# ── Mystic (Huyền học) ───────────────────────────────────────────────────────
# Tử vi and the other readings live in their own service (sonic-mystic) and database. It pushes a brief per person
# and discipline to /api/persons/{id}/mystic-briefs/{discipline}, signed with MYSTIC_SYNC_TOKEN; this API tells it
# (MYSTIC_API_URL) when a person changes or is deleted.
mystic.api-url=${MYSTIC_API_URL:}
mystic.sync-token=${MYSTIC_SYNC_TOKEN:}
