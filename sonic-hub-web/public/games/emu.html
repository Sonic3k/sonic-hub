<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Game</title>
<!-- A Game Boy, SNES, NES or DS game in EmulatorJS (the cores come from its CDN, pinned to 4.2.3). The page is opened
     in a frame by the game windows of Sonic Hub: ?core=gba|gb|snes|nes|nds&rom=<file>&save=<his save>&name=<key>.
     His save is put in place each time the game starts, so it always opens where he left it. -->
<style>html, body { margin: 0; height: 100%; background: #000; overflow: hidden; } #game { width: 100%; height: 100%; }</style>
</head>
<body>
<div id="game"></div>
<script>
  const q = new URLSearchParams(location.search);
  const DATA = 'https://cdn.emulatorjs.org/4.2.3/data/';
  window.EJS_player = '#game';
  window.EJS_core = q.get('core') || 'gba';
  window.EJS_gameUrl = q.get('rom');
  window.EJS_gameName = q.get('name') || 'game';
  window.EJS_pathtodata = DATA;
  window.EJS_startOnLoaded = true;
  window.EJS_color = '#7B61FF';
  window.EJS_language = 'en-US';
  window.EJS_disableDatabases = true;
  window.EJS_Buttons = { netplay: false, cheat: false, saveSavFiles: true, loadSavFiles: false, quickSave: true, quickLoad: true };
  const save = q.get('save');
  window.EJS_onGameStart = async () => {
    if (!save) return;
    try {
      const r = await fetch(save);
      if (!r.ok) return;
      const data = new Uint8Array(await r.arrayBuffer());
      const gm = window.EJS_emulator.gameManager;
      const path = gm.getSaveFilePath();
      const dir = path.substring(0, path.lastIndexOf('/'));
      try { gm.FS.mkdir(dir); } catch (e) { /* already there */ }
      gm.FS.writeFile(path, data);
      gm.loadSaveFiles();
      gm.restart();
    } catch (e) { console.error('save', e); }
  };
  const s = document.createElement('script');
  s.src = DATA + 'loader.js';
  document.body.appendChild(s);
</script>
</body>
</html>
