# Railway service for the web app.
# Settings: root directory "sonic-hub-learn", config file "/sonic-hub-learn/web/railway.toml",
# variable VITE_API_URL = the learn API's public URL (used at build time).
[build]
builder = "nixpacks"
buildCommand = "npm ci && npm run build:web"

[deploy]
startCommand = "npm run start -w @learn/web"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
