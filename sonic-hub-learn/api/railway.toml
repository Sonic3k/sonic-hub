# Railway service for the learn API (runs database migrations on start).
# Settings: root directory "sonic-hub-learn", config file "/sonic-hub-learn/api/railway.toml",
# variables: DATABASE_URL, CORS_ORIGIN (the web's URL), MEDIA_BASE_URL (Bunny CDN), APP_TIMEZONE, DAY_ROLLOVER_HOUR.
[build]
builder = "nixpacks"
buildCommand = "npm ci && npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
