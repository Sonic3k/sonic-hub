<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Medieval Mayhem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>/* ── Medieval Mayhem · a war council by candlelight ──
   Oak table, a vellum chart in the middle, cards like leaves from a manuscript. Each civilization's cards and
   camp use its culture's design family (silhouette, frame, ornaments) plus its own pattern, colours and crest. */
:root{
  --ink:#2b2118;--ink-2:#5a4636;--ink-3:#8b7458;--vel:#eee0bf;--vel-hi:#f7eed7;--vel-lo:#dac69a;
  --rubric:#a4301d;--gold:#c9a24a;--gold-hi:#ecd18b;--gold-lo:#86631f;
  --f-head:'IM Fell English SC',Georgia,serif;--f-text:'Alegreya',Georgia,serif;
  --cw:150px;--ch:212px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1b1109;overscroll-behavior:none}
body{font-family:var(--f-text);color:var(--vel);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
.hidden{display:none!important}
#app{position:relative;height:100dvh;overflow:hidden;background:
  radial-gradient(ellipse 70% 58% at 50% 45%,rgba(255,186,104,.22),rgba(255,186,104,0) 72%),
  radial-gradient(ellipse 130% 100% at 50% 50%,rgba(0,0,0,0) 45%,rgba(0,0,0,.6) 100%),
  var(--oak-tex),linear-gradient(180deg,#3d2817,#2b1c10)}
.screen{position:relative;height:100%;z-index:1}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
#table,#topbar,#hand,.camp,.mk-item,.btn,.icon-btn{touch-action:manipulation}
#screen-match{-webkit-user-select:none;user-select:none}

/* buttons: red leather with gold tooling; vellum tags for the quieter ones */
.btn{font-family:var(--f-head);font-size:18px;line-height:1.1;letter-spacing:.01em;min-height:46px;padding:10px 22px;border:0;border-radius:6px;cursor:pointer;color:#fbecc9;
  background:var(--leather-tex),linear-gradient(#b8452b,#8b2c1b);text-shadow:0 1px 0 rgba(0,0,0,.45);
  box-shadow:inset 0 0 0 1px rgba(255,222,160,.6),inset 0 0 0 3px rgba(139,44,27,.9),inset 0 0 0 4px rgba(255,222,160,.32),0 3px 0 #4c160b,0 8px 18px rgba(0,0,0,.45)}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:translateY(1px)}
.btn.ghost{color:var(--ink);text-shadow:none;background:var(--vellum-tex),linear-gradient(#f4e9cc,#ddc796);
  box-shadow:inset 0 0 0 1px rgba(43,33,24,.65),inset 0 0 0 3px rgba(247,238,215,.7),inset 0 0 0 4px rgba(164,48,29,.35),0 3px 0 #7d6640,0 8px 18px rgba(0,0,0,.35)}
.btn.small{font-size:16px;min-height:40px;padding:7px 15px}
.btn:disabled{opacity:.6;cursor:default;filter:grayscale(.4)}
.icon-btn{position:relative;width:44px;height:44px;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--gold-hi);
  background:radial-gradient(circle at 40% 35%,#5c3b22,#2c1a0d);box-shadow:inset 0 0 0 1.5px var(--gold),inset 0 0 0 3.5px rgba(0,0,0,.45),0 2px 5px rgba(0,0,0,.55)}
.icon-btn svg{width:22px;height:22px}
.icon-btn .badge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;font-weight:800;font-size:12px;line-height:19px;color:#2a1a06;background:var(--gold-hi);box-shadow:0 0 0 2px #2c1a0d}
.icon-btn .badge.dot{min-width:11px;width:11px;height:11px;padding:0;background:#d5553c}
.mob-only{display:none!important}

/* ── cards: a manuscript leaf inside its civilization's frame ── */
.card{--w:var(--cw);--h:var(--ch);--s:calc(var(--w) * .2);position:relative;width:var(--w);height:var(--h);flex:0 0 auto;user-select:none;color:var(--ink);filter:drop-shadow(0 6px 8px rgba(14,7,0,.55))}
.card .cf{position:absolute;inset:0;padding:6px;border-radius:7px;background-color:var(--civ-deep);background-image:var(--motif);
  box-shadow:inset 0 0 0 1px rgba(255,228,170,.38),inset 0 0 0 2px rgba(0,0,0,.55)}
.card .cb{position:relative;height:100%;display:flex;flex-direction:column;border-radius:4px;overflow:hidden;
  background:var(--vellum-tex),linear-gradient(180deg,var(--vel-hi),var(--vel) 62%,var(--vel-lo));
  box-shadow:inset 0 0 0 1px rgba(43,33,24,.72),inset 0 0 0 3px rgba(247,238,215,.65),inset 0 0 0 4px rgba(164,48,29,.42),inset 0 0 24px rgba(130,80,30,.26)}
.card .cn{margin:7px 7px 0;padding:4px 8px;text-align:center;font-family:var(--f-head);font-size:14px;line-height:1.06;color:#fbeed2;text-shadow:0 1px 0 rgba(0,0,0,.5);
  background:linear-gradient(90deg,var(--civ-deep),var(--civ) 30%,var(--civ) 70%,var(--civ-deep));box-shadow:inset 0 0 0 1px rgba(255,228,170,.45),0 1px 2px rgba(0,0,0,.35)}
.card .ca{height:35%;margin:5px 9px 0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:3px;border-radius:2px;
  background-color:var(--civ-wash);background-image:var(--motif-soft);box-shadow:inset 0 0 0 1px rgba(201,162,74,.85),inset 0 0 0 2px rgba(247,238,215,.75),inset 0 0 0 3px rgba(43,33,24,.22)}
.card .ca .sym{width:var(--s);height:var(--s);filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.card.t-age .ca .sym{width:calc(var(--w) * .32);height:calc(var(--w) * .32)}   /* the Imperial Age crown, the same share of the card on every size */
.card .ct{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:5px 9px 11px;font-size:13px;line-height:1.24}
.card .corner{position:absolute;z-index:2;width:21px;height:21px;background:var(--corner) center/contain no-repeat;pointer-events:none}
.card .c1{left:0;top:0}.card .c2{right:0;top:0;transform:scaleX(-1)}
.card .seal{position:absolute;z-index:3;left:50%;bottom:-8px;transform:translateX(-50%);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;
  background:radial-gradient(circle at 38% 32%,#c8452c,#8c2416 68%,#5d160b);box-shadow:0 0 0 2px rgba(93,22,11,.6),0 2px 4px rgba(0,0,0,.55)}
.card .seal .crest{width:21px;height:21px}
.card .seal.coin{background:radial-gradient(circle at 38% 32%,#f5de93,#c9a24a 60%,#86631f);color:#3a2706;font-weight:800;font-size:15px}
.card .seal.crown{background:radial-gradient(circle at 38% 32%,#8f68cc,#5a3a8a 66%,#381f62)}
.card .seal.crown svg{width:24px;height:24px}
/* types: commons plain; signatures gilded with the civ's seal; Imperial porphyry with a crown; mercenaries in brass */
.card.t-sig .cf{background-color:#9a7424;background-image:var(--motif-gold);box-shadow:inset 0 0 0 1px rgba(255,236,180,.7),inset 0 0 0 2px rgba(60,40,8,.6)}
.card.t-imp .cf,.card.t-age .cf{background-color:#47257a;background-image:var(--motif-gold)}
.card.t-imp .cn,.card.t-age .cn{background:linear-gradient(90deg,#341760,#6a43ad,#341760)}
.card.t-imp .cb{background:var(--vellum-tex),linear-gradient(180deg,#f7f0f2,#ebdce6)}
.card.t-age .cb{background:radial-gradient(circle at 50% 32%,#fff7d6,#f0d17e 58%,#d6a443)}
.card.t-age .ca{background:none;box-shadow:none}
.card.t-age{filter:drop-shadow(0 0 14px rgba(236,209,139,.7)) drop-shadow(0 6px 8px rgba(14,7,0,.55))}
.card.t-merc .cf{background-color:#4f3f27}
.card.t-merc .cn{background:linear-gradient(90deg,#3b2d18,#6f5a35,#3b2d18)}
/* families: the silhouette and frame of each visual culture */
.fam-gothic .cn{clip-path:polygon(7% 0,93% 0,100% 50%,93% 100%,7% 100%,0 50%);padding:4px 13px}
.fam-knot .cf{border-radius:2px;padding:7px}.fam-knot .cb{border-radius:0}.fam-knot .cn{border-radius:0}
.fam-icon .cf,.fam-icon .cb{border-radius:46% 46% 5px 5px/12% 12% 5px 5px}.fam-icon .cf{box-shadow:inset 0 0 0 2px #d4b15b,inset 0 0 0 3px rgba(0,0,0,.5)}.fam-icon .cn{margin-top:17px}
.fam-folk .cn{outline:1.5px dashed rgba(255,238,205,.75);outline-offset:-4px}.fam-folk .cf{border-radius:4px}
.fam-islamic .cf,.fam-islamic .cb{clip-path:polygon(0 11%,12% 7.4%,28% 4.6%,42% 1.8%,50% 0,58% 1.8%,72% 4.6%,88% 7.4%,100% 11%,100% 100%,0 100%)}.fam-islamic .cn{margin-top:19px}
.fam-steppe .cf{background-image:var(--motif),var(--leather-tex)}.fam-steppe .cb{outline:1.5px dashed rgba(110,70,30,.5);outline-offset:-8px}
/* East Asian group: a tiled roof over the card, upturned eaves, ridge with end ornaments; the card body is the hall beneath, its name on a dark lacquered board */
.fam-sino .cf{--roof:calc(var(--h) * .125);padding:var(--roof) 6px 6px;-webkit-mask:var(--roof-mask) top/100% var(--roof) no-repeat,linear-gradient(#000,#000) bottom/100% calc(100% - var(--roof) + 1px) no-repeat;mask:var(--roof-mask) top/100% var(--roof) no-repeat,linear-gradient(#000,#000) bottom/100% calc(100% - var(--roof) + 1px) no-repeat}
.fam-sino .cf::before{content:'';position:absolute;left:0;right:0;top:0;height:var(--roof);background:var(--roof-art) center/100% 100% no-repeat;pointer-events:none;z-index:1}
.fam-sino .cb{border-radius:1px}.fam-sino .ca{height:31%}.fam-sino .cn{background:linear-gradient(#2e231a,#120b06);color:#ecd18b;box-shadow:inset 0 0 0 1px rgba(214,180,95,.75),0 1px 2px rgba(0,0,0,.4)}
.fam-temple .cf,.fam-temple .cb{clip-path:polygon(0 7%,15% 7%,15% 4.4%,30% 4.4%,30% 2%,42% 2%,42% 0,58% 0,58% 2%,70% 2%,70% 4.4%,85% 4.4%,85% 7%,100% 7%,100% 100%,0 100%)}.fam-temple .cn{margin-top:16px}
.fam-sahel .cf,.fam-sahel .cb{clip-path:polygon(0 6%,7% 6%,9% 0,11% 6%,29% 6%,31% 0,33% 6%,48% 6%,50% 0,52% 6%,67% 6%,69% 0,71% 6%,89% 6%,91% 0,93% 6%,100% 6%,100% 100%,0 100%)}.fam-sahel .cf{background-color:#8f5d32}.fam-sahel .cn{margin-top:15px}
.fam-codex .cf{padding:8px;border-radius:3px;box-shadow:inset 0 0 0 2px #1d1108,inset 0 0 0 4px #d6a03e}.fam-codex .cn{background:#d6a03e;color:#2a1908;text-shadow:none}
.fam-andes .cf,.fam-andes .cb{clip-path:polygon(7% 0,93% 0,100% 100%,0 100%)}.fam-andes .cn{margin:7px 15px 0}
.fam-icon .corner,.fam-islamic .corner,.fam-temple .corner,.fam-sahel .corner,.fam-andes .corner,.fam-sino .corner{top:auto;bottom:0}.fam-icon .c2,.fam-islamic .c2,.fam-temple .c2,.fam-sahel .c2,.fam-andes .c2,.fam-sino .c2{transform:scale(-1,-1)}.fam-icon .c1,.fam-islamic .c1,.fam-temple .c1,.fam-sahel .c1,.fam-andes .c1,.fam-sino .c1{transform:scaleY(-1)}
/* sizes */
.card.sm{--w:112px;--h:158px}.card.sm .cf{padding:4px}.card.sm .cn{font-size:11.5px;margin:5px 5px 0;padding:3px 6px}.card.sm .ca{margin:4px 6px 0}
.card.sm .ct{font-size:10.5px;padding:3px 6px 9px}.card.sm .ct span{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.card.sm .corner{width:14px;height:14px}.card.sm .seal{width:22px;height:22px;bottom:-6px;font-size:12px}.card.sm .seal .crest{width:15px;height:15px}.card.sm .seal svg{width:17px;height:17px}
.card.sm.fam-sino .cf{padding:var(--roof) 4px 4px}.card.sm.fam-sino .ct span{-webkit-line-clamp:4}.card.sm.fam-icon .cn,.card.sm.fam-islamic .cn,.card.sm.fam-temple .cn,.card.sm.fam-sahel .cn{margin-top:12px}
.card.lg{--w:214px;--h:302px}.card.lg .cf{padding:8px}.card.lg .cn{font-size:18.5px;margin:9px 9px 0;padding:6px 12px}.card.lg .ca{margin:8px 12px 0}
.card.lg .ct{font-size:16px;padding:8px 13px 16px}.card.lg .corner{width:28px;height:28px}.card.lg .seal{width:40px;height:40px;bottom:-10px}.card.lg .seal .crest{width:28px;height:28px}.card.lg .seal svg{width:30px;height:30px}
.card.lg.fam-sino .cf{padding:var(--roof) 8px 8px}.card.lg.fam-icon .cn,.card.lg.fam-islamic .cn{margin-top:24px}.card.lg.fam-temple .cn,.card.lg.fam-sahel .cn{margin-top:20px}
.cost{position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);z-index:4;white-space:nowrap;font-weight:800;font-size:13px;padding:1px 10px;border-radius:3px;color:#3a2706;
  background:linear-gradient(#f2d98e,#c9a24a);box-shadow:inset 0 0 0 1px #7a5a18,0 2px 4px rgba(0,0,0,.5)}
.cost:not(.ok){filter:grayscale(.6) brightness(.85)}
.cback{display:inline-block;width:11px;height:16px;border-radius:2px;margin-right:-4px;background-color:var(--civ-deep);background-image:var(--motif);box-shadow:0 0 0 1px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,228,170,.4)}

/* keywords: the pigment of their symbol, a touch darker for reading on vellum */
.kw{font-weight:800}.k-dmg{color:#9b2c17}.k-hp{color:#2e6a2c}.k-gold{color:#80600e}.k-card{color:#2b3570}.k-wall{color:#4c5462}.k-play{color:#55358a}.k-aoe{color:#a9441a}.k-pierce{color:#2e5f45}.k-steal{color:#6e2752}.k-raze{color:#5f3a1f}

/* ── the table ── */
#screen-match{display:flex;flex-direction:column}
#topbar{flex:0 0 auto;height:54px;display:flex;align-items:center;gap:10px;padding:0 14px;position:relative;z-index:5;
  background:var(--leather-tex),linear-gradient(180deg,#432a18,#2a1a0e);box-shadow:inset 0 -1px 0 rgba(236,209,139,.4),inset 0 -3px 0 rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.5)}
.tb-mid{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;min-width:0}
.tb-right{display:flex;gap:8px;align-items:center}
.pill{font-family:var(--f-head);font-size:17px;white-space:nowrap;color:var(--gold-hi);padding:4px 14px;border-radius:3px;background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 1px rgba(236,209,139,.32)}
.pill.you{color:#fcebc9;background:linear-gradient(#b8452b,#8b2c1b);box-shadow:inset 0 0 0 1px rgba(255,222,160,.55)}
.pips{display:flex;gap:5px}.pip{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff0c2,#c9a24a);box-shadow:0 0 0 1px #6b4f12,0 0 9px rgba(236,209,139,.75)}
.speed{min-width:58px;height:44px;border:0;border-radius:22px;cursor:pointer;font-family:var(--f-head);font-size:16px;color:var(--gold-hi);background:radial-gradient(circle at 40% 35%,#5c3b22,#2c1a0d);box-shadow:inset 0 0 0 1.5px var(--gold),0 2px 5px rgba(0,0,0,.55)}
.evchip{border:0;cursor:pointer;display:inline-flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:44px;padding:2px 12px;border-radius:3px;color:var(--ink);text-align:left;
  background:var(--vellum-tex),linear-gradient(#f3e7c7,#dcc594);box-shadow:inset 0 0 0 1px rgba(43,33,24,.6),0 2px 4px rgba(0,0,0,.45);position:relative;min-width:0}
.evchip small{font-family:var(--f-head);font-size:12px;color:var(--rubric);line-height:1}.evchip b{font-family:var(--f-head);font-weight:400;font-size:16px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.evchip .badge{position:absolute;top:-4px;right:-4px;width:11px;height:11px;border-radius:50%;background:#d5553c;box-shadow:0 0 0 2px #2c1a0d}
#table{flex:1;min-height:0;display:grid;gap:12px;padding:10px 18px 0;
  grid-template-columns:300px minmax(0,1fr) 344px;grid-template-rows:auto minmax(0,1fr) auto auto;
  grid-template-areas:"opps opps opps" "events stage market" "me act act" "me hand hand"}
#opps{grid-area:opps;display:flex;justify-content:center;gap:16px}
#opps .camp{flex:0 1 340px}#opps.n1 .camp{flex-basis:460px}

/* camps: a vellum plaque under the civ's banner, HP in a wax seal */
.camp{position:relative;min-width:0;border-radius:5px;color:var(--ink);background:var(--vellum-tex),linear-gradient(180deg,var(--vel-hi),var(--vel));transition:box-shadow .2s,transform .2s,outline-color .2s;
  box-shadow:inset 0 0 0 1px rgba(43,33,24,.75),inset 0 0 0 3px rgba(247,238,215,.65),inset 0 0 0 4px rgba(164,48,29,.32),0 10px 24px rgba(0,0,0,.5)}
.camp-banner{position:relative;display:flex;align-items:center;gap:8px;min-height:42px;padding:4px 74px 4px 10px;color:#fbeed2;border-radius:5px 5px 0 0;
  background-color:var(--civ-deep);background-image:var(--motif);box-shadow:inset 0 -2px 0 rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,228,170,.35)}
.camp-banner .crest{flex:0 0 auto;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.cname{font-family:var(--f-head);font-size:21px;line-height:1;text-shadow:0 1px 0 rgba(0,0,0,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.you{flex:0 0 auto;font-weight:700;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:2px;background:rgba(0,0,0,.35);color:var(--gold-hi)}
.flag{flex:0 0 auto;font-weight:700;font-size:12px;padding:1px 8px;border-radius:2px;background:var(--gold-hi);color:#2a1a06}.flag.out{background:#2b2118;color:#eee0bf}
.hpseal{position:absolute;right:6px;top:-9px;width:64px;height:64px;display:grid;place-items:center;cursor:help;z-index:2;filter:drop-shadow(0 3px 4px rgba(0,0,0,.55))}
.hpseal svg{position:absolute;inset:0;width:100%;height:100%}
.hpseal b{position:relative;margin-top:-6px;font-weight:800;font-size:24px;line-height:1;color:#fbe7c6;text-shadow:0 1px 0 rgba(0,0,0,.55)}
.hpseal small{position:absolute;bottom:13px;font-size:10.5px;font-weight:700;color:#f0cdb0}
.hpseal.low{animation:throb 1.1s ease-in-out infinite}
@keyframes throb{50%{transform:scale(1.08)}}
.camp-body{display:flex;align-items:flex-end;gap:12px;padding:8px 12px 11px}
.defs{flex:1;min-width:0}
.defs .lbl{display:block;font-family:var(--f-head);font-size:13px;color:var(--rubric);margin-bottom:3px}
.defs .row{display:flex;flex-wrap:wrap;gap:6px}
.defs .none{font-style:italic;font-size:13.5px;color:var(--ink-3)}
.bld{position:relative;display:inline-grid;place-items:center;width:40px;height:38px;border-radius:3px;cursor:help;background:rgba(90,60,30,.08);box-shadow:inset 0 0 0 1px rgba(43,33,24,.22)}
.bld svg{width:32px;height:32px}
.bld b{position:absolute;right:-6px;bottom:-6px;min-width:19px;height:19px;padding:0 4px;border-radius:10px;font-weight:800;font-size:12.5px;line-height:19px;text-align:center;color:#fbeed2;background:#4c5462;box-shadow:0 0 0 1.5px var(--vel)}
.bld.wonder{background:rgba(214,160,62,.22)}.bld.wonder b{background:#86631f}
.bld em{position:absolute;left:-6px;bottom:-6px;font-style:normal;font-weight:800;font-size:11.5px;line-height:18px;padding:0 6px;border-radius:9px;color:#fff;background:#5a3a8a;box-shadow:0 0 0 1.5px var(--vel)}
.stash{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto}
.coin{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:16px;color:#6a4c08;cursor:help}.coin .sym{width:21px;height:21px}
.backs{display:inline-flex;align-items:center;font-weight:700;font-size:14px;color:var(--ink-2);cursor:help}.backs b{margin-left:9px}
.agem{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:12.5px;padding:0 8px 0 1px;border-radius:999px;background:rgba(90,58,138,.13);color:#47297a;cursor:help}
.agem .sym{width:17px;height:17px}.agem.hot{background:#5a3a8a;color:#fff}.agem.imp{background:linear-gradient(90deg,#341760,#6a43ad);color:#ffe9a6}
.relic{font-weight:700;font-size:12.5px;padding:1px 8px;border-radius:2px;background:rgba(43,33,24,.08);box-shadow:inset 0 0 0 1px rgba(43,33,24,.2);color:var(--ink-2);cursor:help;white-space:nowrap}
.tokens{display:flex;flex-wrap:wrap;gap:5px;padding:0 12px 9px}
.token{font-size:12.5px;font-weight:700;padding:1px 9px;border-radius:2px;background:#2a4b77;color:#f6ebcf;cursor:help}.token.camel{background:#9c7040}
.camp.turn{box-shadow:inset 0 0 0 1px rgba(43,33,24,.75),inset 0 0 0 3px rgba(247,238,215,.65),0 0 0 2px var(--gold-hi),0 0 30px rgba(236,209,139,.55),0 10px 24px rgba(0,0,0,.5)}
.camp.targetable{cursor:crosshair;outline:3px dashed rgba(214,90,60,.95);outline-offset:4px}
.camp.targetable.hot{outline-style:solid;outline-color:#e26a4a;box-shadow:inset 0 0 0 1px rgba(43,33,24,.75),0 0 36px rgba(226,106,74,.7),0 10px 24px rgba(0,0,0,.5)}
.camp.out{filter:grayscale(.9) brightness(.7)}
.camp.hit{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.chips{position:absolute;left:50%;top:-14px;transform:translateX(-50%);display:flex;gap:4px;z-index:6;pointer-events:none;white-space:nowrap}
.chip{font-weight:800;font-size:13.5px;padding:2px 9px;border-radius:3px;box-shadow:0 0 0 1px rgba(43,33,24,.6),0 3px 8px rgba(0,0,0,.45)}
.chip.dmg{background:#f6d9cc;color:#8a2412}.chip.heal{background:#d6ead1;color:#255b24}.chip.gold{background:#f4e3a8;color:#5f4708}.chip.wall{background:#e0e2e6;color:#3c4452}.chip.cards{background:#dfe1f2;color:#28316c}.chip.ko{background:#8a2412;color:#fff}
.floats{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center;z-index:7}
.float{position:absolute;font-weight:800;font-size:31px;white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 12px rgba(255,240,210,.8);animation:floatup 1.5s ease-out forwards}
.float.dmg{color:#a82814}.float.heal{color:#2d6f2a}.float.wall{color:#3f4756;font-size:23px}.float.gold{color:#7c5b06;font-size:22px}.float.info{color:#4c2c7a;font-size:21px}.float.big{font-size:40px}
@keyframes floatup{0%{transform:translateY(10px) scale(.6);opacity:0}15%{transform:scale(1.1);opacity:1}100%{transform:translateY(-48px);opacity:0}}
/* the centre: a chart on vellum, events on a scroll, the merchant's board */
#stage{grid-area:stage;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
#stage::before{content:'';position:absolute;inset:2% 1%;border-radius:4px;transform:rotate(-.5deg);
  background:var(--rose) center/min(62%,300px) no-repeat,var(--rhumb) center/1500px no-repeat,var(--vellum-tex),linear-gradient(180deg,#eedfbc,#dcc89c);
  box-shadow:inset 0 0 60px rgba(120,70,25,.48),inset 0 0 8px rgba(70,40,15,.65),0 16px 36px rgba(0,0,0,.55);will-change:transform}
#stage .dropglow{position:absolute;inset:2% 1%;border-radius:4px;transform:rotate(-.5deg);pointer-events:none;opacity:0;transition:opacity .15s ease;will-change:opacity;box-shadow:inset 0 0 0 3px rgba(164,48,29,.8),inset 0 0 70px rgba(236,180,90,.6)}
#stage.holding .dropglow{opacity:.3}#stage.drop-ok .dropglow{opacity:1}
#stage .rose{display:none}
#stage-card{position:relative;min-height:10px;display:flex;justify-content:center;transition:opacity .15s}
.stage-fit{transform-origin:top center}
#stage-card .card.pop{animation:pop .3s ease-out}
@keyframes pop{from{transform:scale(.82);opacity:.2}to{transform:none;opacity:1}}
#stage-caption{position:relative;margin-top:12px;font-family:var(--f-head);font-size:18px;color:var(--rubric);min-height:24px;text-align:center;padding:0 12px;text-shadow:0 1px 0 rgba(255,245,220,.6)}
#events{grid-area:events;align-self:center;display:flex;flex-direction:column;gap:18px;padding:8px 0}
.ev{position:relative;padding:12px 14px;color:var(--ink);border-radius:2px;background:var(--vellum-tex),linear-gradient(180deg,var(--vel-hi),var(--vel));box-shadow:inset 0 0 0 1px rgba(43,33,24,.55),0 8px 18px rgba(0,0,0,.45)}
.ev::before,.ev::after{content:'';position:absolute;left:-5px;right:-5px;height:10px;border-radius:5px;background:linear-gradient(180deg,#e2cd9c,#a8884f 55%,#6f532c);box-shadow:0 2px 3px rgba(0,0,0,.45)}
.ev::before{top:-6px}.ev::after{bottom:-6px}
.ev .when{font-family:var(--f-head);font-size:13.5px;color:var(--rubric)}
.ev h4{margin:0 0 3px;font-family:var(--f-head);font-weight:400;font-size:21px;line-height:1.05}
.ev p{margin:0;font-size:14.5px;line-height:1.3}
.ev.next{opacity:.9;transform:scale(.97)}
.ev.flip{animation:flip .55s ease-out}
@keyframes flip{0%{transform:perspective(600px) rotateX(80deg);opacity:0}100%{transform:none;opacity:1}}
.ev-warn{font-size:13.5px;font-weight:700;padding:7px 11px;border-radius:2px;background:#7c1d12;color:#fbe1d4;box-shadow:inset 0 0 0 1px rgba(255,210,180,.4)}
#market{grid-area:market;align-self:center;border-radius:5px;padding:12px 12px 14px;background:var(--oak-tex),linear-gradient(#4b3120,#2d1c10);
  box-shadow:inset 0 0 0 2px #170d06,inset 0 0 0 3px rgba(201,162,74,.5),0 12px 26px rgba(0,0,0,.55)}
#market h3{margin:0 0 10px;font-family:var(--f-head);font-weight:400;font-size:21px;color:var(--gold-hi);text-shadow:0 1px 0 #000}
.mk-row{display:flex;gap:8px;justify-content:space-between;padding-bottom:12px}
.mk-item{border:0;padding:0;background:none;cursor:default}
.mk-item.can{cursor:pointer}.mk-item.can .card{filter:drop-shadow(0 0 10px rgba(236,209,139,.75)) drop-shadow(0 6px 8px rgba(14,7,0,.55))}
.mk-note{margin:4px 0 0;font-size:13.5px;line-height:1.3;color:#e8d8b4}
.mk-note .kw{color:var(--gold-hi)}
#me{grid-area:me;align-self:end;padding-bottom:12px}
#prompt{grid-area:act}
.camp.mine .camp-body{flex-wrap:wrap}
.piles{display:flex;gap:6px;padding:0 12px 11px}
.pile{border:0;cursor:pointer;font-weight:700;font-size:13.5px;min-height:34px;padding:4px 11px;border-radius:2px;color:var(--ink);background:rgba(43,33,24,.07);box-shadow:inset 0 0 0 1px rgba(43,33,24,.3)}
.pile:hover{background:rgba(43,33,24,.13)}
.actionbar{position:relative;z-index:60;display:flex;align-items:center;justify-content:center;gap:10px;min-height:50px}
.actionbar .hint{font-family:var(--f-head);font-size:19px;color:var(--gold-hi);text-align:center;text-shadow:0 1px 0 #000,0 0 12px rgba(0,0,0,.6)}
.actionbar .btn{white-space:nowrap;min-width:120px}
/* the hand: one straight row, as in Photo Studio. A native scroller that settles on a card; nothing moves on hover, a chosen card
   rises 8px; the ghost of a drag is a copy of the card on its own GPU layer */
#handzone{grid-area:hand;position:relative;align-self:end;min-width:0}
#hand{position:relative;display:flex;align-items:flex-end;gap:20px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;scrollbar-width:none;overscroll-behavior-x:contain;padding:22px 20px 14px;touch-action:pan-x}
#hand::-webkit-scrollbar{display:none}
#handzone.over #hand{padding-left:54px;padding-right:54px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 50px,#000 calc(100% - 50px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 50px,#000 calc(100% - 50px),transparent)}
#hand>.card:first-child{margin-left:auto}#hand>.card:last-child{margin-right:auto}
#hand .card{scroll-snap-align:center;transition:transform .2s cubic-bezier(.2,.9,.3,1.2),opacity .15s;-webkit-touch-callout:none}
#hand .card.playable{cursor:grab}
#hand .card.sel{transform:translateY(-8px);filter:drop-shadow(0 0 1.5px #fff3c8) drop-shadow(0 0 2.5px var(--gold-hi)) drop-shadow(0 0 12px rgba(236,209,139,.95))}
#hand .card.dim{filter:saturate(.7) brightness(.82) drop-shadow(0 6px 8px rgba(14,7,0,.55))}
#hand .card.drag-src{opacity:.35;transform:none;cursor:grabbing}
.hand-empty{align-self:center;margin:auto;font-style:italic;color:#d9c8a2}
.hand-nav{display:none;position:absolute;top:50%;z-index:2;width:38px;height:38px;margin-top:-15px;padding:0;border:0;border-radius:50%;place-items:center;cursor:pointer;font-size:26px;line-height:1;color:var(--gold-hi);
  background:radial-gradient(circle at 40% 35%,#5c3b22,#2c1a0d);box-shadow:inset 0 0 0 1.5px var(--gold),0 2px 6px rgba(0,0,0,.55)}
#handzone.over .hand-nav{display:grid}
.hand-nav.prev{left:6px}.hand-nav.next{right:6px}
.hand-nav:disabled{opacity:.3;cursor:default}
#drag-ghost{position:fixed;left:0;top:0;z-index:75;pointer-events:none;display:none;transform-origin:0 0;will-change:transform}
#drag-ghost.on{display:block}
#drag-ghost .card{margin:0;filter:drop-shadow(0 16px 18px rgba(14,7,0,.55));animation:pickup .14s ease-out}
@keyframes pickup{from{transform:scale(1.25) rotate(3deg)}}
#stage.holding #stage-card{opacity:.35}

/* drawer, sheets, tooltips, coach, banner */
.drawer{position:absolute;top:54px;right:0;bottom:0;width:340px;z-index:30;padding:16px 18px;overflow:auto;transform:translateX(105%);transition:transform .25s ease;color:var(--ink);
  background:var(--vellum-tex),linear-gradient(180deg,var(--vel-hi),var(--vel));box-shadow:inset 1px 0 0 rgba(43,33,24,.5),-14px 0 32px rgba(0,0,0,.5)}
.drawer.open{transform:none}
.drawer h3{margin:0 0 10px;font-family:var(--f-head);font-weight:400;font-size:24px;color:var(--rubric)}
.log{list-style:none;margin:0;padding:0}.log li{padding:7px 0;border-bottom:1px solid rgba(43,33,24,.15);font-size:15px;line-height:1.35}.log li.r{font-family:var(--f-head);font-size:17px;color:var(--rubric)}
.sheet-wrap{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:18px;background:rgba(12,6,2,.68)}
.sheet-panel{width:min(780px,100%);max-height:88dvh;overflow:auto;border-radius:3px;padding:22px 24px;color:var(--ink);background:var(--vellum-tex),linear-gradient(180deg,var(--vel-hi),var(--vel));
  box-shadow:inset 0 0 0 1px rgba(43,33,24,.7),inset 0 0 0 4px rgba(247,238,215,.7),inset 0 0 0 5px rgba(164,48,29,.4),inset 0 0 60px rgba(130,80,30,.3),0 28px 70px rgba(0,0,0,.65)}
.sheet-panel h2{margin:0 0 6px;font-family:var(--f-head);font-weight:400;font-size:32px;line-height:1.05;color:var(--rubric)}
.sheet-panel h3{margin:16px 0 6px;font-family:var(--f-head);font-weight:400;font-size:21px;color:var(--rubric)}
.sheet-panel p{line-height:1.45;font-size:16px;margin:6px 0}
.muted{color:var(--ink-3)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.row.center{justify-content:center}
.seg{display:inline-flex;padding:3px;gap:3px;border-radius:4px;background:rgba(43,33,24,.1);box-shadow:inset 0 0 0 1px rgba(43,33,24,.25)}
.seg button{border:0;cursor:pointer;min-height:42px;padding:6px 14px;border-radius:3px;background:none;font-weight:700;font-size:15px;color:var(--ink-2)}
.seg button.on{color:#fbecc9;background:linear-gradient(#b8452b,#8b2c1b);box-shadow:inset 0 0 0 1px rgba(255,222,160,.5)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid rgba(43,33,24,.14)}
.set-row>div>b{display:block;font-family:var(--f-head);font-weight:400;font-size:18px}.set-row>div>span{font-size:14.5px;color:var(--ink-3)}
.relics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.relic-pick{text-align:left;border:0;cursor:pointer;border-radius:3px;padding:14px;color:var(--ink);background:var(--vellum-tex),linear-gradient(#fbf3de,#ead7ab);box-shadow:inset 0 0 0 1px rgba(43,33,24,.6),inset 0 0 0 3px rgba(201,162,74,.6),0 4px 0 #8c7448,0 8px 16px rgba(0,0,0,.3)}
@media (hover:hover) and (pointer:fine){.relic-pick:hover{filter:brightness(1.04)}}
.relic-pick>b{display:block;font-family:var(--f-head);font-weight:400;font-size:20px;color:var(--rubric)}.relic-pick>span{display:block;font-size:15px;line-height:1.35}
.legend{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 18px;margin:8px 0}
.legend div{display:grid;grid-template-columns:30px 1fr;gap:2px 8px;font-size:15px}.legend .sym{width:28px;height:28px}.legend>div>b{align-self:center;font-family:var(--f-head);font-weight:400;font-size:17px}.legend>div>span{grid-column:2;color:var(--ink-2);line-height:1.3}
.decklist{columns:2;column-gap:18px;margin:6px 0}.decklist div{break-inside:avoid;display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dotted rgba(43,33,24,.25);font-size:15px}
.tip{position:fixed;z-index:90;max-width:300px;padding:9px 12px;border-radius:3px;font-size:14.5px;line-height:1.35;color:var(--ink);background:var(--vellum-tex),#f7eed7;box-shadow:inset 0 0 0 1px rgba(43,33,24,.6),0 12px 28px rgba(0,0,0,.5);pointer-events:none}
#zoom{position:fixed;z-index:85;pointer-events:none}
.coach{position:fixed;inset:0;z-index:70;pointer-events:none}
.coach .spot{position:fixed;border-radius:8px;box-shadow:0 0 0 9999px rgba(12,6,2,.66);transition:all .3s ease}
.coach .bubble{position:fixed;width:min(370px,calc(100vw - 24px));padding:15px 17px;border-radius:3px;color:var(--ink);pointer-events:auto;background:var(--vellum-tex),linear-gradient(180deg,var(--vel-hi),var(--vel));box-shadow:inset 0 0 0 1px rgba(43,33,24,.7),inset 0 0 0 4px rgba(247,238,215,.7),inset 0 0 0 5px rgba(164,48,29,.4),0 18px 44px rgba(0,0,0,.6)}
.coach .bubble h4{margin:0 0 4px;font-family:var(--f-head);font-weight:400;font-size:22px;color:var(--rubric)}.coach .bubble p{margin:0 0 10px;font-size:16px;line-height:1.4}
.coach .bubble .row{margin-top:6px;justify-content:space-between;align-items:center}
.coach .step{font-size:13.5px;color:var(--ink-3)}
#banner{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:50;text-align:center;pointer-events:none;opacity:0;width:min(92vw,760px)}
#banner .bt{font-family:var(--f-head);font-size:clamp(34px,5.6vw,62px);line-height:1.02;color:var(--gold-hi);text-shadow:0 3px 0 #3a2406,0 0 30px rgba(0,0,0,.85),0 0 60px rgba(0,0,0,.6)}
#banner .bs{margin-top:8px;font-size:19px;color:#fbecc9;text-shadow:0 2px 8px #000}
#banner .bs .kw{color:var(--gold-hi)}
#banner.show{animation:bannerIn var(--bdur,1.9s) ease-out}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-40%)}12%{opacity:1;transform:translate(-50%,-50%)}78%{opacity:1}100%{opacity:0}}
#fx-layer{position:fixed;inset:0;z-index:45;pointer-events:none}
/* a card changing hands: it turns up face up with a tag saying what happened, then goes where it goes */
.mv{pointer-events:none;transform-origin:50% 50%;will-change:transform,opacity}
.mv .card{margin:0}
.mv-tag{position:absolute;left:50%;top:-10px;transform:translate(-50%,-100%);white-space:nowrap;font-weight:800;font-size:19px;line-height:1.15;padding:4px 14px 5px;border-radius:4px;color:#fbe7c6;background:#7a2c5b;box-shadow:0 0 0 1.5px rgba(255,228,170,.55),0 8px 18px rgba(0,0,0,.55)}
.mv-tag.convert{background:#574789}.mv-tag.discard{background:#5a4636}.mv-tag.pass{background:#2a4b77}
.mv-bld{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px}
.bld.big{width:62px;height:58px;background:var(--vel-hi);box-shadow:inset 0 0 0 1px rgba(43,33,24,.35),0 8px 18px rgba(0,0,0,.5)}.bld.big svg{width:50px;height:50px}.bld.big b{right:-8px;bottom:-8px;min-width:24px;height:24px;line-height:24px;font-size:15px}
.mv-name{font-family:var(--f-head);font-size:17px;white-space:nowrap;padding:2px 10px;border-radius:3px;color:var(--ink);background:var(--vellum-tex),var(--vel-hi);box-shadow:inset 0 0 0 1px rgba(43,33,24,.5),0 4px 10px rgba(0,0,0,.45)}
.mv-bld .mv-tag{top:-6px;font-size:14px;padding:3px 10px 4px}.mv-bld .mv-name{font-size:14px}
#fx-arrows{position:fixed;inset:0;width:100%;height:100%;z-index:44;pointer-events:none}
.arrow{fill:none;stroke-width:4.5;stroke-linecap:round;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.arrow.dmg{stroke:#b5321c}.arrow.raze{stroke:#7a4a20}.arrow.steal{stroke:#7a2c5b}.arrow.aim{stroke:#a4301d;stroke-dasharray:10 9}

/* menu */
#screen-menu{display:grid;place-items:center;padding:24px}
.menu{display:flex;flex-direction:column;align-items:center;text-align:center}
.menu-title{margin:0;font-family:var(--f-head);font-weight:400;font-size:clamp(50px,9vw,112px);line-height:.95;color:var(--gold-hi);text-shadow:0 4px 0 #3a2406,0 0 40px rgba(0,0,0,.7)}
.menu-rule{width:min(420px,70vw);height:14px;margin:10px auto 4px;background:var(--rhumb-rule) center/contain no-repeat}
.menu-sub{margin:4px 0 0;font-size:20px;font-style:italic;color:#ecdcb8;max-width:34ch}
.menu-fan{position:relative;height:262px;width:min(740px,94vw);margin:18px 0 12px}
.menu-fan .card{position:absolute;left:50%;top:12px;margin-left:calc(var(--cw) / -2);transform:translateX(var(--x)) translateY(var(--y)) rotate(var(--rot));transform-origin:50% 120%;animation:deal .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
@keyframes deal{from{transform:translateX(0) translateY(60px) rotate(0);opacity:0}}
.menu-actions{display:flex;flex-direction:column;gap:12px;width:min(340px,90vw)}
.menu-foot{margin-top:16px;font-size:15px;font-style:italic;color:#cdb991}
/* civilization select */
#screen-select{display:grid;grid-template-columns:minmax(0,1fr) 450px;grid-template-rows:auto minmax(0,1fr);gap:0 20px;padding:0 20px 20px}
.sel-top{grid-column:1/-1;display:flex;align-items:center;gap:12px;height:66px}
.sel-top h2{margin:0;flex:1;font-family:var(--f-head);font-weight:400;font-size:30px;color:var(--gold-hi);text-shadow:0 2px 0 #000}
.sel-list{overflow:auto;padding:2px 6px 20px 2px}
.region h3{margin:16px 0 8px;font-family:var(--f-head);font-weight:400;font-size:21px;color:var(--gold-hi);text-shadow:0 1px 0 #000}
.civ-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:12px}
.civ-tile{position:relative;height:92px;border:0;cursor:pointer;text-align:left;color:#fbeed2;padding:9px 10px;display:flex;align-items:flex-end;gap:8px;border-radius:4px;
  background-color:var(--civ-deep);background-image:var(--motif);box-shadow:inset 0 0 0 1px rgba(255,228,170,.4),inset 0 0 0 2px rgba(0,0,0,.5),0 6px 14px rgba(0,0,0,.5)}
@media (hover:hover) and (pointer:fine){.civ-tile:hover{filter:brightness(1.1)}}
.civ-tile.on{box-shadow:inset 0 0 0 1px rgba(255,228,170,.6),0 0 0 3px var(--gold-hi),0 0 26px rgba(236,209,139,.55)}
.civ-tile .crest{flex:0 0 auto;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.civ-tile .nm{font-family:var(--f-head);font-size:18px;line-height:1.02;text-shadow:0 1px 0 rgba(0,0,0,.6)}
.civ-tile .hp{position:absolute;top:7px;right:9px;font-weight:800;font-size:13.5px;padding:0 7px;border-radius:2px;color:#fbe7c6;background:rgba(122,26,14,.85)}
.sel-detail{overflow:auto;border-radius:3px;color:var(--ink);display:flex;flex-direction:column;background:var(--vellum-tex),linear-gradient(180deg,var(--vel-hi),var(--vel));
  box-shadow:inset 0 0 0 1px rgba(43,33,24,.7),inset 0 0 0 4px rgba(247,238,215,.7),inset 0 0 0 5px rgba(164,48,29,.38),0 14px 34px rgba(0,0,0,.55)}
.sd-hero{display:flex;gap:14px;align-items:center;padding:18px;color:#fbeed2;background-color:var(--civ-deep);background-image:var(--motif);box-shadow:inset 0 -2px 0 rgba(0,0,0,.35)}
.sd-hero h2{margin:0;font-family:var(--f-head);font-weight:400;font-size:38px;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.sd-hero p{margin:4px 0 0;font-size:16.5px;font-style:italic;opacity:.95}
.sd-body{padding:6px 20px 10px;flex:1}
.sd-body h3{margin:16px 0 10px;font-family:var(--f-head);font-weight:400;font-size:21px;color:var(--rubric)}
.sd-cards{display:flex;gap:12px;flex-wrap:wrap;padding-bottom:8px}

/* ── round herald: the table stops and the event is read out ── */
.herald{position:fixed;inset:0;z-index:65;display:grid;place-items:center;padding:20px;background:rgba(12,6,2,.62);animation:hin .25s ease-out;cursor:pointer}
.herald.out{animation:hout .26s ease-in forwards}
@keyframes hin{from{opacity:0}}@keyframes hout{to{opacity:0}}
.hscroll{position:relative;width:min(400px,90vw);padding:22px 24px 16px;text-align:center;color:var(--ink);border-radius:2px;animation:unroll .4s cubic-bezier(.2,.8,.2,1);
  background:var(--vellum-tex),linear-gradient(180deg,var(--vel-hi),var(--vel));box-shadow:inset 0 0 0 1px rgba(43,33,24,.6),inset 0 0 50px rgba(130,80,30,.3),0 26px 60px rgba(0,0,0,.6)}
.hscroll::before,.hscroll::after{content:'';position:absolute;left:-8px;right:-8px;height:16px;border-radius:8px;background:linear-gradient(180deg,#e4cf9e,#a8884f 55%,#6c512a);box-shadow:0 3px 5px rgba(0,0,0,.5)}
.hscroll::before{top:-9px}.hscroll::after{bottom:-9px}
@keyframes unroll{from{transform:scaleY(.2);opacity:0}}
.hround{font-family:var(--f-head);font-size:20px;color:var(--rubric);letter-spacing:.02em}
.hart{width:76px;height:76px;margin:8px auto 2px;display:block}

.hnote{margin:6px 0;font-size:15px;font-weight:700;color:#7c1d12}
.hnext{margin-top:12px;padding-top:10px;border-top:1px solid rgba(43,33,24,.2);font-size:14.5px;color:var(--ink-2)}
.hnext span{display:block;font-family:var(--f-head);font-size:14px;color:var(--rubric)}.hnext b{font-family:var(--f-head);font-weight:400;font-size:19px;color:var(--ink)}.hnext em{display:block;font-style:normal}
.htap{margin-top:10px;font-size:13px;font-style:italic;color:var(--ink-3)}

    if (!this.on) return;

      case 'click': this.noise(0, 0.03, 0.05, 2500); break;
      case 'whoosh': this.noise(0, 0.18, 0.05, 1200); break;
      case 'crown': [523, 659, 784, 1047].forEach((f, i) => this.tone(f, i * 0.1, 0.45, 'triangle', 0.08)); break;
      case 'card': this.noise(0, 0.08, 0.07, 1800); this.tone(660, 0.02, 0.06, 'triangle', 0.04); break;
      case 'hit': this.noise(0, 0.12, 0.14, 700); this.tone(140, 0, 0.18, 'square', 0.06, -60); break;
      case 'wall': this.noise(0, 0.25, 0.12, 300, 'lowpass'); this.tone(90, 0, 0.3, 'sine', 0.2, -30); break;
      case 'heal': [523, 784].forEach((f, i) => this.tone(f, i * 0.07, 0.25, 'sine', 0.07)); break;
      case 'turn': this.tone(392, 0, 0.18, 'triangle', 0.07); this.tone(523, 0.12, 0.25, 'triangle', 0.07); break;
      case 'quill': this.noise(0, 0.09, 0.05, 3500); break;
      case 'coin': [1318, 1760].forEach((f, i) => this.tone(f, i * 0.06, 0.12, 'triangle', 0.06)); break;
      case 'bad': this.tone(196, 0, 0.18, 'sawtooth', 0.04, -40); break;
      case 'drum': [0, 0.18, 0.36, 0.48].forEach(t => { this.tone(70, t, 0.22, 'sine', 0.35, -30); this.noise(t, 0.08, 0.08, 400, 'lowpass'); }); break;
      case 'horn': this.tone(196, 0, 0.9, 'sawtooth', 0.05); this.tone(294, 0.05, 0.85, 'sawtooth', 0.035); this.tone(392, 0.5, 0.6, 'triangle', 0.04); break;
      case 'clash': for (let i = 0; i < 4; i++) { this.noise(i * 0.09, 0.12, 0.12, 3000); this.tone(1200 + i * 230, i * 0.09, 0.15, 'square', 0.02); } break;
      case 'age': [262, 330, 392, 523, 659].forEach((f, i) => this.tone(f, i * 0.12, 0.5, 'triangle', 0.08)); this.tone(131, 0, 1.2, 'sawtooth', 0.03); break;
      case 'win': [392, 523, 659, 784, 1046].forEach((f, i) => this.tone(f, i * 0.14, 0.6, 'triangle', 0.09)); break;

    }
  },
};

/* colour helpers */
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix(h1, h2, t) { const a = hexRgb(h1), b = hexRgb(h2); return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
function rgba(h, a) { const [r, g, b] = hexRgb(h); return `rgba(${r},${g},${b},${a})`; }
function tileURL(name, a, b) {
  const [w, h, inner] = MOTIF_TILES[name](a, b);
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='${w}' height='${h}' viewBox='0 0 ${w} ${h}'>${inner.replace(/"/g, "'")}</svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}
function installCivStyles() {
  let css = '';
  const add = (cls, color, motif) => {
    const light = mix(color, '#ffffff', 0.42), deep = mix(color, '#000000', 0.38);
    css += `.${cls}{--civ:${color};--civ-deep:${deep};--civ-light:${light};--civ-wash:${rgba(color, 0.12)};--motif:${tileURL(motif, rgba('#ffffff', 0.38), rgba('#ffffff', 0.08))};--motif-soft:${tileURL(motif, rgba(color, 0.2), 'none')};--motif-gold:${tileURL(motif, rgba('#f2cf73', 0.55), rgba('#f2cf73', 0.1))}}\n`;
  };
  for (const c of CIV_ORDER) add('civ-' + c, CIVS[c].color, CIV_MOTIF[c] || 'diaper');
  add('civ-merc', '#7a6542', 'brass');
  add('civ-neutral', '#6b5843', 'diaper');
  const el = document.createElement('style'); el.id = 'civ-styles'; el.textContent = css; document.head.appendChild(el);
}

<h2>${E ? esc(E.name) : 'A quiet start'}</h2>${E ? eventGlyphs(E.id, 32, 'hgl') : ''}<p class="heff">${E ? kw(E.text) : 'No event this round. Events begin next round.'}</p>${note ? `<p class="hnote">${kw(note)}</p>` : ''}
${N ? `<div class="hnext"><span>Next round</span><b>${esc(N.name)}${eventGlyphs(N.id, 20)}</b><em>${kw(N.text)}</em></div>` : ''}<div class="htap">Tap to continue</div></div>`;
    document.getElementById('app').appendChild(el);
    SFX.play('quill');

/* turns */
async function nextTurn() {
  UI.busy = true; UI.sel = null; renderMatch(); await wait(D(380)); await holdForOverlay();
  const round = S.round; endTurn(S);
  if (S.round !== round && S.winner == null) await roundStart();
  if (S.winner != null || !S.players[0].alive) return finish();
  if (S.turn === 0) return myTurnStart();
  return aiTurn();
}
async function roundStart() {
  UI.flipEvent = true; UI.eventSeen = S.round; renderMatch();
  const note = S.round >= 16 ? 'The war drags on: everyone lost 1 HP.' : S.round >= 14 ? `From round 16 everyone loses 1 HP each round.` : '';
  await herald(S.round, S.event, S.eventNext, note);
  await roundMoves(S.moves);
}
function myTurnStart() {
  UI.busy = false; UI.sel = null; renderMatch(); SFX.play('turn'); buzz(20);
  const me = S.players[0];
  coachEvent('turn');
  if (me.ageGiven && !me.aged && me.turns === RULES.ageTurn) { banner('The Imperial Age', 'Your Imperial Age card has arrived', 2000); coachEvent('agecard'); }
  if (!me.hand.length) nextTurn();
}
async function aiTurn() {
  const pid = S.turn, P = S.players[pid];
  renderMatch(); await wait(D(500));
  for (let guard = 0; guard < 30 && S.winner == null && S.turn === pid; guard++) {
    await holdForOverlay();
    const a = aiAct(S, pid);
    if (a.kind === 'buy') {
      const card = S.market[a.idx], el = document.querySelector(`.mk-item[data-mi="${a.idx}"]`), from = el ? el.getBoundingClientRect() : document.getElementById('stage').getBoundingClientRect();
      if (buy(S, pid, a.idx)) { SFX.play('coin'); renderMatch(); await animateBuy(card, pid, from); renderMatch(); await wait(D(200)); continue; }
    }
    if (a.kind === 'play') {
      const camp = document.getElementById('camp-' + pid), from = camp ? camp.getBoundingClientRect() : null;
      UI.view = S.players.map(p => p.hp);
      const ev = playCard(S, pid, a.uid, a.target);
      if (ev) { await animatePlay(ev, pid, from); if (S.winner != null || !S.players[0].alive) return finish(); if (S.plays > 0 && P.hand.length && P.alive) continue; }
      else UI.view = null;
    }
    break;
  }
  if (S.winner != null || !S.players[0].alive) return finish();
  return nextTurn();
}
function finish() {
  if (UI.finished) return; UI.finished = true; UI.busy = true; renderMatch();
  const me = S.players[0], win = S.winner === 0, r = SET.stats[me.civ] || [0, 0];
  if (!UI.lastSetup.tutorial) { r[1]++; if (win) r[0]++; SET.stats[me.civ] = r; }
  if (UI.tutorial) endTutorial();
  saveSettings();
  setTimeout(() => { SFX.play(win ? 'win' : 'lose'); resultsSheet(); }, D(700) + 400);
}
function toggleChronicle(force) { UI.drawer = force != null ? force : !UI.drawer; $('#chronicle').classList.toggle('open', UI.drawer); if (UI.drawer) renderChronicle(); }
function cycleSpeed() { SET.speed = SPEED_ORDER[(SPEED_ORDER.indexOf(SET.speed) + 1) % SPEED_ORDER.length]; saveSettings(); if (S) renderTopbar(); }

/* input */
document.addEventListener('click', e => {
  SFX.init();
  if (performance.now() - DRAG.droppedAt < 450 && e.target.closest('#hand, #stage, .camp')) return;   /* the click that follows a drop is not a tap */
  const act = e.target.closest('[data-act]'), touch = e.pointerType === 'touch' || matchMedia('(pointer: coarse)').matches;
  if (act) return action(act.dataset.act, act);
  const hire = e.target.closest('[data-hire]'); if (hire) { if (!hire.disabled) humanBuy(+hire.dataset.hire); return; }
  const cref = e.target.closest('[data-cref]'); if (cref) { const r = cref.dataset.cref; return cardSheet(staticCard(r), { hire: r.startsWith('mk:') ? +r.slice(3) : null }); }
  if (e.target.closest('#stage-card .card')) { const sel = isMyTurn() && selCard(), c = sel || (UI.last && UI.last.card); if (c) cardSheet(c, { hand: !!sel }); return; }
  const t = e.target.closest('.civ-tile, [data-n], [data-diff], [data-set], .relic-pick, .mk-item, #hand .card, .camp');
  if (!t) { if (e.target.id === 'sheet' && !$('#sheet').dataset.lock) closeSheet(); return; }
  if (t.classList.contains('civ-tile')) { UI.civ = t.dataset.civ; SET.civ = UI.civ; saveSettings(); SFX.play('click'); if (mobile()) { UI.selScroll = $('#screen-select').scrollTop; UI.selView = 'detail'; renderSelect(); $('#screen-select').scrollTop = 0; return; } return rerenderSelect(); }
  if (t.dataset.n) { UI.n = +t.dataset.n; SET.n = UI.n; saveSettings(); return rerenderSelect(); }
  if (t.dataset.diff) { SET.difficulty = t.dataset.diff; saveSettings(); return rerenderSelect(); }
  if (t.dataset.set) { const v = t.dataset.val; SET[t.dataset.set] = v === 'true' ? true : v === 'false' ? false : v; SFX.on = SET.sound; saveSettings(); settingsSheet(); if (S && UI.screen === 'match') renderTopbar(); return; }
  if (t.classList.contains('relic-pick')) { chooseRelic(S, 0, t.dataset.relic); return beginMatch(); }
  if (t.classList.contains('mk-item')) { if (t.classList.contains('can')) humanBuy(+t.dataset.mi); return; }
  if (t.matches('#hand .card')) return onHandCard(+t.dataset.uid);
  if (t.classList.contains('camp')) return onCamp(+t.dataset.pid, touch);
});
function action(a, el) {
  switch (a) {
    case 'tutorial': return newMatch({ civ: 'franks', n: 2, opps: ['japanese'], tutorial: true });
    case 'quick': return newMatch({ civ: UI.civ, n: UI.n });
    case 'choose': UI.selView = 'list'; return go('select');
    case 'menu': return go('menu');
    case 'start': return newMatch({ civ: UI.civ, n: UI.n });
    case 'again': return newMatch(UI.lastSetup.tutorial ? { civ: UI.civ, n: UI.n } : UI.lastSetup);
    case 'random-civ': UI.civ = CIV_ORDER[Math.floor(Math.random() * CIV_ORDER.length)]; SET.civ = UI.civ; saveSettings(); if (mobile()) { UI.selView = 'detail'; renderSelect(); $('#screen-select').scrollTop = 0; return; } return rerenderSelect();
    case 'sel-list': UI.selView = 'list'; renderSelect(); $('#screen-select').scrollTop = UI.selScroll || 0; return;
    case 'codex': closeSheet(); return openCodex('civs', { civ: S && UI.screen === 'match' ? S.players[0].civ : null });
    case 'rules': closeSheet(); return openCodex('rules');
    case 'codex-back': if (CODEX.tab === 'civs' && CODEX.civ) { CODEX.civ = null; return renderCodex(); } return closeCodex();
    case 'codex-close': return closeCodex();
    case 'codex-tab': CODEX.tab = el.dataset.tab; return renderCodex();
    case 'codex-civ': closeSheet(); return openCodex('civs', { civ: el.dataset.civ });
    case 'codex-play': closeCodex(); UI.civ = el.dataset.civ; SET.civ = UI.civ; saveSettings(); UI.selView = 'detail'; return go('select');
    case 'cx-filter': CODEX.filter = el.dataset.f; return renderCodex(true);
    case 'card-info': { const c = selCard(); if (c) cardSheet(c, { hand: true }); return; }
    case 'play-card': { const uid = +el.dataset.uid, c = S && S.players[0].hand.find(x => x.uid === uid); closeSheet(); if (!c || !isMyTurn()) return; UI.sel = uid; const t = selTarget(c); if (needsTarget(c) && t == null) { UI.hoverT = null; return renderSelection(); } return humanPlay(uid, t); }
    case 'hand-prev': return handStep(-1);
    case 'hand-next': return handStep(1);
    case 'settings': return settingsSheet();
    case 'tutorial-reset': SET.tutorialDone = false; saveSettings(); return settingsSheet();
    case 'pause': return pauseSheet();
    case 'help': return helpSheet();
    case 'close': closeSheet(); return UI.screen === 'menu' ? renderMenu() : null;
    case 'concede': UI.tutorial = null; $('#coach').classList.add('hidden'); return go('menu');
    case 'chronicle': return toggleChronicle();
    case 'speed': return cycleSpeed();
    case 'deck': return deckSheet('deck');
    case 'discard': return deckSheet('discard');
    case 'events': return mobileSheet('events');
    case 'market': return mobileSheet('market');
    case 'coach-next': return coachNext();
    case 'cancel-sel': return unselect();
    case 'play-sel': { const c = selCard(); if (!c) return; const t = selTarget(c); if (needsTarget(c) && t == null) return; return humanPlay(c.uid, t); }
    case 'coach-skip': return endTutorial();
  }
}
/* aiming with a mouse: the camp under the pointer becomes the target, and stays it until another camp is pointed at */
document.addEventListener('pointerover', e => {
  if (e.pointerType === 'touch' || DRAG.on || !aiming()) return;
  const camp = e.target.closest('.camp.targetable'); if (camp) setAimTarget(+camp.dataset.pid);
});
function rerenderSelect() { const l = $('.sel-list'), d = $('.sel-detail'), ly = l ? l.scrollTop : 0, dy = d ? d.scrollTop : 0, sy = $('#screen-select').scrollTop; renderSelect(); if ($('.sel-list')) $('.sel-list').scrollTop = ly; if ($('.sel-detail')) $('.sel-detail').scrollTop = dy; $('#screen-select').scrollTop = sy; }
document.addEventListener('keydown', e => {
  if (CODEX.open) { if (e.key === 'Escape') { if (!$('#sheet').classList.contains('hidden')) closeSheet(); else action('codex-back'); } return; }
  if (UI.screen !== 'match' || !S) return;
  const sheetOpen = !$('#sheet').classList.contains('hidden');
  if (e.key === 'Escape') { if (sheetOpen) { if (!$('#sheet').dataset.lock) closeSheet(); return; } if (UI.sel != null) return unselect(); return pauseSheet(); }
  if (sheetOpen) return;
  const k = e.key.toLowerCase();
  if (/^[1-9]$/.test(e.key)) { const c = S.players[0].hand[+e.key - 1]; if (c) onHandCard(c.uid); }
  else if (e.key === 'Enter' && UI.sel != null) { e.preventDefault(); action('play-sel'); }
  else if (k === 'i' && UI.sel != null) action('card-info');
  else if (k === 'c') action('codex');
  else if (e.key === 'Tab' && aiming()) { e.preventDefault(); const o = opponents(S, S.players[0]).map(p => p.id), i = o.indexOf(UI.hoverT); UI.hoverT = null; setAimTarget(o[(i + 1) % o.length]); clearAim(); }
  else if (k === 'l') toggleChronicle();
  else if (k === 's') cycleSpeed();
  else if (k === 'h') action('rules');
});
/* drag a card onto the chart, or onto an enemy camp, to play it — Photo Studio's model. Hold it a moment or pull it up to pick it
   up; a sideways swipe scrolls the hand. One ghost card, made once and moved on the GPU; where the drop zones are is measured
   once, when the card is picked up, and nothing on the table is rebuilt while it moves */
const DRAG = { uid: null, el: null, pid: null, mouse: false, x0: 0, y0: 0, lx: 0, ly: 0, hold: 0, on: false, back: false, ox: 0, oy: 0, w: 0, k: 0.8, zone: null, ok: false, t: null, droppedAt: 0 };
const TILT = -3 * Math.PI / 180;
function ghostAt(x, y) {
  /* the point where the card was grabbed stays under the pointer while the ghost tilts and shrinks about its corner */
  const k = DRAG.k, c = Math.cos(TILT), s = Math.sin(TILT), gx = DRAG.ox * k, gy = DRAG.oy * k;
  $('#drag-ghost').style.transform = `translate3d(${(x - (gx * c - gy * s)).toFixed(1)}px,${(y - (gx * s + gy * c)).toFixed(1)}px,0) rotate(-3deg) scale(${k})`;
}
function ghostTo(r, ms, ease) {
  const g = $('#drag-ghost'); g.style.transition = `transform ${ms}ms ${ease}`;
  g.style.transform = `translate3d(${r.left.toFixed(1)}px,${r.top.toFixed(1)}px,0) rotate(0deg) scale(${(r.width / DRAG.w).toFixed(4)})`;
  return wait(ms + 16);
}
function dropGhost() { const g = $('#drag-ghost'); g.classList.remove('on'); g.style.transition = ''; g.innerHTML = ''; }
/* where a dropped card settles: on the chart, over the copy already shown there if it is this card */
function landingRect(c) { const cur = $('#stage-card .card'); return cur && +cur.dataset.uid === c.uid ? cur.getBoundingClientRect() : stageRect(); }
function beginDrag(x, y) {
  clearTimeout(DRAG.hold);
  const c = S.players[0].hand.find(h => h.uid === DRAG.uid);
  if (!c || !isMyTurn() || !DRAG.el.isConnected) { DRAG.uid = null; return; }
  /* every position is read before anything is written: the card, and the drop zones (above the hand for most cards, the enemy
     camps when there is a choice of target) */
  const r = DRAG.el.getBoundingClientRect(), opps = opponents(S, S.players[0]), aim = needsTarget(c);
  DRAG.w = DRAG.el.offsetWidth; DRAG.ox = DRAG.x0 - r.left; DRAG.oy = DRAG.y0 - r.top;
  DRAG.zone = { top: $('#hand').getBoundingClientRect().top - 6, solo: aim && opps.length === 1 ? opps[0].id : null,
    camps: aim && opps.length > 1 ? opps.map(P => ({ pid: P.id, r: document.getElementById('camp-' + P.id).getBoundingClientRect() })) : null };
  DRAG.on = true; DRAG.ok = false; DRAG.t = null; UI.sel = c.uid; UI.hoverT = null;
  try { DRAG.el.setPointerCapture(DRAG.pid); } catch (_) { }
  /* the ghost: a copy of the card itself, tilted and a little smaller, rising off the hand */
  const g = $('#drag-ghost');
  g.innerHTML = DRAG.el.outerHTML;
  const gc = g.firstElementChild; gc.classList.remove('sel', 'playable', 'drag-src'); gc.removeAttribute('tabindex'); gc.removeAttribute('role'); gc.style.transformOrigin = `${DRAG.ox}px ${DRAG.oy}px`;
  g.style.transition = ''; ghostAt(x, y); g.classList.add('on');
  DRAG.el.classList.add('drag-src'); $('#stage').classList.add('holding');
  hideTip(); SFX.play('card'); buzz(12);
  later(() => { if (!DRAG.on) return; markHand(); renderAction(); renderPreview(); syncCampMarks(); coachEvent('select'); });
}
function dragMove(x, y) {
  ghostAt(x, y);
  const Z = DRAG.zone; let ok, t = null;
  if (Z.camps) { const hit = Z.camps.find(q => x >= q.r.left && x <= q.r.right && y >= q.r.top && y <= q.r.bottom); t = hit ? hit.pid : null; ok = t != null; }
  else { ok = y < Z.top; t = ok ? Z.solo : null; }
  if (ok === DRAG.ok && t === DRAG.t) return;
  DRAG.ok = ok; DRAG.t = t; UI.hoverT = t;
  $('#stage').classList.toggle('drop-ok', ok && !Z.camps);
  renderPreview(); syncCampMarks();
}
async function endDrag(x, y, cancelled) {
  const uid = UI.sel, c = S.players[0].hand.find(h => h.uid === uid);
  if (!cancelled) dragMove(x, y);
  const ok = !cancelled && DRAG.ok && c && (!needsTarget(c) || DRAG.t != null), t = DRAG.t;
  DRAG.on = false; DRAG.back = true; DRAG.droppedAt = performance.now();
  $('#stage').classList.remove('drop-ok', 'holding');
  if (ok) {
    /* it glides onto the chart and is played from there */
    UI.busy = true; buzz(14);
    await ghostTo(landingRect(c), 180, 'ease-out');
    DRAG.back = false;
    return humanPlay(uid, needsTarget(c) ? t : null, true);
  }
  /* anywhere else: it slides back into the hand and stays chosen */
  const src = document.querySelector(`#hand .card[data-uid="${uid}"]`);
  if (src) { const r = src.getBoundingClientRect(); await ghostTo({ left: r.left, top: r.top - 8, width: r.width }, 200, 'ease-in'); src.classList.remove('drag-src'); }
  dropGhost(); DRAG.back = false;
  renderSelection();
}
document.addEventListener('pointerdown', e => {
  if (DRAG.on || DRAG.back) return;
  const el = e.target.closest('#hand .card.playable'); if (!el || !isMyTurn() || e.button > 0) return;
  clearTimeout(DRAG.hold);
  Object.assign(DRAG, { uid: +el.dataset.uid, el, pid: e.pointerId, mouse: e.pointerType === 'mouse', x0: e.clientX, y0: e.clientY, lx: e.clientX, ly: e.clientY });
  if (!DRAG.mouse) DRAG.hold = setTimeout(() => { if (DRAG.uid != null && !DRAG.on) beginDrag(DRAG.lx, DRAG.ly); }, 240);
});
document.addEventListener('pointermove', e => {
  if (DRAG.uid == null || e.pointerId !== DRAG.pid) return;
  if (!DRAG.on) {
    /* a finger: a pull up (or down) of 10px picks the card up, a sideways move of 18px is a scroll; a mouse: any 6px move */
    DRAG.lx = e.clientX; DRAG.ly = e.clientY;
    const dx = e.clientX - DRAG.x0, dy = e.clientY - DRAG.y0;
    if (DRAG.mouse ? Math.hypot(dx, dy) > 6 : Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx) * 0.8) beginDrag(e.clientX, e.clientY);
    else if (Math.hypot(dx, dy) > 18) { clearTimeout(DRAG.hold); DRAG.uid = null; }
    return;
  }
  e.preventDefault(); dragMove(e.clientX, e.clientY);
}, { passive: false });
document.addEventListener('pointerup', e => { if (e.pointerId !== DRAG.pid) return; clearTimeout(DRAG.hold); if (DRAG.on) endDrag(e.clientX, e.clientY); DRAG.uid = null; });
document.addEventListener('pointercancel', e => { if (e.pointerId !== DRAG.pid) return; clearTimeout(DRAG.hold); if (DRAG.on) endDrag(0, 0, true); DRAG.uid = null; });
/* while a card is held the page never scrolls under it (only gestures that start on the hand can hold a card) */
$('#hand').addEventListener('touchmove', e => { if (DRAG.on) e.preventDefault(); }, { passive: false });
document.addEventListener('contextmenu', e => { if (e.target.closest('#hand .card')) e.preventDefault(); });
/* the hand row: a mouse wheel scrolls it sideways when it is wider than its space, and the arrows follow the scroll */
$('#hand').addEventListener('wheel', e => { const h = e.currentTarget; if (mobile() || h.scrollWidth <= h.clientWidth + 2 || Math.abs(e.deltaX) >= Math.abs(e.deltaY)) return; e.preventDefault(); h.scrollLeft += e.deltaY; }, { passive: false });
$('#hand').addEventListener('scroll', () => { if (!mobile()) handNav(); }, { passive: true });

addEventListener('resize', () => { updateMode(); if (UI.screen === 'match' && S && !UI.busy) renderMatch(); else if (UI.screen === 'menu') renderMenu(); });
UI.selView = 'list';
updateMode(); installCivStyles(); installMaterials(); installTableArt(); installSymbolSprites(); go('menu');

</script>
