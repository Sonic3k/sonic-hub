<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Medieval Mayhem — Sonic Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;700;800&family=Grenze+Gotisch:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--parch:#f4e8cb;--parch2:#e8d5aa;--ink:#2a1c11;--muted:#7a6248;--gold:#d4a23a;--line:rgba(42,28,17,.25);--serif:'Alegreya',Georgia,serif;--goth:'Grenze Gotisch','Alegreya',Georgia,serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--serif);color:var(--parch);background:#1a0f08 radial-gradient(ellipse at 50% 25%,#4a2c1a 0%,#24150c 60%,#140b06 100%) fixed}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;background:repeating-linear-gradient(92deg,rgba(255,255,255,.018) 0 2px,transparent 2px 9px),repeating-linear-gradient(88deg,rgba(0,0,0,.05) 0 1px,transparent 1px 13px)}
.top{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid rgba(212,162,58,.25);background:rgba(0,0,0,.25);position:relative;z-index:2}
.top a{color:var(--parch2);text-decoration:none;font-size:14px;opacity:.8}
.top h1{font-family:var(--goth);font-weight:800;font-size:24px;margin:0;color:var(--gold);flex:1}
.btn{font-family:var(--serif);font-weight:700;font-size:14px;padding:7px 14px;border-radius:8px;border:1px solid #8a6a2a;background:linear-gradient(#e7c66b,#b98a2c);color:#2a1a08;cursor:pointer;box-shadow:0 2px 0 #5a4010,0 3px 8px rgba(0,0,0,.3)}
.btn:hover{filter:brightness(1.06)}.btn.ghost{background:transparent;color:var(--parch2);border-color:rgba(232,213,170,.35);box-shadow:none}
.btn.big{font-size:18px;padding:11px 26px}.top .btn{font-size:13px;padding:5px 10px}
.hidden{display:none!important}
#setup{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
.hero{text-align:center;margin:6px 0 16px}
.hero h1{font-family:var(--goth);font-size:clamp(38px,6vw,64px);margin:0;color:var(--gold);text-shadow:0 2px 0 #3a2208,0 6px 24px rgba(0,0,0,.5)}
.hero p{margin:4px auto 0;max-width:620px;color:var(--parch2);font-size:17px}
.setup-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;align-items:start}
.pick,.detail{background:linear-gradient(#f6ebcf,#ead8ad);color:var(--ink);border-radius:12px;padding:14px 16px;box-shadow:0 0 0 1px #5a3a1a,0 10px 30px rgba(0,0,0,.45)}
.seg{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}.seg span{font-weight:700;margin-right:6px}
.seg button{font-family:var(--serif);font-size:14px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:#fff8e6;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--parch);border-color:var(--ink)}
.grp h4,.detail h4{margin:10px 0 6px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 5px;border-radius:22px;border:1px solid var(--line);background:#fffaf0;cursor:pointer;font-family:var(--serif);font-size:15px;color:var(--ink)}
.tile em{font-style:normal;font-size:12px;color:var(--muted);background:rgba(0,0,0,.06);border-radius:8px;padding:0 6px}
.tile.on{border-color:var(--civ);box-shadow:0 0 0 2px var(--civ) inset;background:#fff}
.detail{position:sticky;top:12px;border-top:6px solid var(--civ)}
.d-head{display:flex;gap:12px;align-items:center}.d-head h2{margin:0;font-family:var(--goth);font-size:34px;color:var(--civ)}.d-head p{margin:2px 0}.d-hp b{font-size:20px}
.d-uniques{display:flex;gap:12px;flex-wrap:wrap;padding:6px 0 4px 6px}
.d-mix{display:flex;flex-wrap:wrap;gap:8px}.d-mix span{display:inline-flex;align-items:center;gap:3px;font-size:14px}
.d-opp{color:var(--muted);font-size:14px}
.d-actions{display:flex;gap:10px;align-items:center;margin-top:10px}.d-actions .btn.ghost,.row .btn.ghost{color:var(--ink);border-color:var(--line)}
.card{position:relative;width:128px;min-height:176px;border-radius:10px;background:linear-gradient(170deg,#fffaf0,#f1e2bd 70%,#e6d09f);color:var(--ink);box-shadow:0 0 0 1px rgba(0,0,0,.35),0 0 0 3px var(--civ),0 6px 14px rgba(0,0,0,.4);display:flex;flex-direction:column;flex:0 0 auto;user-select:none}
.card.unique{background:linear-gradient(170deg,#fff6dc,#f3dc9e 70%,#e3c473);box-shadow:0 0 0 1px rgba(0,0,0,.35),0 0 0 3px var(--civ),0 0 0 5px #d4a23a,0 6px 14px rgba(0,0,0,.4)}
.card.merc{box-shadow:0 0 0 1px rgba(0,0,0,.35),0 0 0 3px #8a7350,0 6px 14px rgba(0,0,0,.4)}
.c-head{display:flex;align-items:center;gap:4px;padding:5px 6px 4px;background:var(--civ);color:#fff;border-radius:9px 9px 0 0;min-height:30px}
.c-name{font-weight:800;font-size:13px;line-height:1.05;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.c-syms{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;padding:8px 4px 4px}
.c-text{font-size:11.5px;line-height:1.22;padding:2px 7px 8px;color:#3d2c1c;text-align:center}
.c-star{position:absolute;top:-8px;right:-6px;width:20px;height:20px;border-radius:50%;background:#d4a23a;color:#3a2208;font-size:12px;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.c-cost{position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);height:22px;padding:0 10px;border-radius:11px;background:#7d6a4a;color:#fff;font-weight:800;font-size:12.5px;display:flex;align-items:center;white-space:nowrap;box-shadow:0 0 0 2px #f4e8cb,0 2px 4px rgba(0,0,0,.5)}.c-cost.ok{background:#c8961e}
.card.empty{display:grid;place-items:center;color:var(--muted);--civ:#5a4a35;font-style:italic}
.card.big{width:168px;min-height:220px}.card.big .c-name{font-size:15px}.card.big .c-text{font-size:13px}
.card.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:translateY(26px) scale(.7) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
.d-uniques .card{width:150px}
#game{display:grid;grid-template-columns:minmax(0,1fr) 230px;grid-template-areas:"opps chron" "mid chron" "mine chron" "hand hand";gap:10px;padding:10px 14px 14px;max-width:1400px;margin:0 auto}
.opps{grid-area:opps;display:grid;gap:10px}.opps.n1{grid-template-columns:minmax(0,560px);justify-content:center}.opps.n2{grid-template-columns:repeat(2,minmax(0,1fr))}.opps.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.seat{position:relative;background:linear-gradient(#f5e9cc,#e7d3a6);color:var(--ink);border-radius:12px;padding:8px 10px;box-shadow:0 0 0 1px #4a2e14,0 8px 20px rgba(0,0,0,.4);border-left:6px solid var(--civ);transition:box-shadow .2s,transform .2s}
.seat.turn{box-shadow:0 0 0 2px var(--gold),0 0 22px rgba(212,162,58,.55),0 8px 20px rgba(0,0,0,.4)}
.seat.out{filter:grayscale(.85) brightness(.75)}
.seat.targetable{cursor:crosshair;box-shadow:0 0 0 3px #e0442f,0 0 24px rgba(224,68,47,.6);animation:pulse 1s infinite alternate}
@keyframes pulse{to{transform:translateY(-3px)}}
.seat.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.s-top{display:flex;align-items:center;gap:8px}
.s-id{flex:1;min-width:0}.s-name{font-weight:800;font-size:17px;color:var(--civ);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.s-sub{font-size:12.5px;color:var(--muted)}
.s-hp{text-align:right;min-width:74px}.s-hp b{font-size:30px;line-height:1;color:#7e1d14;font-family:var(--goth)}.s-hp small{color:var(--muted);font-size:13px}
.hpbar{height:5px;background:rgba(0,0,0,.12);border-radius:3px;margin-top:3px;overflow:hidden}.hpbar div{height:100%;background:linear-gradient(90deg,#b3261e,#e0563f);transition:width .4s}
.s-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px;font-size:13px;min-height:22px}
.gold{display:inline-flex;align-items:center;gap:3px}.gold b{font-size:15px}
.backs{display:inline-flex;align-items:center}.backs i{width:11px;height:16px;border-radius:2px;background:linear-gradient(135deg,#7a2e1d,#4a1a10);border:1px solid #d4a23a;margin-right:-4px}.backs em{font-style:normal;margin-left:8px;color:var(--muted)}
.tok{display:inline-flex;align-items:center;gap:3px;font-size:12px;background:rgba(0,0,0,.06);border-radius:10px;padding:1px 7px 1px 2px}.tok.hot{background:#1f4e79;color:#fff;padding:1px 8px}
.turn-tag,.out-tag{margin-left:auto;font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:1px 8px;border-radius:8px;font-weight:800}.turn-tag{background:var(--gold);color:#2a1a08}.out-tag{background:#333;color:#fff}
.s-structs{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;min-height:26px}.s-structs .none{font-size:12px;color:var(--muted);font-style:italic;align-self:center}
.st{display:inline-flex;align-items:center;gap:4px;background:#fff8e6;border:1px solid #9a8a6a;border-radius:6px;padding:2px 7px 2px 3px;font-size:12px;box-shadow:0 2px 0 #9a8a6a}
.st b{font-size:15px}.st i{font-size:10.5px;color:var(--muted)}
.st.wonder{background:linear-gradient(#ffe9a8,#e7c25a);border-color:#8a6a1a;padding:2px 8px}.st.wonder i{color:#5a3a08;font-weight:700}
.floats{position:absolute;inset:0;pointer-events:none;display:flex;justify-content:center;align-items:center;z-index:5}
.float{position:absolute;font-family:var(--goth);font-size:28px;font-weight:800;animation:floatup 1.6s ease-out forwards;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 10px rgba(255,255,255,.6);white-space:nowrap}
.float.dmg{color:#c2261a}.float.heal{color:#2e7d32}.float.wall{color:#3d4f6b;font-size:22px}.float.gold{color:#a87a10;font-size:20px}.float.info{color:#5b2a86;font-size:20px}.float.big{font-size:38px}
@keyframes floatup{0%{transform:translateY(10px) scale(.7);opacity:0}15%{transform:translateY(0) scale(1.1);opacity:1}100%{transform:translateY(-46px) scale(1);opacity:0}}
.mid{grid-area:mid;display:grid;grid-template-columns:210px minmax(0,1fr) auto;gap:10px;align-items:stretch}
#events{display:flex;flex-direction:column;gap:6px}
.ev-now,.ev-next{background:rgba(244,232,203,.95);color:var(--ink);border-radius:10px;padding:7px 10px;box-shadow:0 0 0 1px #4a2e14}
.ev-now{border-top:4px solid #a3261c}.ev-next{opacity:.85;border-top:4px solid #56657d}
.ev-now small,.ev-next small{display:block;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}.ev-now b,.ev-next b{font-size:16px}.ev-now p,.ev-next p{margin:2px 0 0;font-size:12.5px;line-height:1.25}
.ev-warn{font-size:12px;background:#7e1d14;color:#fff;border-radius:8px;padding:4px 8px}
#arena{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:250px;border-radius:16px;background:radial-gradient(ellipse at center,rgba(244,232,203,.12),rgba(0,0,0,.18) 70%);box-shadow:inset 0 0 0 1px rgba(212,162,58,.25)}
.played-by{font-weight:700;color:var(--parch);font-size:15px;text-shadow:0 1px 0 #000}.arena-hint{color:var(--parch2);opacity:.7;font-style:italic}
#market{background:rgba(0,0,0,.25);border-radius:12px;padding:6px 10px 8px;box-shadow:inset 0 0 0 1px rgba(212,162,58,.25)}
#market h3,.chronbox h3{margin:0 0 8px;font-family:var(--goth);color:var(--gold);font-size:20px;font-weight:600}
.m-cards{display:flex;gap:10px;padding:6px 4px 14px 6px}.m-cards .c-text{padding-bottom:16px}.me-mini{display:none}
.kw{font-weight:800}.k-dmg{color:#b3261e}.k-hp{color:#23772f}.k-gold{color:#9a6a00}.k-card{color:#3646a8}.k-wall{color:#475a75}.k-play{color:#6a3fb0}.k-aoe{color:#c94a12}.k-pierce{color:#0f6b52}.k-steal{color:#a3306d}.k-raze{color:#7a4a20}
#chron .k-gold,#status .k-gold,.m-note .k-gold{color:#f0c050}#status .k-hp{color:#8fd694}#status .k-wall{color:#b8c7dc}
.legend-key{font-size:14px;line-height:1.7}
.card.imperial{background:linear-gradient(170deg,#fbf4ff,#ecdcf4 70%,#dcc3ea);box-shadow:0 0 0 1px rgba(0,0,0,.35),0 0 0 3px var(--civ),0 0 0 5px #6a3fb0,0 6px 14px rgba(0,0,0,.4)}
.c-imp{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#6a3fb0;color:#fff;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:1px 8px;border-radius:8px;font-weight:800;box-shadow:0 1px 3px rgba(0,0,0,.5);white-space:nowrap}
.card.agecard{background:radial-gradient(circle at 50% 30%,#fff6cf,#f2d27a 58%,#d9a83f);box-shadow:0 0 0 1px rgba(0,0,0,.35),0 0 0 3px #8a6a1a,0 0 20px rgba(242,201,76,.75),0 6px 14px rgba(0,0,0,.4)}
.card.agecard .c-head{background:linear-gradient(90deg,#5a2f9c,#8a5ac9)}.card.agecard .c-text{color:#3a2408}
.imp-tag svg{vertical-align:-3px}.tok.imp{background:#6a3fb0}.d-bonus{margin:0 0 8px;font-size:14px}.m-cards .card{width:112px;min-height:160px}.m-cards .c-text{font-size:10.5px}
.card.buyable{cursor:pointer;transition:transform .15s}.card.buyable:hover{transform:translateY(-4px)}
.m-note{margin:8px 0 0;font-size:12px;color:var(--parch2);opacity:.85;max-width:360px}
#mine{grid-area:mine}#mine .seat{padding:8px 12px}
.handbar{grid-area:hand}#status{text-align:center;font-weight:700;color:var(--gold);min-height:30px;font-size:17px;display:flex;justify-content:center;align-items:center;gap:10px}
#hand{display:flex;gap:12px;justify-content:center;padding:14px 8px 8px;overflow-x:auto;min-height:200px}
#hand .card{transition:transform .15s,box-shadow .15s}#hand .card.playable{cursor:pointer}#hand .card.playable:hover{transform:translateY(-10px) rotate(-1deg)}
#hand .card.chosen{transform:translateY(-14px);box-shadow:0 0 0 1px rgba(0,0,0,.35),0 0 0 3px #e0442f,0 0 20px rgba(224,68,47,.7)}
#hand .card:not(.playable){filter:saturate(.75) brightness(.92)}
.hand-empty{color:var(--parch2);opacity:.7;font-style:italic;align-self:center}
.chronbox{grid-area:chron;background:rgba(0,0,0,.25);border-radius:12px;padding:8px 12px;box-shadow:inset 0 0 0 1px rgba(212,162,58,.2);align-self:start}
#chron{list-style:none;margin:0;padding:0;font-size:13px;line-height:1.3}#chron li{padding:4px 0;border-bottom:1px dashed rgba(232,213,170,.18);color:var(--parch2)}#chron li:first-child{color:#fff}
#banner{position:fixed;left:50%;top:22%;transform:translateX(-50%);pointer-events:none;text-align:center;opacity:0;z-index:20;width:min(90vw,700px)}
#banner .bt{display:block;font-family:var(--goth);font-size:clamp(30px,5vw,52px);color:var(--gold);text-shadow:0 3px 0 #2a1a08,0 0 30px rgba(0,0,0,.8)}#banner span{display:block;color:#fff;font-size:17px;text-shadow:0 2px 6px #000;margin-top:4px}#banner .kw{color:#ffd76a}
#banner.show{animation:bannerIn 2.4s ease-out}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,10px)}12%{opacity:1;transform:translate(-50%,0)}75%{opacity:1}100%{opacity:0}}
.modal{position:fixed;inset:0;background:rgba(10,5,2,.72);display:grid;place-items:center;z-index:30;padding:16px}
.sheet{max-width:720px;width:100%;max-height:88vh;overflow:auto;background:linear-gradient(#f7ecd2,#ead7ab);color:var(--ink);border-radius:14px;padding:18px 22px;box-shadow:0 0 0 1px #4a2e14,0 20px 60px rgba(0,0,0,.6)}
.sheet h2{font-family:var(--goth);font-size:32px;margin:0 0 6px;color:#7e1d14}
.muted{color:var(--muted)}.small{font-size:13px}
.relics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.relic{text-align:left;font-family:var(--serif);cursor:pointer;border-radius:12px;border:1px solid #8a6a2a;background:linear-gradient(#fff8e2,#f0d896);padding:12px;color:var(--ink);box-shadow:0 3px 0 #8a6a2a}.relic:hover{transform:translateY(-3px)}
.relic b{display:block;font-size:18px;color:#7e1d14}.relic span{font-size:14px}
.legend{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px;margin:10px 0}.legend div{display:grid;grid-template-columns:30px auto;column-gap:6px;font-size:13.5px}.legend b{align-self:center}.legend span{grid-column:2;color:#4a3826}
.row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.end{text-align:center}.end h2{font-size:46px}.end.win h2{color:#a87a10}.stats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:14px;color:#4a3826}.stats b{font-size:18px;color:var(--ink)}
@media (max-width:980px){#game{grid-template-columns:minmax(0,1fr);grid-template-areas:"opps" "mid" "mine" "hand" "chron"}.mid{grid-template-columns:1fr}#events{flex-direction:row;flex-wrap:wrap}.ev-now,.ev-next{flex:1 1 200px}#arena{min-height:200px}.m-cards{overflow-x:auto;padding-bottom:6px}.setup-grid{grid-template-columns:1fr}.detail{position:static}}
@media (max-width:640px){
.top{padding:6px 10px;gap:6px}.top h1{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.top a{display:none}.top .btn{font-size:12px;padding:4px 7px}
#game{padding:6px 6px 0;gap:6px}
.opps.n2{grid-template-columns:1fr 1fr}.opps.n3{grid-template-columns:1fr 1fr 1fr}.opps{gap:6px}
.seat{padding:5px 6px;border-left-width:4px;border-radius:9px}.s-top{gap:4px}.s-top .crest{width:24px;height:24px}.s-sub{display:none}.s-name{font-size:13px}
.s-hp{min-width:0}.s-hp b{font-size:21px}.s-hp small{font-size:11px}.s-row{gap:4px;margin-top:2px;font-size:11px;min-height:18px}.backs i{display:none}.backs em{margin-left:2px}.backs em::before{content:'🂠 '}
.turn-tag,.out-tag{font-size:9px;padding:0 5px;letter-spacing:.5px}.tok{font-size:10px}.tok svg{display:none}
.s-structs{gap:3px;margin-top:3px;min-height:18px}.st{padding:1px 4px 1px 2px;font-size:11px}.st span,.st i{display:none}.st b{font-size:13px}.st svg{width:13px;height:13px}.s-structs .none{font-size:10.5px}
.opps.n2 .hp-u,.opps.n3 .hp-u{display:none}.opps.n1 .s-sub,#mine .s-sub{display:block}.opps.n1 .s-top .crest,#mine .s-top .crest{width:34px;height:34px}.opps.n1 .st span,#mine .st span{display:inline}
#events{gap:6px}.ev-now,.ev-next{padding:5px 8px;flex-basis:140px}.ev-now b,.ev-next b{font-size:14px}.ev-now p,.ev-next p{font-size:11.5px}
#arena{min-height:0;padding:6px 0}.card.big{width:118px;min-height:150px}.card.big .c-name{font-size:12.5px}.card.big .c-text{font-size:10.5px}
#market{padding:4px 8px 4px}#market h3{font-size:17px;margin:0 0 2px}.m-cards .card{width:100px;min-height:138px}.m-note{font-size:11px;margin-top:2px}
.handbar{position:sticky;bottom:0;z-index:12;margin:0 -6px;padding:4px 6px calc(6px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(20,11,6,0),rgba(20,11,6,.97) 22%)}
#status{font-size:14px;min-height:22px;flex-wrap:wrap;gap:2px 10px}.me-mini{display:inline;color:var(--parch);font-weight:500;font-size:13px}#hand{justify-content:flex-start;gap:8px;padding:10px 4px 4px;min-height:0}
.card{width:106px;min-height:150px}.c-name{font-size:12px}.c-text{font-size:10.5px}.c-syms svg{width:24px;height:24px}
.chronbox{margin-bottom:10px}.relics,.legend{grid-template-columns:1fr}.sheet{padding:14px}
}
</style>

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
function rnd(S) {
  let t = (S.rs = (S.rs + 0x6D2B79F5) >>> 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const pick = (S, arr) => arr[Math.floor(rnd(S) * arr.length)];
function wpick(S, entries) {
  let tot = 0; for (const e of entries) tot += Math.max(0, e[1]);
  if (tot <= 0) return entries[0][0];
  let r = rnd(S) * tot;
  for (const e of entries) { r -= Math.max(0, e[1]); if (r <= 0) return e[0]; }
  return entries[entries.length - 1][0];
}
function shuffled(S, arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd(S) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ── Engine: draw 1, play 1; symbols do the rest ── */
function cardFromIcons(icons) {
  const steps = []; let wall = 0;
  for (const ch of icons) { if (ch === 'W') wall++; else for (const s of SYM[ch].steps) steps.push({ ...s }); }
  return { steps, wall };
}
function makeCard(S, base) { return { uid: S.nextUid++, ...base }; }
function buildDeck(S, civ) {
  const C = CIVS[civ], out = [];
  for (const tok of C.deck.split(/\s+/)) {
    if (tok[0] === '+') {
      const id = tok.slice(1), U = UNIQUE[id];
      const fromIcons = U.steps ? { steps: U.steps.map(s => ({ ...s })), wall: U.wall || 0 } : { steps: [], wall: U.wall || 0 };
      out.push(makeCard(S, { name: U.name, icons: U.icons, text: U.text, civ, unique: id, steps: fromIcons.steps, wall: fromIcons.wall, kind: U.kind || (U.wonder ? 'wonder' : null), wonder: !!U.wonder }));
    } else {
      const m = tok.match(/^([A-Z]+)(\d+)$/);
      for (let k = 0; k < +m[2]; k++) { const c = cardFromIcons(m[1]); out.push(makeCard(S, { name: COMMON_NAMES[m[1]] || SYM[m[1][0]].name, icons: m[1], civ, steps: c.steps, wall: c.wall })); }
    }
  }
  return out;
}
function buildMercs(S) {
  const out = [];
  for (const M of MERCS) for (let k = 0; k < M.n; k++) {
    const c = M.steps ? { steps: M.steps.map(s => ({ ...s })), wall: (M.icons.match(/W/g) || []).length } : cardFromIcons(M.icons);
    out.push(makeCard(S, { name: M.name, icons: M.icons, text: M.text, civ: 'merc', merc: M.id, cost: M.cost, steps: c.steps, wall: c.wall }));
  }
  return shuffled(S, out);
}

function newGame(o) {

  S.duel = o.civs.length === 2;

  S.mercs = buildMercs(S);
  S.market = [0, 1, 2].map(() => S.mercs.pop() || null);

const SFX = {
  ctx: null, on: true,
  init() { if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; } try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); } catch (e) { } },

  },

    if (!this.on) return;

      case 'click': this.noise(0, 0.03, 0.05, 2500); break;
      case 'card': this.noise(0, 0.08, 0.07, 1800); this.tone(660, 0.02, 0.06, 'triangle', 0.04); break;
      case 'hit': this.noise(0, 0.12, 0.14, 700); this.tone(140, 0, 0.18, 'square', 0.06, -60); break;
      case 'wall': this.noise(0, 0.25, 0.12, 300, 'lowpass'); this.tone(90, 0, 0.3, 'sine', 0.2, -30); break;
      case 'heal': [523, 784].forEach((f, i) => this.tone(f, i * 0.07, 0.25, 'sine', 0.07)); break;
      case 'turn': this.tone(392, 0, 0.18, 'triangle', 0.07); this.tone(523, 0.12, 0.25, 'triangle', 0.07); break;
      case 'quill': this.noise(0, 0.09, 0.05, 3500); break;
      case 'coin': [1318, 1760].forEach((f, i) => this.tone(f, i * 0.06, 0.12, 'triangle', 0.06)); break;
      case 'bad': this.tone(196, 0, 0.18, 'sawtooth', 0.04, -40); break;
      case 'drum': [0, 0.18, 0.36, 0.48].forEach(t => { this.tone(70, t, 0.22, 'sine', 0.35, -30); this.noise(t, 0.08, 0.08, 400, 'lowpass'); }); break;

      case 'win': [392, 523, 659, 784, 1046].forEach((f, i) => this.tone(f, i * 0.14, 0.6, 'triangle', 0.09)); break;

    }
  },
};

  $('#arena').innerHTML = lp ? `<div class="played-by">${esc(civName(lp.pid))}${lp.target != null ? ' ▸ ' + esc(civObj(lp.target)) : ''}</div>${cardHTML(lp.card, { cls: 'big pop' })}` : `<div class="arena-hint">${S.turn === 0 ? 'Pick a card from your hand' : ''}</div>`;
  $('#market').innerHTML = `<h3>Mercenary Market</h3><div class="m-cards">${S.market.map((c, i) => { if (!c) return '<div class="card empty">Sold out</div>'; const cost = marketCost(S, me, c), ok = myTurn && !S.flags.bought && me.gold >= cost; return cardHTML(c, { small: 1, cost, afford: ok, attrs: `data-mi="${i}"`, cls: ok ? 'buyable' : '' }); }).join('')}</div>
    <p class="m-note">${S.flags.bought && S.turn === 0 ? 'Already hired this turn' : 'Hire 1 card per turn with <b class="kw k-gold">gold</b>; it goes straight to your hand'}${S.mod.fair ? ' · Great Fair: 1 cheaper' : ''}${S.flags.buyFree && S.turn === 0 ? ' · this hire is free' : ''}</p>`;
  $('#hand').innerHTML = me.hand.map(c => cardHTML(c, { cls: myTurn ? 'playable' + (UI.targeting === c.uid ? ' chosen' : '') : '' })).join('') || '<div class="hand-empty">No cards in hand</div>';
  const mini = `<span class="me-mini"><b class="kw k-hp">${me.hp}/${me.maxHP} HP</b> · <b class="kw k-gold">${me.gold} gold</b>${walls(me).length ? ` · <b class="kw k-wall">${wallTotal(me)} walls</b>` : ''}</span>`;
  $('#status').innerHTML = mini + (S.winner != null ? '' : UI.targeting ? 'Choose an opponent to target <button class="btn ghost" id="cancelTarget">Cancel</button>' : myTurn ? `Your turn${S.plays > 1 ? ` · ${S.plays} plays left` : ''}` : `${esc(civName(S.turn))} is playing…`);
  $('#chron').innerHTML = S.log.slice(-9).reverse().map(e => `<li>${logLine(e)}</li>`).join('');
}
function logLine(e) {
  switch (e.k) {
    case 'play': return `${esc(civName(e.pid))} ▸ <b>${esc(e.card)}</b>${e.target != null ? ' → ' + esc(civObj(e.target)) : ''}`;
    case 'buy': return `${esc(civName(e.pid))} hired <b>${esc(e.card)}</b> for <b class="kw k-gold">${e.cost} gold</b>`;
    case 'event': return `Round ${e.round}: <b>${esc(EVENT_BY[e.id].name)}</b>`;
    case 'out': return `<b>${esc(civName(e.pid))}</b> ${e.pid === 0 ? 'were' : 'is'} defeated`;
    case 'hich': return `${esc(civName(e.pid))} in danger: drew 2 extra cards`;
    case 'banner': return `The Holy Banner raised ${esc(civObj(e.pid))} again`;
    case 'fatigue': return `${esc(civName(e.pid))} reshuffled the deck: exhausted, −1 HP`;
    case 'wonder': return `<b>${esc(civName(e.pid))}</b> completed ${esc(e.name)}`;
    case 'attrition': return 'The war drags on: everyone −1 HP';
    case 'agecard': return e.pid === 0 ? 'The <b>Imperial Age</b> card is in your hand' : `${esc(civName(e.pid))} can now reach the Imperial Age`;
    case 'aged': return `<b>${esc(civName(e.pid))}</b> ${e.pid === 0 ? 'advance' : 'advances'} to the Imperial Age`;
  }
  return '';
}
const FX_TEXT = {
  hp: f => (f.n < 0 ? ['−' + -f.n, 'dmg'] : ['+' + f.n, 'heal']), wall: f => [`−${f.n} wall`, 'wall'], razed: f => [`${f.name} falls`, 'wall'],
  camel: () => ['Camels block!', 'info'], immune: () => ['Divine Wind!', 'info'], shroud: () => ['Mantle −1', 'info'], trap: () => ['Stakes!', 'dmg'],
  thorns: () => ['Spikes!', 'dmg'], steal: () => ['Card stolen', 'info'], convert: f => [`Lost ${f.name}`, 'info'], gold: f => [`+${f.n} gold`, 'gold'],
  out: () => ['Defeated!', 'dmg big'], hich: () => ['In danger: +2 cards', 'heal'], banner: () => ['Holy Banner!', 'heal'], wonderhit: f => [`Wonder ${f.left}`, 'wall'],
  discard: () => ['−1 card', 'info'], rained: () => ['Monsoon: no building', 'info'], age: () => ['Imperial Age!', 'gold big'], tribute: () => ['−1 gold', 'gold'],
};
function floatText(pid, text, cls, delay) {
  setTimeout(() => {
    const box = document.querySelector(`#seat-${pid} .floats`); if (!box) return;
    const d = document.createElement('div'); d.className = 'float ' + cls; d.textContent = text; box.appendChild(d);
    setTimeout(() => d.remove(), 1700);
  }, delay);
}
function showFx(fx) {
  let t = 0; const snd = new Set();
  for (const f of fx) {
    const m = FX_TEXT[f.k]; if (!m) continue;
    const [text, cls] = m(f);
    floatText(f.t, text, cls, t); t += 140;
    if (f.k === 'hp') snd.add(f.n < 0 ? 'hit' : 'heal'); else if (f.k === 'wall' || f.k === 'razed' || f.k === 'wonderhit') snd.add('wall');
    if (f.k === 'hp' && f.n < 0) { const el = document.querySelector(`#seat-${f.t}`); if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); } }
  }
  [...snd].forEach((s, i) => setTimeout(() => SFX.play(s), 120 + i * 90));
}
function banner(text, sub) {
  const b = $('#banner'); b.innerHTML = `<div class="bt">${esc(text)}</div>${sub ? `<span>${kw(sub)}</span>` : ''}`;
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
}

/* ── Flow: setup → relic → turns → end ── */
let S = null;
const UI = { n: 2, civ: 'daiviet', targeting: null, busy: false, last: null, round: 1 };
const STORE = 'civclash.v2';
const prefs = (() => { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { return {}; } })();
function savePrefs() { try { localStorage.setItem(STORE, JSON.stringify(prefs)); } catch (e) { } }
if (prefs.n) UI.n = prefs.n; if (prefs.civ && CIVS[prefs.civ]) UI.civ = prefs.civ; if (prefs.sound === false) SFX.on = false;
function modal(html) { const m = $('#modal'); m.innerHTML = `<div class="sheet">${html}</div>`; m.classList.remove('hidden'); }
function closeModal() { $('#modal').classList.add('hidden'); $('#modal').innerHTML = ''; }
function deckMix(civ) {
  const cnt = {};
  for (const c of buildDeck({ nextUid: 1 }, civ)) for (const ch of c.icons) cnt[ch] = (cnt[ch] || 0) + 1;
  return Object.entries(cnt).sort((a, b) => b[1] - a[1]);
}
function renderSetup() {
  const hp = c => (UI.n === 2 ? CIVS[c].hp2 : CIVS[c].hp4), C = CIVS[UI.civ], rec = (prefs.wins || {})[UI.civ];
  const uniques = C.deck.split(/\s+/).filter(t => t[0] === '+').map(t => { const id = t.slice(1), U = UNIQUE[id]; return { uid: 0, name: U.name, icons: U.icons, text: U.text, civ: UI.civ, unique: id, steps: [] }; });
  $('#setup').innerHTML = `<div class="hero"><h1>Medieval Mayhem</h1><p>Every civilization fights with its own deck. Draw 1, play 1: the last realm standing wins.</p></div>
  <div class="setup-grid">
    <div class="pick">
      <div class="seg"><span>Players</span>${[2, 3, 4].map(n => `<button class="${UI.n === n ? 'on' : ''}" data-n="${n}">${n === 2 ? 'Duel' : n + ' players'}</button>`).join('')}</div>
      ${GROUPS.map(g => `<div class="grp"><h4>${esc(g)}</h4><div class="tiles">${CIV_ORDER.filter(c => CIVS[c].group === g).map(c => `<button class="tile${c === UI.civ ? ' on' : ''}" data-civ="${c}" style="--civ:${CIVS[c].color}" title="${esc(CIVS[c].style)}">${crest(c, 30)}<span>${esc(CIVS[c].name)}</span><em>${hp(c)} HP</em></button>`).join('')}</div></div>`).join('')}
    </div>
    <div class="detail" style="--civ:${C.color}">
      <div class="d-head">${crest(UI.civ, 64)}<div><h2>${esc(C.name)}</h2><p>${esc(C.style)}</p><p class="d-hp">Starting <b class="kw k-hp">${hp(UI.civ)} HP</b> ${UI.n === 2 ? 'in a duel' : 'at a 3–4 player table'}${rec ? ` · won ${rec[0]} of ${rec[1]}` : ''}</p></div></div>
      <h4>Signature cards</h4><div class="d-uniques">${uniques.map(u => cardHTML(u, { small: 1 })).join('')}</div>
      <h4>Imperial Age</h4><p class="d-bonus">${kw(IMPERIAL[UI.civ].bonus.text)}</p><div class="d-uniques">${IMPERIAL[UI.civ].cards.map(d => cardHTML({ uid: 0, name: d.name, icons: d.icons, text: d.text, civ: UI.civ, imperial: true, steps: [] }, { small: 1 })).join('')}</div>
      <h4>The 24-card deck</h4><div class="d-mix">${deckMix(UI.civ).map(([ch, k]) => `<span title="${esc(SYM[ch].name)}: ${esc(SYM[ch].desc)}">${symBadge(ch, 22)}<b>×${k}</b></span>`).join('')}</div>
      <p class="d-opp">Opponents: ${UI.n - 1} random civilization${UI.n > 2 ? 's' : ''} played by the computer</p>
      <div class="d-actions"><button class="btn big" id="go">To battle</button><button class="btn ghost" id="randCiv">Random civ</button></div>
    </div>
  </div>`;
}
function showScreen(id) { for (const s of ['setup', 'game']) $('#' + s).classList.toggle('hidden', s !== id); }
function newMatch() {
  SFX.init();
  prefs.n = UI.n; prefs.civ = UI.civ; savePrefs();
  const seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0, R = { rs: seed };
  const others = shuffled(R, CIV_ORDER.filter(c => c !== UI.civ)).slice(0, UI.n - 1);
  S = newGame({ seed, civs: [UI.civ, ...others], ai: [false, ...others.map(() => true)] });
  for (const P of S.players.slice(1)) chooseRelic(S, P.id, aiRelic(S, P));
  UI.last = null; UI.targeting = null; UI.busy = false; UI.round = 1;
  showScreen('game'); renderGame();
  const P = S.players[0];
  modal(`<h2>Choose a relic</h2><p class="muted">Your relic stays with you all game. Three are drawn at random each match.</p><div class="relics">${P.relicOffer.map(id => `<button class="relic" data-relic="${id}"><b>${esc(RELICS[id].name)}</b><span>${kw(RELICS[id].text)}</span></button>`).join('')}</div>
    <p class="muted small">Opponents: ${S.players.slice(1).map(o => `${esc(CIVS[o.civ].name)} (${esc(RELICS[o.relic].name)})`).join(', ')}</p>`);
}
function beginPlay(relic) {
  chooseRelic(S, 0, relic); closeModal(); startGame(S); renderGame();
  banner('Round 1', 'You go first; every opponent starts with 1 extra card'); SFX.play('turn');
  if (window.__auto) setTimeout(autoHuman, 300);
}
/* human */
function handPlay(uid) {
  if (S.turn !== 0 || UI.busy || S.winner != null) return;
  const card = S.players[0].hand.find(c => c.uid === uid); if (!card) return;
  if (needsTarget(card)) {
    const opps = opponents(S, S.players[0]);
    if (opps.length > 1) { UI.targeting = UI.targeting === uid ? null : uid; renderGame(); return; }
    return doPlay(uid, opps.length ? opps[0].id : null);
  }
  doPlay(uid, null);
}
function doPlay(uid, tid) {
  const ev = playCard(S, 0, uid, tid);
  UI.targeting = null;
  if (!ev) { renderGame(); return; }
  UI.last = { card: ev.card, pid: 0, target: ev.target };
  SFX.play('card'); renderGame(); showFx(ev.fx); afterHuman();
}
function doBuy(i) {
  if (S.turn !== 0 || UI.busy) return;
  const card = S.market[i];
  if (buy(S, 0, i)) { SFX.play('coin'); renderGame(); floatText(0, 'Hired ' + card.name, 'gold', 0); }
}
function afterHuman() {
  if (S.winner != null || !S.players[0].alive) { UI.busy = true; setTimeout(endScreen, 1100); return; }
  const me = S.players[0];
  if (S.plays > 0 && me.hand.length) { renderGame(); if (window.__auto) setTimeout(autoHuman, 250); return; }
  UI.busy = true; renderGame();
  setTimeout(() => { endTurn(S); afterTurnChange(); }, 700);
}
function autoHuman() {
  if (S.turn !== 0 || S.winner != null) return;
  const a = aiAct(S, 0);
  if (a.kind === 'buy') { doBuy(a.idx); setTimeout(autoHuman, 200); }
  else if (a.kind === 'play') doPlay(a.uid, a.target);
  else afterHuman();
}
/* turns */
function afterTurnChange() {
  if (S.winner != null) { renderGame(); setTimeout(endScreen, 900); return; }
  let roundBanner = false;
  if (S.round !== UI.round) { UI.round = S.round; const E = EVENT_BY[S.event]; banner(`Round ${S.round}: ${E.name}`, E.text); roundBanner = true; }
  if (S.turn === 0) {
    UI.busy = false; renderGame(); SFX.play('turn');
    const me = S.players[0];
    if (me.ageGiven && !me.aged && me.turns === RULES.ageTurn) setTimeout(() => banner('The Imperial Age', 'Play the Imperial Age card when you are ready'), roundBanner ? 1500 : 0);
    if (!S.players[0].hand.length) { afterHuman(); return; }
    if (window.__auto) setTimeout(autoHuman, 300);
    return;
  }
  renderGame(); setTimeout(aiStep, window.__fast ? 30 : 750);
}
function aiStep() {
  if (S.winner != null) { setTimeout(endScreen, 600); return; }
  const pid = S.turn, P = S.players[pid], wait = window.__fast ? 30 : 950;
  const a = aiAct(S, pid);
  if (a.kind === 'buy') { const card = S.market[a.idx]; if (buy(S, pid, a.idx)) { SFX.play('coin'); renderGame(); floatText(pid, 'Hired ' + card.name, 'gold', 0); setTimeout(aiStep, wait); return; } }
  let ok = false;
  if (a.kind === 'play') { const ev = playCard(S, pid, a.uid, a.target); if (ev) { ok = true; UI.last = { card: ev.card, pid, target: ev.target }; SFX.play('card'); renderGame(); showFx(ev.fx); } }
  if (S.winner != null || !S.players[0].alive) { setTimeout(endScreen, 1100); return; }
  if (!ok || S.plays <= 0 || !P.hand.length || !P.alive) setTimeout(() => { endTurn(S); afterTurnChange(); }, wait);
  else setTimeout(aiStep, wait);
}
function endScreen() {
  if (!S || $('#modal .end')) return;
  const me = S.players[0], W = S.winner != null && S.winner >= 0 ? S.players[S.winner] : null, win = S.winner === 0;
  prefs.wins = prefs.wins || {}; const r = prefs.wins[me.civ] || [0, 0]; r[1]++; if (win) r[0]++; prefs.wins[me.civ] = r; savePrefs();
  SFX.play(win ? 'win' : 'lose');
  const reason = S.wonderWin ? 'wonder completed' : S.timeUp ? '40 rounds passed, most HP wins' : 'last realm standing';
  modal(`<div class="end ${win ? 'win' : 'lose'}">${W ? crest(W.civ, 76) : crest(me.civ, 76)}
    <h2>${win ? 'Victory!' : me.alive ? 'Defeat' : 'You were defeated'}</h2>
    <p>${W ? `${W.id === 0 ? 'You win' : esc(CIVS[W.civ].name) + ' win'} · ${reason}` : `Still standing: ${S.players.filter(p => p.alive).map(p => esc(CIVS[p.civ].name)).join(', ')}`}</p>
    <div class="stats"><span>Damage dealt <b>${me.stats.dmg}</b></span><span>Cards played <b>${me.stats.played}</b></span><span>Mercenaries hired <b>${me.stats.bought}</b></span><span>Rounds <b>${S.round}</b></span></div>
    <div class="row"><button class="btn big" data-act="again">Play again</button><button class="btn ghost" data-act="setup">Choose another civ</button></div></div>`);
}
function rulesModal() {
  modal(`<h2>How to play</h2>
  <p>Each player holds their own civilization's deck. On your turn <b>draw 1 card, then play 1 card</b>; with an empty hand you draw 2. A card does what its symbols say, left to right. The last player with HP left wins.</p>
  <p class="legend-key">Card texts colour their keywords: <b class="kw k-dmg">damage</b> · <b class="kw k-hp">HP</b> · <b class="kw k-gold">gold</b> · <b class="kw k-card">cards</b> · <b class="kw k-wall">walls</b> · <b class="kw k-play">play another card</b> · <b class="kw k-aoe">every opponent</b> · <b class="kw k-pierce">over the walls</b> · <b class="kw k-steal">steal</b> · <b class="kw k-raze">destroy</b></p>
  <div class="legend">${SYM_ORDER.split('').map(ch => `<div>${symBadge(ch, 26)}<b>${esc(SYM[ch].name)}</b><span>${kw(SYM[ch].desc)}</span></div>`).join('')}</div>
  <p><b>Walls</b> soak up damage before it reaches your HP. <b>Cards with ★</b> are a civilization's signature cards. <b>Events</b>: one hits everyone each round, and the next one is always shown in advance. <b>Mercenary Market</b>: hire 1 card per turn with gold; it goes to your hand and joins your deck. <b>Relics</b>: pick 1 of 3 when the match starts.</p>
  <p><b>Imperial Age</b>: at the start of your ${RULES.ageTurn}th turn an Imperial Age card arrives in your hand. Playing it costs your play for that turn, but no gold: your civilization's three Imperial cards join your deck and its age-up bonus happens at once (some civs get gold, cards, an attack, or a card straight to hand). Nobody can steal or discard it.</p>
  <p><b>Wonders</b> (Angkor Wat, Chichén Itzá) win the game if they still stand at the start of their builder's third turn, so the whole table has to pile on. The first time you fall to 3 HP or less you draw 2 extra cards. From round 16 everyone loses 1 HP each round.</p>
  <p class="muted small">Each civilization's starting HP is tuned with hundreds of thousands of AI-vs-AI games, separately for duels and for 3–4 player tables: every civ wins roughly 46–54% of duels and close to its fair share at bigger tables.</p>
  <div class="row"><button class="btn" data-act="close">Close</button></div>`);
}
/* wiring */
document.addEventListener('click', e => {
  const t = e.target.closest('button, .card, .seat'); if (!t) return;
  SFX.init();
  if (t.dataset.n) { UI.n = +t.dataset.n; SFX.play('click'); renderSetup(); return; }
  if (t.dataset.civ) { UI.civ = t.dataset.civ; SFX.play('click'); renderSetup(); return; }
  if (t.id === 'randCiv') { UI.civ = CIV_ORDER[Math.floor(Math.random() * CIV_ORDER.length)]; renderSetup(); return; }
  if (t.id === 'go') { newMatch(); return; }
  if (t.dataset.relic) { beginPlay(t.dataset.relic); return; }
  if (t.id === 'cancelTarget') { UI.targeting = null; renderGame(); return; }
  if (t.id === 'rulesBtn') { rulesModal(); return; }
  if (t.id === 'soundBtn') { SFX.on = !SFX.on; prefs.sound = SFX.on; savePrefs(); t.textContent = SFX.on ? 'Sound: on' : 'Sound: off'; return; }
  if (t.id === 'newBtn') { if (S && S.winner == null && S.started && !$('#modal .end')) { modal('<h2>Abandon this game?</h2><p>It will not count.</p><div class="row"><button class="btn" data-act="setup">Abandon and choose again</button><button class="btn ghost" data-act="close">Keep playing</button></div>'); return; } closeModal(); S = null; showScreen('setup'); renderSetup(); return; }
  if (t.dataset.act === 'close') { closeModal(); return; }
  if (t.dataset.act === 'again') { closeModal(); newMatch(); return; }
  if (t.dataset.act === 'setup') { closeModal(); S = null; showScreen('setup'); renderSetup(); return; }
  if (t.classList.contains('seat') && t.classList.contains('targetable') && UI.targeting) { doPlay(UI.targeting, +t.dataset.pid); return; }
  if (t.classList.contains('card') && t.closest('#hand') && t.classList.contains('playable')) { handPlay(+t.dataset.uid); return; }
  if (t.classList.contains('card') && t.closest('#market') && t.classList.contains('buyable')) { doBuy(+t.dataset.mi); return; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (UI.targeting) { UI.targeting = null; renderGame(); } else if (!$('#modal .relics') && !$('#modal .end')) closeModal(); } });
$('#soundBtn').textContent = SFX.on ? 'Sound: on' : 'Sound: off';
renderSetup();

</script>
