      if (tone) drawMark(tone, hatTop !== null ? hatTop - 2 : baseTop - 2);
    }

  }

    x.fillStyle = col;
    for (let y = 0; y < H; y++) for (let xx = 0; xx < W; xx++) if (mask[y * W + xx]) x.fillRect(xx + dx, y + dy, 1, 1);
  };

  else if (opts.shadow) paint(opts.shadow, 1, 1);

}
/* Draw text so that the cap-top sits at (x, y). align: 'left' | 'center' | 'right'. */
function drawText(ctx, str, x, y, color, opts = {}) {
  const s = opts.scale || 1;
  const c = textCanvas(str, color, opts);
  const w = (c.width - 3) * s;
  let dx = x;
  if (opts.align === 'center') dx = x - w / 2; else if (opts.align === 'right') dx = x - w;
  ctx.drawImage(c, Math.round(dx - s), Math.round(y - (TEXT_PAD_TOP + 1) * s), c.width * s, c.height * s);
  return w;
}
/* Wrap text into lines that fit maxW (in unscaled pixels). */
function wrapText(str, maxW) {
  const words = String(str).split(' ');
  const lines = [];
  let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (textWidth(t) > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}

/* ── Art: sprites ──
   Sprites are drawn as character maps and get an automatic 1px outline, which keeps the
   whole cast consistent. '.' is transparent; every other char maps through a palette. */
function spriteFrom(rows, pal, outline, noOutline = '') {
  const h = rows.length, w = rows[0].length;
  const [c, x] = mkCanvas(w, h);
  const img = x.createImageData(w, h);
  const d = img.data;
  const set = (i, hex, a = 255) => { const [r, g, b] = hexRgb(hex); d[i * 4] = r; d[i * 4 + 1] = g; d[i * 4 + 2] = b; d[i * 4 + 3] = a; };
  for (let y = 0; y < h; y++) for (let xx = 0; xx < w; xx++) {
    const ch = rows[y][xx];
    if (ch !== '.' && ch !== ' ' && pal[ch]) set(y * w + xx, pal[ch]);
  }
  if (outline) {
    const filled = (xx, y) => { if (xx < 0 || y < 0 || xx >= w || y >= h) return false; const ch = rows[y][xx]; return ch !== '.' && ch !== ' ' && !noOutline.includes(ch); };
    for (let y = 0; y < h; y++) for (let xx = 0; xx < w; xx++) {
      const ch = rows[y][xx];
      if (ch !== '.' && ch !== ' ') continue;
      if (filled(xx - 1, y) || filled(xx + 1, y) || filled(xx, y - 1) || filled(xx, y + 1)) set(y * w + xx, outline);
    }
  }
  x.putImageData(img, 0, 0);
  return c;
}
function flipH(src) {
  const [c, x] = mkCanvas(src.width, src.height);
  x.translate(src.width, 0); x.scale(-1, 1); x.drawImage(src, 0, 0);
  return c;
}
function tintCanvas(src, color, alpha = 1) {
  const [c, x] = mkCanvas(src.width, src.height);
  x.drawImage(src, 0, 0);
  x.globalCompositeOperation = 'source-in';
  x.globalAlpha = alpha; x.fillStyle = color; x.fillRect(0, 0, c.width, c.height);
  return c;
}
/* compose rows: paint `layers` (each {rows, dx, dy}) onto a blank w×h grid of chars */
function composeRows(w, h, layers) {
  const g = Array.from({ length: h }, () => Array(w).fill('.'));
  for (const L of layers) {
    L.rows.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) {
        const ch = row[x];
        if (ch === '.' || ch === ' ') continue;
        const X = x + (L.dx || 0), Y = y + (L.dy || 0);
        if (X >= 0 && Y >= 0 && X < w && Y < h) g[Y][X] = ch;
      }
    });
  }
  return g.map(r => r.join(''));
}

/* ───────── Terrain painting ───────── */
function paintTerrain(level, theme) {
  const Wt = level.w, Ht = level.h, W = Wt * TILE, H = Ht * TILE;
  const buf = new PixBuf(W, H);
  const fake = new PixBuf(W, H);
  const code = (x, y) => {
    if (x < 0 || x >= Wt) return T.SOLID;
    if (y >= Ht) return T.SOLID;
    if (y < 0) return T.EMPTY;
    return level.tiles[y * Wt + x];
  };
  const ground = (x, y) => isGroundCode(code(x, y));
  const tp = theme.tile, R = ramp(tp.body, 12), capR = tp.cap;
  const depthOf = (x, y) => { let d = 0; while (d < 6 && ground(x, y - d - 1)) d++; return d; };
  for (let ty = 0; ty < Ht; ty++) for (let tx = 0; tx < Wt; tx++) {
    const c = code(tx, ty);
    if (!isGroundCode(c)) continue;
    const target = c === T.FAKE ? fake : buf;
    const n = ground(tx, ty - 1), s = ground(tx, ty + 1), e = ground(tx + 1, ty), w = ground(tx - 1, ty);
    const depth = depthOf(tx, ty);
    const ox = tx * TILE, oy = ty * TILE;
    if (c === T.ALT) { paintAltTile(target, ox, oy, theme, n, s, e, w, tx, ty); continue; }
    const iceTile = c === T.ICE;
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const gx = ox + x, gy = oy + y;
      // rounded outer corners
      if (!n && !w && x + y < 2) continue;
      if (!n && !e && 15 - x + y < 2) continue;
      if (!s && !w && x + 15 - y < 1) continue;
      if (!s && !e && 30 - x - y < 1) continue;
      let col;
      if (iceTile) {
        const ic = theme.ice;
        const tt = (depth * 16 + y) / 40;
        col = tt < 0.3 ? ic.a : tt < 0.7 ? ic.b : ic.c;
        if (((gx + gy) % 11 === 0 || (gx + gy + 1) % 11 === 0) && y > 2) col = ic.line;
        if (!n && y < 2) col = ic.top;
      } else {
        const tt = (depth * 16 + y) / (16 * 3.2);
        col = rampPick(R, tt, gx, gy);
        if (tp.style === 'sand') {
          const band = Math.floor((gy + pnoise(gx / 9, 64, 5) * 5) / 6) % tp.strata.length;
          if (depth > 0 || y > 7) col = mix(col, tp.strata[band], 0.55);
        }
        if (tp.style === 'brick' || tp.style === 'stone') {
          const bh = tp.style === 'brick' ? 5 : 8, bw = tp.style === 'brick' ? 10 : 16;
          const row = Math.floor(gy / bh), off = (row % 2) * (bw >> 1);
          if (gy % bh === 0 || (gx + off) % bw === 0) col = tp.mortar;
          else if (hash(Math.floor((gx + off) / bw), row, 9) < 0.18) col = mix(col, tp.speck[1], 0.35);
        }
        const hs = hash(gx, gy, 3);
        if (hs < 0.018) col = tp.speck[0];
        else if (hs > 0.986) col = tp.speck[1];
        if (tp.style === 'frost' && hash(gx >> 1, gy >> 1, 17) < 0.004) col = tp.speck[hash(gx, gy, 5) < 0.5 ? 0 : 1];
      }
      // exposed edges
      if (!w && x === 0) col = tp.edge; else if (!w && x === 1) col = mix(col, tp.edge, 0.45);
      if (!e && x === 15) col = tp.edge; else if (!e && x === 14) col = mix(col, tp.edge, 0.45);
      if (!s && y === 15) col = tp.edge; else if (!s && y === 14) col = mix(col, tp.edge, 0.5);
      // surface cap
      if (!n && !iceTile) {
        const wob = hash(gx, 1, 11) < 0.45 ? 1 : 0;
        const ch = tp.capH + wob + (tp.style === 'snow' && hash(gx >> 1, 3, 12) < 0.2 ? 2 : 0);
        if (y < ch) {
          col = y === 0 ? capR[0] : y >= ch - 1 ? capR[2] : capR[1];
          if (y === 1 && hash(gx, gy, 13) < 0.3) col = capR[0];
          if (!w && x === 0 && y > 0) col = capR[2];
          if (!e && x === 15 && y > 0) col = capR[2];
        } else if (y === ch && tp.style !== 'brick' && tp.style !== 'stone') col = mix(col, tp.under, 0.6);
      }
      target.set(gx, gy, col);
    }
    // grass tufts / snow lumps / moss strands spilling over the edge
    if (!n && !iceTile) {
      for (let x = 1; x < 15; x++) {
        const gx = ox + x, hh = hash(gx, ty, 21);
        if (tp.style === 'grass' && hh < 0.28) { target.set(gx, oy - 1, capR[1]); if (hh < 0.1) target.set(gx, oy - 2, capR[0]); }
        if (tp.style === 'snow' && hh < 0.18) target.set(gx, oy - 1, capR[0]);
        if (tp.style === 'moss' && hh < 0.2) target.set(gx, oy - 1, capR[1]);
      }
    }
    if (!s) {
      for (let x = 2; x < 14; x++) {
        const gx = ox + x, hh = hash(gx, ty, 31);
        if ((tp.style === 'grass' || tp.style === 'moss') && hh < 0.08) { target.set(gx, oy + 16, tp.edge); if (hh < 0.03) target.set(gx, oy + 17, tp.edge); }
        if ((tp.style === 'snow' || tp.style === 'frost') && hh < 0.06) { target.set(gx, oy + 16, theme.spike.mid); if (hh < 0.02) target.set(gx, oy + 17, theme.spike.hi); }
      }
    }
  }
  const [cv, cx] = mkCanvas(W, H);
  cx.putImageData(buf.img, 0, 0);
  // props painted onto the terrain layer: one-way planks and spikes
  for (let ty = 0; ty < Ht; ty++) for (let tx = 0; tx < Wt; tx++) {
    const c = level.tiles[ty * Wt + tx];
    if (c === T.ONEWAY) paintOneWay(cx, tx, ty, theme, level.tiles[ty * Wt + tx - 1] === T.ONEWAY, level.tiles[ty * Wt + tx + 1] === T.ONEWAY);
    else if (c >= T.SPIKE_U && c <= T.SPIKE_R) paintSpike(cx, tx, ty, c, theme);
  }
  let fakeCanvas = null;
  if (level.tiles.includes(T.FAKE)) { fakeCanvas = fake.toCanvas(); }
  return { canvas: cv, fake: fakeCanvas };
}
function paintAltTile(buf, ox, oy, theme, n, s, e, w, tx, ty) {
  const a = theme.alt;
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    const gx = ox + x, gy = oy + y;
    const row = Math.floor(y / 8), off = (row + ty) % 2 ? 8 : 0;
    let col = hash(Math.floor((x + off) / 16) + tx * 2, row + ty * 2, 41) < 0.5 ? a.a : a.b;
    if (y % 8 === 0 || (x + off) % 16 === 0) col = a.line;
    if (hash(gx, gy, 43) < 0.04) col = mix(col, a.line, 0.4);
    if (!n && y < 2) col = a.top;
    if (!w && x === 0) col = a.line; if (!e && x === 15) col = a.line; if (!s && y === 15) col = a.line;
    buf.set(gx, gy, col);
  }
}
function paintOneWay(ctx, tx, ty, theme, left, right) {
  const o = theme.oneway, x0 = tx * TILE, y0 = ty * TILE;
  ctx.fillStyle = o.dark; ctx.fillRect(x0, y0, 16, 6);
  ctx.fillStyle = o.mid; ctx.fillRect(x0, y0 + 1, 16, 4);
  ctx.fillStyle = o.top; ctx.fillRect(x0, y0 + 1, 16, 1);
  ctx.fillStyle = o.dark;
  if (!left) { ctx.fillRect(x0, y0, 1, 6); ctx.clearRect(x0, y0, 1, 1); ctx.clearRect(x0, y0 + 5, 1, 1); }
  if (!right) { ctx.fillRect(x0 + 15, y0, 1, 6); ctx.clearRect(x0 + 15, y0, 1, 1); ctx.clearRect(x0 + 15, y0 + 5, 1, 1); }
  ctx.fillRect(x0 + (tx % 2 ? 4 : 11), y0 + 2, 1, 2);   // plank seam / peg
  if (theme.world === 3 && theme.outdoor) { ctx.fillStyle = '#F2F6FF'; ctx.fillRect(x0, y0 - 1, 16, 2); ctx.fillStyle = '#CBD8F2'; ctx.fillRect(x0 + (tx * 5) % 12, y0 + 1, 3, 1); }

function paintSpike(ctx, tx, ty, c, theme) {
  const sp = theme.spike, x0 = tx * TILE, y0 = ty * TILE;
  const tri = (ax, ay, dir) => {
    // one 8px spike; dir: 0 up,1 down,2 left,3 right
    for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
      // local coords u across (0..7), v along (0 base .. 7 tip)
      const u = i, v = j;
      const half = (7 - v) / 2;
      if (Math.abs(u - 3.5) > half + 0.25) continue;
      let col = u < 3.5 ? sp.hi : sp.mid;
      if (Math.abs(u - 3.5) > half - 0.9) col = sp.lo;
      if (v === 7) col = sp.hi;
      let px, py;
      if (dir === 0) { px = ax + u; py = ay + 7 - v; }
      else if (dir === 1) { px = ax + u; py = ay + v; }
      else if (dir === 2) { px = ax + 7 - v; py = ay + u; }
      else { px = ax + v; py = ay + u; }

  if (c === T.SPIKE_D) { tri(x0, y0, 1); tri(x0 + 8, y0, 1); ctx.fillStyle = sp.lo; ctx.fillRect(x0, y0, 16, 1); }
  if (c === T.SPIKE_L) { tri(x0 + 8, y0, 2); tri(x0 + 8, y0 + 8, 2); ctx.fillStyle = sp.lo; ctx.fillRect(x0 + 15, y0, 1, 16); }
  if (c === T.SPIKE_R) { tri(x0, y0, 3); tri(x0, y0 + 8, 3); ctx.fillStyle = sp.lo; ctx.fillRect(x0, y0, 1, 16); }
}

/* Background props planted on the surface (behind terrain, in world space) */
function paintProps(level, theme, seed) {
  const W = level.w * TILE, H = level.h * TILE;

/* ── World map: the journey is one day — morning hills, sunset desert, aurora night ── */
const MAP_W = 1320;

  const r3 = 190 + Math.sin(x * 0.02 + 2) * 14 - Math.max(0, 1 - Math.abs(x - 1222) / 90) * 36;

}
function buildMapArt() {
  const H = VIEW_H, b = new PixBuf(MAP_W, H);

  for (let x = 0; x < MAP_W; x++) {
    const z = zone(x), a = Math.floor(z), f = z - a;
    const col = R[a].map((c, i) => (f > 0 && R[a + 1] ? mix(c, R[a + 1][i], f) : c));
    for (let y = 0; y < H; y++) b.set(x, y, rampPick(col, y / (H - 1), x, y));
  }
  const sr = rng(9);
  for (let i = 0; i < 160; i++) { const x = 860 + sr() * 460, y = sr() * 140; if (sr() < 0.9) b.set(x, y, sr() < 0.3 ? '#FFFFFF' : '#AFC4F0'); }

  const dz = (x, y) => { const z = zone(x), a = Math.floor(z), f = z - a; return f > bayer(x, y) ? a + 1 : a; };
  for (let x = 0; x < MAP_W; x++) {
    const z = zone(x);
    const far = 150 - (Math.abs(Math.sin(x * 0.01)) * 30 + Math.abs(Math.sin(x * 0.027 + 1)) * 14) * (z > 1.5 ? 1.6 : z > 0.5 ? 0.6 : 1);
    for (let y = Math.round(far); y < H; y++) b.set(x, y, ['#A6C6DE', '#8A3E70', '#34447A'][dz(x, y)]);
    if (z > 1.5 && far < 128) for (let y = Math.round(far); y < Math.round(far) + 4; y++) b.set(x, y, '#9FB2E0');
  }
  // ground band
  for (let x = 0; x < MAP_W; x++) {
    const g = Math.round(mapGround(x));
    const P = [['#7FCC4E', '#5AAA46', '#3E8A3E'], ['#F6C47C', '#DB8E52', '#B8663E'], ['#F2F6FF', '#AFC2EA', '#6E80B8']];
    for (let y = g; y < H; y++) { const cols = P[dz(x, y)]; b.set(x, y, y < g + 2 ? cols[0] : rampPick(cols.slice(1), (y - g) / 50, x, y)); }

  const tr = rng(3);

  for (let i = 0; i < 9; i++) { const x = 480 + tr() * 320; propCactus(b, Math.round(x), Math.round(mapGround(x)) + 1, tr); }
  for (let i = 0; i < 18; i++) { const x = 900 + tr() * 400; if (Math.abs(x - 1222) > 30) propPine(b, Math.round(x), Math.round(mapGround(x)) + 1, tr, ['#1E2A4C', '#16203C', '#DDE8FA']); }

  for (let y = -9; y <= 0; y++) for (let x = -6; x <= 6; x++) if (y > -4 || x * x + (y + 4) ** 2 < 30) b.set(cx + 20 + x, cg + y, y === -9 ? '#2B1A1F' : '#1B1422');

  for (let k = 0; k < 22; k++) for (let x = -24 + k; x <= 24 - k; x++) b.set(tx + x, tg - k, k % 4 === 0 ? '#B8663E' : '#D98E52');   // stepped temple

  const px = MAP_NODE_X[11], pg = Math.round(mapGround(px));
  for (let y = 0; y < 70; y++) for (let x = -7; x <= 7; x++) { let c = x < -3 ? '#5C6294' : x > 3 ? '#3C426A' : '#4E5486'; if (y % 8 === 0) c = '#2A2E4C'; b.set(px + x, pg - y, c); }

}

  load() { try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.v === 1) return Object.assign(this.freshSave(), s); } catch (e) { } return this.freshSave(); }
  persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.save)); } catch (e) { } }
  hasProgress() { return this.save.unlocked > 1 || Object.keys(this.save.levels).length > 0; }
  resetSave() { const keep = { sfx: this.save.sfx, music: this.save.music }; this.save = Object.assign(this.freshSave(), keep); this.persist(); }
  applySound() { this.audio.setSfx(this.save.sfx); this.audio.setMusic(this.save.music); }
  go(state, arg) {

    } };
  }
  startLevel(id) {
    if (this.fade) return;
    this.fade = { t: 0, mid: () => {
      const def = LEVELS[id - 1];
      this.level = new Level(this, def); this.state = 'play'; this.paused = null; this.automap = false;
      this.audio.music(def.music || THEMES[def.theme].music); this.audio.duck(false);
    } };
  }
  levelComplete(L) {

    const stars = [0, 1, 2].map(i => !!((prev.stars || [])[i] || L.stats.stars[i]));
    S.levels[id] = { done: true, stars, best: prev.best ? Math.min(prev.best, L.stats.time) : L.stats.time, flies: Math.max(prev.flies || 0, L.stats.flies) };

  }
  afterClear(L) {

  }

    let px = -1e4, py = -1e4;
    if (this.state === 'play' && L) { const r = this.cv.getBoundingClientRect(); px = r.left + (L.player.cx - L.cam.x) / V.W * r.width; py = r.top + (L.player.cy - L.cam.y) / V.H * r.height; }
    for (const el of els) {
      const b = el.getBoundingClientRect(), near = px > b.left - 24 && px < b.right + 24 && py > b.top - 30 && py < b.bottom + 20;
      el.style.opacity = near ? '0.28' : '';
    }
  }
  update(inp) {
    this.t++;
    if (this.fade) {
      this.fade.t++;
      if (this.fade.t === 14) this.fade.mid();
      if (this.fade.t >= 28) this.fade = null;
      inp = { ...inp, taps: [] };
      if (this.fade) return;
    }
    const b = document.body;
    if (this.state === 'play') {
      const L = this.level;
      if (this.paused) { this.pauseMenu.update(inp); }
      else if (this.automap) { this.mapT++; if (inp.mapPressed || inp.pausePressed || inp.backPressed || inp.confirm || inp.taps.length) { this.automap = false; this.audio.sfx('back'); } }
      else if (inp.pausePressed && (L.state === 'run')) { this.paused = true; this.pauseMenu.sel = 0; this.audio.duck(true); this.audio.sfx('select'); }
      else if (inp.mapPressed && L.def.maze && L.state === 'run') { this.automap = true; this.mapT = 0; this.audio.sfx('map'); }
      else L.update(inp);

        b.classList.toggle('playing', !this.paused && !this.automap && this.level.state !== 'clear');
        b.classList.toggle('maze', !!this.level.def.maze);
      }

      b.classList.remove('playing');
      this.screens[this.state].update(inp);
    }

  draw() {

      const L = this.level;
      L.draw(ctx);
      if (L.state !== 'clear') { drawHUD(ctx, L); drawSign(ctx, L); if (!this.paused && !this.automap && L.state !== 'banner') drawTitleCard(ctx, L); }

  }
}
function boot() {
  const cv = document.getElementById('game');
  ART = { hero: buildHero(), enemies: buildEnemies(), items: buildItems() };
  const game = window.game = new Game(cv);
  const stage = document.getElementById('stage');
  let cssScale = 1;
  const resize = () => {
    const vv = window.visualViewport, vw0 = vv ? vv.width : innerWidth, vh0 = vv ? vv.height : innerHeight;
    const cs = getComputedStyle(document.getElementById('safe')), pad = k => parseFloat(cs['padding' + k]) || 0;
    const sl = pad('Left'), sr = pad('Right'), st = pad('Top'), sb = pad('Bottom');
    const vw = vw0 - sl - sr, vh = vh0 - st - sb;
    const coarse = game.input.usingTouch || matchMedia('(pointer: coarse)').matches;
    const portrait = coarse && vh > vw * 1.05;
    const aw = vw, ah = portrait ? Math.max(200, vh - 250) : vh;
    stage.style.padding = portrait ? '' : `${st}px ${sr}px ${sb}px ${sl}px`;
    let w = Math.round(clamp(VIEW_H * aw / ah, 320, 560)); if (w % 2) w++;
    V.W = w; V.H = VIEW_H;
    cssScale = Math.min(aw / V.W, ah / V.H);
    if (cv.width !== V.W) cv.width = V.W;
    if (cv.height !== V.H) cv.height = V.H;
    cv.style.width = Math.floor(V.W * cssScale) + 'px'; cv.style.height = Math.floor(V.H * cssScale) + 'px';
    document.body.classList.toggle('portrait', portrait);
    UI.s = cssScale < 2.3 ? 2 : 1;
    game.draw();
  };
  addEventListener('resize', resize);
  if (window.visualViewport) visualViewport.addEventListener('resize', resize);
  addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse' && !game.input.usingTouch) { game.input.setTouchMode(true); resize(); } }, true);
  const toGame = (x, y) => { const r = cv.getBoundingClientRect(); const gx = (x - r.left) / r.width * V.W, gy = (y - r.top) / r.height * V.H; return gx >= 0 && gy >= 0 && gx <= V.W && gy <= V.H ? { x: gx, y: gy } : { x: -1, y: -1 }; };
  game.input.bindTouch(document.getElementById('touch'), cv, toGame);
  resize();
  { const h = document.getElementById('home'); if (h && (!/game-muop\.html$/.test(location.pathname) || /claude/.test(location.hostname))) h.remove(); }
  let last = performance.now(), acc = 0;
  const STEP = 1000 / 60;
  const loop = now => {
    requestAnimationFrame(loop);
    acc += Math.min(100, now - last); last = now;
    let n = 0;
    while (acc >= STEP && n < 4) { game.update(game.input.frame()); acc -= STEP; n++; }
    if (n === 4) acc = 0;
    if (n) game.draw();
  };
  requestAnimationFrame(loop);
  document.addEventListener('visibilitychange', () => { if (document.hidden && game.state === 'play' && game.level && game.level.state === 'run' && !game.paused) { game.paused = true; game.pauseMenu.sel = 0; } if (game.audio.ctx) { if (document.hidden) game.audio.ctx.suspend(); else game.audio.ctx.resume(); } });
}

boot();
</script>
