<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Medieval Mayhem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700;800&family=Alegreya:wght@700;800&display=swap" rel="stylesheet">
<style>/* ── Medieval Mayhem · table UI ──
   A lapis war-table under portolan rhumb lines; vellum cards framed in each civilization's own pattern. */
:root{
  --lapis-0:#0d2244;--lapis-1:#15325e;--lapis-2:#1e4479;--lapis-3:#2b5a97;
  --gold:#e3b44c;--gold-hi:#f6d989;--gold-lo:#9b7420;
  --vellum:#f8f0de;--vellum-2:#eedfbf;--vellum-3:#e1cda2;--ink:#2a2333;--ink-2:#544a5e;--ink-3:#857a8a;
  --verm:#d2442e;--mal:#2b9467;--amethyst:#6a3fb0;--steel:#475a75;
  --f-ui:'Alegreya Sans','Segoe UI',system-ui,sans-serif;--f-sc:'Alegreya SC',Georgia,serif;--f-num:'Alegreya',Georgia,serif;
  --shadow-1:0 2px 0 rgba(0,0,0,.18),0 10px 26px rgba(3,10,26,.45);
  --cw:150px;--ch:212px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--lapis-0)}
body{font-family:var(--f-ui);color:var(--vellum);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
.hidden{display:none!important}
#app{position:relative;height:100%;overflow:hidden;background:radial-gradient(120% 95% at 50% 44%,var(--lapis-3) 0%,var(--lapis-2) 28%,var(--lapis-1) 60%,var(--lapis-0) 100%)}
#app::before{content:'';position:absolute;inset:0;background:var(--rhumb) center 46%/2000px 2000px no-repeat;opacity:.6;pointer-events:none}
.screen{position:relative;height:100%;z-index:1}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}

/* buttons */
.btn{font-family:var(--f-sc);font-weight:700;font-size:17px;letter-spacing:.01em;border:0;border-radius:11px;padding:10px 20px;min-height:46px;cursor:pointer;color:#2b1d05;
  background:linear-gradient(#f7dc8f,#e3b44c 55%,#c9952f);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 2px 0 #8a6516,0 8px 18px rgba(0,0,0,.35)}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:translateY(1px)}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--vellum);box-shadow:inset 0 0 0 1px rgba(246,217,137,.38)}
.btn.small{font-size:15px;min-height:40px;padding:7px 14px}
.icon-btn{width:44px;height:44px;border-radius:12px;border:0;display:grid;place-items:center;cursor:pointer;color:var(--vellum);background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(246,217,137,.25)}
.icon-btn:hover{background:rgba(255,255,255,.13)}
.icon-btn svg{width:22px;height:22px}

/* ── cards ── */
.card{--w:var(--cw);--h:var(--ch);--s:28px;position:relative;width:var(--w);height:var(--h);border-radius:12px;padding:6px;flex:0 0 auto;user-select:none;
  background-color:var(--civ);background-image:var(--motif);color:var(--ink);box-shadow:0 0 0 1px rgba(0,0,0,.5),0 7px 18px rgba(4,10,26,.5)}
.card .cb{height:100%;border-radius:8px;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,var(--vellum),var(--vellum-2));box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.card .cn{display:flex;align-items:center;gap:5px;min-height:30px;padding:4px 6px 4px 6px;background:linear-gradient(90deg,var(--civ-deep),var(--civ));color:#fff;
  font-family:var(--f-sc);font-weight:700;font-size:13.5px;line-height:1.05;text-shadow:0 1px 0 rgba(0,0,0,.45)}
.card .cn span{flex:1;min-width:0}
.card .ca{height:36%;margin:6px 6px 0;border-radius:6px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:3px;padding:4px;
  background-color:var(--civ-wash);background-image:var(--motif-soft);box-shadow:inset 0 0 0 1px rgba(0,0,0,.09)}
.card .ca .sym{width:var(--s);height:var(--s);filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.card .ct{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:5px 8px 2px;font-size:12.5px;line-height:1.24}
.card .cf{display:flex;justify-content:space-between;gap:6px;padding:2px 7px 5px;font-family:var(--f-sc);font-size:11px;color:var(--ink-3)}
.card .seal{flex:0 0 auto;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--f-num);font-size:12px;font-weight:800;color:#3a2306;background:radial-gradient(circle at 40% 35%,#fbe39c,#d9a73e);box-shadow:0 1px 2px rgba(0,0,0,.5)}
.card .seal svg{width:18px;height:18px}
.card.sig .cb{box-shadow:inset 0 0 0 2px var(--gold),inset 0 0 0 3px rgba(0,0,0,.15)}
.card.imp{background-color:#4a2783;background-image:var(--motif-gold)}
.card.imp .cn{background:linear-gradient(90deg,#3a1b70,#7445bd)}
.card.imp .cb{background:linear-gradient(180deg,#fcf7ff,#eadcf6)}
.card.age{background-color:#55299a;background-image:var(--motif-gold);box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 22px rgba(246,217,137,.6),0 7px 18px rgba(4,10,26,.5)}
.card.age .cn{background:linear-gradient(90deg,#3a1b70,#7445bd)}
.card.age .cb{background:radial-gradient(circle at 50% 30%,#fff8da,#f3d57f 58%,#dcaa42)}
.card.age .ca{background:none;box-shadow:none}
.card.merc .cn{background:linear-gradient(90deg,#4d3f27,#7a6542)}
.card.sm{--w:104px;--h:148px;--s:20px;padding:4px;border-radius:10px}
.card.sm .cn{font-size:11.5px;min-height:24px;padding:3px 5px}.card.sm .ct span{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
#zoom{position:fixed;z-index:85;pointer-events:none;filter:drop-shadow(0 18px 30px rgba(0,0,0,.55))}.card.sm .ct{font-size:10.5px;padding:3px 5px 1px}.card.sm .cf{font-size:9.5px;padding:1px 5px 3px}.card.sm .ca{margin:4px 4px 0}
.card.lg{--w:214px;--h:302px;--s:40px;padding:8px;border-radius:15px}
.card.lg .cn{font-size:17px;min-height:38px;padding:6px 9px}.card.lg .ct{font-size:15.5px;padding:8px 12px 4px}.card.lg .cf{font-size:13px;padding:3px 10px 7px}.card.lg .ca{margin:8px 8px 0}
.cost{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);white-space:nowrap;font-family:var(--f-num);font-weight:800;font-size:13px;padding:2px 10px;border-radius:999px;color:#fff;background:#6d5c3e;box-shadow:0 0 0 2px var(--vellum),0 2px 5px rgba(0,0,0,.5)}
.cost.ok{background:#b8871f}
.cback{display:inline-block;width:12px;height:17px;border-radius:2.5px;margin-right:-5px;background-color:var(--civ);background-image:var(--motif);box-shadow:0 0 0 1px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.35)}

/* keywords: same hue as the symbol of that resource */
.kw{font-weight:800}.k-dmg{color:#b3261e}.k-hp{color:#1f7a3a}.k-gold{color:#946300}.k-card{color:#3646a8}.k-wall{color:#475a75}.k-play{color:#6a3fb0}.k-aoe{color:#c4470f}.k-pierce{color:#0b6a50}.k-steal{color:#a3306d}.k-raze{color:#7a4a20}

/* ── match layout ── */
#screen-match{display:flex;flex-direction:column}
#topbar{flex:0 0 auto;height:56px;display:flex;align-items:center;gap:10px;padding:0 14px;background:linear-gradient(180deg,rgba(5,14,30,.6),rgba(5,14,30,0))}
.tb-mid{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-width:0}
.tb-right{display:flex;gap:8px;align-items:center}
.pill{font-family:var(--f-sc);font-weight:700;font-size:15px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(246,217,137,.25);white-space:nowrap}
.pill.gold{background:linear-gradient(#f7dc8f,#e3b44c);color:#2b1d05;box-shadow:none}
.pips{display:flex;gap:5px;padding:0 4px}.pip{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff3c4,#e3b44c);box-shadow:0 0 9px rgba(246,217,137,.85)}
.speed{min-width:58px;height:44px;border:0;border-radius:12px;cursor:pointer;font-family:var(--f-sc);font-weight:700;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(246,217,137,.25)}
.mob-only{display:none!important}
#table{flex:1;min-height:0;display:grid;gap:12px;padding:6px 18px 0;
  grid-template-columns:262px minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"opps opps opps" "events stage market" "me hand hand"}
#opps{grid-area:opps;display:flex;justify-content:center;gap:14px}
#opps .camp{flex:0 1 330px}#opps.n1 .camp{flex-basis:440px}

/* camps */
.camp{position:relative;min-width:0;border-radius:15px;color:var(--ink);background:linear-gradient(180deg,rgba(250,243,227,.98),rgba(237,222,190,.98));box-shadow:var(--shadow-1);transition:box-shadow .2s,transform .2s}
.camp-banner{display:flex;align-items:center;gap:8px;min-height:38px;padding:5px 10px;border-radius:15px 15px 0 0;color:#fff;background-color:var(--civ);background-image:var(--motif);font-family:var(--f-sc);font-weight:700}
.camp-banner .crest{flex:0 0 auto;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.cname{font-size:18px;text-shadow:0 1px 0 rgba(0,0,0,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.csub{font-size:14px;opacity:.85}
.relic{margin-left:auto;font-family:var(--f-ui);font-weight:700;font-size:12.5px;padding:2px 9px;border-radius:999px;background:rgba(0,0,0,.28);white-space:nowrap;cursor:help}
.flag{font-family:var(--f-ui);font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--gold-hi);color:#2b1d05}
.flag.out{background:#333;color:#fff}
.relic.mine-relic{margin:0;background:rgba(106,63,176,.12);color:#4a2783}
.camp-body{display:flex;align-items:center;gap:10px;padding:8px 10px 10px}
.hpgem{--p:100;position:relative;flex:0 0 auto;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;cursor:help;
  background:conic-gradient(var(--verm) calc(var(--p)*1%),rgba(60,30,30,.16) 0)}
.hpgem::before{content:'';position:absolute;inset:5px;border-radius:50%;background:radial-gradient(circle at 40% 32%,#fffbf1,#efdfbc);box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.hpgem b{position:relative;font-family:var(--f-num);font-size:25px;line-height:1;color:#7c1d12}
.hpgem small{position:absolute;bottom:7px;font-family:var(--f-num);font-weight:700;font-size:10.5px;color:var(--ink-3)}
.works{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.works .none{font-size:13px;color:var(--ink-3)}
.work{position:relative;display:inline-grid;place-items:center;min-width:34px;height:32px;padding:0 6px;border-radius:6px;cursor:help;font-family:var(--f-num);font-weight:800;font-size:16px;color:#2d2a26;
  background:linear-gradient(#d8d0c0,#ada18c);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.5),0 1px 2px rgba(0,0,0,.4)}
.work.thorns{background:linear-gradient(#c9b9a6,#8f7a63);color:#fff}
.work.sacred{background:linear-gradient(#f4ead0,#d5bf88)}
.work.regen{background:linear-gradient(#cfdcc4,#93a982)}
.work.income{background:linear-gradient(#f7e3a2,#d1a63e)}
.work.fortress{background:linear-gradient(#bdb3a5,#7f7465);color:#fff}
.work.wonder{display:inline-flex;gap:4px;padding:0 8px;background:linear-gradient(#ffe9a6,#e0b14b)}
.work.wonder em{font-style:normal;font-size:11px;font-weight:700;padding:0 5px;border-radius:999px;background:#5a3a08;color:#ffe9a6}
.stash{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:0 0 auto}
.coin{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-num);font-weight:800;font-size:16px;color:#6b4a00;cursor:help}
.coin .sym{width:20px;height:20px}
.backs{display:inline-flex;align-items:center;font-size:13px;color:var(--ink-2);cursor:help}.backs b{margin-left:9px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:1px 8px 1px 2px;border-radius:999px;background:rgba(106,63,176,.12);color:#4a2783;cursor:help}
.tag .sym{width:16px;height:16px}.tag.hot{background:#6a3fb0;color:#fff}.tag.imp{background:linear-gradient(90deg,#3a1b70,#7445bd);color:#ffe9a6}
.tokens{display:flex;flex-wrap:wrap;gap:5px;padding:0 10px 8px}
.token{font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:#1f4e79;color:#fff;cursor:help}.token.camel{background:#a8743a}
.camp.turn{box-shadow:0 0 0 2px var(--gold-hi),0 0 28px rgba(246,217,137,.45),var(--shadow-1)}
.camp.targetable{cursor:crosshair;box-shadow:0 0 0 3px #ff8a66,0 0 26px rgba(255,138,102,.55),var(--shadow-1)}
.camp.targetable.hot{transform:translateY(-4px);box-shadow:0 0 0 4px #ffb199,0 0 34px rgba(255,138,102,.75),var(--shadow-1)}
.camp.out{filter:grayscale(.9) brightness(.72)}
.camp.hit{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.chips{position:absolute;left:50%;top:-13px;transform:translateX(-50%);display:flex;gap:4px;z-index:6;pointer-events:none;white-space:nowrap}
.chip{font-family:var(--f-num);font-weight:800;font-size:13.5px;padding:2px 9px;border-radius:999px;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.chip.dmg{background:#ffe0d6;color:#9e2312}.chip.heal{background:#d9f2e3;color:#16613b}.chip.gold{background:#fff0c2;color:#6f4f00}.chip.wall{background:#e1e8f2;color:#344866}.chip.card{background:#e2e5fb;color:#2a3796}.chip.ko{background:#9e2312;color:#fff}
.floats{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center;z-index:7}
.float{position:absolute;font-family:var(--f-num);font-weight:800;font-size:30px;white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.3),0 0 12px rgba(255,255,255,.7);animation:floatup 1.5s ease-out forwards}
.float.dmg{color:#c42a17}.float.heal{color:#1f8a4c}.float.wall{color:#3c5170;font-size:23px}.float.gold{color:#9a6a00;font-size:22px}.float.info{color:#5b2a96;font-size:21px}.float.big{font-size:40px}
@keyframes floatup{0%{transform:translateY(10px) scale(.6);opacity:0}15%{transform:none scale(1.1);opacity:1}100%{transform:translateY(-48px);opacity:0}}

/* centre of the table */
#events{grid-area:events;align-self:center;display:flex;flex-direction:column;gap:10px}
.ev{border-radius:13px;padding:10px 13px;color:var(--ink);background:linear-gradient(180deg,var(--vellum),var(--vellum-2));box-shadow:var(--shadow-1)}
.ev .when{font-size:13px;font-weight:700;color:var(--ink-3)}
.ev h4{margin:1px 0 3px;font-family:var(--f-sc);font-size:19px;line-height:1.1}
.ev p{margin:0;font-size:14px;line-height:1.3}
.ev.now{border-left:5px solid var(--verm)}.ev.next{border-left:5px solid var(--steel);opacity:.9}
.ev.flip{animation:flip .55s ease-out}
@keyframes flip{0%{transform:perspective(600px) rotateY(80deg);opacity:0}100%{transform:none;opacity:1}}
.ev-warn{font-size:13px;font-weight:700;padding:6px 10px;border-radius:10px;background:#7c1d12;color:#ffe3d9}
#stage{grid-area:stage;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
#stage .rose{position:absolute;width:min(48vh,380px);aspect-ratio:1;background:var(--rose) center/contain no-repeat;opacity:.55;pointer-events:none}
#stage-card{position:relative;min-height:10px;display:flex;justify-content:center}
.stage-fit{transform-origin:top center}
#stage-card .card.pop{animation:pop .3s ease-out}
@keyframes pop{from{transform:scale(.82);opacity:.2}to{transform:none;opacity:1}}
#stage-caption{position:relative;margin-top:10px;font-family:var(--f-sc);font-weight:700;font-size:17px;color:var(--gold-hi);text-shadow:0 1px 0 #061226;min-height:24px;text-align:center}
#market{grid-area:market;align-self:center;border-radius:15px;padding:10px 12px 12px;background:rgba(8,22,46,.5);box-shadow:inset 0 0 0 1px rgba(246,217,137,.22)}
#market h3{margin:0 0 8px;font-family:var(--f-sc);font-size:19px;color:var(--gold-hi)}
.mk-row{display:flex;gap:8px;justify-content:space-between;padding-bottom:12px}
.mk-item{border:0;padding:0;background:none;cursor:default;border-radius:10px}
.mk-item.can{cursor:pointer}.mk-item.can .card{box-shadow:0 0 0 2px var(--gold-hi),0 0 18px rgba(246,217,137,.5)}
.mk-item.can:hover .card{transform:translateY(-4px)}
.mk-note{margin:2px 0 0;font-size:13px;color:#d8e1f1;line-height:1.3}
#me{grid-area:me;align-self:end;padding-bottom:12px}
.camp.mine .camp-body{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"hp stash" "works works";gap:8px 10px}
.camp.mine .hpgem{grid-area:hp;width:68px;height:68px}.camp.mine .hpgem b{font-size:29px}
.camp.mine .stash{grid-area:stash;align-items:flex-start}.camp.mine .works{grid-area:works}
.camp.mine .piles{padding:0 10px 10px}
.piles{display:flex;gap:6px}
.pile{border:0;cursor:pointer;font-family:var(--f-ui);font-weight:700;font-size:13px;padding:5px 10px;border-radius:9px;color:var(--ink);background:rgba(0,0,0,.07);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);min-height:34px}
.pile:hover{background:rgba(0,0,0,.12)}
#handzone{grid-area:hand;position:relative;align-self:end}
#prompt{text-align:center;font-family:var(--f-sc);font-weight:700;font-size:17px;color:var(--gold-hi);min-height:26px;text-shadow:0 1px 0 #061226}
#hand{position:relative;display:flex;justify-content:center;align-items:flex-end;height:246px;padding:0 20px 12px}
#hand .card{margin:0 -16px;transform:translateY(var(--y,0)) rotate(var(--rot,0deg));transform-origin:50% 115%;transition:transform .16s ease,box-shadow .16s ease,filter .16s}
#hand .card.playable{cursor:pointer}
#hand .card.playable:hover,#hand .card.playable:focus-visible{transform:translateY(-30px) scale(1.07);z-index:5}
#hand .card.sel{transform:translateY(-46px) scale(1.1);z-index:6;box-shadow:0 0 0 2px var(--gold-hi),0 0 30px rgba(246,217,137,.75),0 14px 30px rgba(0,0,0,.55)}
#hand .card.dim{filter:saturate(.7) brightness(.86)}
.hand-empty{align-self:center;color:#c9d4ea;font-style:italic}

/* drawer, sheets, tooltips, coach, banner */
.drawer{position:absolute;top:56px;right:0;bottom:0;width:330px;z-index:30;padding:16px;overflow:auto;transform:translateX(105%);transition:transform .25s ease;
  background:linear-gradient(180deg,rgba(14,32,62,.98),rgba(9,23,47,.99));box-shadow:-14px 0 32px rgba(0,0,0,.4)}
.drawer.open{transform:none}
.drawer h3{margin:0 0 10px;font-family:var(--f-sc);font-size:20px;color:var(--gold-hi)}
.log{list-style:none;margin:0;padding:0}.log li{padding:7px 0;border-bottom:1px solid rgba(246,217,137,.12);font-size:14.5px;line-height:1.35;color:#dbe3f2}.log li.r{color:var(--gold-hi);font-family:var(--f-sc);font-weight:700}
.log .kw{filter:brightness(1.6) saturate(.9)}
.sheet-wrap{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:18px;background:rgba(4,11,25,.66)}
.sheet-panel{width:min(780px,100%);max-height:88dvh;overflow:auto;border-radius:18px;padding:20px 22px;color:var(--ink);background:linear-gradient(180deg,var(--vellum),var(--vellum-2));box-shadow:0 26px 70px rgba(0,0,0,.6)}
.sheet-panel h2{margin:0 0 6px;font-family:var(--f-sc);font-size:30px;line-height:1.1;color:#3a1f12}
.sheet-panel h3{margin:16px 0 6px;font-family:var(--f-sc);font-size:19px;color:#3a1f12}
.sheet-panel p{line-height:1.45;font-size:15.5px;margin:6px 0}
.muted{color:var(--ink-3)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.row.center{justify-content:center}

<script>

/* ── Medieval Mayhem ──
   Demo game #4 for Sonic Hub Pages: a light card brawl where every medieval civilization has its own deck.
   Cards speak in symbols; shared symbols recur across decks, some belong to a few civs, some to one.
   The engine is pure (state S, seeded RNG, no DOM) so sim.js can play thousands of AI games to balance it. */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
function rnd(S) {
  let t = (S.rs = (S.rs + 0x6D2B79F5) >>> 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const pick = (S, arr) => arr[Math.floor(rnd(S) * arr.length)];
function wpick(S, entries) {
  let tot = 0; for (const e of entries) tot += Math.max(0, e[1]);
  if (tot <= 0) return entries[0][0];
  let r = rnd(S) * tot;
  for (const e of entries) { r -= Math.max(0, e[1]); if (r <= 0) return e[0]; }

}

const sumObj = o => Object.values(o).reduce((a, b) => a + b, 0);

/* ── Content. Nothing here is a rule about regions: symbols go wherever history puts them. ── */

/* each symbol resolves into steps; a card resolves its symbols left to right */

const UNIQUE = {

/* ── Sounds: drums, horns and steel, synthesized with WebAudio ── */
const SFX = {
  ctx: null, on: true,
  init() { if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; } try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); } catch (e) { } },
  tone(f, t0, dur, type = 'sine', vol = 0.12, slide = 0) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(t0, dur, vol = 0.1, freq = 900, type = 'highpass') {
    const c = this.ctx, n = Math.floor(c.sampleRate * dur), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(), t = c.currentTime + t0;
    f.type = type; f.frequency.value = freq; g.gain.value = vol; s.buffer = b; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
  },
  play(name) {
    if (!this.on) return;
    this.init(); if (!this.ctx) return;
    switch (name) {
      case 'click': this.noise(0, 0.03, 0.05, 2500); break;
      case 'whoosh': this.noise(0, 0.18, 0.05, 1200); break;
      case 'crown': [523, 659, 784, 1047].forEach((f, i) => this.tone(f, i * 0.1, 0.45, 'triangle', 0.08)); break;
      case 'card': this.noise(0, 0.08, 0.07, 1800); this.tone(660, 0.02, 0.06, 'triangle', 0.04); break;
      case 'hit': this.noise(0, 0.12, 0.14, 700); this.tone(140, 0, 0.18, 'square', 0.06, -60); break;
      case 'wall': this.noise(0, 0.25, 0.12, 300, 'lowpass'); this.tone(90, 0, 0.3, 'sine', 0.2, -30); break;
      case 'heal': [523, 784].forEach((f, i) => this.tone(f, i * 0.07, 0.25, 'sine', 0.07)); break;
      case 'turn': this.tone(392, 0, 0.18, 'triangle', 0.07); this.tone(523, 0.12, 0.25, 'triangle', 0.07); break;
      case 'quill': this.noise(0, 0.09, 0.05, 3500); break;
      case 'coin': [1318, 1760].forEach((f, i) => this.tone(f, i * 0.06, 0.12, 'triangle', 0.06)); break;
      case 'bad': this.tone(196, 0, 0.18, 'sawtooth', 0.04, -40); break;
      case 'drum': [0, 0.18, 0.36, 0.48].forEach(t => { this.tone(70, t, 0.22, 'sine', 0.35, -30); this.noise(t, 0.08, 0.08, 400, 'lowpass'); }); break;
      case 'horn': this.tone(196, 0, 0.9, 'sawtooth', 0.05); this.tone(294, 0.05, 0.85, 'sawtooth', 0.035); this.tone(392, 0.5, 0.6, 'triangle', 0.04); break;
      case 'clash': for (let i = 0; i < 4; i++) { this.noise(i * 0.09, 0.12, 0.12, 3000); this.tone(1200 + i * 230, i * 0.09, 0.15, 'square', 0.02); } break;
      case 'age': [262, 330, 392, 523, 659].forEach((f, i) => this.tone(f, i * 0.12, 0.5, 'triangle', 0.08)); this.tone(131, 0, 1.2, 'sawtooth', 0.03); break;
      case 'win': [392, 523, 659, 784, 1046].forEach((f, i) => this.tone(f, i * 0.14, 0.6, 'triangle', 0.09)); break;
      case 'lose': [392, 349, 311, 262].forEach((f, i) => this.tone(f, i * 0.28, 0.6, 'triangle', 0.09)); break;
    }
  },
};

/* colour helpers */
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix(h1, h2, t) { const a = hexRgb(h1), b = hexRgb(h2); return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
function rgba(h, a) { const [r, g, b] = hexRgb(h); return `rgba(${r},${g},${b},${a})`; }
function tileURL(name, a, b) {
  const [w, h, inner] = MOTIF_TILES[name](a, b);
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='${w}' height='${h}' viewBox='0 0 ${w} ${h}'>${inner.replace(/"/g, "'")}</svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}
function installCivStyles() {
  let css = '';

    const light = mix(color, '#ffffff', 0.42), deep = mix(color, '#000000', 0.38);
    css += `.${cls}{--civ:${color};--civ-deep:${deep};--civ-light:${light};--civ-wash:${rgba(color, 0.12)};--motif:${tileURL(motif, rgba('#ffffff', 0.38), rgba('#ffffff', 0.08))};--motif-soft:${tileURL(motif, rgba(color, 0.2), 'none')};--motif-gold:${tileURL(motif, rgba('#f2cf73', 0.55), rgba('#f2cf73', 0.1))}}\n`;
  };
  for (const c of CIV_ORDER) add('civ-' + c, CIVS[c].color, CIV_MOTIF[c] || 'diaper');
  add('civ-merc', '#7a6542', 'brass');
  const el = document.createElement('style'); el.id = 'civ-styles'; el.textContent = css; document.head.appendChild(el);
}

}
function newMatch(o = {}) {
  const civ = o.civ || UI.civ, n = o.n || UI.n, seed = o.tutorial ? 20261005 : (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
  const others = o.opps || shuffled({ rs: seed }, CIV_ORDER.filter(c => c !== civ)).slice(0, n - 1);
  S = newGame({ seed, civs: [civ, ...others], ai: [false, ...others.map(() => true)] });
  for (const P of S.players.slice(1)) { P.skill = o.tutorial ? 'easy' : SET.difficulty; chooseRelic(S, P.id, aiRelic(S, P)); }
  Object.assign(UI, { sel: null, hoverT: null, last: null, view: null, busy: false, finished: false, round: 1, drawer: false, tutorial: null, lastSetup: o });
  $('#chronicle').classList.remove('open');
  go('match'); renderMatch();
  if (o.tutorial) { chooseRelic(S, 0, 'jade'); beginMatch(); startTutorial(); } else relicSheet();
}
function beginMatch() { closeSheet(); startGame(S); renderMatch(); banner('Round 1', 'You go first; every opponent starts with 1 extra card'); SFX.play('turn'); }

/* the human */
function onHandCard(uid) {
  if (!isMyTurn()) return;
  const c = S.players[0].hand.find(x => x.uid === uid); if (!c) return;
  if (UI.sel !== uid) { UI.sel = uid; UI.hoverT = null; clearAim(); SFX.play('click'); renderMatch(); coachEvent('select'); return; }
  const opps = opponents(S, S.players[0]);
  if (needsTarget(c)) { if (opps.length === 1) return humanPlay(uid, opps[0].id); if (UI.hoverT != null) return humanPlay(uid, UI.hoverT); UI.sel = null; clearAim(); return renderMatch(); }
  humanPlay(uid, null);
}
function aiming() { const c = selCard(); return !!(c && isMyTurn() && needsTarget(c) && opponents(S, S.players[0]).length > 1); }
function onCamp(pid, touch) {
  if (!aiming() || pid === 0 || !S.players[pid].alive) return;
  if (touch && UI.hoverT !== pid) return setAimTarget(pid);
  humanPlay(UI.sel, pid);
}
function setAimTarget(pid) {
  if (UI.hoverT === pid) return;
  UI.hoverT = pid;
  $$('.camp.targetable').forEach(el => el.classList.toggle('hot', +el.dataset.pid === pid));
  renderStage(); renderPreview();
}
async function humanPlay(uid, tid) {
  const el = document.querySelector(`#hand .card[data-uid="${uid}"]`), from = el ? el.getBoundingClientRect() : null;
  UI.busy = true; clearAim(); UI.view = S.players.map(p => p.hp);
  const ev = playCard(S, 0, uid, tid);
  if (!ev) { UI.busy = false; UI.view = null; return renderMatch(); }
  coachEvent('play');
  await animatePlay(ev, 0, from);
  UI.busy = false;
  if (S.winner != null || !S.players[0].alive) return finish();
  if (S.plays > 0 && S.players[0].hand.length) return renderMatch();
  nextTurn();
}
async function humanBuy(i) {
  if (!isMyTurn()) return;
  const card = S.market[i], el = document.querySelector(`.mk-item[data-mi="${i}"]`), from = el ? el.getBoundingClientRect() : null;
  if (!card || !buy(S, 0, i)) return;
  closeSheet(); UI.busy = true; SFX.play('coin'); renderMatch();
  await animateBuy(card, 0, from);
  UI.busy = false; renderMatch(); coachEvent('buy');
}
/* turns */
async function nextTurn() {
  UI.busy = true; UI.sel = null; renderMatch(); await wait(D(380));
  const round = S.round; endTurn(S);
  if (S.round !== round && S.winner == null) await roundStart();
  if (S.winner != null || !S.players[0].alive) return finish();
  if (S.turn === 0) return myTurnStart();
  return aiTurn();
}
async function roundStart() {
  UI.flipEvent = true; renderMatch(); SFX.play('quill');
  const E = EVENT_BY[S.event]; banner(`Round ${S.round}`, `${E.name}: ${E.text}`, 2000);
  await wait(D(1100));
}
function myTurnStart() {
  UI.busy = false; UI.sel = null; renderMatch(); SFX.play('turn');
  const me = S.players[0];
  coachEvent('turn');
  if (me.ageGiven && !me.aged && me.turns === RULES.ageTurn) { banner('The Imperial Age', 'Your Imperial Age card has arrived', 2000); coachEvent('agecard'); }
  if (!me.hand.length) nextTurn();
}
async function aiTurn() {
  const pid = S.turn, P = S.players[pid];
  renderMatch(); await wait(D(500));
  for (let guard = 0; guard < 30 && S.winner == null && S.turn === pid; guard++) {
    const a = aiAct(S, pid);
    if (a.kind === 'buy') {
      const card = S.market[a.idx], el = document.querySelector(`.mk-item[data-mi="${a.idx}"]`), from = el ? el.getBoundingClientRect() : document.getElementById('stage').getBoundingClientRect();
      if (buy(S, pid, a.idx)) { SFX.play('coin'); renderMatch(); await animateBuy(card, pid, from); renderMatch(); await wait(D(200)); continue; }
    }
    if (a.kind === 'play') {
      const camp = document.getElementById('camp-' + pid), from = camp ? camp.getBoundingClientRect() : null;
      UI.view = S.players.map(p => p.hp);
      const ev = playCard(S, pid, a.uid, a.target);
      if (ev) { await animatePlay(ev, pid, from); if (S.winner != null || !S.players[0].alive) return finish(); if (S.plays > 0 && P.hand.length && P.alive) continue; }
      else UI.view = null;
    }
    break;
  }
  if (S.winner != null || !S.players[0].alive) return finish();
  return nextTurn();
}
function finish() {
  if (UI.finished) return; UI.finished = true; UI.busy = true; renderMatch();
  const me = S.players[0], win = S.winner === 0, r = SET.stats[me.civ] || [0, 0];
  if (!UI.lastSetup.tutorial) { r[1]++; if (win) r[0]++; SET.stats[me.civ] = r; }
  if (UI.tutorial) endTutorial();
  saveSettings();
  setTimeout(() => { SFX.play(win ? 'win' : 'lose'); resultsSheet(); }, D(700) + 400);
}
function toggleChronicle(force) { UI.drawer = force != null ? force : !UI.drawer; $('#chronicle').classList.toggle('open', UI.drawer); if (UI.drawer) renderChronicle(); }
function cycleSpeed() { SET.speed = SPEED_ORDER[(SPEED_ORDER.indexOf(SET.speed) + 1) % SPEED_ORDER.length]; saveSettings(); if (S) renderTopbar(); }

/* input */
document.addEventListener('click', e => {
  SFX.init();
  const act = e.target.closest('[data-act]'), touch = e.pointerType === 'touch' || matchMedia('(pointer: coarse)').matches;
  if (act) return action(act.dataset.act, act);
  const t = e.target.closest('.civ-tile, [data-n], [data-diff], [data-set], .relic-pick, .mk-item, #hand .card, .camp');
  if (!t) { if (e.target.id === 'sheet' && !$('#sheet').dataset.lock) closeSheet(); return; }
  if (t.classList.contains('civ-tile')) { UI.civ = t.dataset.civ; SET.civ = UI.civ; saveSettings(); SFX.play('click'); const y = $('.sel-list').scrollTop; renderSelect(); $('.sel-list').scrollTop = y; return; }
  if (t.dataset.n) { UI.n = +t.dataset.n; SET.n = UI.n; saveSettings(); const y = $('.sel-list').scrollTop; renderSelect(); $('.sel-list').scrollTop = y; return; }
  if (t.dataset.diff) { SET.difficulty = t.dataset.diff; saveSettings(); const y = $('.sel-list').scrollTop; renderSelect(); $('.sel-list').scrollTop = y; return; }
  if (t.dataset.set) { const v = t.dataset.val; SET[t.dataset.set] = v === 'true' ? true : v === 'false' ? false : v; SFX.on = SET.sound; saveSettings(); settingsSheet(); if (S && UI.screen === 'match') renderTopbar(); return; }
  if (t.classList.contains('relic-pick')) { chooseRelic(S, 0, t.dataset.relic); return beginMatch(); }
  if (t.classList.contains('mk-item')) { if (t.classList.contains('can')) humanBuy(+t.dataset.mi); return; }
  if (t.matches('#hand .card')) return onHandCard(+t.dataset.uid);
  if (t.classList.contains('camp')) return onCamp(+t.dataset.pid, touch);
});
function action(a, el) {
  switch (a) {
    case 'tutorial': return newMatch({ civ: 'franks', n: 2, opps: ['japanese'], tutorial: true });
    case 'quick': return newMatch({ civ: UI.civ, n: UI.n });
    case 'choose': return go('select');
    case 'menu': return go('menu');
    case 'start': return newMatch({ civ: UI.civ, n: UI.n });
    case 'again': return newMatch(UI.lastSetup.tutorial ? { civ: UI.civ, n: UI.n } : UI.lastSetup);
    case 'random-civ': UI.civ = CIV_ORDER[Math.floor(Math.random() * CIV_ORDER.length)]; SET.civ = UI.civ; saveSettings(); return renderSelect();
    case 'settings': return settingsSheet();
    case 'tutorial-reset': SET.tutorialDone = false; saveSettings(); return settingsSheet();
    case 'pause': return pauseSheet();
    case 'help': return helpSheet();
    case 'close': closeSheet(); return UI.screen === 'menu' ? renderMenu() : null;
    case 'concede': UI.tutorial = null; $('#coach').classList.add('hidden'); return go('menu');
    case 'chronicle': return toggleChronicle();
    case 'speed': return cycleSpeed();
    case 'deck': return deckSheet('deck');
    case 'discard': return deckSheet('discard');
    case 'events': return mobileSheet('events');
    case 'market': return mobileSheet('market');
    case 'coach-next': return coachNext();
    case 'coach-skip': return endTutorial();
  }
}
document.addEventListener('pointermove', e => {
  if (!aiming() || e.pointerType === 'touch') return;
  const camp = e.target.closest('.camp.targetable');
  setAimTarget(camp ? +camp.dataset.pid : null);
  const cardEl = document.querySelector(`#hand .card[data-uid="${UI.sel}"]`);
  if (camp) { const r = camp.getBoundingClientRect(); aim(cardEl && cardEl.getBoundingClientRect(), r.left + r.width / 2, r.top + r.height / 2); }
  else aim(cardEl && cardEl.getBoundingClientRect(), e.clientX, e.clientY);
});
document.addEventListener('keydown', e => {
  if (UI.screen !== 'match' || !S) return;
  const sheetOpen = !$('#sheet').classList.contains('hidden');
  if (e.key === 'Escape') { if (sheetOpen) { if (!$('#sheet').dataset.lock) closeSheet(); return; } if (UI.sel != null) { UI.sel = null; UI.hoverT = null; clearAim(); return renderMatch(); } return pauseSheet(); }
  if (sheetOpen) return;
  const k = e.key.toLowerCase();
  if (/^[1-9]$/.test(e.key)) { const c = S.players[0].hand[+e.key - 1]; if (c) onHandCard(c.uid); }
  else if (e.key === 'Enter' && UI.sel != null) { e.preventDefault(); onHandCard(UI.sel); }
  else if (e.key === 'Tab' && aiming()) { e.preventDefault(); const o = opponents(S, S.players[0]).map(p => p.id), i = o.indexOf(UI.hoverT); UI.hoverT = null; setAimTarget(o[(i + 1) % o.length]); clearAim(); }
  else if (k === 'l') toggleChronicle();
  else if (k === 's') cycleSpeed();
  else if (k === 'h') helpSheet();
});
addEventListener('resize', () => { if (UI.screen === 'match' && S && !UI.busy) renderMatch(); });
installCivStyles(); installTableArt(); go('menu');

</script>
