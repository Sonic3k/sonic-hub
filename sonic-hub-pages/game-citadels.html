<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151a28">
<title>Masks &amp; Mortar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Metamorphous&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>/* ── Masks & Mortar · a city by lantern light ──
   A night square of blue stone lit by two lanterns. Along the top runs the calling track, one medallion per rank; the rivals
   sit on parchment plaques; the middle of the square is where characters step forward and districts are shown; your own
   plaque, city and hand fill the bottom. District cards wear the colour of their type, characters the colour they collect for. */
:root{
  --ink:#24180f;--ink-2:#57473a;--ink-3:#8a7866;--parch:#f2e5c8;--parch-hi:#fbf3e1;--parch-lo:#dcc8a1;
  --gold:#d6a73e;--gold-hi:#f4d68b;--gold-lo:#8a6417;--blood:#9a2a2e;--night:#1b2133;
  --f-head:'Metamorphous',Georgia,serif;--f-text:'Alegreya Sans',system-ui,-apple-system,sans-serif;
  --cw:134px;--ch:188px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:#12151f;overscroll-behavior:none}
body{font-family:var(--f-text);color:var(--parch);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
.hidden{display:none!important}
#app{position:relative;height:100%;overflow:hidden;background:
  radial-gradient(ellipse 36% 46% at 6% 0%,rgba(255,168,80,.27),rgba(255,168,80,0) 70%),
  radial-gradient(ellipse 36% 46% at 94% 0%,rgba(255,168,80,.27),rgba(255,168,80,0) 70%),
  radial-gradient(ellipse 70% 52% at 50% 50%,rgba(255,206,150,.09),rgba(255,206,150,0) 70%),
  radial-gradient(ellipse 130% 100% at 50% 50%,rgba(0,0,0,0) 40%,rgba(0,0,0,.62) 100%),
  var(--stone-tex),linear-gradient(180deg,#252d42,#131722)}
.screen{position:relative;height:100%;z-index:1}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
#table,#topbar,#hand,.seat,.med,.btn,.icon-btn,.pick{touch-action:manipulation}
#screen-match{-webkit-user-select:none;user-select:none}
.ic{display:inline-block;vertical-align:-.18em;width:1.15em;height:1.15em;flex:0 0 auto}

/* buttons: burgundy leather with brass; parchment tags for the quieter ones */
.btn{font-family:var(--f-head);font-size:18px;line-height:1.1;min-height:46px;padding:10px 20px;border:0;border-radius:8px;cursor:pointer;color:#fdeccc;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--leather-tex),linear-gradient(#a8333f,#6f1b27);text-shadow:0 1px 0 rgba(0,0,0,.5);
  box-shadow:inset 0 0 0 1px rgba(255,214,150,.65),inset 0 0 0 3px rgba(100,24,32,.9),inset 0 0 0 4px rgba(255,214,150,.3),0 3px 0 #3f0d14,0 8px 18px rgba(0,0,0,.5)}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(1px)}
.btn.ghost{color:var(--ink);text-shadow:none;background:var(--parch-tex),linear-gradient(#f5ead1,#dcc79c);
  box-shadow:inset 0 0 0 1px rgba(36,24,15,.65),inset 0 0 0 3px rgba(251,243,225,.7),inset 0 0 0 4px rgba(154,42,46,.3),0 3px 0 #6f5a3a,0 8px 18px rgba(0,0,0,.4)}
.btn.blue{background:var(--leather-tex),linear-gradient(#3d5296,#222f64);box-shadow:inset 0 0 0 1px rgba(255,214,150,.65),inset 0 0 0 3px rgba(20,28,70,.9),inset 0 0 0 4px rgba(255,214,150,.3),0 3px 0 #10173a,0 8px 18px rgba(0,0,0,.5)}
.btn.small{font-size:16px;min-height:40px;padding:7px 14px}
.btn .ic{width:20px;height:20px}
.btn:disabled{opacity:.5;cursor:default;filter:grayscale(.5)}
.btn b{font-family:var(--f-text);font-weight:800}
.icon-btn{position:relative;width:44px;height:44px;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--gold-hi);flex:0 0 auto;
  background:radial-gradient(circle at 40% 35%,#3d4766,#171b2a);box-shadow:inset 0 0 0 1.5px var(--gold),inset 0 0 0 3.5px rgba(0,0,0,.45),0 2px 5px rgba(0,0,0,.55)}
.icon-btn svg{width:22px;height:22px}
.mob-only{display:none!important}

/* ── keywords print in their own colour ── */
.kw{font-weight:800;white-space:nowrap}
.kw .ic{width:1.05em;height:1.05em;margin-right:1px}
.kw-gold{color:#8a5f06}.kw-card{color:#4c3a78}.kw-crown{color:#8a5f06}
.kw-noble{color:#8a6408}.kw-religious{color:#22508f}.kw-trade{color:#2b6b31}.kw-military{color:#962a20}.kw-unique{color:#65359a}
.dark .kw-gold,.dark .kw-crown{color:#f4d06a}.dark .kw-card{color:#c9b7f0}.dark .kw-noble{color:#f0cf6c}.dark .kw-religious{color:#9cc0f3}.dark .kw-trade{color:#9fd59a}.dark .kw-military{color:#f29b8f}.dark .kw-unique{color:#d1b0f2}

/* ── cards: a district wears its type's colour, a character the colour it collects for ── */
.card{--w:var(--cw);--hh:var(--ch);position:relative;width:var(--w);height:var(--hh);flex:0 0 auto;user-select:none;color:var(--ink);filter:drop-shadow(0 5px 7px rgba(0,0,0,.5))}
.card .cf{position:absolute;inset:0;border-radius:calc(var(--w) * .075);padding:calc(var(--w) * .042);background-color:var(--h);background-image:linear-gradient(155deg,rgba(255,255,255,.24),rgba(0,0,0,.3));
  box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.65),inset 0 0 0 3px rgba(255,236,200,.4),inset 0 -8px 14px rgba(0,0,0,.25)}
.card .cb{position:relative;height:100%;display:flex;flex-direction:column;border-radius:calc(var(--w) * .05);overflow:hidden;
  background:var(--parch-tex),linear-gradient(180deg,var(--parch-hi),var(--parch) 62%,var(--parch-lo));box-shadow:inset 0 0 0 1px rgba(30,18,10,.75),inset 0 0 18px rgba(120,80,30,.22)}
.card .cn{position:relative;z-index:1;margin:0;padding:calc(var(--w) * .03) calc(var(--w) * .05) calc(var(--w) * .028) calc(var(--w) * .25);font-family:var(--f-head);font-size:calc(var(--w) * .098);line-height:1.04;color:#fff4dc;text-shadow:0 1px 0 rgba(0,0,0,.6);
  background:linear-gradient(90deg,var(--hd),var(--h));box-shadow:inset 0 -1px 0 rgba(0,0,0,.4),0 1px 0 rgba(255,236,200,.45);min-height:calc(var(--w) * .21);display:flex;align-items:center}
.card .cn span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .cart{position:relative;flex:0 0 49%;margin:0;background:radial-gradient(circle at 50% 48%,var(--hw) 0,var(--hw2) 70%,var(--hw3) 100%);box-shadow:inset 0 -1px 0 rgba(30,18,10,.45)}
.card .cart svg.art{position:absolute;left:6%;top:5%;width:88%;height:90%;color:var(--h);filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.card .ct{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:calc(var(--w) * .03) calc(var(--w) * .055) calc(var(--w) * .045);font-size:calc(var(--w) * .085);line-height:1.2}
.card .ct span{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card .ct .kind{font-weight:800;font-size:calc(var(--w) * .074);letter-spacing:.1em;text-transform:uppercase;color:var(--hd)}
/* the cost: a gold coin over the corner; the type: a gem in the opposite corner */
.card .cost{position:absolute;z-index:3;left:calc(var(--w) * -.035);top:calc(var(--w) * -.035);width:calc(var(--w) * .27);height:calc(var(--w) * .27);border-radius:50%;display:grid;place-items:center;
  font-weight:800;font-size:calc(var(--w) * .15);line-height:1;color:#4a2f04;background:radial-gradient(circle at 38% 32%,#fff1b8,#ebc04f 45%,#b98a1c);box-shadow:0 0 0 1.5px #5c3d08,inset 0 0 0 calc(var(--w) * .022) rgba(192,143,30,.75),0 2px 4px rgba(0,0,0,.5)}
.card .cost.free{font-size:calc(var(--w) * .12)}
.card .cost.off{color:#8a2412}
.card .tgem{position:absolute;z-index:3;right:calc(var(--w) * .055);top:calc(var(--w) * .052);width:calc(var(--w) * .13);height:calc(var(--w) * .13)}
.card .tgem svg{width:100%;height:100%;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.card .beau{position:absolute;z-index:3;right:calc(var(--w) * -.04);bottom:calc(var(--w) * .2);font-weight:800;font-size:calc(var(--w) * .085);padding:1px 5px;border-radius:3px;color:#4b3206;background:linear-gradient(#f7e2a3,#e1b955);box-shadow:0 1px 3px rgba(0,0,0,.5)}
.card .mus{position:absolute;z-index:3;left:calc(var(--w) * -.04);bottom:calc(var(--w) * .2);font-weight:800;font-size:calc(var(--w) * .085);padding:1px 5px;border-radius:3px;color:#fff;background:#5b3a8a;box-shadow:0 1px 3px rgba(0,0,0,.5)}
/* characters: the rank on a wax seal */
.card.cc .cn{padding-left:calc(var(--w) * .27)}
.card .rank{position:absolute;z-index:3;left:calc(var(--w) * -.03);top:calc(var(--w) * -.03);width:calc(var(--w) * .27);height:calc(var(--w) * .27);border-radius:50%;display:grid;place-items:center;font-family:var(--f-head);font-size:calc(var(--w) * .15);line-height:1;color:#fff4dc;text-shadow:0 1px 0 rgba(0,0,0,.6);
  background:radial-gradient(circle at 38% 32%,#d0564a,#9a2420 55%,#6a130f);box-shadow:0 0 0 1.5px #3a0906,inset 0 0 0 calc(var(--w) * .02) rgba(255,190,170,.35),0 2px 4px rgba(0,0,0,.5)}
.card.cc .ct{font-size:calc(var(--w) * .083)}
.card.cc .ct span{-webkit-line-clamp:5}
/* sizes */
.card.sm{--w:106px;--hh:148px}
.card.md{--w:118px;--hh:165px}
.card.lg{--w:200px;--hh:280px}
.card.lg .ct{font-size:16px}.card.lg.cc .ct{font-size:15.5px}
.card.xs{--w:74px;--hh:98px}
.card.xs .ct{display:none}.card.xs .cart{flex:1}.card.xs .cn{font-size:11px;padding:3px 4px 3px 20px;min-height:0}.card.xs .cn span{-webkit-line-clamp:1;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.xs .cost{width:22px;height:22px;font-size:12px;left:-5px;top:-5px}.card.xs .tgem{display:none}.card.xs .beau,.card.xs .mus{font-size:10px;padding:0 4px;bottom:4px}
.card.xs .rank{width:22px;height:22px;font-size:12px;left:-5px;top:-5px}
/* the back of a character card: a mask on plum */
.cback{position:relative;width:var(--w,var(--cw));height:var(--hh,var(--ch));border-radius:calc(var(--w,var(--cw)) * .075);flex:0 0 auto;
  background:radial-gradient(circle at 50% 42%,#7d5590,#3a2346 70%),#3a2346;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.65),inset 0 0 0 4px rgba(244,214,139,.55),inset 0 0 0 5.5px rgba(0,0,0,.4),0 6px 10px rgba(0,0,0,.5)}
.cback svg{position:absolute;left:18%;top:28%;width:64%;height:44%;color:#c9a0dc;opacity:.9}

/* ── the table ── */
#screen-match{display:flex;flex-direction:column}
#topbar{flex:0 0 auto;height:52px;display:flex;align-items:center;gap:10px;padding:0 12px;position:relative;z-index:5;
  background:var(--leather-tex),linear-gradient(180deg,#323a55,#1a1f30);box-shadow:inset 0 -1px 0 rgba(244,214,139,.38),inset 0 -3px 0 rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.5)}
.tb-mid{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;min-width:0}
.tb-right{display:flex;gap:8px;align-items:center}
.pill{font-family:var(--f-head);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--gold-hi);padding:4px 14px;border-radius:4px;background:rgba(0,0,0,.3);box-shadow:inset 0 0 0 1px rgba(244,214,139,.3)}
.pill.you{color:#fdeccc;background:linear-gradient(#a8333f,#6f1b27);box-shadow:inset 0 0 0 1px rgba(255,214,150,.55)}
.speed{min-width:58px;height:44px;border:0;border-radius:22px;cursor:pointer;font-family:var(--f-head);font-size:16px;color:var(--gold-hi);background:radial-gradient(circle at 40% 35%,#3d4766,#171b2a);box-shadow:inset 0 0 0 1.5px var(--gold),0 2px 5px rgba(0,0,0,.55)}
#table{flex:1;min-height:0;display:grid;gap:8px 14px;padding:6px 16px 0;
  grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto minmax(0,1fr) auto auto;
  grid-template-areas:"track track" "opps opps" "stage stage" "me act" "hand hand"}

/* the calling track: one medallion per rank, in calling order */
#track{grid-area:track;display:flex;justify-content:center;align-items:flex-start;gap:6px;min-width:0}
.med{position:relative;width:76px;padding:2px 0 0;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--parch)}
.med .disc{position:relative;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,var(--hw),var(--hw3));transition:transform .25s,box-shadow .25s,filter .25s;
  box-shadow:0 0 0 2px rgba(0,0,0,.55),0 0 0 3.5px var(--h),0 0 0 5px rgba(0,0,0,.35),0 4px 8px rgba(0,0,0,.5)}
.med .disc svg{width:42px;height:42px;color:var(--h)}
.med .rk{position:absolute;z-index:2;left:6px;top:-2px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-head);font-size:12.5px;line-height:1;color:#fff4dc;
  background:radial-gradient(circle at 38% 32%,#d0564a,#9a2420 55%,#6a130f);box-shadow:0 0 0 1.2px #3a0906,0 1px 3px rgba(0,0,0,.6)}
.med .nm{max-width:100%;font-size:12.5px;font-weight:700;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 0 #000,0 0 6px rgba(0,0,0,.8)}
.med .who{min-height:15px;max-width:100%;display:flex;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:800;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#d9c9a8;text-shadow:0 1px 0 #000}
.med .who .badge{width:14px;height:14px;font-size:9px}
.med .marks{position:absolute;z-index:3;right:2px;top:-4px;display:flex;flex-direction:column;gap:1px}
.med .marks .ic{width:19px;height:19px;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.7))}
.med .marks .ic.real{filter:drop-shadow(0 0 3px #ffd36a) drop-shadow(0 1px 1.5px rgba(0,0,0,.7))}
.med .taxpot{position:absolute;z-index:3;left:0;bottom:30px;font-weight:800;font-size:11px;padding:0 4px;border-radius:7px;color:#4a2f04;background:#f4d06a;box-shadow:0 1px 2px rgba(0,0,0,.6)}
.med.up .disc{filter:grayscale(.85) brightness(.55);box-shadow:0 0 0 2px rgba(0,0,0,.55),0 0 0 3.5px #6b6b6b}
.med.up .nm{text-decoration:line-through;opacity:.6}
.med.past .disc{filter:saturate(.55) brightness(.72)}
.med.past.had .disc{filter:none}
.med.nobody .who{opacity:.6;font-style:italic;font-weight:400}
.med.now .disc{transform:scale(1.12);box-shadow:0 0 0 2px rgba(0,0,0,.55),0 0 0 3.5px var(--gold-hi),0 0 0 6px rgba(244,214,139,.35),0 0 26px rgba(255,214,130,.85)}
.med.now .nm{color:var(--gold-hi)}
.med.mine .disc::after{content:'';position:absolute;inset:-7px;border-radius:50%;border:2px dashed rgba(244,214,139,.85);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.med.killed .disc{filter:grayscale(.8) brightness(.6) sepia(.3)}
.med.ping .disc{animation:ping .6s ease-out}
@keyframes ping{40%{transform:scale(1.25)}}

/* seats: a parchment plaque per player; the badge's colour is the player's own */
#opps{grid-area:opps;display:flex;justify-content:center;gap:10px;min-width:0}
.seat{position:relative;flex:0 1 230px;min-width:0;border-radius:8px;color:var(--ink);cursor:pointer;background:var(--parch-tex),linear-gradient(180deg,var(--parch-hi),var(--parch));transition:box-shadow .2s,transform .2s;
  box-shadow:inset 0 0 0 1px rgba(36,24,15,.75),inset 0 0 0 3px rgba(251,243,225,.6),inset 0 0 0 4px rgba(0,0,0,.18),0 8px 20px rgba(0,0,0,.5)}
.seat-head{display:flex;align-items:center;gap:6px;min-height:34px;padding:4px 8px;border-radius:8px 8px 0 0;color:#fff4dc;background:var(--leather-tex),linear-gradient(180deg,#46405a,#2a2536);box-shadow:inset 0 -2px 0 rgba(0,0,0,.35)}
.badge{flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:inline-grid;vertical-align:middle;place-items:center;font-weight:800;font-size:12.5px;line-height:1;color:#fff;background:var(--pc,#666);box-shadow:0 0 0 1.5px rgba(0,0,0,.5),0 0 0 2.5px rgba(255,236,200,.6)}
.seat-head b{flex:1;min-width:0;font-family:var(--f-head);font-weight:400;font-size:17px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 0 rgba(0,0,0,.6)}
.seat-head .ic.i-crown{width:22px;height:22px;filter:drop-shadow(0 0 4px rgba(255,214,120,.7))}
.flag{flex:0 0 auto;font-weight:800;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:3px;background:var(--gold-hi);color:#2a1a06}
.flag.done{background:#3f8f45;color:#fff}
.seat-row{display:flex;align-items:center;gap:8px;padding:6px 9px 0}
.chars{display:flex;gap:3px;flex:0 0 auto}
.seat-head .chars:empty{display:none}
.seat:not(.mine) .chip{padding:0;height:24px;border-radius:12px}.seat:not(.mine) .chip .t{display:none}.seat:not(.mine) .chip .cd{width:24px;height:24px}.seat:not(.mine) .chip .cd svg{width:20px;height:20px}
.seat:not(.mine) .chip.hid{width:24px;justify-content:center}
.seat.mine .seat-head .chip{height:24px}
.chip{position:relative;display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 7px 0 2px;border-radius:13px;font-weight:800;font-size:12.5px;white-space:nowrap;color:#fff4dc;background:var(--h);box-shadow:inset 0 0 0 1px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,236,200,.35)}
.chip .cd{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,var(--hw),var(--hw3));box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.chip .cd svg{width:19px;height:19px;color:var(--h)}
.chip.hid{padding:0 8px;background:radial-gradient(circle at 50% 40%,#6b4a7c,#3a2346);color:#e8d6f2}
.chip.hid svg{width:18px;height:18px;color:#c9a0dc}
.chip.dead{filter:grayscale(.85) brightness(.75)}
.chip .x{position:absolute;right:-5px;top:-6px}.chip .x .ic{width:16px;height:16px}
.stats{display:flex;gap:10px;flex:1;justify-content:flex-start;font-weight:800;font-size:15px;white-space:nowrap}
.stats .dist{margin-left:auto}
.stats span{display:inline-flex;align-items:center;gap:3px}
.stats .ic{width:18px;height:18px}
.stats .dist{color:var(--ink-2);font-size:13.5px}
.stats .chg{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.35);color:#9a2a2e}}
.city-mini{display:flex;flex-wrap:wrap;gap:3px;padding:6px 8px 8px;min-height:36px;align-content:flex-start}
.mt{position:relative;width:20px;height:24px;border-radius:3px;display:grid;place-items:center;font-weight:800;font-size:12px;line-height:1;color:#fff;background:var(--h);text-shadow:0 1px 0 rgba(0,0,0,.6);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.45),inset 0 3px 0 rgba(255,255,255,.25),0 1px 2px rgba(0,0,0,.35);transition:transform .2s}
.mt.b{box-shadow:inset 0 0 0 1px rgba(0,0,0,.45),0 0 0 2px #f0cf74,0 1px 2px rgba(0,0,0,.35)}
.mt.fresh{animation:raise .5s cubic-bezier(.2,.9,.3,1.3)}
.mt.slot{background:none;box-shadow:inset 0 0 0 1.5px rgba(36,24,15,.2);border-radius:3px}
@keyframes raise{from{transform:translateY(-16px) scale(1.4);opacity:0}}
.seat.turn{box-shadow:inset 0 0 0 1px rgba(36,24,15,.75),inset 0 0 0 3px rgba(251,243,225,.6),0 0 0 2.5px var(--gold-hi),0 0 26px rgba(244,214,139,.55),0 8px 20px rgba(0,0,0,.5)}
.seat.pick{outline:3px dashed rgba(226,96,64,.95);outline-offset:3px}
.seat.hit{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.floats{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center;z-index:7}
.float{position:absolute;display:inline-flex;align-items:center;gap:3px;font-weight:800;font-size:24px;white-space:nowrap;text-shadow:0 2px 0 rgba(255,255,255,.4),0 0 10px rgba(255,244,220,.95);animation:floatup 1.5s ease-out forwards}
.float .ic{width:24px;height:24px}
.float.gold{color:#7a5300}.float.loss{color:#9a2a2e}.float.cards{color:#3e2f72}.float.info{color:#4c2780;font-size:18px}.float.big{font-size:30px}
@keyframes floatup{0%{transform:translateY(10px) scale(.6);opacity:0}15%{transform:scale(1.1);opacity:1}100%{transform:translateY(-44px);opacity:0}}

/* the middle of the square */
#stage{grid-area:stage;position:relative;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:26px;min-height:0}
#stage .halo{position:absolute;left:50%;top:50%;width:min(92%,620px);aspect-ratio:2.1;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,rgba(255,206,140,.17),rgba(255,206,140,.06) 45%,rgba(255,206,140,0) 70%);box-shadow:inset 0 0 0 1px rgba(244,214,139,.08)}
#stage.drop-ok .halo{background:radial-gradient(ellipse at 50% 50%,rgba(255,206,140,.4),rgba(255,206,140,.12) 50%,rgba(255,206,140,0) 72%);box-shadow:inset 0 0 0 2px rgba(239,170,90,.7)}
#stage-card{position:relative;min-height:10px;display:flex;justify-content:center;align-items:flex-start;gap:12px;transition:opacity .15s}
.stage-fit{transform-origin:top center;display:flex;gap:14px;align-items:flex-end}
#stage-card .pop{animation:pop .32s ease-out}
@keyframes pop{from{transform:scale(.82);opacity:.2}to{transform:none;opacity:1}}
#stage-caption{position:relative;font-family:var(--f-head);font-size:21px;line-height:1.2;color:var(--gold-hi);text-align:left;max-width:360px;text-shadow:0 1px 0 #000,0 0 14px rgba(0,0,0,.85)}
#stage-caption:empty{display:none}
#stage-card:empty+#stage-caption{text-align:center}
#stage-caption small{display:block;margin-top:3px;font-family:var(--f-text);font-size:15px;font-weight:500;color:#e4d6ba}
.deckpile{position:relative;width:var(--w);height:var(--hh);--w:96px;--hh:134px}
.deckpile .cback{position:absolute;left:0;top:0;--w:96px;--hh:134px}
.deckpile .n{position:absolute;right:-8px;bottom:-8px;z-index:3;min-width:26px;height:26px;padding:0 6px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#2a1a06;background:var(--gold-hi);box-shadow:0 2px 4px rgba(0,0,0,.5)}
#stage.holding #stage-card{opacity:.35}

/* your plaque and your city */
#me{grid-area:me;display:flex;align-items:flex-end;gap:12px;min-width:0}
#me .seat{flex:0 0 250px;cursor:pointer}
.mycity{flex:1;min-width:0;display:flex;align-items:flex-end;gap:7px;overflow-x:auto;overflow-y:visible;padding:16px 4px 4px;scrollbar-width:thin;scrollbar-color:rgba(244,214,139,.35) transparent}
.mycity .card{cursor:pointer}
.mycity .empty{align-self:center;font-style:italic;color:#cdbb98;font-size:15px}
.mycity .lot{flex:0 0 auto;width:74px;height:98px;border-radius:6px;box-shadow:inset 0 0 0 1.5px rgba(244,214,139,.18);background:repeating-linear-gradient(135deg,rgba(244,214,139,.04) 0 6px,rgba(244,214,139,0) 6px 12px)}
.mycity .card.fresh{animation:raise .5s cubic-bezier(.2,.9,.3,1.3)}
.mycity .card.use{cursor:pointer;filter:drop-shadow(0 0 2px #fff3c8) drop-shadow(0 0 8px rgba(244,214,139,.9))}
#prompt{grid-area:act;align-self:center;max-width:560px}
.actionbar{position:relative;z-index:20;display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:8px 10px;min-height:50px}
.actionbar .hint{font-family:var(--f-head);font-size:18px;color:var(--gold-hi);text-align:center;text-shadow:0 1px 0 #000,0 0 12px rgba(0,0,0,.7)}
.actionbar .btn{white-space:nowrap}
.actionbar .sep{width:1px;height:30px;background:rgba(244,214,139,.25)}
/* the hand: one straight row; a chosen card rises; a dragged card is a copy on its own layer */
#handzone{grid-area:hand;position:relative;min-width:0}
#hand{position:relative;display:flex;align-items:flex-end;gap:14px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;scrollbar-width:none;overscroll-behavior-x:contain;padding:18px 18px 12px;touch-action:pan-x}
#hand::-webkit-scrollbar{display:none}
#handzone.over #hand{padding-left:52px;padding-right:52px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 48px,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 48px,#000 calc(100% - 48px),transparent)}
#hand>.card:first-child{margin-left:auto}#hand>.card:last-child{margin-right:auto}
#hand .card{scroll-snap-align:center;cursor:pointer;transition:transform .2s cubic-bezier(.2,.9,.3,1.2),opacity .15s,filter .15s;-webkit-touch-callout:none}
#hand .card.can{cursor:grab}
#hand .card.can::after{content:'';position:absolute;left:12%;right:12%;bottom:-7px;height:3px;border-radius:2px;background:var(--gold-hi);box-shadow:0 0 8px rgba(244,214,139,.9)}
#hand .card.sel{transform:translateY(-8px);filter:drop-shadow(0 0 1.5px #fff3c8) drop-shadow(0 0 3px var(--gold-hi)) drop-shadow(0 0 12px rgba(244,214,139,.95))}
#hand .card.dim{filter:saturate(.7) brightness(.78) drop-shadow(0 5px 7px rgba(0,0,0,.5))}
#hand .card.drag-src{opacity:.35;transform:none;cursor:grabbing}
#hand .card.fresh{animation:drawn .45s cubic-bezier(.2,.9,.3,1.1)}
@keyframes drawn{from{transform:translateY(40px) scale(.9);opacity:0}}
.hand-empty{align-self:center;margin:auto;font-style:italic;color:#cdbb98;min-height:60px;display:grid;place-items:center}
.hand-nav{display:none;position:absolute;top:50%;z-index:2;width:38px;height:38px;margin-top:-15px;padding:0;border:0;border-radius:50%;place-items:center;cursor:pointer;font-size:26px;line-height:1;color:var(--gold-hi);
  background:radial-gradient(circle at 40% 35%,#3d4766,#171b2a);box-shadow:inset 0 0 0 1.5px var(--gold),0 2px 6px rgba(0,0,0,.55)}
#handzone.over .hand-nav{display:grid}
.hand-nav.prev{left:6px}.hand-nav.next{right:6px}
.hand-nav:disabled{opacity:.3;cursor:default}
#drag-ghost{position:fixed;left:0;top:0;z-index:75;pointer-events:none;display:none;transform-origin:0 0;will-change:transform}
#drag-ghost.on{display:block}
#drag-ghost .card{margin:0;filter:drop-shadow(0 16px 18px rgba(0,0,0,.55));animation:pickup .14s ease-out}
@keyframes pickup{from{transform:scale(1.2) rotate(3deg)}}

/* drawer, sheets, tooltip, banner */
.drawer{position:absolute;top:52px;right:0;bottom:0;width:360px;z-index:30;padding:16px 18px;overflow:auto;transform:translateX(105%);transition:transform .25s ease;color:var(--ink);
  background:var(--parch-tex),linear-gradient(180deg,var(--parch-hi),var(--parch));box-shadow:inset 1px 0 0 rgba(36,24,15,.5),-14px 0 32px rgba(0,0,0,.5)}
.drawer.open{transform:none}
.drawer h3{margin:0 0 10px;font-family:var(--f-head);font-weight:400;font-size:24px;color:var(--blood)}
.log{list-style:none;margin:0;padding:0}.log li{padding:6px 0;border-bottom:1px solid rgba(36,24,15,.13);font-size:15px;line-height:1.35}.log li.r{font-family:var(--f-head);font-size:16.5px;color:var(--blood);padding-top:12px}
.log li.me{background:linear-gradient(90deg,rgba(214,167,62,.16),rgba(214,167,62,0))}
.log .badge{display:inline-grid;width:17px;height:17px;font-size:10px;vertical-align:-3px;margin-right:2px}
.sheet-wrap{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:18px;background:rgba(8,10,18,.68)}
.sheet-panel{position:relative;width:min(820px,100%);max-height:90dvh;overflow:auto;overscroll-behavior:contain;border-radius:6px;padding:22px 24px;color:var(--ink);background:var(--parch-tex),linear-gradient(180deg,var(--parch-hi),var(--parch));
  box-shadow:inset 0 0 0 1px rgba(36,24,15,.7),inset 0 0 0 4px rgba(251,243,225,.7),inset 0 0 0 5px rgba(154,42,46,.35),inset 0 0 60px rgba(120,80,30,.25),0 28px 70px rgba(0,0,0,.7)}
.sheet-panel h2{margin:0 0 6px;padding-right:40px;font-family:var(--f-head);font-weight:400;font-size:28px;line-height:1.08;color:var(--blood)}
.sheet-panel h3{margin:16px 0 6px;font-family:var(--f-head);font-weight:400;font-size:20px;color:var(--blood)}
.sheet-panel p{line-height:1.45;font-size:16px;margin:6px 0}
.sheet-panel .x-close{position:absolute;right:12px;top:12px;width:40px;height:40px;color:var(--ink);background:rgba(36,24,15,.08);box-shadow:inset 0 0 0 1px rgba(36,24,15,.3)}
.muted{color:var(--ink-3)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.row.center{justify-content:center}.row.end{justify-content:flex-end}
.seg{display:inline-flex;flex-wrap:wrap;padding:3px;gap:3px;border-radius:6px;background:rgba(36,24,15,.1);box-shadow:inset 0 0 0 1px rgba(36,24,15,.25)}
.seg button{border:0;cursor:pointer;min-height:42px;min-width:42px;padding:6px 12px;border-radius:4px;background:none;font-weight:800;font-size:15px;color:var(--ink-2)}
.seg button.on{color:#fdeccc;background:linear-gradient(#a8333f,#6f1b27);box-shadow:inset 0 0 0 1px rgba(255,214,150,.5)}
.seg button:disabled{opacity:.4;cursor:default}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid rgba(36,24,15,.14)}
.set-row>div>b{display:block;font-family:var(--f-head);font-weight:400;font-size:18px}.set-row>div>span{font-size:14.5px;color:var(--ink-3)}
.tip{position:fixed;z-index:90;max-width:300px;padding:9px 12px;border-radius:5px;font-size:14.5px;line-height:1.35;color:var(--ink);background:var(--parch-tex),#fbf3e1;box-shadow:inset 0 0 0 1px rgba(36,24,15,.6),0 12px 28px rgba(0,0,0,.5);pointer-events:none}
.tip b{font-family:var(--f-head);font-weight:400;font-size:16px}
#banner{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:50;text-align:center;pointer-events:none;opacity:0;width:min(92vw,760px)}
#banner .ribbon{display:inline-block;padding:14px 34px 16px;background:linear-gradient(90deg,rgba(10,12,22,0),rgba(10,12,22,.86) 14%,rgba(10,12,22,.86) 86%,rgba(10,12,22,0));box-shadow:inset 0 1px 0 rgba(244,214,139,.45),inset 0 -1px 0 rgba(244,214,139,.45)}
#banner .bt{font-family:var(--f-head);font-size:clamp(30px,5vw,54px);line-height:1.04;color:var(--gold-hi);text-shadow:0 3px 0 #2a1606,0 0 30px rgba(0,0,0,.85)}
#banner .bs{margin-top:8px;font-size:19px;color:#fdeccc;text-shadow:0 2px 8px #000}
#banner.show{animation:bannerIn var(--bdur,1.9s) ease-out}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-40%)}12%{opacity:1;transform:translate(-50%,-50%)}78%{opacity:1}100%{opacity:0}}
#fx-layer{position:fixed;inset:0;z-index:45;pointer-events:none}
.mv{pointer-events:none;will-change:transform,opacity}
.mv .card{margin:0}
.mv-tag{position:absolute;left:50%;top:-10px;transform:translate(-50%,-100%);white-space:nowrap;font-weight:800;font-size:17px;line-height:1.15;padding:4px 13px 5px;border-radius:5px;color:#fbe9d0;background:#3b3f78;box-shadow:0 0 0 1.5px rgba(255,228,170,.55),0 8px 18px rgba(0,0,0,.55)}
.mv-tag.bad{background:#8a2420}.mv-tag.good{background:#2f6f3a}.mv-tag.magic{background:#5d2d8a}
.token{position:fixed;left:0;top:0;width:28px;height:28px;pointer-events:none;z-index:46;will-change:transform,opacity}
.token .ic,.token svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.55))}
.token.big{width:56px;height:56px}

/* pickers in sheets */
.pick-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:16px 12px;margin:14px 0 6px}
.pick{position:relative;border:0;padding:0;background:none;cursor:pointer;border-radius:10px;transition:transform .12s ease-out;color:var(--ink)}
.pick:not(:disabled):hover,.pick:not(:disabled):focus-visible{transform:translateY(-4px)}
.pick.on{transform:translateY(-6px)}
.pick.on .card{filter:drop-shadow(0 0 2px #fff3c8) drop-shadow(0 0 4px var(--gold)) drop-shadow(0 0 14px rgba(214,167,62,.95))}
.pick:disabled{cursor:default}
.pick:disabled .card{filter:grayscale(.7) brightness(.8) drop-shadow(0 5px 7px rgba(0,0,0,.35))}
.pick .why{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:4;max-width:96%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800;font-size:12.5px;padding:2px 8px;border-radius:4px;color:#fff4dc;background:rgba(36,24,15,.85)}
.pick .tag{position:absolute;left:50%;top:-10px;transform:translateX(-50%);z-index:4;white-space:nowrap;font-weight:800;font-size:12.5px;padding:2px 8px;border-radius:4px;color:#2a1a06;background:var(--gold-hi);box-shadow:0 2px 4px rgba(0,0,0,.4)}
.pick .tag.red{color:#fff;background:#9a2a2e}
.pick .price{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);z-index:4;white-space:nowrap;display:inline-flex;align-items:center;gap:3px;font-weight:800;font-size:13.5px;padding:2px 9px;border-radius:10px;color:#4a2f04;background:#f4d06a;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.pick .price .ic{width:15px;height:15px}
.out-row{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:8px 0 2px;font-size:14.5px;color:var(--ink-2)}
.out-row .chip{font-size:12px}
.plist{display:flex;flex-direction:column;gap:8px;margin:12px 0 4px}
.prow{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 12px;border:0;border-radius:8px;cursor:pointer;text-align:left;color:var(--ink);background:rgba(36,24,15,.06);box-shadow:inset 0 0 0 1px rgba(36,24,15,.25)}
.prow:hover{background:rgba(36,24,15,.11)}
.prow.on{background:rgba(214,167,62,.22);box-shadow:inset 0 0 0 2px var(--gold)}
.prow:disabled{opacity:.5;cursor:default}
.prow .badge{width:28px;height:28px;font-size:14px}
.prow b{font-family:var(--f-head);font-weight:400;font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .stats{flex:0 0 auto;font-size:14.5px}
.prow .note{font-size:13.5px;color:var(--ink-3);font-weight:700}
.cityblock{margin:12px 0 4px}
.cityblock h4{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-family:var(--f-head);font-weight:400;font-size:18px}
.cityblock h4 .note{font-family:var(--f-text);font-size:13.5px;font-weight:700;color:var(--ink-3)}
.cityblock .pick-grid{justify-content:flex-start;margin:4px 0 14px;gap:16px 10px}
.typepick{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.typepick button{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:6px 12px;border:0;border-radius:6px;cursor:pointer;font-weight:800;font-size:15px;color:var(--ink);background:rgba(36,24,15,.06);box-shadow:inset 0 0 0 1px rgba(36,24,15,.25)}
.typepick button.on{background:rgba(214,167,62,.25);box-shadow:inset 0 0 0 2px var(--gold)}
.typepick .gem{width:20px;height:20px}
.peek{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:12px 0}
.score-table{width:100%;border-collapse:collapse;margin:10px 0}
.score-table td,.score-table th{padding:7px 6px;border-bottom:1px solid rgba(36,24,15,.15);text-align:left;vertical-align:top;font-size:15px}
.score-table th{font-family:var(--f-head);font-weight:400;font-size:16px;color:var(--blood)}
.score-table td.num{text-align:right;font-weight:800;font-size:18px;white-space:nowrap}
.score-table tr.win td{background:rgba(214,167,62,.18)}
.score-table .lines{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.score-table .who{display:flex;align-items:center;gap:7px;font-weight:800;font-size:16px}
html.compact .score-table .mt{width:16px;height:19px;font-size:10.5px}
.char-sheet{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:start}
.char-sheet .cs-card{display:flex;justify-content:center}
.char-sheet .cs-kind{font-size:15px;color:var(--ink-2)}
.char-sheet .cs-eff{font-size:18px;line-height:1.42;margin:6px 0!important}
.status{display:inline-block;margin:4px 0;padding:3px 10px;border-radius:4px;font-weight:800;font-size:14px;color:#fff4dc;background:#3b3f78}
.status.bad{background:#8a2420}.status.good{background:#2f6f3a}.status.gray{background:#6b6258}

/* menu */
#screen-menu{display:grid;place-items:center;padding:24px;overflow:auto}
.menu{display:flex;flex-direction:column;align-items:center;text-align:center}
.menu-kicker{font-weight:800;font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.menu-title{margin:4px 0 0;font-family:var(--f-head);font-weight:400;font-size:clamp(48px,8.6vw,104px);line-height:.95;color:var(--gold-hi);text-shadow:0 4px 0 #2a1606,0 0 40px rgba(0,0,0,.75)}
.menu-rule{width:min(420px,70vw);height:14px;margin:10px auto 4px;background:var(--rule) center/contain no-repeat}
.menu-sub{margin:4px 0 0;font-size:20px;font-style:italic;color:#e9dcc0;max-width:40ch}
.menu-fan{position:relative;height:250px;width:min(760px,94vw);margin:16px 0 12px}
.menu-fan>*{position:absolute;left:50%;top:10px;margin-left:calc(var(--cw) / -2);transform:translateX(var(--x)) translateY(var(--y)) rotate(var(--rot));transform-origin:50% 120%;animation:deal .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
@keyframes deal{from{transform:translateX(0) translateY(60px) rotate(0);opacity:0}}
.menu-actions{display:flex;flex-direction:column;gap:12px;width:min(340px,90vw)}
.menu-row{display:flex;gap:12px}.menu-row .btn{flex:1}
.menu-foot{margin-top:16px;font-size:15px;font-style:italic;color:#c9b898}

/* setup */
#screen-setup{display:grid;grid-template-columns:minmax(0,1fr) 520px;grid-template-rows:auto minmax(0,1fr);gap:0 20px;padding:0 20px 20px}
.su-top{grid-column:1/-1;display:flex;align-items:center;gap:12px;height:64px}
.su-top h2{margin:0;flex:1;font-family:var(--f-head);font-weight:400;font-size:30px;color:var(--gold-hi);text-shadow:0 2px 0 #000}
.su-list{overflow:auto;padding:4px 6px 20px 2px}
.su-list h3{margin:12px 0 10px;font-family:var(--f-head);font-weight:400;font-size:20px;color:var(--gold-hi);text-shadow:0 1px 0 #000}
.su-seg{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center}
.su-seg .seg{background:rgba(0,0,0,.25);box-shadow:inset 0 0 0 1px rgba(244,214,139,.3)}
.su-seg .seg button{color:#e9dcc0}
.su-seg label{font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.set-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.set-tile{position:relative;border:0;cursor:pointer;text-align:left;padding:12px 12px 10px;border-radius:8px;color:var(--ink);display:flex;flex-direction:column;gap:6px;background:var(--parch-tex),linear-gradient(180deg,var(--parch-hi),var(--parch));
  box-shadow:inset 0 0 0 1px rgba(36,24,15,.7),inset 0 0 0 3px rgba(251,243,225,.6),0 8px 18px rgba(0,0,0,.5)}
.set-tile b{font-family:var(--f-head);font-weight:400;font-size:19px;line-height:1.1;color:var(--blood)}
.set-tile span{font-size:14px;line-height:1.3;color:var(--ink-2)}
.set-tile .dots{display:flex;gap:3px;flex-wrap:wrap}
.set-tile .dots i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,var(--hw),var(--hw3));box-shadow:0 0 0 1.5px var(--h)}
.set-tile .dots i svg{width:20px;height:20px;color:var(--h)}
.set-tile.on{box-shadow:inset 0 0 0 1px rgba(36,24,15,.7),inset 0 0 0 3px rgba(251,243,225,.6),0 0 0 3px var(--gold-hi),0 0 26px rgba(244,214,139,.5)}
.su-note{margin:16px 2px 0;font-size:14.5px;line-height:1.45;color:#cbbb9c;max-width:66ch}

<body>
<div id="app">
  <section id="screen-menu" class="screen"></section>
  <section id="screen-setup" class="screen hidden"></section>
  <section id="screen-match" class="screen hidden">
    <header id="topbar"></header>
    <div id="table">
      <nav id="track" aria-label="The characters, called in rank order"></nav>
      <div id="opps"></div>
      <div id="stage"><div class="halo"></div><div id="stage-card"></div><div id="stage-caption" aria-live="polite"></div></div>
      <div id="me"></div>
      <div id="prompt" class="actionbar"></div>
      <div id="handzone"><button class="hand-nav prev" data-act="hand-prev" aria-label="Scroll the hand left" tabindex="-1">‹</button><div id="hand"></div><button class="hand-nav next" data-act="hand-next" aria-label="Scroll the hand right" tabindex="-1">›</button></div>
    </div>
    <aside id="chronicle" class="drawer" aria-label="Chronicle"></aside>
  </section>
  <div id="fx-layer" aria-hidden="true"></div>
  <div id="drag-ghost" aria-hidden="true"></div>
  <div id="codex" class="codex hidden" role="dialog" aria-label="Rules and cards"></div>
  <div id="sheet" class="sheet-wrap hidden"></div>
  <div id="tip" class="tip hidden" role="tooltip"></div>
  <div id="banner" aria-live="polite"></div>
</div>
<script>
'use strict';
/* ── Masks & Mortar ──
   The Citadels rules (2016 edition), played against the computer: every round each player secretly takes a character, the
   characters are called in rank order, and each one gathers gold or cards, builds districts and uses its ability. The first
   city of 7 districts (8 with two or three players) ends the game at the end of that round; the most points wins.
   The engine is pure (state S, seeded RNG, no DOM) so sim.js and test.js can run it in node. */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
function rnd(S) {
  let t = (S.rs = (S.rs + 0x6D2B79F5) >>> 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const pick = (S, arr) => arr[Math.floor(rnd(S) * arr.length)];
function shuffled(S, arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd(S) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sum = (arr, f = x => x) => arr.reduce((a, x) => a + f(x), 0);

/* ── The cards: 27 characters, 54 basic districts in four types, 30 unique districts, and the suggested sets ──
   Names follow the 2016 edition. Texts are written for this game; {noble}, {gold}, {cards} and friends are keywords the
   table prints in their own colour. A game uses one character per rank (rank 9 only with 3 or 8 players, or by choice) and
   14 of the 30 unique districts, shuffled in with the 54 basic ones. */
const RULES = { startGold: 2, startHand: 4, minPlayers: 2, maxPlayers: 8, uniquesPerGame: 14 };
const citySize = n => (n <= 3 ? 8 : 7);

const TYPES = {
  noble: { name: 'Noble', color: '#c99a1e', deep: '#6b4e08', wash: '#f6e6b3' },
  religious: { name: 'Religious', color: '#3a6db3', deep: '#16305c', wash: '#d9e5f6' },
  trade: { name: 'Trade', color: '#3f8f45', deep: '#173f1b', wash: '#d8ecd4' },
  military: { name: 'Military', color: '#b0362a', deep: '#561510', wash: '#f4d6cf' },
  unique: { name: 'Unique', color: '#7a48a8', deep: '#341a52', wash: '#e8dcf3' },
};
const TYPE_ORDER = ['noble', 'religious', 'trade', 'military', 'unique'];

/* the 54 basic districts: n is the number of copies */
const BASIC = [
  { id: 'manor', name: 'Manor', type: 'noble', cost: 3, n: 5 },
  { id: 'castle', name: 'Castle', type: 'noble', cost: 4, n: 4 },
  { id: 'palace', name: 'Palace', type: 'noble', cost: 5, n: 3 },
  { id: 'temple', name: 'Temple', type: 'religious', cost: 1, n: 3 },
  { id: 'church', name: 'Church', type: 'religious', cost: 2, n: 3 },
  { id: 'monastery', name: 'Monastery', type: 'religious', cost: 3, n: 3 },
  { id: 'cathedral', name: 'Cathedral', type: 'religious', cost: 5, n: 2 },
  { id: 'tavern', name: 'Tavern', type: 'trade', cost: 1, n: 5 },
  { id: 'market', name: 'Market', type: 'trade', cost: 2, n: 4 },
  { id: 'trading-post', name: 'Trading Post', type: 'trade', cost: 2, n: 3 },
  { id: 'docks', name: 'Docks', type: 'trade', cost: 3, n: 3 },
  { id: 'harbor', name: 'Harbor', type: 'trade', cost: 4, n: 3 },
  { id: 'town-hall', name: 'Town Hall', type: 'trade', cost: 5, n: 2 },
  { id: 'watchtower', name: 'Watchtower', type: 'military', cost: 1, n: 3 },
  { id: 'prison', name: 'Prison', type: 'military', cost: 2, n: 3 },
  { id: 'barracks', name: 'Barracks', type: 'military', cost: 3, n: 3 },
  { id: 'fortress', name: 'Fortress', type: 'military', cost: 5, n: 2 },
];

/* the 30 unique districts, one copy each. when: 'end' scores at the end, 'gather' changes gathering, 'turn' is used during the
   owner's turn, 'build' changes how a district is built, 'pass' always applies */
const UNIQUE = [
  { id: 'armory', name: 'Armory', cost: 3, when: 'turn', text: 'During your turn, destroy the Armory to destroy 1 district of your choice (not in a completed city).' },
  { id: 'basilica', name: 'Basilica', cost: 4, when: 'end', text: 'At the end of the game, score 1 extra point for each district in your city with an odd cost.' },
  { id: 'capitol', name: 'Capitol', cost: 5, when: 'end', text: 'At the end of the game, if you have at least 3 districts of the same type, score 3 extra points.' },
  { id: 'dragon-gate', name: 'Dragon Gate', cost: 6, when: 'end', text: 'At the end of the game, score 2 extra points.' },
  { id: 'factory', name: 'Factory', cost: 5, when: 'build', text: 'You pay 1 {gold} less to build any other {unique} district.' },
  { id: 'framework', name: 'Framework', cost: 3, when: 'build', text: 'You may build a district by destroying the Framework instead of paying its cost.' },
  { id: 'gold-mine', name: 'Gold Mine', cost: 6, when: 'gather', text: 'When you gather by taking {gold}, take 1 more {gold}.' },
  { id: 'great-wall', name: 'Great Wall', cost: 6, when: 'pass', text: 'The rank 8 character pays 1 more {gold} to use its ability on any other district in your city.' },
  { id: 'haunted-quarter', name: 'Haunted Quarter', cost: 2, when: 'end', text: 'At the end of the game, the Haunted Quarter counts as the district type of your choice.' },
  { id: 'imperial-treasury', name: 'Imperial Treasury', cost: 5, when: 'end', text: 'At the end of the game, score 1 extra point for each {gold} you have.' },
  { id: 'ivory-tower', name: 'Ivory Tower', cost: 5, when: 'end', text: 'At the end of the game, if the Ivory Tower is the only {unique} district in your city, score 5 extra points.' },

      case 'card': this.noise(0, 0.08, 0.07, 1800); this.tone(660, 0.02, 0.06, 'triangle', 0.04); break;
      case 'draw': this.noise(0, 0.06, 0.05, 2600); this.tone(880, 0.01, 0.05, 'triangle', 0.03); break;

      case 'magic': [988, 1319, 1568, 1976].forEach((f, i) => this.tone(f, i * 0.05, 0.22, 'sine', 0.04)); break;
      case 'seal': this.noise(0, 0.06, 0.08, 900, 'lowpass'); this.tone(196, 0, 0.12, 'square', 0.04, -40); break;
      case 'swap': this.tone(440, 0, 0.18, 'sine', 0.06, 220); this.tone(660, 0.12, 0.18, 'sine', 0.06, -220); break;
      case 'turn': this.bell(784, 0, 0.06, 0.9); this.tone(392, 0, 0.18, 'triangle', 0.06); this.tone(523, 0.12, 0.25, 'triangle', 0.06); break;

      case 'bad': this.tone(196, 0, 0.18, 'sawtooth', 0.04, -40); break;

    await showCard(districtHTML(e.card, { size: 'lg' }), stageRect(), cityRect(e.pid), 'Confiscated!', 'bad', 640);
    SFX.play('seal'); commit();

  },
  async build(e, commit) {
    if (e.how === 'confiscated') { commit(); freshTile(e.pid, e.card.uid); return; }
    const landed = UI.ctx && UI.ctx.landed === e.card.uid;
    const from = UI.buildFrom != null ? statRect(UI.buildFrom, 'h') : e.pid === 0 ? rectOf(document.querySelector(`#hand .card[data-uid="${e.card.uid}"]`)) || stageRect() : statRect(e.pid, 'h');
    UI.buildFrom = null;
    if (landed) dropGhost();
    await showCard(districtHTML(e.card, { size: 'lg' }), landed ? stageRect() : from, cityRect(e.pid), `${esc(nameOf(e.pid))} ${vb(e.pid, 'build', 'builds')}`, 'good', e.pid === 0 ? 260 : 620);
    SFX.play('build'); commit(); freshTile(e.pid, e.card.uid); bump(e.pid, 'g');
  },
  async tax(e, commit) { await flyTokens('gold', statRect(e.pid, 'g'), medRect('tax-collector'), 1, { dur: 420 }); SFX.play('coin'); commit(); },
  async complete(e, commit) {
    commit(); SFX.play('crown');
    banner(e.pid === 0 ? 'Your city is complete!' : `${S.players[e.pid].name} completes a city`, e.first ? 'The game ends at the end of this round' : 'Completed city: +2 points', 2000);
    await wait(D(1500));
  },
  async destroy(e, commit) {
    if (e.why === 'framework' || e.why === 'necropolis') { SFX.play('destroy'); commit(); return; }
    const r = tileRect(e.pid, e.card.uid);
    if (e.why === 'armory' && e.by == null) { SFX.play('destroy'); commit(); return; }
    if (e.paid) { await flyTokens('gold', statRect(e.by, 'g'), stageRect(), e.paid, { dur: 420 }); }
    shake(e.pid); SFX.play('destroy');
    await showCard(districtHTML(e.card, { size: 'lg' }), r, null, `Destroyed by ${esc(objOf(e.by))}`, 'bad', 560);
    commit();
  },
  async bribe(e, commit) { await flyTokens('gold', statRect(e.pid, 'g'), statRect(e.by, 'g'), e.n); SFX.play('pay', e.n); commit(); floatAt(e.pid, e.n ? `paid ${e.n}${ic('gold')}` : 'paid', 'loss'); },
  async refuse(e) { floatAt(e.pid, 'refuses to pay', 'info'); SFX.play('seal'); await wait(D(600)); },
  async threat(e, commit) {
    if (e.real) { SFX.play('steal'); shake(e.pid); floatAt(e.pid, `real threat! −${e.n}${ic('gold')}`, 'loss'); await flyTokens('gold', statRect(e.pid, 'g'), statRect(e.by, 'g'), e.n); }
    else { floatAt(e.pid, 'an empty threat', 'info'); SFX.play('bad'); await wait(D(600)); }
    commit();
  },
  async spare(e) { floatAt(e.pid, 'threat stays hidden', 'info'); await wait(D(500)); },
  async bewitch(e, commit) { commit(); pingMed(e.char); SFX.play('magic'); await wait(D(700)); },
  async bewitchedEnd(e) { floatAt(e.pid, 'bewitched', 'info'); await wait(D(500)); },
  async resume(e, commit) { commit(); pingMed(e.char); SFX.play('magic'); if (e.pid === 0) { banner('Your turn', `As ${esc(theC(e.char))}, by the Witch’s spell`, 1500); SFX.play('turn'); } await wait(D(900)); },
  async witchIdle(e) { floatAt(e.pid, 'no spell', 'info'); await wait(D(300)); },
  async kill(e, commit) { commit(); pingMed(e.char); SFX.play('kill'); if (S.players[0].chars.includes(e.char)) { banner('You are killed', `${esc(CHAR[e.char].name)} skips the turn`, 1600); buzz(60); } await wait(D(800)); },
  async warrants(e, commit) { commit(); for (const c of e.chars) pingMed(c); SFX.play('seal'); await wait(D(700)); },
  async robNamed(e, commit) { commit(); pingMed(e.char); SFX.play('seal'); await wait(D(700)); },
  async threats(e, commit) { commit(); for (const c of e.chars) pingMed(c); SFX.play('seal'); await wait(D(700)); },
  async spy(e, commit) {
    floatAt(e.target, `${e.n} ${TYPES[e.type].name.toLowerCase()}`, 'info');
    await Promise.all([flyTokens('gold', statRect(e.target, 'g'), statRect(e.pid, 'g'), e.gold), cardsTo(e.pid, e.cards)]);
    if (e.gold || e.cards) SFX.play('steal');
    commit(); await wait(D(400));
  },
  async peek(e) { UI.post.push({ kind: 'peek', target: e.target, hand: e.hand }); },
  async swapHands(e, commit) {
    SFX.play('swap');
    await Promise.all([flyTokens('back', statRect(e.pid, 'h'), statRect(e.target, 'h'), e.gave, { max: 4 }), flyTokens('back', statRect(e.target, 'h'), statRect(e.pid, 'h'), e.got, { max: 4 })]);
    commit(); bump(e.pid, 'h'); bump(e.target, 'h');
  },
  async redraw(e, commit) { await flyTokens('back', statRect(e.pid, 'h'), stageRect(), e.n, { max: 4, dur: 400 }); await cardsTo(e.pid, e.n); SFX.play('magic'); commit(); },
  async wizardEmpty(e) { floatAt(e.target, 'empty hand', 'info'); await wait(D(500)); },
  async wizardLook(e) { floatAt(e.target, 'hand looked at', 'info'); SFX.play('magic'); await wait(D(500)); },
  async wizardTake(e, commit) {
    if (e.build) { UI.buildFrom = e.from; return; }
    await flyTokens('back', statRect(e.from, 'h'), statRect(e.pid, 'h'), 1); SFX.play('steal'); commit();
  },
  async seer(e, commit) { SFX.play('magic'); await Promise.all(e.from.map(x => flyTokens('back', statRect(x, 'h'), statRect(e.pid, 'h'), 1))); commit(); },
  async seerGave(e, commit) { await Promise.all(e.to.map(x => flyTokens('back', statRect(e.pid, 'h'), statRect(x, 'h'), 1))); SFX.play('card'); commit(); },
  async tribute(e, commit) { if (e.took) { await flyTokens(e.took === 'gold' ? 'gold' : 'back', statRect(e.from, e.took === 'gold' ? 'g' : 'h'), statRect(e.pid, e.took === 'gold' ? 'g' : 'h'), 1); SFX.play(e.took === 'gold' ? 'coin' : 'draw'); } commit(); },
  async alms(e, commit) { await flyTokens('gold', statRect(e.from, 'g'), statRect(e.pid, 'g'), 1); SFX.play('coin'); commit(); floatAt(e.pid, `+1${ic('gold')}`, 'gold'); },
  async scholar(e) { await cardsTo(e.pid, Math.min(e.n, 4)); SFX.play('draw'); },
  async seize(e, commit) {
    await showCard(districtHTML(e.card, { size: 'lg' }), tileRect(e.from, e.card.uid), cityRect(e.pid), `Seized for ${plural(e.paid, 'gold', 'gold')}`, 'bad', 520);
    await flyTokens('gold', statRect(e.pid, 'g'), statRect(e.from, 'g'), e.paid);
    SFX.play('steal'); commit(); freshTile(e.pid, e.card.uid);
  },
  async exchange(e, commit) {
    SFX.play('swap');
    await Promise.all([showCard(districtHTML(e.got, { size: 'lg' }), tileRect(e.with, e.got.uid), cityRect(e.pid), 'Exchanged', 'magic', 520), flyTokens('gold', statRect(e.pid, 'g'), statRect(e.with, 'g'), e.paid)]);
    commit(); freshTile(e.pid, e.got.uid); freshTile(e.with, e.gave.uid);
  },
  async beautify(e, commit) { await flyTokens('gold', statRect(e.pid, 'g'), cityRect(e.pid), e.cards.length); SFX.play('coins', 2); commit(); for (const c of e.cards) freshTile(e.pid, c.uid); },
  async museum(e, commit) { await flyTokens('back', statRect(e.pid, 'h'), cityRect(e.pid), 1); SFX.play('card'); commit(); },
  async end(e, commit) { commit(); await wait(D(200)); },
  async killedWas(e, commit) {
    UI.killedWas = { char: e.char, pid: e.pid }; commit(); pingMed(e.char); SFX.play('kill');
    floatAt(e.pid, `was ${esc(theC(e.char))}`, 'info'); await wait(D(900));
  },
  async roundEnd(e, commit) { UI.calling = null; commit(); await wait(D(500)); },
};

/* ── Screens and sheets: menu, setup, the decisions of a turn, cards and seats, results, the codex ── */
function statsLine() { const r = SET.record; return r.played ? `You have won ${r.won} of ${r.played} games${r.best ? `; your best score is ${r.best}` : ''}.` : 'Choose a character in secret, gather, build. The finest city wins.'; }
function renderMenu() {

  const fan = list.map((c, i) => { const k = i - mid; return charHTML(c, { attrs: `style="--x:${k * (mobile() ? 78 : 108)}px;--y:${Math.abs(k) * 14}px;--rot:${k * 7}deg;--d:${120 + i * 90}ms"` }); }).join('');
  $('#screen-menu').innerHTML = `<div class="menu"><div class="menu-kicker">The Citadels rules · 2016 edition</div><h1 class="menu-title">Masks &amp; Mortar</h1><div class="menu-rule" aria-hidden="true"></div><p class="menu-sub">Take a character in secret, gather gold, build your districts. When a city is complete, the finest city wins.</p>

<div class="menu-actions"><button class="btn" data-act="quick">Play</button><button class="btn ghost" data-act="setup">New game…</button><div class="menu-row"><button class="btn ghost" data-act="rules">How to play</button><button class="btn ghost" data-act="settings">Settings</button></div></div>
<p class="menu-foot">${statsLine()} ${UI.setup.n} players · ${esc(setName(UI.setup.set))} · ${SET.difficulty}</p></div>`;

  $('#screen-setup').innerHTML = `<div class="su-top"><button class="icon-btn" data-act="menu" aria-label="Back to the menu">${ICON.back}</button><h2>New game</h2></div>

<div><label>Computer players</label><br><div class="seg" role="group" aria-label="Difficulty">${['easy', 'normal', 'hard'].map(d => `<button class="${SET.difficulty === d ? 'on' : ''}" data-diff="${d}">${d[0].toUpperCase() + d.slice(1)}</button>`).join('')}</div></div>
<div><label>Rank 9 character</label><br>${ninthSeg}</div></div>

/* ── forms: a sheet with a small state of its own; taps on [data-f] change it and redraw it ── */
const FORMS = {};
function form(kind, init = {}) { UI.form = { kind, ...init }; drawForm(true); }
function drawForm(first) {
  const f = UI.form; if (!f) return;
  const F = FORMS[f.kind], html = F.html(f), o = { closeAct: F.need ? 'hide-need' : 'close', kind: f.kind };
  if (first) openSheet(html, o); else refreshSheet(html, o);
  UI.form = f;
}
function formTap(key, val) { const f = UI.form; if (!f) return; const r = FORMS[f.kind].tap(f, key, val); if (r === 'ok') return formOK(); SFX.play('click'); drawForm(); }
function formOK(alt) { const f = UI.form; if (!f) return; const a = FORMS[f.kind][alt ? 'alt' : 'ok'](f, alt); if (a) humanAct(a); }
const pickBtn = (key, val, inner, o = {}) => `<button class="pick${o.on ? ' on' : ''}" data-f="${key}" data-v="${val}"${o.off ? ' disabled' : ''} aria-pressed="${!!o.on}">${inner}${o.tag ? `<span class="tag${o.red ? ' red' : ''}">${o.tag}</span>` : ''}${o.why ? `<span class="why">${esc(o.why)}</span>` : ''}${o.price != null ? `<span class="price">${o.price}${ic('gold')}</span>` : ''}</button>`;
function playerRow(pid, key, o = {}) {
  const P = S.players[pid], v = publicView(S), city = cityOf(v, pid);
  return `<button class="prow${o.on ? ' on' : ''}" data-f="${key}" data-v="${pid}"${o.off ? ' disabled' : ''}>${badge(pid)}<b>${esc(nameOf(pid))}</b>${S.crown === pid ? ic('crown') : ''}${o.note ? `<span class="note">${esc(o.note)}</span>` : ''}<span class="stats">${ic('gold')}${P.gold} ${ic('card')}${P.hand.length} ${ic('points')}${cityPts(city)}</span></button>`;
}
const okBtn = (label, on, cls = '') => `<button class="btn ${cls}" data-act="form-ok"${on ? '' : ' disabled'}>${label}</button>`;
const altBtn = (label, val = 1) => `<button class="btn ghost" data-act="form-alt" data-v="${val}">${label}</button>`;
const charSort = list => list.slice().sort((a, b) => CHAR[a].rank - CHAR[b].rank);

/* the selection: choose a character (or, with two players, put one face down) */
FORMS.pick = {
  need: true,
  html(f) {
    const nd = S.need, P = S.players[0], down = nd.op === 'down', two = S.n <= 3;
    const opts = charSort(nd.options);
    const sub = down ? 'It leaves play face down; your rival chooses from the rest.' : two ? `With ${S.n} players you take two characters a round${P.chars.length ? `; you already have ${theC(P.chars[0])}` : ''}.` : nd.op === 'keepPlus' ? 'You are the last to choose: the face-down card is in the pile too.' : `${plural(opts.length, 'character')} left. The rest go on to ${S.n > 3 ? 'the next player' : 'your rival'}.`;
    return `<h2>${down ? 'Put a character face down' : 'Choose your character'}</h2><p class="muted">${sub}</p>
<div class="pick-grid">${opts.map(c => pickBtn('char', c, charHTML(c, { size: 'md' }), { on: f.char === c })).join('')}</div>
${S.sel.faceUp.length ? `<div class="out-row">Face up, out this round: ${S.sel.faceUp.map(c => chipHTML(c)).join('')}</div>` : ''}${P.chars.length ? `<div class="out-row">Yours: ${P.chars.map(c => chipHTML(c)).join('')}</div>` : ''}
<div class="row end">${okBtn(f.char ? `${down ? 'Put down' : 'Take'} ${esc(theC(f.char))}` : 'Choose one', !!f.char)}</div>`;
  },
  tap(f, k, v) { if (f.char === v) return 'ok'; f.char = v; },
  ok: f => f.char && { t: 'pick', char: f.char },
};
FORMS.theater = {
  need: true,
  html(f) {
    const P = S.players[0], opps = S.players.filter(X => X !== P && X.chars.length);

${P.chars.length > 1 ? `<h3>Give</h3><div class="pick-grid">${P.chars.map(c => pickBtn('give', c, charHTML(c, { size: 'sm' }), { on: f.give === c })).join('')}</div>` : `<div class="out-row">Yours: ${chipHTML(P.chars[0])}</div>`}
<h3>Swap with</h3><div class="plist">${opps.map(X => playerRow(X.id, 'target', { on: f.target === X.id, note: X.chars.length > 1 ? 'a random one of their two' : '' })).join('')}</div>
<div class="row end">${altBtn('Keep mine')}${okBtn(f.target != null ? `Swap with ${esc(objOf(f.target))}` : 'Swap', f.target != null && (P.chars.length < 2 || f.give))}</div>`;
  },
  tap(f, k, v) { if (k === 'give') f.give = v; else f.target = +v; },
  ok: f => ({ t: 'theater', target: f.target, give: f.give || S.players[0].chars[0] }),
  alt: () => ({ t: 'theater', target: null }),

FORMS.keep = {
  need: true,
  html(f) {
    const nd = S.need, sch = nd.why === 'scholar';
    return `<h2>${sch ? 'The Scholar: keep one card' : 'Keep one card'}</h2><p class="muted">${sch ? 'The others are shuffled back into the deck.' : 'The other goes to the bottom of the deck.'}</p>
<div class="pick-grid">${nd.cards.map(c => pickBtn('uid', c.uid, districtHTML(c, { size: 'md', cost: c.cost == null ? null : buildCost(S.players[0], c) }), { on: f.uid === c.uid, tag: has(S.players[0], c.id) && !has(S.players[0], 'quarry') ? 'in your city' : '' })).join('')}</div>
<div class="row end">${okBtn(f.uid ? `Keep the ${esc(nd.cards.find(c => c.uid === f.uid).name)}` : 'Choose one', !!f.uid)}</div>`;
  },
  tap(f, k, v) { if (f.uid === +v) return 'ok'; f.uid = +v; },
  ok: f => f.uid && { t: 'keep', uids: [f.uid] },

FORMS.bribe = {
  need: true,
  html() {
    const th = S.threats.find(x => x.char === S.cur.char && x.on), B = th.by, P = S.players[0], half = Math.floor(P.gold / 2);

<div class="row end">${altBtn('Refuse')}${okBtn(`Pay ${half}${ic('gold')}`, true)}</div>`;
  },
  tap() { }, ok: () => ({ t: 'bribe', pay: true }), alt: () => ({ t: 'bribe', pay: false }),

FORMS.reveal = {
  need: true,
  html() {
    const X = S.need.target, th = S.threats.find(x => x.char === S.cur.char && x.on);
    return `<h2>${esc(nameOf(X))} refuses to pay</h2><p>Your threat on ${esc(theC(S.cur.char))} is <b>${th.real ? 'the real one' : 'an empty one'}</b>. ${th.real ? `Turn it up and take all ${possOf(X)} gold (${plural(S.players[X].gold, 'gold', 'gold')}).` : 'Turning it up only shows it was empty.'}</p>
<div class="row end">${altBtn('Leave it face down')}${okBtn('Turn it up', true)}</div>`;
  },
  tap() { }, ok: () => ({ t: 'reveal', reveal: true }), alt: () => ({ t: 'reveal', reveal: false }),

FORMS.confiscate = {
  need: true,
  html() {
    const nd = S.need;
    return `<h2>Confiscate the ${esc(nd.card.name)}?</h2><div class="peek">${districtHTML(nd.card, { size: 'md' })}</div><p>${esc(nameOf(nd.builder))} ${vb(nd.builder, 'are', 'is')} ${theC(S.cur.char)}, on your signed warrant, and just paid ${plural(nd.goldPaid, 'gold', 'gold')} for it. Reveal the warrant to take the district into your city for free; ${esc(objOf(nd.builder))} ${vb(nd.builder, 'get', 'gets')} the gold back.</p>
<div class="row end">${altBtn('Let it be')}${okBtn('Confiscate', true)}</div>`;
  },
  tap() { }, ok: () => ({ t: 'confiscate', take: true }), alt: () => ({ t: 'confiscate', take: false }),
};
FORMS.wizard = {
  need: true,
  html(f) {
    const nd = S.need, P = S.players[0], card = f.uid && nd.cards.find(c => c.uid === f.uid);

}
