<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mayhem Classic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Metamorphous&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>/* ── Mayhem Classic · a brawl by torchlight ──
   A stone cellar lit by two torches, a chalk ring on the floor where cards are played, and four heroes whose decks
   each wear their own colour and pattern. Seats are parchment plaques; shields in play stand in front of their owner. */
:root{
  --ink:#24180f;--ink-2:#57473a;--ink-3:#8a7866;--parch:#f2e5c8;--parch-hi:#fbf3e1;--parch-lo:#dcc8a1;
  --gold:#d6a73e;--gold-hi:#f4d68b;--gold-lo:#8a6417;--blood:#a8261b;
  --f-head:'Metamorphous',Georgia,serif;--f-text:'Alegreya Sans',system-ui,-apple-system,sans-serif;
  --cw:150px;--ch:212px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:#121016;overscroll-behavior:none}
body{font-family:var(--f-text);color:var(--parch);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
.hidden{display:none!important}
#app{position:relative;height:100%;overflow:hidden;background:
  radial-gradient(ellipse 38% 46% at 6% 0%,rgba(255,150,60,.30),rgba(255,150,60,0) 70%),
  radial-gradient(ellipse 38% 46% at 94% 0%,rgba(255,150,60,.30),rgba(255,150,60,0) 70%),
  radial-gradient(ellipse 70% 55% at 50% 52%,rgba(255,190,120,.10),rgba(255,190,120,0) 70%),
  radial-gradient(ellipse 130% 100% at 50% 50%,rgba(0,0,0,0) 40%,rgba(0,0,0,.65) 100%),
  var(--stone-tex),linear-gradient(180deg,#2a2530,#17141b)}
.screen{position:relative;height:100%;z-index:1}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
#table,#topbar,#hand,.seat,.shc,.btn,.icon-btn{touch-action:manipulation}
#screen-match{-webkit-user-select:none;user-select:none}

/* buttons: oxblood leather with brass; parchment tags for the quieter ones */
.btn{font-family:var(--f-head);font-size:18px;line-height:1.1;min-height:46px;padding:10px 22px;border:0;border-radius:8px;cursor:pointer;color:#fdeccc;
  background:var(--leather-tex),linear-gradient(#b23a2a,#7d2216);text-shadow:0 1px 0 rgba(0,0,0,.5);
  box-shadow:inset 0 0 0 1px rgba(255,214,150,.65),inset 0 0 0 3px rgba(110,30,18,.9),inset 0 0 0 4px rgba(255,214,150,.3),0 3px 0 #45120a,0 8px 18px rgba(0,0,0,.5)}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(1px)}
.btn.ghost{color:var(--ink);text-shadow:none;background:var(--parch-tex),linear-gradient(#f5ead1,#dcc79c);
  box-shadow:inset 0 0 0 1px rgba(36,24,15,.65),inset 0 0 0 3px rgba(251,243,225,.7),inset 0 0 0 4px rgba(168,38,27,.3),0 3px 0 #6f5a3a,0 8px 18px rgba(0,0,0,.4)}
.btn.small{font-size:16px;min-height:40px;padding:7px 15px}
.btn:disabled{opacity:.55;cursor:default;filter:grayscale(.4)}
.icon-btn{position:relative;width:44px;height:44px;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--gold-hi);
  background:radial-gradient(circle at 40% 35%,#4a3a52,#1d1622);box-shadow:inset 0 0 0 1.5px var(--gold),inset 0 0 0 3.5px rgba(0,0,0,.45),0 2px 5px rgba(0,0,0,.55)}
.icon-btn svg{width:22px;height:22px}
.mob-only{display:none!important}

/* ── cards: a painted card in its hero's colour; the symbols run down the left of the picture ── */
.card{--w:var(--cw);--hh:var(--ch);--s:calc(var(--w) * .19);position:relative;width:var(--w);height:var(--hh);flex:0 0 auto;user-select:none;color:var(--ink);filter:drop-shadow(0 6px 8px rgba(0,0,0,.55))}
.card .cf{position:absolute;inset:0;border-radius:calc(var(--w) * .08);padding:calc(var(--w) * .045);background-color:var(--h);background-image:var(--pat),linear-gradient(155deg,rgba(255,255,255,.2),rgba(0,0,0,.28));
  box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.65),inset 0 0 0 3px rgba(255,236,200,.38),inset 0 -8px 14px rgba(0,0,0,.25)}
.card .cb{position:relative;height:100%;display:flex;flex-direction:column;border-radius:calc(var(--w) * .055);overflow:hidden;
  background:var(--parch-tex),linear-gradient(180deg,var(--parch-hi),var(--parch) 62%,var(--parch-lo));box-shadow:inset 0 0 0 1px rgba(30,18,10,.75),inset 0 0 18px rgba(120,80,30,.22)}
.card .cn{position:relative;z-index:1;margin:0;padding:calc(var(--w) * .035) 6px calc(var(--w) * .03) calc(var(--s) + 9px);font-family:var(--f-head);font-size:calc(var(--w) * .092);line-height:1.04;color:#fff4dc;text-shadow:0 1px 0 rgba(0,0,0,.6);
  background:linear-gradient(90deg,var(--hd),var(--h));box-shadow:inset 0 -1px 0 rgba(0,0,0,.4),0 1px 0 rgba(255,236,200,.45);min-height:calc(var(--w) * .2);display:flex;align-items:center}
.card .cn span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .cart{position:relative;flex:0 0 47%;margin:0;background:radial-gradient(circle at 56% 48%,var(--hw) 0,var(--hw2) 70%,var(--hw3) 100%);box-shadow:inset 0 -1px 0 rgba(30,18,10,.45)}
.card .cart svg.art{position:absolute;left:calc(var(--s) * .55);right:0;top:4%;bottom:4%;width:calc(100% - var(--s) * .55);height:92%;color:var(--h);filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.card .csy{position:absolute;z-index:2;left:calc(var(--w) * .035);top:calc(var(--w) * .035);display:flex;flex-direction:column;gap:calc(var(--w) * .012)}
.card .csy .sym{width:var(--s);height:var(--s);display:block;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.45))}
.card.many .csy{flex-wrap:wrap;max-height:calc(var(--hh) * .62);column-gap:2px}
.card .ct{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:calc(var(--w) * .03) calc(var(--w) * .06) calc(var(--w) * .05);font-size:calc(var(--w) * .084);line-height:1.22}
.card .ct span{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.card .ct b{font-weight:800}
/* Mighty Power: a gilded inner frame and a star seal */
.card.mighty .cf{background-image:var(--pat),linear-gradient(155deg,rgba(255,240,190,.35),rgba(0,0,0,.2));box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.65),inset 0 0 0 3px #f0cf74,inset 0 0 0 4.5px rgba(80,50,8,.7),inset 0 -8px 14px rgba(0,0,0,.25)}
.card.mighty .cb{box-shadow:inset 0 0 0 1px rgba(30,18,10,.75),inset 0 0 0 3px rgba(240,207,116,.75),inset 0 0 18px rgba(120,80,30,.22)}
.card .seal{position:absolute;z-index:3;right:calc(var(--w) * -.03);bottom:calc(var(--w) * -.04);width:calc(var(--w) * .2);height:calc(var(--w) * .2)}
.card .seal svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.card .ckind{position:absolute;z-index:2;right:6px;bottom:calc(53% - var(--w) * .1);font-family:var(--f-text);font-weight:800;font-size:calc(var(--w) * .062);letter-spacing:.08em;text-transform:uppercase;color:#4b3206;padding:1px 6px;border-radius:3px;background:linear-gradient(#f7e2a3,#e1b955);box-shadow:0 1px 2px rgba(0,0,0,.4)}
/* sizes */
.card.sm{--w:108px;--hh:152px}
.card.lg{--w:214px;--hh:302px}
.card.xs{--w:84px;--hh:118px}.card.xs .ct{display:none}.card.xs .cart{flex:1}
.cback{display:inline-block;width:12px;height:17px;border-radius:2px;margin-right:-5px;background:var(--h,#5a3c6a);background-image:var(--pat);box-shadow:0 0 0 1px rgba(0,0,0,.6),inset 0 0 0 1.5px rgba(255,236,200,.4)}

/* keywords take the colour of their symbol */
.kw{font-weight:800}.k-A{color:#a3221a}.k-S{color:#2f5b86}.k-H{color:#24704a}.k-D{color:#35449a}.k-P{color:#9a6609}.k-M{color:#6b3399}

/* ── the table ── */
#screen-match{display:flex;flex-direction:column}
#topbar{flex:0 0 auto;height:54px;display:flex;align-items:center;gap:10px;padding:0 14px;position:relative;z-index:5;
  background:var(--leather-tex),linear-gradient(180deg,#3a2c40,#1f1824);box-shadow:inset 0 -1px 0 rgba(244,214,139,.38),inset 0 -3px 0 rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.5)}
.tb-mid{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;min-width:0}
.tb-right{display:flex;gap:8px;align-items:center}
.pill{font-family:var(--f-head);font-size:17px;white-space:nowrap;color:var(--gold-hi);padding:4px 14px;border-radius:4px;background:rgba(0,0,0,.3);box-shadow:inset 0 0 0 1px rgba(244,214,139,.3)}
.pill.you{color:#fdeccc;background:linear-gradient(#b23a2a,#7d2216);box-shadow:inset 0 0 0 1px rgba(255,214,150,.55)}
.pips{display:flex;align-items:center;gap:5px;font-weight:800;font-size:14px;color:var(--gold-hi)}.pip{width:20px;height:20px;display:block}
.speed{min-width:58px;height:44px;border:0;border-radius:22px;cursor:pointer;font-family:var(--f-head);font-size:16px;color:var(--gold-hi);background:radial-gradient(circle at 40% 35%,#4a3a52,#1d1622);box-shadow:inset 0 0 0 1.5px var(--gold),0 2px 5px rgba(0,0,0,.55)}
#table{flex:1;min-height:0;display:grid;gap:10px 16px;padding:10px 18px 0;
  grid-template-columns:380px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;
  grid-template-areas:"opps opps" "stage stage" "me act" "me hand"}
#opps{grid-area:opps;display:flex;justify-content:center;gap:16px;min-width:0}
#opps .seat{flex:0 1 360px;min-width:0}#opps.n1 .seat{flex-basis:440px}

/* seats: a parchment plaque under its hero's banner; HP in a heart and a track of ten */
.seat{position:relative;min-width:0;border-radius:8px;color:var(--ink);background:var(--parch-tex),linear-gradient(180deg,var(--parch-hi),var(--parch));transition:box-shadow .2s,transform .2s,outline-color .2s;
  box-shadow:inset 0 0 0 1px rgba(36,24,15,.75),inset 0 0 0 3px rgba(251,243,225,.6),inset 0 0 0 4px rgba(0,0,0,.18),0 10px 24px rgba(0,0,0,.55)}
.seat-banner{position:relative;display:flex;align-items:center;gap:8px;min-height:46px;padding:4px 8px 4px 8px;color:#fff4dc;border-radius:8px 8px 0 0;
  background-color:var(--h);background-image:var(--pat),linear-gradient(180deg,rgba(255,255,255,.14),rgba(0,0,0,.22));box-shadow:inset 0 -2px 0 rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,236,200,.3)}
.seat-banner .emb{flex:0 0 auto;width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--hw),var(--hw3));box-shadow:0 0 0 2px rgba(0,0,0,.45),0 0 0 3.5px rgba(255,236,200,.55)}
.seat-banner .emb svg{width:30px;height:30px;color:var(--h)}
.sname{display:flex;flex-direction:column;min-width:0;line-height:1}
.sname b{font-family:var(--f-head);font-weight:400;font-size:20px;text-shadow:0 1px 0 rgba(0,0,0,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sname small{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.9;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flag{flex:0 0 auto;font-weight:800;font-size:12px;padding:1px 8px;border-radius:3px;background:var(--gold-hi);color:#2a1a06}.flag.out{background:#24180f;color:var(--parch)}
.flag.vanish{background:#2b1450;color:#e8ddf5;box-shadow:inset 0 0 0 1px rgba(232,221,245,.5)}
.hpheart{margin-left:auto;position:relative;flex:0 0 auto;width:48px;height:44px;display:grid;place-items:center;cursor:help}
.hpheart svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.hpheart b{position:relative;margin-top:-3px;font-weight:800;font-size:21px;line-height:1;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.6)}
.hpheart.low{animation:throb 1s ease-in-out infinite}
@keyframes throb{50%{transform:scale(1.1)}}
.hptrack{display:flex;gap:2px;padding:5px 9px 0}
.hptrack i{flex:1;height:7px;border-radius:2px;background:rgba(36,24,15,.18);box-shadow:inset 0 1px 1px rgba(0,0,0,.25);transition:background-color .3s}
.hptrack i.on{background:linear-gradient(180deg,#e2503a,#a4241a);box-shadow:inset 0 1px 0 rgba(255,210,190,.5)}
.seat-body{display:flex;align-items:flex-end;gap:10px;padding:7px 10px 10px;min-height:96px}
.shields{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:7px}
.shields .none{align-self:center;font-style:italic;font-size:13.5px;color:var(--ink-3)}
.stash{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.backs{display:inline-flex;align-items:center;font-weight:800;font-size:14px;color:var(--ink-2);cursor:help}.backs b{margin-left:10px}
.piles{display:flex;gap:6px}
.pile{border:0;cursor:pointer;font-weight:800;font-size:13px;min-height:30px;padding:3px 9px;border-radius:4px;color:var(--ink-2);background:rgba(36,24,15,.07);box-shadow:inset 0 0 0 1px rgba(36,24,15,.28)}
.pile:hover{background:rgba(36,24,15,.13)}
.pile.static{cursor:help}
.seat.turn{box-shadow:inset 0 0 0 1px rgba(36,24,15,.75),inset 0 0 0 3px rgba(251,243,225,.6),0 0 0 2.5px var(--gold-hi),0 0 30px rgba(244,214,139,.5),0 10px 24px rgba(0,0,0,.55)}
.seat.targetable{cursor:crosshair;outline:3px dashed rgba(226,96,64,.95);outline-offset:4px}
.seat.targetable.hot{outline-style:solid;outline-color:#ef6a48;box-shadow:inset 0 0 0 1px rgba(36,24,15,.75),0 0 36px rgba(239,106,72,.7),0 10px 24px rgba(0,0,0,.55)}
.seat.out{filter:grayscale(.9) brightness(.65)}
.seat.vanished .seat-body,.seat.vanished .hptrack{opacity:.55}
.seat.vanished::after{content:'';position:absolute;inset:0;border-radius:8px;pointer-events:none;background:radial-gradient(ellipse at 30% 70%,rgba(90,60,140,.28),rgba(90,60,140,0) 60%),radial-gradient(ellipse at 75% 40%,rgba(90,60,140,.22),rgba(90,60,140,0) 55%)}
.seat.hit{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.chips{position:absolute;left:50%;top:-14px;transform:translateX(-50%);display:flex;gap:4px;z-index:6;pointer-events:none;white-space:nowrap}
.chip{font-weight:800;font-size:13.5px;padding:2px 9px;border-radius:4px;box-shadow:0 0 0 1px rgba(36,24,15,.6),0 3px 8px rgba(0,0,0,.45)}
.chip.dmg{background:#f8d9cd;color:#8a2412}.chip.heal{background:#d3ecd9;color:#1f5e3a}.chip.shield{background:#dbe5ef;color:#2b4f75}.chip.cards{background:#dfe1f4;color:#2c3878}.chip.ko{background:#8a2412;color:#fff}.chip.info{background:#e9ddf5;color:#4c2780}
.floats{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center;z-index:7}
.float{position:absolute;font-weight:800;font-size:31px;white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 12px rgba(255,244,220,.85);animation:floatup 1.5s ease-out forwards}
.float.dmg{color:#a8261b}.float.heal{color:#22704a}.float.shield{color:#2b4f75;font-size:22px}.float.info{color:#4c2780;font-size:21px}.float.cards{color:#2c3878;font-size:21px}.float.big{font-size:40px}
@keyframes floatup{0%{transform:translateY(10px) scale(.6);opacity:0}15%{transform:scale(1.1);opacity:1}100%{transform:translateY(-48px);opacity:0}}

/* shields in play: a little card standing in front of its holder, one pip per shield symbol (spent ones cracked) */
.shc{position:relative;width:58px;height:78px;padding:0;border:0;border-radius:6px;cursor:help;flex:0 0 auto;background-color:var(--h);background-image:var(--pat),linear-gradient(155deg,rgba(255,255,255,.2),rgba(0,0,0,.25));
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),inset 0 0 0 2.5px rgba(255,236,200,.35),0 3px 6px rgba(0,0,0,.4);transition:transform .15s,box-shadow .15s}
.shc .shc-art{position:absolute;left:3px;right:3px;top:3px;height:46px;border-radius:4px;background:radial-gradient(circle at 50% 45%,var(--hw) 0,var(--hw2) 70%,var(--hw3));box-shadow:inset 0 0 0 1px rgba(30,18,10,.6)}
.shc .shc-art svg{width:100%;height:100%;display:block;color:var(--h)}
.shc .shc-pips{position:absolute;left:2px;right:2px;bottom:4px;display:flex;justify-content:center;gap:1px}
.shc .shc-pips svg{width:17px;height:17px;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.shc .shc-pips svg.used{opacity:.32;filter:grayscale(1)}
.shc .lent{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--oh,#444);box-shadow:0 0 0 1.5px var(--parch),0 1px 3px rgba(0,0,0,.5)}
.shc.targetable{cursor:crosshair;outline:2.5px dashed rgba(226,96,64,.95);outline-offset:2px}
.shc.targetable.hot,.shc.targetable:hover{outline-style:solid;outline-color:#ef6a48;transform:translateY(-3px);box-shadow:0 0 18px rgba(239,106,72,.8),0 3px 6px rgba(0,0,0,.4)}
.shc.fresh{animation:raise .45s cubic-bezier(.2,.9,.3,1.3)}
@keyframes raise{from{transform:translateY(-26px) scale(1.25);opacity:0}}
.shc.cracked{animation:crack .3s}
@keyframes crack{30%{transform:rotate(-6deg) scale(.94)}60%{transform:rotate(5deg)}}

/* the middle: a chalk ring on the cellar floor */
#stage{grid-area:stage;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
#stage .ring{position:absolute;left:50%;top:50%;width:min(92%,calc(100% * 1.9),560px);aspect-ratio:1.9;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  background:var(--ring) center/100% 100% no-repeat,radial-gradient(ellipse at 50% 50%,rgba(255,200,130,.16),rgba(255,200,130,0) 70%);opacity:.95}
#stage .dropglow{position:absolute;left:50%;top:50%;width:min(92%,560px);aspect-ratio:1.9;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;opacity:0;transition:opacity .15s ease;will-change:opacity;
  box-shadow:0 0 0 3px rgba(239,106,72,.85),inset 0 0 70px rgba(244,190,110,.55),0 0 40px rgba(244,190,110,.45)}
#stage.holding .dropglow{opacity:.35}#stage.drop-ok .dropglow{opacity:1}
#stage-card{position:relative;min-height:10px;display:flex;justify-content:center;transition:opacity .15s}
.stage-fit{transform-origin:top center}
#stage-card .card.pop{animation:pop .3s ease-out}
@keyframes pop{from{transform:scale(.82);opacity:.2}to{transform:none;opacity:1}}
#stage-caption{position:relative;margin-top:12px;font-family:var(--f-head);font-size:18px;color:var(--gold-hi);min-height:24px;text-align:center;padding:0 12px;text-shadow:0 1px 0 #000,0 0 14px rgba(0,0,0,.8)}
#stage.holding #stage-card{opacity:.35}
#me{grid-area:me;align-self:end;padding-bottom:12px}
#prompt{grid-area:act}
.actionbar{position:relative;z-index:60;display:flex;align-items:center;justify-content:center;gap:10px;min-height:50px}
.actionbar .hint{font-family:var(--f-head);font-size:19px;color:var(--gold-hi);text-align:center;text-shadow:0 1px 0 #000,0 0 12px rgba(0,0,0,.7)}
.actionbar .btn{white-space:nowrap;min-width:120px}
/* the hand: one straight row; a chosen card rises 8px; a dragged card is a copy on its own layer */
#handzone{grid-area:hand;position:relative;align-self:end;min-width:0}
#hand{position:relative;display:flex;align-items:flex-end;gap:18px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;scrollbar-width:none;overscroll-behavior-x:contain;padding:22px 20px 14px;touch-action:pan-x}
#hand::-webkit-scrollbar{display:none}
#handzone.over #hand{padding-left:54px;padding-right:54px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 50px,#000 calc(100% - 50px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 50px,#000 calc(100% - 50px),transparent)}
#hand>.card:first-child{margin-left:auto}#hand>.card:last-child{margin-right:auto}
#hand .card{scroll-snap-align:center;transition:transform .2s cubic-bezier(.2,.9,.3,1.2),opacity .15s;-webkit-touch-callout:none}
#hand .card.playable{cursor:grab}
#hand .card.sel{transform:translateY(-8px);filter:drop-shadow(0 0 1.5px #fff3c8) drop-shadow(0 0 3px var(--gold-hi)) drop-shadow(0 0 12px rgba(244,214,139,.95))}
#hand .card.dim{filter:saturate(.75) brightness(.8) drop-shadow(0 6px 8px rgba(0,0,0,.55))}
#hand .card.drag-src{opacity:.35;transform:none;cursor:grabbing}
#hand .card.fresh{animation:drawn .45s cubic-bezier(.2,.9,.3,1.1)}
@keyframes drawn{from{transform:translateY(40px) scale(.9);opacity:0}}
.hand-empty{align-self:center;margin:auto;font-style:italic;color:#cdbb98}
.hand-nav{display:none;position:absolute;top:50%;z-index:2;width:38px;height:38px;margin-top:-15px;padding:0;border:0;border-radius:50%;place-items:center;cursor:pointer;font-size:26px;line-height:1;color:var(--gold-hi);
  background:radial-gradient(circle at 40% 35%,#4a3a52,#1d1622);box-shadow:inset 0 0 0 1.5px var(--gold),0 2px 6px rgba(0,0,0,.55)}
#handzone.over .hand-nav{display:grid}
.hand-nav.prev{left:6px}.hand-nav.next{right:6px}
.hand-nav:disabled{opacity:.3;cursor:default}
#drag-ghost{position:fixed;left:0;top:0;z-index:75;pointer-events:none;display:none;transform-origin:0 0;will-change:transform}
#drag-ghost.on{display:block}
#drag-ghost .card{margin:0;filter:drop-shadow(0 16px 18px rgba(0,0,0,.55));animation:pickup .14s ease-out}
@keyframes pickup{from{transform:scale(1.25) rotate(3deg)}}

/* drawer, sheets, tooltip, banner */
.drawer{position:absolute;top:54px;right:0;bottom:0;width:340px;z-index:30;padding:16px 18px;overflow:auto;transform:translateX(105%);transition:transform .25s ease;color:var(--ink);
  background:var(--parch-tex),linear-gradient(180deg,var(--parch-hi),var(--parch));box-shadow:inset 1px 0 0 rgba(36,24,15,.5),-14px 0 32px rgba(0,0,0,.5)}
.drawer.open{transform:none}
.drawer h3{margin:0 0 10px;font-family:var(--f-head);font-weight:400;font-size:24px;color:var(--blood)}
.log{list-style:none;margin:0;padding:0}.log li{padding:7px 0;border-bottom:1px solid rgba(36,24,15,.15);font-size:15px;line-height:1.35}.log li.r{font-family:var(--f-head);font-size:16px;color:var(--blood)}
.sheet-wrap{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:18px;background:rgba(10,6,12,.7)}
.sheet-panel{width:min(780px,100%);max-height:88dvh;overflow:auto;border-radius:6px;padding:22px 24px;color:var(--ink);background:var(--parch-tex),linear-gradient(180deg,var(--parch-hi),var(--parch));
  box-shadow:inset 0 0 0 1px rgba(36,24,15,.7),inset 0 0 0 4px rgba(251,243,225,.7),inset 0 0 0 5px rgba(168,38,27,.35),inset 0 0 60px rgba(120,80,30,.25),0 28px 70px rgba(0,0,0,.7)}
.sheet-panel h2{margin:0 0 6px;font-family:var(--f-head);font-weight:400;font-size:30px;line-height:1.05;color:var(--blood)}
.sheet-panel h3{margin:16px 0 6px;font-family:var(--f-head);font-weight:400;font-size:20px;color:var(--blood)}
.sheet-panel p{line-height:1.45;font-size:16px;margin:6px 0}
.muted{color:var(--ink-3)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.row.center{justify-content:center}
.seg{display:inline-flex;padding:3px;gap:3px;border-radius:6px;background:rgba(36,24,15,.1);box-shadow:inset 0 0 0 1px rgba(36,24,15,.25)}
.seg button{border:0;cursor:pointer;min-height:42px;padding:6px 14px;border-radius:4px;background:none;font-weight:800;font-size:15px;color:var(--ink-2)}
.seg button.on{color:#fdeccc;background:linear-gradient(#b23a2a,#7d2216);box-shadow:inset 0 0 0 1px rgba(255,214,150,.5)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid rgba(36,24,15,.14)}
.set-row>div>b{display:block;font-family:var(--f-head);font-weight:400;font-size:18px}.set-row>div>span{font-size:14.5px;color:var(--ink-3)}
.decklist{columns:2;column-gap:18px;margin:6px 0}.decklist div{break-inside:avoid;display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dotted rgba(36,24,15,.25);font-size:15px}
.tip{position:fixed;z-index:90;max-width:300px;padding:9px 12px;border-radius:5px;font-size:14.5px;line-height:1.35;color:var(--ink);background:var(--parch-tex),#fbf3e1;box-shadow:inset 0 0 0 1px rgba(36,24,15,.6),0 12px 28px rgba(0,0,0,.5);pointer-events:none}
#banner{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:50;text-align:center;pointer-events:none;opacity:0;width:min(92vw,760px)}
#banner .ribbon{display:inline-block;padding:14px 34px 16px;background:linear-gradient(90deg,rgba(14,8,16,0),rgba(14,8,16,.85) 14%,rgba(14,8,16,.85) 86%,rgba(14,8,16,0));box-shadow:inset 0 1px 0 rgba(244,214,139,.45),inset 0 -1px 0 rgba(244,214,139,.45)}
#banner .bt{font-family:var(--f-head);font-size:clamp(32px,5.4vw,58px);line-height:1.04;color:var(--gold-hi);text-shadow:0 3px 0 #2a1606,0 0 30px rgba(0,0,0,.85)}
#banner .bs{margin-top:8px;font-size:19px;color:#fdeccc;text-shadow:0 2px 8px #000}
#banner.show{animation:bannerIn var(--bdur,1.9s) ease-out}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-40%)}12%{opacity:1;transform:translate(-50%,-50%)}78%{opacity:1}100%{opacity:0}}
#fx-layer{position:fixed;inset:0;z-index:45;pointer-events:none}
.mv{pointer-events:none;transform-origin:50% 50%;will-change:transform,opacity}
.mv .card{margin:0}
.mv-tag{position:absolute;left:50%;top:-10px;transform:translate(-50%,-100%);white-space:nowrap;font-weight:800;font-size:18px;line-height:1.15;padding:4px 14px 5px;border-radius:5px;color:#fbe9d0;background:#5d2d8a;box-shadow:0 0 0 1.5px rgba(255,228,170,.55),0 8px 18px rgba(0,0,0,.55)}
.mv-tag.recall{background:#7a5a12}.mv-tag.charm{background:#2c5fb2}
#fx-arrows{position:fixed;inset:0;width:100%;height:100%;z-index:44;pointer-events:none}
.arrow{fill:none;stroke-width:4.5;stroke-linecap:round;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.arrow.dmg{stroke:#d0392a}.arrow.break{stroke:#8a5a2b}.arrow.magic{stroke:#8a54d0}.arrow.aim{stroke:#ef6a48;stroke-dasharray:10 9}
.blastfx{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:46;background:radial-gradient(circle at var(--x,50%) var(--y,50%),rgba(255,170,60,.55),rgba(255,90,20,.25) 30%,rgba(255,90,20,0) 60%);animation:blast .7s ease-out forwards}
@keyframes blast{0%{opacity:0}20%{opacity:1}100%{opacity:0}}

/* menu */
#screen-menu{display:grid;place-items:center;padding:24px}
.menu{display:flex;flex-direction:column;align-items:center;text-align:center}
.menu-kicker{font-weight:800;font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.menu-title{margin:2px 0 0;font-family:var(--f-head);font-weight:400;font-size:clamp(50px,9vw,108px);line-height:.95;color:var(--gold-hi);text-shadow:0 4px 0 #2a1606,0 0 40px rgba(0,0,0,.75)}
.menu-rule{width:min(420px,70vw);height:14px;margin:10px auto 4px;background:var(--rule) center/contain no-repeat}
.menu-sub{margin:4px 0 0;font-size:20px;font-style:italic;color:#e9dcc0;max-width:36ch}
.menu-fan{position:relative;height:262px;width:min(740px,94vw);margin:18px 0 12px}
.menu-fan .card{position:absolute;left:50%;top:12px;margin-left:calc(var(--cw) / -2);transform:translateX(var(--x)) translateY(var(--y)) rotate(var(--rot));transform-origin:50% 120%;animation:deal .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
@keyframes deal{from{transform:translateX(0) translateY(60px) rotate(0);opacity:0}}
.menu-actions{display:flex;flex-direction:column;gap:12px;width:min(340px,90vw)}
.menu-row{display:flex;gap:12px}.menu-row .btn{flex:1}
.menu-foot{margin-top:16px;font-size:15px;font-style:italic;color:#c9b898}

/* hero select */
#screen-select{display:grid;grid-template-columns:minmax(0,1fr) 470px;grid-template-rows:auto minmax(0,1fr);gap:0 20px;padding:0 20px 20px}
.sel-top{grid-column:1/-1;display:flex;align-items:center;gap:12px;height:66px}
.sel-top h2{margin:0;flex:1;font-family:var(--f-head);font-weight:400;font-size:30px;color:var(--gold-hi);text-shadow:0 2px 0 #000}
.sel-list{overflow:auto;padding:6px 6px 20px 2px}
.sel-list h3{margin:10px 0 10px;font-family:var(--f-head);font-weight:400;font-size:20px;color:var(--gold-hi);text-shadow:0 1px 0 #000}
.hero-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.hero-tile{position:relative;min-height:150px;border:0;cursor:pointer;text-align:left;color:#fff4dc;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;border-radius:10px;overflow:hidden;
  background-color:var(--h);background-image:var(--pat),linear-gradient(160deg,rgba(255,255,255,.16),rgba(0,0,0,.35));box-shadow:inset 0 0 0 1px rgba(255,236,200,.4),inset 0 0 0 2.5px rgba(0,0,0,.5),0 8px 18px rgba(0,0,0,.55)}
@media (hover:hover) and (pointer:fine){.hero-tile:hover{filter:brightness(1.1)}}
.hero-tile.on{box-shadow:inset 0 0 0 1px rgba(255,236,200,.6),0 0 0 3px var(--gold-hi),0 0 28px rgba(244,214,139,.55)}
.hero-tile .big{position:absolute;right:-8px;top:-6px;width:118px;height:118px;opacity:.95;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
.hero-tile .big svg{width:100%;height:100%;color:var(--hw)}
.hero-tile .nm{position:relative;font-family:var(--f-head);font-size:23px;line-height:1.02;text-shadow:0 1px 0 rgba(0,0,0,.6)}
.hero-tile .cl{position:relative;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.hero-tile .rec{position:absolute;left:10px;top:9px;font-weight:800;font-size:12.5px;padding:1px 8px;border-radius:3px;background:rgba(0,0,0,.35)}
.sel-note{margin:16px 2px 0;font-size:14.5px;line-height:1.45;color:#cbbb9c;max-width:62ch}
.sel-detail{overflow:auto;border-radius:6px;color:var(--ink);display:flex;flex-direction:column;background:var(--parch-tex),linear-gradient(180deg,var(--parch-hi),var(--parch));
  box-shadow:inset 0 0 0 1px rgba(36,24,15,.7),inset 0 0 0 4px rgba(251,243,225,.7),inset 0 0 0 5px rgba(168,38,27,.32),0 14px 34px rgba(0,0,0,.6)}
.sd-hero{display:flex;gap:14px;align-items:center;padding:18px;color:#fff4dc;background-color:var(--h);background-image:var(--pat),linear-gradient(180deg,rgba(255,255,255,.12),rgba(0,0,0,.25));box-shadow:inset 0 -2px 0 rgba(0,0,0,.35)}
.sd-hero .emb{flex:0 0 auto;width:74px;height:74px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--hw),var(--hw3));box-shadow:0 0 0 3px rgba(0,0,0,.45),0 0 0 5px rgba(255,236,200,.55)}
.sd-hero .emb svg{width:58px;height:58px;color:var(--h)}
.sd-hero h2{margin:0;font-family:var(--f-head);font-weight:400;font-size:32px;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.sd-hero .cls{font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.sd-hero p{margin:5px 0 0;font-size:16px;font-style:italic;opacity:.95}
.sd-body{padding:6px 20px 10px;flex:1}
.sd-body h3{margin:16px 0 10px;font-family:var(--f-head);font-weight:400;font-size:20px;color:var(--blood)}
.mix{display:flex;flex-wrap:wrap;gap:6px 14px}.mix span{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:15.5px}.mix .sym{width:24px;height:24px}
.sd-cards{display:flex;gap:12px;flex-wrap:wrap;padding-bottom:8px}
.sd-cards .cx{position:relative}
.sd-cards .cx em{position:absolute;right:-4px;top:-6px;z-index:5;font-style:normal;font-weight:800;font-size:13px;padding:1px 7px;border-radius:10px;color:#fff4dc;background:#24180f;box-shadow:0 0 0 1.5px var(--parch)}
.sd-foot{position:sticky;bottom:0;padding:12px 20px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:linear-gradient(180deg,rgba(242,229,200,0),var(--parch) 30%)}
.sd-stats{display:flex;gap:16px;flex-wrap:wrap;font-size:15.5px;margin-top:12px}.sd-stats b{font-size:21px}

/* card sheet and pickers */
.card-sheet{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:start}
.cs-card{display:flex;justify-content:center;padding-bottom:12px}
.cs-kind{font-size:15px;color:var(--ink-2)}
.cs-eff{font-size:19px;line-height:1.4;margin:6px 0!important}
.cs-syms>div{display:grid;grid-template-columns:34px 1fr;gap:0 10px;margin:8px 0}
.cs-syms .sym{width:32px;height:32px;grid-row:span 2}
.cs-syms>div>b{font-family:var(--f-head);font-weight:400;font-size:17px;line-height:1.1}
.cs-syms span{font-size:14.5px;color:var(--ink-2);line-height:1.3}
.pick-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:16px 12px;margin:14px 0 6px}
.pick-grid .pick{border:0;padding:0;background:none;cursor:pointer;border-radius:8px;transition:transform .12s ease-out}
.pick-grid .pick:hover,.pick-grid .pick:focus-visible{transform:translateY(-4px)}
.seat-sheet .hdr{display:flex;align-items:center;gap:12px;padding:14px;margin:-22px -24px 10px;color:#fff4dc;background-color:var(--h);background-image:var(--pat)}
.seat-sheet .hdr h2{color:#fff4dc;margin:0}.seat-sheet .hdr p{margin:2px 0 0;font-style:italic}
.seat-sheet .hdr .emb{width:58px;height:58px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--hw),var(--hw3));box-shadow:0 0 0 2px rgba(0,0,0,.45),0 0 0 4px rgba(255,236,200,.55)}
.seat-sheet .hdr .emb svg{width:44px;height:44px;color:var(--h)}
.seat-sheet ul{margin:6px 0;padding-left:18px}.seat-sheet li{margin:3px 0;font-size:15.5px}

/* codex */
.codex{position:fixed;inset:0;z-index:58;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);background:var(--stone-tex),linear-gradient(180deg,#2a2530,#17141b)}
.cx-top{flex:0 0 auto;display:flex;align-items:center;gap:12px;height:56px;padding:0 12px;background:var(--leather-tex),linear-gradient(180deg,#3a2c40,#1f1824);box-shadow:inset 0 -1px 0 rgba(244,214,139,.38),0 4px 14px rgba(0,0,0,.5)}
.cx-top h2{margin:0;flex:1;min-width:0;font-family:var(--f-head);font-weight:400;font-size:24px;color:var(--gold-hi);text-shadow:0 2px 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx-tabs{flex:0 0 auto;display:flex;gap:4px;padding:10px 10px 0;overflow-x:auto;scrollbar-width:none;width:min(1040px,calc(100% - 20px));margin:0 auto}
.cx-tabs button{flex:1 0 auto;min-height:44px;padding:6px 14px;border:0;border-radius:6px 6px 0 0;cursor:pointer;font-family:var(--f-head);font-size:17px;color:var(--gold-hi);background:rgba(0,0,0,.32);box-shadow:inset 0 0 0 1px rgba(244,214,139,.2)}
.cx-tabs button.on{color:var(--blood);background:var(--parch-tex),linear-gradient(var(--parch-hi),var(--parch-hi));box-shadow:none}
.cx-body{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;width:min(1040px,calc(100% - 20px));margin:0 auto calc(10px + env(safe-area-inset-bottom,0px));padding:14px 18px 28px;border-radius:0 0 6px 6px;color:var(--ink);
  background:var(--parch-tex),linear-gradient(180deg,var(--parch-hi),var(--parch));box-shadow:inset 0 0 0 1px rgba(36,24,15,.5),inset 0 0 50px rgba(120,80,30,.2),0 14px 30px rgba(0,0,0,.55)}
.cx-body h3{margin:18px 0 6px;font-family:var(--f-head);font-weight:400;font-size:21px;color:var(--blood)}
.cx-body p,.cx-body li{line-height:1.45;font-size:16px}
.cx-body ul,.cx-body ol{padding-left:22px}
.cx-lead{font-size:16.5px!important;color:var(--ink-2)}
.cx-heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:10px}
.cx-hero .sd-hero{margin:-14px -18px 0}
.cx-sym{display:grid;grid-template-columns:46px minmax(0,1fr);gap:12px;padding:12px 2px;border-bottom:1px solid rgba(36,24,15,.14)}
.cx-sym>.sym{width:42px;height:42px}
.cx-sym>div>b{font-family:var(--f-head);font-weight:400;font-size:19px}
.cx-sym p{margin:2px 0!important;font-size:15px!important;color:var(--ink-2)}
.cx-power{padding:10px 2px;border-bottom:1px solid rgba(36,24,15,.14)}
.cx-power b{font-family:var(--f-head);font-weight:400;font-size:18px}
.cx-power p{margin:2px 0!important;font-size:15px!important;color:var(--ink-2)}

<script>
'use strict';
/* ── Mayhem Classic ──
   The original Dungeon Mayhem rules, played against the computer: every hero is a fixed deck of 28 cards, everyone starts at
   10 HP, you draw 1 and play 1 each turn, and the symbols on a card do the rest. Heroes, card names and art are our own; each deck
   follows the card counts and symbols of its class in the original game.
   The engine is pure (state S, seeded RNG, no DOM) so sim.js and test.js can run it in node. */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
function rnd(S) {
  let t = (S.rs = (S.rs + 0x6D2B79F5) >>> 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const pick = (S, arr) => arr[Math.floor(rnd(S) * arr.length)];
function shuffled(S, arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd(S) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const count = (s, ch) => { let n = 0; for (const c of s || '') if (c === ch) n++; return n; };

/* ── The rules in numbers, the five symbols, and the Mighty Powers ── */
const RULES = { hp: 10, maxHP: 10, startHand: 3, emptyDraw: 2, deckSize: 28, minPlayers: 2, maxPlayers: 4 };

/* every card is a row of symbols, used top to bottom; a Mighty Power card adds the text of its power */
const SYM = {
  A: { name: 'Attack', short: 'damage', desc: 'Deals 1 damage. All the attacks on a card go to one target: an opponent, or one of their shields. Damage left after a shield breaks moves on to their next shield, then to them.' },
  S: { name: 'Shield', short: 'shield', desc: 'The card stays in front of you. Each shield symbol stops 1 damage; when they are all used up the card breaks. While you have a shield, attacks cannot reach your HP.' },
  H: { name: 'Heal', short: 'heal', desc: 'Heal 1 HP. Nobody goes above 10.' },
  D: { name: 'Draw', short: 'draw', desc: 'Draw a card.' },
  P: { name: 'Play again', short: 'play again', desc: 'Play one more card this turn. You must, even if you would rather not.' },
  M: { name: 'Mighty Power', short: 'mighty', desc: 'A power only this hero has. Do what the card says, then use its other symbols.' },
};
const SYM_ORDER = ['A', 'S', 'H', 'D', 'P'];

/* aim: what the player chooses when the card is played
   'shield'  a shield in front of an opponent      'opp'     an opponent
   'oppDeck' an opponent whose deck is stolen from  'discard' a card in your own discard pile */
/* text: the full rule (card sheet, codex); short: what fits on the card */
const POWERS = {
  whirl:    { name: 'Whirlwind', aim: null, short: 'Heal 1 per opponent, then deal 1 damage to each opponent.', text: 'Heal 1 for each opponent, then deal 1 damage to each opponent (their shields take it first).' },

  fireball: { name: 'Firestorm', aim: null, short: 'Everyone, you too, takes 3 damage.', text: 'Every player, you too, takes 3 damage. Shields take it first, as with any damage.' },
  swap:     { name: 'Life Swap', aim: 'opp', short: 'Swap your HP with an opponent\'s.', text: 'Swap your HP with an opponent\'s HP.' },
  charm:    { name: 'Turncoat', aim: 'shield', short: 'Take an opponent\'s shield. It protects you now.', text: 'Take a shield from in front of an opponent, with any damage it has taken. It protects you now; when it breaks it goes back to its owner\'s discard pile.' },
  recall:   { name: 'Second Chance', aim: 'discard', short: 'Put a card from your discard pile into your hand.', text: 'Choose any card in your discard pile and put it into your hand.' },
  purge:    { name: 'Clean Sweep', aim: null, short: 'Destroy every shield in play, yours too.', text: 'Destroy every shield in play, your own included.' },
  disguise: { name: 'Vanish', aim: null, short: 'Until your next turn, opponents\' cards can\'t touch you or your shields.', text: 'Until the start of your next turn, nothing an opponent plays can affect you or your shields: no attack, no damage, no theft.' },
  steal:    { name: 'Light Fingers', aim: 'oppDeck', short: 'Play the top card of an opponent\'s deck as your own.', text: 'Take the top card of an opponent\'s deck and play it at once as if it were yours (its play-again symbols count for you). Then it goes to their discard pile; a shield stays in front of you until it breaks.' },

/* ── Heroes: one deck of 28 cards each ──
   sym: the card's symbols in order (A attack, S shield, H heal, D draw, P play again); power: its Mighty Power, if any.
   art: the picture on the card (drawn in code), when it is not simply the hero's weapon. */
const HEROES = {

      { id: 'skullbash', name: 'Skull Bash', sym: 'AP', n: 2, art: 'helm' },
      { id: 'hatchets', name: 'Twin Hatchets', sym: 'AA', n: 2, art: 'hatchets' },
      { id: 'gnasher', name: 'Gnasher', sym: 'SSS', n: 1, art: 'hound' },
      { id: 'growler', name: 'Growler', sym: 'SSS', n: 1, art: 'hound' },
      { id: 'buckler', name: 'Studded Buckler', sym: 'SS', n: 1, art: 'buckler' },
      { id: 'weasels', name: 'Sack of Weasels', sym: 'SD', n: 1, art: 'sack' },
      { id: 'haunch', name: 'Roast Haunch', sym: 'DDH', n: 1, art: 'meat' },
      { id: 'showoff', name: 'Show Off', sym: 'HD', n: 2, art: 'flex' },
      { id: 'rack', name: 'Raid the Rack', sym: 'DD', n: 2, art: 'rack' },
      { id: 'howl', name: 'Earsplitting Howl', power: 'roar', sym: 'P', n: 2, art: 'howl' },
      { id: 'tossaside', name: 'Toss Aside', power: 'destroy', sym: 'D', n: 2, art: 'toss' },
      { id: 'whirlwind', name: 'Whirlwind of Steel', power: 'whirl', sym: '', n: 2, art: 'whirl' },
    ],
  },
  wizard: {
    name: 'Mirrin', title: 'the Arcane', cls: 'Wizard', color: '#2c5fb2', deep: '#13285a', wash: '#dbe5f7', ink: '#0f2148', emblem: 'hat', weapon: 'bolt',
    blurb: 'Lightning, fire and tricks that turn a fight around: swap lives, steal a shield, or set the whole room ablaze.',
    cards: [
      { id: 'thunderclap', name: 'Thunderclap', sym: 'AAA', n: 4, art: 'bolt' },
      { id: 'scorch', name: 'Scorching Ray', sym: 'AA', n: 3, art: 'flame' },
      { id: 'dart', name: 'Arcane Dart', sym: 'AP', n: 3, art: 'dart' },
      { id: 'tome', name: 'Tome of Secrets', sym: 'DDD', n: 3, art: 'tome' },
      { id: 'quicken', name: 'Quickened Mind', sym: 'PP', n: 3, art: 'hourglass' },

      { id: 'beguile', name: 'Beguile', power: 'charm', sym: '', n: 2, art: 'charm' },
      { id: 'siphon', name: 'Soul Siphon', power: 'swap', sym: '', n: 2, art: 'swap' },
      { id: 'firestorm', name: 'Firestorm', power: 'fireball', sym: '', n: 2, art: 'fireball' },
    ],
  },
  paladin: {
    name: 'Ysolde', title: 'the Dawnblade', cls: 'Paladin', color: '#c08a22', deep: '#5e3f0b', wash: '#f8edcc', ink: '#4a3208', emblem: 'sun', weapon: 'sword',
    blurb: 'Strikes that heal, the sturdiest shields at the table, and a prayer that brings back the card she needs.',

      { id: 'bandolier', name: 'More Knives!', sym: 'DDH', n: 1, art: 'bandolier' },

      { id: 'cloak', name: 'Smoke Cloak', sym: 'SD', n: 2, art: 'cloak' },
      { id: 'vanish', name: 'Vanishing Act', power: 'disguise', sym: '', n: 2, art: 'mask' },
      { id: 'cheapshot', name: 'Cheap Shot', power: 'destroy', sym: 'P', n: 2, art: 'cheap' },
      { id: 'fingers', name: 'Light Fingers', power: 'steal', sym: '', n: 2, art: 'hand' },
    ],
  },
};
const HERO_ORDER = ['barbarian', 'wizard', 'paladin', 'rogue'];
const heroName = h => `${HEROES[h].name} ${HEROES[h].title}`;
const deckSize = h => HEROES[h].cards.reduce((a, c) => a + c.n, 0);
/* the symbols across a whole deck, for the hero select screen */
function deckMix(h) { const n = { A: 0, S: 0, H: 0, D: 0, P: 0, M: 0 }; for (const c of HEROES[h].cards) { for (const ch of c.sym) n[ch] += c.n; if (c.power) n.M += c.n; } return n; }

/* ── Engine: draw 1, play 1, and play again for every lightning ──
   A turn: draw a card, then play cards until you owe no more plays (you owe 1, plus 1 for every Play again symbol you use).
   Shield cards stay in front of whoever played them; everything else goes to its owner's discard pile once it has been used.
   Whenever a hand is empty its owner draws 2 at once; an empty deck is made again from the shuffled discard pile.
   S.virtual marks a light copy the AI and the previews play cards on: no card is drawn or stolen there (they are only counted),
   so nothing hidden is revealed. */
function makeCard(S, hero, d) { return { uid: S.nextUid++, hero, id: d.id, name: d.name, sym: d.sym || '', power: d.power || null, art: d.art || null }; }
function buildDeck(S, hero) { const out = []; for (const d of HEROES[hero].cards) for (let k = 0; k < d.n; k++) out.push(makeCard(S, hero, d)); return out; }
function newPlayer(S, hero, id, ai) {
  return { id, hero, ai: !!ai, skill: 'normal', hp: RULES.hp, maxHP: RULES.maxHP, deck: shuffled(S, buildDeck(S, hero)), hand: [], discard: [], shields: [],
    alive: true, disguised: false, turns: 0, stats: { dmg: 0, healed: 0, broke: 0, played: 0, kos: 0 } };
}
function newGame(o) {
  const S = { seed: o.seed >>> 0, rs: o.seed >>> 0, nextUid: 1, seq: 1, players: [], turn: 0, round: 1, turnNo: 0, plays: 0, pending: null, log: [], winner: null, started: false };
  S.players = o.heroes.map((h, i) => newPlayer(S, h, i, o.ai ? o.ai[i] : i > 0));
  for (const P of S.players) draw(S, P, RULES.startHand);
  S.first = o.first != null ? o.first : Math.floor(rnd(S) * S.players.length);
  return S;
}
function startGame(S) { S.started = true; S.turn = S.first; beginTurn(S); }

/* ── the table ── */
const cur = S => S.players[S.turn];
const opponents = (S, P) => S.players.filter(X => X.alive && X.id !== P.id);
/* Vanish: until its owner's next turn, nothing an opponent plays can touch them or their shields */
const immune = (S, P, X) => X.disguised && X.id !== P.id;
const shieldMax = sh => count(sh.card.sym, 'S');
const shieldLeft = sh => shieldMax(sh) - sh.dmg;
const shieldTotal = X => X.shields.reduce((a, sh) => a + shieldLeft(sh), 0);
function findShield(S, uid) { for (const X of S.players) { const sh = X.shields.find(s => s.card.uid === uid); if (sh) return { X, sh }; } return null; }
function log(S, k, x) { if (S.quiet || S.virtual) return; S.log.push({ k, round: S.round, ...x }); if (S.log.length > 400) S.log.splice(0, 100); }
function draw(S, P, n) {
  if (S.virtual) { P.vdraw = (P.vdraw || 0) + n; return n; }
  let got = 0;
  for (let k = 0; k < n; k++) {
    if (!P.deck.length) { if (!P.discard.length) break; P.deck = shuffled(S, P.discard); P.discard = []; log(S, 'reshuffle', { pid: P.id }); }
    P.hand.push(P.deck.pop()); got++;

  return got;

const handCount = P => P.hand.length + (P.vdraw || 0);
function toDiscard(S, owner, card) { S.players[owner].discard.push(card); }
function heal(S, X, n, ev) {
  if (n <= 0 || !X.alive) return 0;
  const before = X.hp; X.hp = Math.min(X.maxHP, X.hp + n);
  const got = X.hp - before; X.stats.healed += got;
  ev.fx.push({ k: 'heal', t: X.id, n: got });
  return got;
}
function loseHP(S, X, n, ev, A) {
  if (n <= 0 || !X.alive) return;
  const before = X.hp; X.hp -= n;
  ev.fx.push({ k: 'hp', t: X.id, n: -n, by: A ? A.id : null });
  if (A && A !== X) A.stats.dmg += Math.min(n, before);
  if (X.hp <= 0) knockOut(S, X, ev, A);
}
function knockOut(S, X, ev, A) {
  X.alive = false; X.hp = 0; X.disguised = false;
  for (const sh of X.shields) toDiscard(S, sh.owner, sh.card);   /* a shield taken from someone goes back to its owner */
  X.shields = [];
  if (A && A !== X) A.stats.kos++;
  ev.fx.push({ k: 'out', t: X.id });
  log(S, 'out', { pid: X.id, by: A ? A.id : null });
}
function breakShield(S, X, sh, ev, A) {
  const i = X.shields.indexOf(sh); if (i < 0) return;
  X.shields.splice(i, 1);
  toDiscard(S, sh.owner, sh.card);
  if (A && A !== X) A.stats.broke++;
  ev.fx.push({ k: 'broken', t: X.id, uid: sh.card.uid, name: sh.card.name });
}
function hurtShield(S, X, sh, n, ev, A) {
  const take = Math.min(n, shieldLeft(sh));
  sh.dmg += take;
  ev.fx.push({ k: 'shield', t: X.id, uid: sh.card.uid, n: take, left: shieldLeft(sh), name: sh.card.name });
  if (shieldLeft(sh) <= 0) breakShield(S, X, sh, ev, A);
  return n - take;
}
/* damage: into the chosen shield first, then the other shields (the weakest first, so as many break as possible), then HP */
function damage(S, A, X, n, ev, firstShield) {
  if (n <= 0 || !X.alive) return;
  let left = n;
  if (firstShield != null) { const sh = X.shields.find(s => s.card.uid === firstShield); if (sh) left = hurtShield(S, X, sh, left, ev, A); }
  while (left > 0 && X.shields.length) {
    const sh = X.shields.slice().sort((a, b) => shieldLeft(a) - shieldLeft(b) || a.seq - b.seq)[0];
    left = hurtShield(S, X, sh, left, ev, A);
  }
  if (left > 0) loseHP(S, X, left, ev, A);
}
function discardHand(S, X) { for (const c of X.hand) X.discard.push(c); X.hand = []; X.vdraw = 0; }

/* ── choices: what a card asks for when it is played ── */
function aimOf(card) { return count(card.sym, 'A') ? 'attack' : card.power ? POWERS[card.power].aim : null; }
function choicesFor(S, P, card) {
  const aim = aimOf(card), opps = opponents(S, P).filter(X => !immune(S, P, X)), out = [];
  if (aim === 'attack') for (const X of opps) { out.push({ t: X.id }); if (X.shields.length > 1) for (const sh of X.shields) out.push({ t: X.id, sh: sh.card.uid }); }
  else if (aim === 'shield') { for (const X of opps) for (const sh of X.shields) out.push({ t: X.id, sh: sh.card.uid }); }
  else if (aim === 'opp') for (const X of opps) out.push({ t: X.id });
  else if (aim === 'oppDeck') { for (const X of opps) if (X.deck.length + X.discard.length > 0) out.push({ t: X.id }); }
  else if (aim === 'discard') for (const c of P.discard) out.push({ pick: c.uid });
  return out.length ? out : [null];
}

<h3>Attacking</h3><p>All the ${symSVG('A', 18)} attacks on a card go to one target: an opponent, or one of their shields.</p>
<h3>Running out</h3><p>Whenever your hand is empty you draw 2 cards at once, even in the middle of a turn. When your deck is empty, shuffle your discard pile to make a new one. HP never goes above 10.</p>
<h3>Knocked out</h3><p>At 0 HP a hero is out. The last hero standing wins. If a card knocks out everyone left at once, it is a tie.</p>
<h3>About this version</h3><p>The rules are the original Dungeon Mayhem rules. The heroes, card names and pictures are our own; each deck is rebuilt after its class in the original game (Barbarian, Wizard, Paladin, Rogue), and the exact card counts are still being checked against the official lists.</p>`;
}

/* ── Controller: screens, the flow of a brawl with motion, input ── */
const STORE = 'mayhem.classic';
const SET = (() => { const d = { difficulty: 'normal', speed: 'normal', sound: true, haptics: true, n: 2, hero: 'barbarian', stats: {} }; try { return Object.assign(d, JSON.parse(localStorage.getItem(STORE) || '{}')); } catch (e) { return d; } })();
function saveSettings() { try { localStorage.setItem(STORE, JSON.stringify(SET)); } catch (e) { } }
let S = null;
UI.n = SET.n; UI.hero = HEROES[SET.hero] ? SET.hero : 'barbarian'; SFX.on = SET.sound;
function go(screen) {
  UI.screen = screen; closeSheet(); clearAim(); hideTip(); if (CODEX.open) closeCodex();
  for (const id of ['menu', 'select', 'match']) $('#screen-' + id).classList.toggle('hidden', id !== screen);
  if (screen === 'menu') renderMenu(); else if (screen === 'select') renderSelect();
}
function newMatch(o = {}) {
  const hero = o.hero || UI.hero, n = clamp(o.n || UI.n, 2, 4), seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
  const others = shuffled({ rs: seed }, HERO_ORDER.filter(h => h !== hero)).slice(0, n - 1);
  S = newGame({ seed, heroes: [hero, ...others], ai: [false, ...others.map(() => true)] });
  for (const P of S.players.slice(1)) P.skill = SET.difficulty;
  Object.assign(UI, { sel: null, aim: null, last: null, view: null, busy: true, finished: false, drawer: false, known: null, lastSetup: { hero, n } });
  $('#chronicle').classList.remove('open');
  go('match');
  startGame(S); renderMatch();
  begin();
}
async function begin() {
  const first = S.first;
  banner(first === 0 ? 'You go first' : `${nameOf(first)} goes first`, first === 0 ? 'Draw 1, play 1. Chain the lightning.' : `${esc(heroName(S.players[first].hero))} opens the brawl.`, 1600);
  await wait(Math.max(700, D(1500)));
  if (S.turn === 0) myTurnStart(); else aiTurn();
}

/* the human */
function onHandCard(uid) {
  if (humanPending()) return;
  const c = S.players[0].hand.find(x => x.uid === uid); if (!c) return;
  if (!isMyTurn() || UI.sel === uid) return cardSheet(c, { hand: true });
  UI.sel = uid; UI.aim = null; markHand(); SFX.play('click'); buzz(8); later(renderSelection);
}
function unselect() { if (humanPending()) return; UI.sel = null; UI.aim = null; markHand(); buzz(6); later(renderSelection); }
function choiceFor(pid, sh) {
  /* what clicking a seat (or one of its shields) means for the chosen card, if it can be aimed there */
  const c = selCard(); if (!c || !boardAim(c)) return null;
  const A = aimable(c);
  if (sh != null) { if (!A.shields.has(sh)) return null; return { t: pid, sh }; }
  if (!A.seats.has(pid)) return null;
  return { t: pid };
}
function onSeat(pid, touch) {
  const ch = (isMyTurn() || humanPending()) && choiceFor(pid, null);
  if (!ch) return seatSheet(pid);
  aimAt(ch, touch);
}
function onShield(uid, pid, touch) {
  const ch = (isMyTurn() || humanPending()) && choiceFor(pid, uid);
  if (!ch) { const f = findShield(S, uid); if (f) cardSheet(f.sh.card); return; }
  aimAt(ch, touch);
}
/* with a mouse a click on a target plays at once; on touch the first tap aims and the Play button (or a second tap) plays */
function aimAt(ch, touch) {
  const same = UI.aim && sameChoice(UI.aim, ch);
  UI.aim = ch;
  if (touch && !same) { SFX.play('click'); renderSelection(); return; }
  const c = selCard(); if (c) humanPlay(c.uid, ch);
}
async function humanPlay(uid, ch, landed) {
  const pd = humanPending(), card = selCard();
  if (!card || (!isMyTurn() && !pd)) { if (landed) dropGhost(); return; }
  const el = !pd && document.querySelector(`#hand .card[data-uid="${card.uid}"]`), from = el ? el.getBoundingClientRect() : null;
  UI.busy = true; clearAim();
  if (aimOf(card) === 'discard') {
    const pile = S.players[0].discard;
    if (pile.length) { if (landed) { dropGhost(); landed = false; } renderAction(); ch = { pick: await discardPick(pile.slice().reverse()) }; }
    else ch = null;
  }
  if (boardAim(card) && !ch) ch = chosenAim(card);
  UI.view = S.players.map(p => p.hp);
  const ev = pd ? resolvePending(S, ch) : playCard(S, 0, card.uid, ch);
  if (!ev) { UI.busy = false; UI.view = null; if (landed) dropGhost(); SFX.play('bad'); return renderMatch(); }
  await animatePlay(ev, 0, pd ? null : from, landed);
  if (S.winner != null || !S.players[0].alive) return finish();
  UI.busy = false; UI.sel = null; UI.aim = null;
  if (humanPending()) { renderMatch(); SFX.play('steal'); return; }
  if (!turnOver(S)) return renderMatch();
  nextTurn();
}
/* turns */
async function nextTurn() {
  UI.busy = true; UI.sel = null; UI.aim = null; renderMatch();
  await wait(D(320));
  if (S.winner != null) return finish();
  endTurn(S);
  if (S.winner != null || !S.players[0].alive) return finish();
  if (S.turn === 0) return myTurnStart();
  return aiTurn();
}
function myTurnStart() {
  UI.busy = false; renderMatch(); SFX.play('turn'); buzz(20);
  if (turnOver(S)) nextTurn();
}
async function aiTurn() {
  const pid = S.turn;
  renderMatch(); await wait(D(520));
  for (let guard = 0; guard < 40 && S.winner == null && S.turn === pid; guard++) {
    if (turnOver(S)) break;
    const a = aiAct(S, pid);
    if (a.kind === 'end') break;
    const from = seatRect(pid);
    UI.view = S.players.map(p => p.hp);
    const ev = a.kind === 'pending' ? resolvePending(S, a.ch) : playCard(S, pid, a.uid, a.ch);
    if (!ev) { UI.view = null; break; }
    await animatePlay(ev, pid, a.kind === 'pending' ? null : from);
    if (S.winner != null || !S.players[0].alive) return finish();
    await wait(D(240));
  }
  return nextTurn();
}
function finish() {
  if (UI.finished) return; UI.finished = true; UI.busy = true; UI.sel = null; UI.aim = null; renderMatch();
  const me = S.players[0], win = S.winner === 0, r = SET.stats[me.hero] || [0, 0];
  r[1]++; if (win) r[0]++; SET.stats[me.hero] = r; saveSettings();
  setTimeout(() => { SFX.play(win ? 'win' : 'lose'); resultsSheet(); }, D(700) + 500);
}
function toggleChronicle(force) { UI.drawer = force != null ? force : !UI.drawer; $('#chronicle').classList.toggle('open', UI.drawer); if (UI.drawer) renderChronicle(); }
function cycleSpeed() { SET.speed = SPEED_ORDER[(SPEED_ORDER.indexOf(SET.speed) + 1) % SPEED_ORDER.length]; saveSettings(); if (S) renderTopbar(); }

/* input */
document.addEventListener('click', e => {
  SFX.init();
  if (performance.now() - DRAG.droppedAt < 450 && e.target.closest('#hand, #stage, .seat')) return;   /* the click after a drop is not a tap */
  const pick = e.target.closest('[data-pick]'); if (pick && UI.pickResolve) return UI.pickResolve(+pick.dataset.pick);
  const act = e.target.closest('[data-act]'), touch = e.pointerType === 'touch' || matchMedia('(pointer: coarse)').matches;
  if (act) return action(act.dataset.act, act);
  const cref = e.target.closest('[data-cref]'); if (cref) { const [h, id] = cref.dataset.cref.split(':'); return cardSheet(staticCard(h, HEROES[h].cards.find(d => d.id === id))); }
  const cuid = e.target.closest('[data-cuid]'); if (cuid) { const f = findShield(S, +cuid.dataset.cuid); if (f) return cardSheet(f.sh.card); return; }
  if (e.target.closest('#stage-card .card')) { const c = selCard() || (UI.last && UI.last.card); if (c) cardSheet(c, { hand: !!(UI.sel && !humanPending()) }); return; }
  const t = e.target.closest('.hero-tile, [data-n], [data-diff], [data-set], #hand .card, .shc, .seat');
  if (!t) { if (e.target.id === 'sheet' && !$('#sheet').dataset.lock) closeSheet(); return; }
  if (t.classList.contains('hero-tile') && t.dataset.hero) { UI.hero = t.dataset.hero; SET.hero = UI.hero; saveSettings(); SFX.play('click'); if (mobile()) { UI.selView = 'detail'; renderSelect(); $('#screen-select').scrollTop = 0; return; } return rerenderSelect(); }
  if (t.dataset.n) { UI.n = +t.dataset.n; SET.n = UI.n; saveSettings(); return rerenderSelect(); }
  if (t.dataset.diff) { SET.difficulty = t.dataset.diff; saveSettings(); return rerenderSelect(); }
  if (t.dataset.set) { const v = t.dataset.val; SET[t.dataset.set] = v === 'true' ? true : v === 'false' ? false : v; SFX.on = SET.sound; saveSettings(); settingsSheet(); if (S && UI.screen === 'match') renderTopbar(); return; }
  if (t.matches('#hand .card')) return onHandCard(+t.dataset.uid);
  if (t.classList.contains('shc')) return onShield(+t.dataset.sh, +t.dataset.pid, touch);
  if (t.classList.contains('seat')) return onSeat(+t.dataset.pid, touch);
});
function action(a, el) {
  switch (a) {
    case 'quick': return newMatch({ hero: UI.hero, n: UI.n });
    case 'choose': UI.selView = 'list'; return go('select');
    case 'menu': return go('menu');
    case 'start': return newMatch({ hero: UI.hero, n: UI.n });
    case 'again': return newMatch(UI.lastSetup);
    case 'random-hero': UI.hero = HERO_ORDER[Math.floor(Math.random() * HERO_ORDER.length)]; SET.hero = UI.hero; saveSettings(); if (mobile()) { UI.selView = 'detail'; renderSelect(); $('#screen-select').scrollTop = 0; return; } return rerenderSelect();
    case 'sel-list': UI.selView = 'list'; renderSelect(); return;
    case 'rules': closeSheet(); return openCodex('rules');
    case 'codex': closeSheet(); return openCodex(S && UI.screen === 'match' ? 'heroes' : 'rules', { hero: S && UI.screen === 'match' ? S.players[0].hero : null });
    case 'codex-tab': CODEX.tab = el.dataset.tab; CODEX.hero = null; return renderCodex();
    case 'codex-hero': closeSheet(); if (!CODEX.open) return openCodex('heroes', { hero: el.dataset.hero }); CODEX.tab = 'heroes'; CODEX.hero = el.dataset.hero; return renderCodex();
    case 'codex-heroes': CODEX.hero = null; return renderCodex();
    case 'codex-back': if (CODEX.tab === 'heroes' && CODEX.hero) { CODEX.hero = null; return renderCodex(); } return closeCodex();
    case 'codex-play': closeCodex(); UI.hero = el.dataset.hero; SET.hero = UI.hero; saveSettings(); UI.selView = 'detail'; return go('select');
    case 'card-info': { const c = selCard(); if (c) cardSheet(c, { hand: !humanPending() }); return; }
    case 'play-card': { const uid = +el.dataset.uid; closeSheet(); if (!isMyTurn() || humanPending()) return; UI.sel = uid; UI.aim = null; return renderSelection(); }
    case 'hand-prev': return handStep(-1);
    case 'hand-next': return handStep(1);
    case 'settings': return settingsSheet();
    case 'pause': return pauseSheet();
    case 'close': closeSheet(); return UI.screen === 'menu' ? renderMenu() : null;
    case 'concede': return go('menu');
    case 'chronicle': return toggleChronicle();
    case 'speed': return cycleSpeed();
    case 'deck': return deckSheet('deck');
    case 'discard': return deckSheet('discard');
    case 'cancel-sel': return unselect();
    case 'play-sel': { const c = selCard(); if (!c) return; const t = chosenAim(c); if (boardAim(c) && !t) return; return humanPlay(c.uid, t); }
  }
}
/* aiming with a mouse: the seat or shield under the pointer is shown as the target while the card is chosen */
document.addEventListener('pointerover', e => {
  if (e.pointerType === 'touch' || DRAG.on || !S || UI.screen !== 'match') return;
  const c = selCard(); if (!c || !boardAim(c) || UI.busy) return;
  const sh = e.target.closest('.shc.targetable'), seat = !sh && e.target.closest('.seat.targetable');
  const ch = sh ? { t: +sh.dataset.pid, sh: +sh.dataset.sh } : seat ? { t: +seat.dataset.pid } : null;
  if (ch && !sameChoice(ch, UI.aim)) { UI.aim = ch; renderStage(); renderAction(); renderPreview(); syncTargets(); }
});
function rerenderSelect() { const l = $('.sel-list'), d = $('.sel-detail'), ly = l ? l.scrollTop : 0, dy = d ? d.scrollTop : 0; renderSelect(); if ($('.sel-list')) $('.sel-list').scrollTop = ly; if ($('.sel-detail')) $('.sel-detail').scrollTop = dy; }
document.addEventListener('keydown', e => {
  if (CODEX.open) { if (e.key === 'Escape') { if (!$('#sheet').classList.contains('hidden')) closeSheet(); else action('codex-back'); } return; }
  if (UI.screen !== 'match' || !S) return;
  const sheetOpen = !$('#sheet').classList.contains('hidden');
  if (e.key === 'Escape') { if (sheetOpen) { if (!$('#sheet').dataset.lock) closeSheet(); return; } if (UI.sel != null) return unselect(); return pauseSheet(); }
  if (sheetOpen) return;
  const k = e.key.toLowerCase();
  if (/^[1-9]$/.test(e.key)) { const c = S.players[0].hand[+e.key - 1]; if (c) onHandCard(c.uid); }
  else if (e.key === 'Enter' && selCard()) { e.preventDefault(); action('play-sel'); }
  else if (k === 'i' && selCard()) action('card-info');
  else if (k === 'h') action('codex');
  else if (k === 'l') toggleChronicle();
  else if (k === 's') cycleSpeed();
  else if (e.key === 'Tab' && selCard() && boardAim(selCard())) {
    e.preventDefault();
    const all = aimChoices(selCard()), i = all.findIndex(ch => sameChoice(ch, UI.aim));
    UI.aim = all[(i + 1) % all.length]; renderSelection();
  }
});
/* drag a card into the ring, or onto a target, to play it. Hold it a moment (or pull it up) to pick it up; a sideways swipe scrolls
   the hand. One ghost card on its own layer; the drop zones are measured once, when the card is picked up */
const DRAG = { uid: null, el: null, pid: null, mouse: false, x0: 0, y0: 0, lx: 0, ly: 0, hold: 0, on: false, back: false, ox: 0, oy: 0, w: 0, k: 0.8, zone: null, ok: false, ch: null, droppedAt: 0 };
const TILT = -3 * Math.PI / 180;
function ghostAt(x, y) {
  const k = DRAG.k, c = Math.cos(TILT), s = Math.sin(TILT), gx = DRAG.ox * k, gy = DRAG.oy * k;
  $('#drag-ghost').style.transform = `translate3d(${(x - (gx * c - gy * s)).toFixed(1)}px,${(y - (gx * s + gy * c)).toFixed(1)}px,0) rotate(-3deg) scale(${k})`;
}
function ghostTo(r, ms, ease) {
  const g = $('#drag-ghost'); g.style.transition = `transform ${ms}ms ${ease}`;
  g.style.transform = `translate3d(${r.left.toFixed(1)}px,${r.top.toFixed(1)}px,0) rotate(0deg) scale(${(r.width / DRAG.w).toFixed(4)})`;
  return wait(ms + 16);
}
function dropGhost() { const g = $('#drag-ghost'); g.classList.remove('on'); g.style.transition = ''; g.innerHTML = ''; }
function landingRect(c) { const cur = $('#stage-card .card'); return cur && +cur.dataset.uid === c.uid ? cur.getBoundingClientRect() : stageRect(); }
function beginDrag(x, y) {
  clearTimeout(DRAG.hold);
  const c = S.players[0].hand.find(h => h.uid === DRAG.uid);
  if (!c || !isMyTurn() || humanPending() || !DRAG.el.isConnected) { DRAG.uid = null; return; }
  const r = DRAG.el.getBoundingClientRect(), aimed = boardAim(c), A = aimable(c);
  DRAG.w = DRAG.el.offsetWidth; DRAG.ox = DRAG.x0 - r.left; DRAG.oy = DRAG.y0 - r.top;
  DRAG.zone = {
    top: $('#hand').getBoundingClientRect().top - 6, aimed,
    shields: aimed ? [...A.shields].map(u => { const el = chipEl(u); return el && { ch: { t: +el.dataset.pid, sh: u }, r: el.getBoundingClientRect() }; }).filter(Boolean) : [],
    seats: aimed ? [...A.seats].map(pid => ({ ch: { t: pid }, r: seatEl(pid).getBoundingClientRect() })) : [],
    solo: aimed ? chosenAim(c) : null,
  };
  DRAG.on = true; DRAG.ok = false; DRAG.ch = null; UI.sel = c.uid; UI.aim = null;
  try { DRAG.el.setPointerCapture(DRAG.pid); } catch (_) { }
  const g = $('#drag-ghost');
  g.innerHTML = DRAG.el.outerHTML;
  const gc = g.firstElementChild; gc.classList.remove('sel', 'playable', 'drag-src', 'fresh'); gc.removeAttribute('tabindex'); gc.removeAttribute('role'); gc.style.transformOrigin = `${DRAG.ox}px ${DRAG.oy}px`;
  g.style.transition = ''; ghostAt(x, y); g.classList.add('on');
  DRAG.el.classList.add('drag-src'); $('#stage').classList.add('holding');
  hideTip(); SFX.play('card'); buzz(12);
  later(() => { if (!DRAG.on) return; markHand(); renderAction(); renderPreview(); syncTargets(); });
}
function dragMove(x, y) {
  ghostAt(x, y);
  const Z = DRAG.zone, inR = r => x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  let ok = false, ch = null;
  if (Z.aimed) {
    const hit = Z.shields.find(q => inR(q.r)) || Z.seats.find(q => inR(q.r));
    if (hit) { ok = true; ch = hit.ch; }
    else if (Z.solo && y < Z.top) { ok = true; ch = Z.solo; }
  } else ok = y < Z.top;
  if (ok === DRAG.ok && sameChoice(ch, DRAG.ch)) return;
  DRAG.ok = ok; DRAG.ch = ch; UI.aim = ch;
  $('#stage').classList.toggle('drop-ok', ok && !ch);
  renderPreview(); syncTargets();
}
async function endDrag(x, y, cancelled) {
  const uid = UI.sel, c = S.players[0].hand.find(h => h.uid === uid);
  if (!cancelled) dragMove(x, y);
  const ok = !cancelled && DRAG.ok && c && (!boardAim(c) || DRAG.ch), ch = DRAG.ch;
  DRAG.on = false; DRAG.back = true; DRAG.droppedAt = performance.now();
  $('#stage').classList.remove('drop-ok', 'holding');
  if (ok) {
    UI.busy = true; buzz(14);
    await ghostTo(landingRect(c), 180, 'ease-out');
    DRAG.back = false;
    return humanPlay(uid, ch, true);
  }
  const src = document.querySelector(`#hand .card[data-uid="${uid}"]`);
  if (src) { const r = src.getBoundingClientRect(); await ghostTo({ left: r.left, top: r.top - 8, width: r.width }, 200, 'ease-in'); src.classList.remove('drag-src'); }
  dropGhost(); DRAG.back = false; UI.aim = null;
  renderSelection();
}
document.addEventListener('pointerdown', e => {
  if (DRAG.on || DRAG.back) return;
  const el = e.target.closest('#hand .card.playable'); if (!el || !isMyTurn() || e.button > 0) return;
  clearTimeout(DRAG.hold);
  Object.assign(DRAG, { uid: +el.dataset.uid, el, pid: e.pointerId, mouse: e.pointerType === 'mouse', x0: e.clientX, y0: e.clientY, lx: e.clientX, ly: e.clientY });
  if (!DRAG.mouse) DRAG.hold = setTimeout(() => { if (DRAG.uid != null && !DRAG.on) beginDrag(DRAG.lx, DRAG.ly); }, 240);
});
document.addEventListener('pointermove', e => {
  if (DRAG.uid == null || e.pointerId !== DRAG.pid) return;
  if (!DRAG.on) {
    DRAG.lx = e.clientX; DRAG.ly = e.clientY;
    const dx = e.clientX - DRAG.x0, dy = e.clientY - DRAG.y0;
    if (DRAG.mouse ? Math.hypot(dx, dy) > 6 : Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx) * 0.8) beginDrag(e.clientX, e.clientY);
    else if (Math.hypot(dx, dy) > 18) { clearTimeout(DRAG.hold); DRAG.uid = null; }
    return;
  }
  e.preventDefault(); dragMove(e.clientX, e.clientY);
}, { passive: false });
document.addEventListener('pointerup', e => { if (e.pointerId !== DRAG.pid) return; clearTimeout(DRAG.hold); if (DRAG.on) endDrag(e.clientX, e.clientY); DRAG.uid = null; });
document.addEventListener('pointercancel', e => { if (e.pointerId !== DRAG.pid) return; clearTimeout(DRAG.hold); if (DRAG.on) endDrag(0, 0, true); DRAG.uid = null; });
$('#hand').addEventListener('touchmove', e => { if (DRAG.on) e.preventDefault(); }, { passive: false });
document.addEventListener('contextmenu', e => { if (e.target.closest('#hand .card')) e.preventDefault(); });
$('#hand').addEventListener('wheel', e => { const h = e.currentTarget; if (mobile() || h.scrollWidth <= h.clientWidth + 2 || Math.abs(e.deltaX) >= Math.abs(e.deltaY)) return; e.preventDefault(); h.scrollLeft += e.deltaY; }, { passive: false });
$('#hand').addEventListener('scroll', () => { if (!mobile()) handNav(); }, { passive: true });
addEventListener('resize', () => { updateMode(); if (UI.screen === 'match' && S && !UI.busy) renderMatch(); else if (UI.screen === 'menu') renderMenu(); else if (UI.screen === 'select') renderSelect(); });
UI.selView = 'list';
updateMode(); installHeroStyles(); installMaterials(); go('menu');

</script>
