<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sonic Hub — Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /* ═══════════════════════════════════════════════════════════════════════
     SONIC HUB PORTAL — one shell, many rooms, one timeline.
     Shell = dark graphite chrome (system bar, dock, time rail): the only constant.
     Rooms = full-screen, each with its own climate via CSS variables.
     Timeline = global state shared by every room.
     ═══════════════════════════════════════════════════════════════════════ */
  :root {
    --chrome: #15161A; --chrome-2: #1E2025; --chrome-line: #2A2D33; --chrome-text: #F1EEE6; --chrome-muted: #8B8E96;
    --sys-h: 48px; --rail-h: 58px; --dock-w: 76px;
    --font: "Familjen Grotesk", system-ui, sans-serif;
    /* room climate defaults (Home / Photos) */
    --canvas: #E9E7E2; --canvas-2: #DEDBD4; --ink: #1F1F1D; --ink-2: #6B6A66; --line: #CDCAC2; --accent: #2C4A6E; --card: #F4F2EE;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--chrome); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; } button { font: inherit; }
  :focus-visible { outline: 2px solid #F1D9A7; outline-offset: 2px; }

  /* ── Room climates ── */
  body[data-room="journal"] { --canvas: #F6F7FB; --canvas-2: #ECEEF6; --ink: #15151A; --ink-2: #62636E; --line: #DDE0EA; --accent: #7A5CFF; --card: #FFFFFF; }
  body[data-room="angels"]  { --canvas: #ECEAF3; --canvas-2: #E1DEED; --ink: #26243A; --ink-2: #7A7791; --line: #CFCBE0; --accent: #7B1FA2; --card: #F7F5FB; }
  body[data-room="fantasy"] { --canvas: #0E3D2E; --canvas-2: #0B3226; --ink: #EAF7EF; --ink-2: #9FC9AF; --line: #1F5A45; --accent: #C9FF3F; --card: #124A38; }
  body[data-room="games"]   { --canvas: #141018; --canvas-2: #1C1622; --ink: #F3EEF7; --ink-2: #9A90A8; --line: #2A2333; --accent: #FF7A59; --card: #1E1826; }

  /* ── System bar ── */
  .sys { position: fixed; top: 0; left: 0; right: 0; height: var(--sys-h); display: flex; align-items: center; gap: 14px; padding: 0 16px; background: var(--chrome); color: var(--chrome-text); border-bottom: 1px solid var(--chrome-line); z-index: 40; }
  .sys .brand { font-weight: 700; letter-spacing: -0.02em; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .sys .brand i { width: 10px; height: 10px; border-radius: 50%; background: #F1D9A7; display: inline-block; box-shadow: 0 0 12px #F1D9A7; }
  .sys .where { color: var(--chrome-muted); font-size: 14px; }
  .sys .where b { color: var(--chrome-text); font-weight: 600; }
  .sys .grow { flex: 1; }
  .sys .clock { font-size: 14px; color: var(--chrome-muted); font-variant-numeric: tabular-nums; }
  .sys button { background: var(--chrome-2); color: var(--chrome-text); border: 1px solid var(--chrome-line); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
  .sys button:hover { border-color: #F1D9A7; }
  .sys kbd { font: inherit; font-size: 11px; color: var(--chrome-muted); }

  /* ── Time rail ── */
  .rail { position: fixed; top: var(--sys-h); left: var(--dock-w); right: 0; height: var(--rail-h); background: var(--chrome); border-bottom: 1px solid var(--chrome-line); z-index: 35; display: flex; align-items: center; }
  .rail .years { display: flex; align-items: flex-end; gap: 0; overflow-x: auto; scrollbar-width: none; padding: 0 14px; height: 100%; width: 100%; }
  .rail .years::-webkit-scrollbar { display: none; }
  .rail .years button { flex: 1 0 auto; min-width: 58px; height: 100%; background: none; border: 0; border-left: 1px solid var(--chrome-line); color: var(--chrome-muted); cursor: pointer; padding: 0 0 8px; position: relative; font-weight: 500; font-size: 13px; letter-spacing: -0.01em; transition: color .15s; }
  .rail .years button::before { content: ""; position: absolute; top: 8px; left: 50%; width: 1px; height: 10px; background: var(--chrome-line); }
  .rail .years button:hover { color: var(--chrome-text); }
  .rail .years button[aria-pressed="true"] { color: var(--chrome-text); font-weight: 700; font-size: 15px; }
  .rail .years button[aria-pressed="true"]::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: 0; height: 3px; background: #F1D9A7; }
  .rail .years button small { display: block; font-size: 10px; font-weight: 500; color: var(--chrome-muted); margin-top: 2px; }

  /* ── Dock ── */
  .dock { position: fixed; top: var(--sys-h); left: 0; bottom: 0; width: var(--dock-w); background: var(--chrome); border-right: 1px solid var(--chrome-line); z-index: 36; display: flex; flex-direction: column; align-items: center; padding-top: 10px; gap: 4px; }
  .dock button { width: 60px; height: 60px; border-radius: 14px; border: 0; background: none; color: var(--chrome-muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 10.5px; font-weight: 500; position: relative; }
  .dock button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .dock button:hover { color: var(--chrome-text); background: var(--chrome-2); }
  .dock button[aria-current="true"] { color: var(--chrome-text); background: var(--chrome-2); }
  .dock button[aria-current="true"]::before { content: ""; position: absolute; left: -8px; top: 18px; width: 3px; height: 24px; border-radius: 2px; background: #F1D9A7; }
  .dock .foot { margin-top: auto; margin-bottom: 12px; color: var(--chrome-muted); font-size: 10px; text-align: center; line-height: 1.4; padding: 0 6px; }

  /* ── Room ── */
  main { position: fixed; top: calc(var(--sys-h) + var(--rail-h)); left: var(--dock-w); right: 0; bottom: 0; overflow-y: auto; background: var(--canvas); color: var(--ink); view-transition-name: room; }
  main::before { content: ""; position: absolute; inset: 0; background: var(--ambient, none) center/cover; opacity: .09; filter: blur(30px) saturate(1.2); pointer-events: none; }
  .room { position: relative; padding: 30px 34px 60px; max-width: 1280px; }
  .room h1 { margin: 0 0 6px; font-size: clamp(28px, 3.6vw, 44px); font-weight: 700; letter-spacing: -0.035em; line-height: 1.02; }
  .room .sub { margin: 0 0 26px; color: var(--ink-2); font-size: 16px; max-width: 64ch; line-height: 1.5; }
  .room h2 { margin: 30px 0 12px; font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }

  /* Home */
  .today { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 16px; }
  .today .card { padding: 16px; }
  .today .card h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .today .strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; } .today .strip img { width: 100%; aspect-ratio: 4/5; object-fit: cover; border-radius: 8px; display: block; }
  .today .chat { font-size: 14px; line-height: 1.5; } .today .chat b { color: #7B1FA2; } .today .chat .ts { color: var(--ink-2); font-size: 12px; }
  .today .note { font-size: 15px; line-height: 1.5; } .today .note em { display: block; font-style: normal; color: var(--ink-2); font-size: 13px; margin-top: 8px; }
  .today .big { font-size: 40px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; margin-bottom: 6px; }
  .today .more { color: var(--accent); font-weight: 600; font-size: 13px; display: inline-block; margin-top: 10px; }
  .doors { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 8px; }
  .door { padding: 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); text-align: left; cursor: pointer; transition: transform .12s; }
  .door:hover { transform: translateY(-2px); }
  .door b { display: block; font-size: 16px; margin-bottom: 4px; } .door span { font-size: 13px; color: var(--ink-2); }
  .door[data-off] { opacity: .55; }

  /* Photos */
  .folders { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; }
  .folder { flex: 0 0 200px; padding: 12px; } .folder img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 8px; display: block; margin-bottom: 8px; }
  .folder b { font-size: 14px; display: block; } .folder span { font-size: 12px; color: var(--ink-2); }
  .jg-item { margin: 0; overflow: hidden; border-radius: 4px; background: var(--canvas-2); position: relative; }
  .jg-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .jg-item figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 20px 10px 8px; font-size: 12px; color: #fff; background: linear-gradient(to top, rgba(0,0,0,.5), transparent); opacity: 0; transition: opacity .2s; }
  .jg-item:hover figcaption { opacity: 1; }

  /* Journal */
  .notes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .note-card { padding: 18px; } .note-card time { font-size: 12px; color: var(--ink-2); } .note-card h3 { margin: 6px 0 8px; font-size: 20px; letter-spacing: -0.02em; line-height: 1.15; }
  .note-card p { margin: 0; color: var(--ink-2); font-size: 15px; line-height: 1.55; }
  .chip { display: inline-block; font-size: 11px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); margin: 10px 6px 0 0; }
  .chip.problem { background: var(--accent); color: #fff; border-color: transparent; }

  /* Angels */
  .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
  .person { background: #fff; padding: 10px 10px 12px; border-radius: 6px; box-shadow: 0 10px 30px rgba(60,40,110,.10); transform: rotate(var(--r)); border: 0; text-align: left; cursor: pointer; color: var(--ink); }
  .person img { width: 100%; aspect-ratio: 4/5; object-fit: cover; border-radius: 2px; display: block; }
  .person b { display: block; margin-top: 8px; font-size: 15px; } .person span { font-size: 12px; color: var(--ink-2); }
  .readers { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .readers button { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .readers button i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  /* Fantasy & Games */
  .pitch { border: 2px solid var(--line); border-radius: 12px; padding: 40px; position: relative; text-align: center; color: var(--ink-2); background:
    linear-gradient(var(--line), var(--line)) center/2px 100% no-repeat, radial-gradient(circle at center, transparent 58px, var(--line) 59px, var(--line) 61px, transparent 62px); }
  .pitch b { display: block; color: var(--ink); font-size: 22px; margin-bottom: 8px; }
  .carts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .cart { aspect-ratio: 3/4; border-radius: 10px 10px 4px 4px; background: linear-gradient(160deg, var(--card), var(--canvas-2)); border: 1px solid var(--line); display: flex; align-items: flex-end; padding: 12px; font-size: 13px; color: var(--ink-2); position: relative; }
  .cart::before { content: ""; position: absolute; top: 12px; left: 12px; right: 12px; height: 34%; border-radius: 6px; background: var(--canvas-2); border: 1px solid var(--line); }
  .cart b { color: var(--ink); display: block; }

  /* ── Command palette ── */
  .palette { position: fixed; inset: 0; z-index: 60; display: none; align-items: flex-start; justify-content: center; padding-top: 12vh; background: rgba(10,10,14,.55); backdrop-filter: blur(4px); }
  .palette.open { display: flex; }
  .palette .box { width: min(600px, 92vw); background: #F6F5F1; color: #1F1F1D; border-radius: 14px; overflow: hidden; box-shadow: 0 40px 100px rgba(0,0,0,.6); }
  .palette input { width: 100%; border: 0; outline: 0; padding: 16px 18px; font: inherit; font-size: 17px; background: #fff; }
  .palette ul { list-style: none; margin: 0; padding: 8px; max-height: 340px; overflow: auto; }
  .palette li { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .palette li small { color: #6B6A66; } .palette li:hover, .palette li.sel { background: #E9E7E2; }

  /* ── Device frame (replica rooms live inside a shell-provided bezel) ── */
  .device { position: fixed; inset: 0; z-index: 70; display: none; align-items: center; justify-content: center; background: rgba(8,8,12,.7); backdrop-filter: blur(6px); }
  .device.open { display: flex; }
  .bezel { width: min(880px, 94vw); background: #D9D6CC; border-radius: 26px; padding: 26px 26px 42px; box-shadow: inset 0 0 0 2px #C6C2B6, 0 50px 120px rgba(0,0,0,.6); position: relative; }
  .bezel .screen { background: #1a1a1a; border-radius: 14px; padding: 12px; box-shadow: inset 0 0 60px rgba(0,0,0,.8); }
  .bezel .glass { aspect-ratio: 16/10; background: #F5F1FA; border-radius: 6px; display: grid; place-items: center; text-align: center; color: #5B4A72; padding: 20px; }
  .bezel .glass b { display: block; font-size: 20px; color: #7B1FA2; margin-bottom: 6px; }
  .bezel .label { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #6B675D; }
  .bezel .close { position: absolute; top: -14px; right: -14px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: #15161A; color: #fff; cursor: pointer; }

  /* ── Mobile ── */
  @media (max-width: 820px) {
    :root { --dock-w: 0px; --rail-h: 50px; }
    .sys .where, .sys .clock, .sys .rand { display: none; }
    .dock { top: auto; bottom: 0; left: 0; right: 0; width: auto; height: 64px; flex-direction: row; justify-content: space-around; border-right: 0; border-top: 1px solid var(--chrome-line); padding: 0 6px; }
    .dock button { width: auto; flex: 1; height: 56px; border-radius: 10px; } .dock button[aria-current="true"]::before { left: 12px; right: 12px; top: auto; bottom: 2px; width: auto; height: 3px; }
    .dock .foot { display: none; }
    .rail { left: 0; } .rail .years button { min-width: 52px; }
    main { left: 0; bottom: 64px; } .room { padding: 20px 16px 40px; }
    .today { grid-template-columns: 1fr; } .doors { grid-template-columns: 1fr 1fr; } .notes { grid-template-columns: 1fr; }
    .bezel { padding: 14px 14px 30px; border-radius: 18px; } .bezel .glass { aspect-ratio: 4/5; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  ::view-transition-old(room), ::view-transition-new(room) { animation-duration: .28s; }
</style>
</head>
<body data-room="home">

<header class="sys">
  <a class="brand" href="#home"><i></i>Sonic Hub</a>
  <span class="where" id="where"></span>
  <span class="grow"></span>
  <span class="clock" id="clock"></span>
  <button class="rand" id="rand" title="Mở một ký ức bất kỳ">Cửa ngẫu nhiên</button>
  <button id="cmdk">Tìm <kbd>⌘K</kbd></button>
</header>

<nav class="dock" id="dock" aria-label="Phòng">
  <button data-room="home" title="Hôm nay (0)"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Hôm nay</button>
  <button data-room="photos" title="Photos (1)"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>Photos</button>
  <button data-room="journal" title="Journal (2)"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg>Journal</button>
  <button data-room="angels" title="Angels (3)"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>Angels</button>
  <button data-room="fantasy" title="Fantasy (4)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M7 7l2 2M15 15l2 2M17 7l-2 2M9 15l-2 2"/></svg>Fantasy</button>
  <button data-room="games" title="Games (5)"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="11" rx="4"/><path d="M7 11v4M5 13h4M15 12h.01M18 14h.01"/></svg>Games</button>
  <div class="foot">1–5 đổi phòng<br>← → đổi năm</div>
</nav>

<div class="rail" aria-label="Trục thời gian"><div class="years" id="years"></div></div>
<main id="main"><div class="room" id="room"></div></main>

<div class="palette" id="palette" role="dialog" aria-label="Tìm"><div class="box"><input id="q" placeholder="Tìm ảnh, người, bài viết, vấn đề, đội bóng, năm..." autocomplete="off"><ul id="results"></ul></div></div>

<div class="device" id="device" role="dialog" aria-label="Phòng đọc">
  <div class="bezel">
    <button class="close" id="devClose" aria-label="Đóng">✕</button>
    <div class="screen"><div class="glass" id="glass"></div></div>
    <div class="label" id="devLabel"></div>
  </div>
</div>

<script src="assets/photos.js"></script>
<script src="assets/justified.js"></script>
<script>
  // ── State ─────────────────────────────────────────────────────────────────
  const P = window.SH_PHOTOS;
  const YEARS = Array.from({ length: 19 }, (_, i) => 2008 + i);
  const ROOMS = ['home', 'photos', 'journal', 'angels', 'fantasy', 'games'];
  const NAMES = { home: 'Hôm nay', photos: 'Photos', journal: 'Journal', angels: 'Angels', fantasy: 'Fantasy Football', games: 'Games' };
  const state = { room: 'home', year: 2010 };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const PEOPLE = [['Bích Trân', 2009, 2012, 'Yahoo · Nokia'], ['Linh', 2013, 2014, 'Facebook'], ['Hà My', 2015, 2015, 'Facebook'], ['Quỳnh', 2016, 2018, 'Zalo'], ['Thu', 2019, 2019, 'Facebook'], ['Mai', 2021, 2021, 'Telegram']];
  const NOTES = [[2026, 'Deadline Q4 và ba dòng cho đỡ nặng đầu', 'Không cần ai đọc. Link vào vấn đề đang theo dõi để tuần sau nhìn lại.', ['Stress', 'Deadline Q4']],
    [2025, 'Đem Nokia N73 đi chụp lại Hồ Tây', 'Nhiễu như xưa, và đẹp như xưa.', ['Máy ảnh']],
    [2024, 'Xem lại chung kết 2005 sau 20 năm', 'Câu trả lời ngắn: có. Câu trả lời dài mất 2.400 chữ.', ['Bóng đá']],
    [2010, 'Status Yahoo tối nay', 'mai thi xong roi di choi nhe', ['Ký ức']],
    [2009, 'Ngày đầu có máy ảnh', 'Chụp 214 tấm trong một buổi chiều. Giữ lại 9.', ['Máy ảnh']]];

  const photosOf = (y) => P.filter(p => p.year === y);
  const nearestYearWithPhotos = (y) => photosOf(y).length ? y : YEARS.slice().sort((a, b) => Math.abs(a - y) - Math.abs(b - y)).find(v => photosOf(v).length);

  // ── Shell ─────────────────────────────────────────────────────────────────
  const clock = document.getElementById('clock');
  setInterval(() => clock.textContent = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }), 1000);
  clock.textContent = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });

  const yearsEl = document.getElementById('years');
  YEARS.forEach(y => {
    const b = document.createElement('button'); b.dataset.year = y;
    b.innerHTML = `${y}<small>${photosOf(y).length ? photosOf(y).length + ' ảnh' : '&nbsp;'}</small>`;
    b.onclick = () => setYear(y); yearsEl.appendChild(b);
  });
  document.querySelectorAll('.dock [data-room]').forEach(b => b.onclick = () => go(b.dataset.room));
  document.getElementById('rand').onclick = () => { const r = ROOMS[1 + Math.floor(Math.random() * 3)]; state.year = YEARS[Math.floor(Math.random() * YEARS.length)]; go(r); };

  function setYear(y) { state.year = y; renderShell(); renderRoom(); }
  function go(room) {
    const run = () => { state.room = room; document.body.dataset.room = room; renderShell(); renderRoom(); document.getElementById('main').scrollTop = 0; };
    if (document.startViewTransition && !reduce) document.startViewTransition(run); else run();
  }
  function renderShell() {
    document.getElementById('where').innerHTML = `<b>${NAMES[state.room]}</b> · ${state.year}`;
    document.querySelectorAll('.dock [data-room]').forEach(b => b.setAttribute('aria-current', String(b.dataset.room === state.room)));
    yearsEl.querySelectorAll('button').forEach(b => {
      const on = +b.dataset.year === state.year; b.setAttribute('aria-pressed', String(on));
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest', behavior: reduce ? 'auto' : 'smooth' });
    });
    const amb = photosOf(nearestYearWithPhotos(state.year))[0];
    document.getElementById('main').style.setProperty('--ambient', amb ? `url(${amb.src})` : 'none');
  }

  // ── Rooms ─────────────────────────────────────────────────────────────────
  const room = document.getElementById('room');
  const R = {
    home() {
      const y = state.year, ph = photosOf(nearestYearWithPhotos(y)).slice(0, 3);
      const today = new Date().toLocaleDateString('vi-VN', { weekday: 'long', day: 'numeric', month: 'long' });
      const who = PEOPLE.find(p => y >= p[1] && y <= p[2]);
      const note = NOTES.find(n => n[0] === y) || NOTES[3];
      return `<h1>${today}</h1><p class="sub">Ngày này năm ${y}. Kéo trục thời gian để xem cùng ngày ở một năm khác — mọi phòng đều đi theo.</p>
      <div class="today">
        <div class="card"><h3>Ảnh cùng ngày</h3><div class="strip">${ph.map(p => `<img src="${p.src}" alt="">`).join('')}</div><a class="more" href="#" data-go="photos">Mở Photos năm ${y}</a></div>
        <div class="card"><h3>Một dòng chat</h3><div class="chat"><span class="ts">${y} · 23:14</span><br><b>${who ? who[0] : 'bichtran_9x'}:</b> mai thi xong roi di choi nhe. t mua ve rap quoc gia roi<br><span class="ts">41 dòng cùng ngày</span></div><a class="more" href="#" data-go="angels">Vào phòng đọc</a></div>
        <div class="card"><h3>Ghi chép</h3><div class="note">${note[1]}<em>${note[3].join(' · ')}</em></div><a class="more" href="#" data-go="journal">Đọc tiếp</a></div>
      </div>
      <h2>Các phòng</h2>
      <div class="doors">
        <button class="door" data-go="photos"><b>Photos</b><span>${P.length} tấm · 18 năm</span></button>
        <button class="door" data-go="journal"><b>Journal</b><span>${NOTES.length} bài · 2 vấn đề đang theo</span></button>
        <button class="door" data-go="angels"><b>Angels</b><span>${PEOPLE.length} người · 3 phòng đọc</span></button>
        <button class="door" data-go="fantasy" data-off><b>Fantasy</b><span>chưa nạp mùa giải</span></button>
        <button class="door" data-go="games" data-off><b>Games</b><span>đang trống</span></button>
      </div>`;
    },
    photos() {
      const y = state.year, list = photosOf(y);
      return `<h1>Photos · ${y}</h1><p class="sub">${list.length ? list.length + ' tấm. Mỗi hàng đầy chiều ngang, ảnh giữ đúng tỉ lệ.' : 'Năm này chưa có ảnh — chọn năm khác trên trục.'}</p>
      <div class="folders">${[['Hồ Tây', 48], ['Tam Đảo', 31], ['Đà Lạt', 77], ['Bãi Sau', 22], ['Phố cổ', 19]].map(([n, c], i) => `<div class="card folder"><img src="${P[(i * 7) % 40].src}" alt=""><b>${n}</b><span>${c} tấm</span></div>`).join('')}</div>
      <h2>Tất cả ảnh</h2><div id="jg"></div>`;
    },
    journal() {
      const list = NOTES.filter(n => n[0] === state.year), show = list.length ? list : NOTES;
      return `<h1>Journal</h1><p class="sub">${list.length ? 'Bài viết năm ' + state.year : 'Năm ' + state.year + ' chưa có bài — đây là mọi bài.'} Chữ 15–20px trên nền sáng, dễ đọc, không kem không nâu.</p>
      <div class="notes">${show.map(n => `<article class="card note-card"><time>${n[0]}</time><h3>${n[1]}</h3><p>${n[2]}</p>${n[3].map((t, i) => `<span class="chip ${i === 1 ? 'problem' : ''}">${t}</span>`).join('')}</article>`).join('')}</div>`;
    },
    angels() {
      const y = state.year, list = PEOPLE.filter(p => y >= p[1] && y <= p[2]), show = list.length ? list : PEOPLE;
      return `<h1>Angels</h1><p class="sub">${list.length ? 'Ai đang ở đây năm ' + y + '.' : 'Năm ' + y + ' không có ai — đây là tất cả.'} Mỗi người một chương; mỗi nền tảng một phòng đọc mở trong khung thiết bị.</p>
      <div class="people">${show.map((p, k) => `<button class="person" style="--r:${(k % 2 ? 1 : -1) * (0.5 + (k % 3) * .4)}deg" data-reader="${p[0]}"><img src="${P[(k * 5 + 3) % 40].src}" alt=""><b>${p[0]}</b><span>${p[1]}${p[2] !== p[1] ? '–' + p[2] : ''} · ${p[3]}</span></button>`).join('')}</div>
      <h2>Phòng đọc</h2><div class="readers">
        <button data-dev="Yahoo! Messenger 2009" data-tone="#7B1FA2"><i style="background:#7B1FA2"></i>Yahoo! Messenger</button>
        <button data-dev="Nokia hộp thư" data-tone="#2E6FDB"><i style="background:#2E6FDB"></i>Nokia</button>
        <button data-dev="Facebook Messenger" data-tone="#1877F2"><i style="background:#1877F2"></i>Facebook</button></div>`;
    },
    fantasy() { return `<h1>Fantasy Football</h1><p class="sub">Mùa ${state.year}/${String(state.year + 1).slice(2)}. Phòng này đã bật đèn, sân đã kẻ vạch, chờ dữ liệu về.</p><div class="pitch"><b>Chưa nạp mùa giải</b>Đội hình, điểm số và bảng xếp hạng sẽ xếp ở đây.</div>`; },
    games() { return `<h1>Games</h1><p class="sub">Những trò đã chơi, đang chơi, và sẽ tự làm. Kệ băng đang trống.</p><div class="carts">${['Trò tự làm #1', 'Memory', 'Mood Run', 'Top Trumps', 'Sắp có'].map(n => `<div class="cart"><b>${n}</b>${n === 'Sắp có' ? 'chưa cắm' : 'đang lên kệ'}</div>`).join('')}</div>`; },
  };
  function renderRoom() {
    room.innerHTML = R[state.room]();
    room.querySelectorAll('[data-go]').forEach(el => el.onclick = (e) => { e.preventDefault(); go(el.dataset.go); });
    room.querySelectorAll('[data-dev]').forEach(b => b.onclick = () => openDevice(b.dataset.dev, b.dataset.tone));
    room.querySelectorAll('[data-reader]').forEach(b => b.onclick = () => openDevice('Yahoo! Messenger 2009', '#7B1FA2', b.dataset.reader));
    if (state.room === 'photos') {
      const list = photosOf(state.year);
      if (list.length) SH.justify(document.getElementById('jg'), list, { rowHeight: 230, gap: 6, render: (p) => { const f = document.createElement('figure'); f.className = 'jg-item'; f.innerHTML = `<img src="${p.src}" alt="${p.caption}" loading="lazy"><figcaption>${p.caption}</figcaption>`; return f; } });
    }
  }

  // ── Device frame ──────────────────────────────────────────────────────────
  const dev = document.getElementById('device');
  function openDevice(name, tone, who) {
    document.getElementById('glass').innerHTML = `<div><b style="color:${tone}">${name}</b>${who ? 'Đang mở hội thoại với <b style="display:inline;color:inherit;font-size:inherit">' + who + '</b>.<br>' : ''}Phòng đọc này sẽ có design riêng, phục dựng đúng thời đó.<br>Khung thiết bị bao ngoài là phần của vỏ Sonic Hub — để bạn luôn biết mình đang ở đâu.</div>`;
    document.getElementById('devLabel').textContent = `${name} · trong khung thiết bị của Sonic Hub`;
    dev.classList.add('open');
  }
  document.getElementById('devClose').onclick = () => dev.classList.remove('open');
  dev.addEventListener('click', e => { if (e.target === dev) dev.classList.remove('open'); });

  // ── Command palette ───────────────────────────────────────────────────────
  const pal = document.getElementById('palette'), q = document.getElementById('q'), res = document.getElementById('results');
  const INDEX = [
    ...PEOPLE.map(p => ({ n: p[0], d: `Angel · ${p[1]}–${p[2]}`, run: () => { state.year = p[1]; go('angels'); } })),
    ...NOTES.map(n => ({ n: n[1], d: `Journal · ${n[0]}`, run: () => { state.year = n[0]; go('journal'); } })),
    ...YEARS.map(y => ({ n: String(y), d: `Năm · ${photosOf(y).length} ảnh`, run: () => { state.year = y; go(state.room === 'home' ? 'photos' : state.room); } })),
    { n: 'Hồ Tây', d: 'Folder · 48 ảnh', run: () => go('photos') }, { n: 'Deadline Q4', d: 'Problem · 7 note', run: () => go('journal') },
    { n: 'Mùa 2025/26', d: 'Fantasy', run: () => { state.year = 2025; go('fantasy'); } },
  ];
  let hits = [];
  function openPalette() { pal.classList.add('open'); q.value = ''; q.focus(); list(); }
  function list() { const v = q.value.toLowerCase().trim(); hits = INDEX.filter(i => !v || i.n.toLowerCase().includes(v) || i.d.toLowerCase().includes(v)).slice(0, 9);
    res.innerHTML = hits.map((h, i) => `<li class="${i === 0 ? 'sel' : ''}" data-i="${i}">${h.n}<small>${h.d}</small></li>`).join('') || '<li><small>Không có gì khớp</small></li>';
    res.querySelectorAll('li[data-i]').forEach(li => li.onclick = () => pick(+li.dataset.i)); }
  function pick(i) { if (hits[i]) { pal.classList.remove('open'); hits[i].run(); } }
  q.addEventListener('input', list);
  q.addEventListener('keydown', e => { if (e.key === 'Enter') pick([...res.children].findIndex(li => li.classList.contains('sel'))); if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const lis = [...res.querySelectorAll('li[data-i]')], cur = lis.findIndex(l => l.classList.contains('sel')); const nx = (cur + (e.key === 'ArrowDown' ? 1 : -1) + lis.length) % lis.length; lis.forEach(l => l.classList.remove('sel')); lis[nx]?.classList.add('sel'); } });
  document.getElementById('cmdk').onclick = openPalette;
  pal.addEventListener('click', e => { if (e.target === pal) pal.classList.remove('open'); });

  // ── Keyboard ──────────────────────────────────────────────────────────────
  addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
    if (e.key === 'Escape') { pal.classList.remove('open'); dev.classList.remove('open'); return; }
    if (pal.classList.contains('open') || e.target.tagName === 'INPUT') return;
    if (/^[0-5]$/.test(e.key)) go(ROOMS[+e.key]);
    if (e.key === 'ArrowLeft' && state.year > YEARS[0]) setYear(state.year - 1);
    if (e.key === 'ArrowRight' && state.year < YEARS.at(-1)) setYear(state.year + 1);
  });

  // ── Boot ──────────────────────────────────────────────────────────────────
  const hash = location.hash.replace('#', ''); if (ROOMS.includes(hash)) state.room = hash;
  document.body.dataset.room = state.room; renderShell(); renderRoom();
</script>
</body>
</html>
