<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sonic Hub — Tạp chí</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Be+Vietnam+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* ═══ SET B · TẠP CHÍ ═══
     Language: print editorial. A personal magazine — high-contrast serif,
     full-bleed photos, generous whitespace, one bold color per issue (= per year).
     Timeline: a pile of past issues on the left, newest on top; the chosen
     issue slides out. Home: that issue's cover with "Trong số này". */
  :root {
    --paper: #FAFAF8; --ink: #111111; --ink-2: #66666A; --rule: #111111; --soft: #E7E6E1;
    --accent: #E4572E;
    --display: "Playfair Display", Georgia, serif; --text: Newsreader, Georgia, serif; --ui: "Be Vietnam Pro", system-ui, sans-serif;
    --stack-w: 168px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--text); font-size: 19px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; } button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* ── The pile of issues (vertical timeline) ── */
  .stack { position: fixed; top: 0; left: 0; bottom: 0; width: var(--stack-w); border-right: 1px solid var(--soft); background: #F2F1ED; overflow-y: auto; scrollbar-width: none; padding: 22px 16px 30px 14px; }
  .stack::-webkit-scrollbar { display: none; }
  .stack h6 { margin: 0 0 14px 4px; font-family: var(--ui); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
  .slab { display: flex; align-items: center; justify-content: space-between; width: 100%; border: 0; cursor: pointer; margin-bottom: 3px; padding: 0 10px; color: #fff;
    font-family: var(--ui); font-weight: 700; font-size: 13px; letter-spacing: .02em; border-radius: 2px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25), inset 0 -2px 0 rgba(0,0,0,.18); transform: translateX(var(--o, 0px)); transition: transform .2s, box-shadow .2s; }
  .slab small { font-weight: 500; font-size: 10px; letter-spacing: .08em; opacity: .85; }
  .slab:hover { transform: translateX(calc(var(--o, 0px) + 6px)); }
  .slab[aria-pressed="true"] { transform: translateX(22px); box-shadow: -8px 6px 16px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.3); position: relative; z-index: 2; }
  .slab .s { display: none; }

  .mag { margin-left: var(--stack-w); padding: 0 56px 80px; max-width: calc(var(--stack-w) + 1240px); }
  .masthead { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; padding: 26px 0 12px; border-bottom: 3px solid var(--rule); }
  .masthead .logo { font-family: var(--display); font-weight: 900; font-size: 64px; line-height: .85; letter-spacing: -0.02em; }
  .masthead .logo span { color: var(--accent); }
  .masthead .issue { font-family: var(--ui); font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; text-align: right; color: var(--ink-2); line-height: 1.6; }
  .masthead .issue b { color: var(--ink); }
  .sections { display: flex; gap: 0; border-bottom: 1px solid var(--rule); overflow-x: auto; scrollbar-width: none; }
  .sections button { border: 0; background: none; cursor: pointer; padding: 12px 16px; font-family: var(--ui); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); border-right: 1px solid var(--soft); white-space: nowrap; }
  .sections button:first-child { padding-left: 0; }
  .sections button[aria-current="true"] { color: var(--ink); box-shadow: inset 0 -4px 0 var(--accent); }
  .kicker { font-family: var(--ui); font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 34px 0 8px; }
  .hed { font-family: var(--display); font-weight: 900; font-size: clamp(40px, 5vw, 74px); line-height: 1; letter-spacing: -0.02em; margin: 0 0 14px; }
  .dek { font-family: var(--text); font-style: italic; font-size: 22px; color: var(--ink-2); margin: 0 0 30px; max-width: 46ch; line-height: 1.4; }

  /* Cover */
  .cover { display: grid; grid-template-columns: minmax(0, 520px) 1fr; gap: 48px; margin-top: 30px; }
  .cover .art { position: relative; aspect-ratio: 4/5; overflow: hidden; background: var(--soft); }
  .cover .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover .art .lines { position: absolute; left: 0; right: 0; bottom: 0; padding: 60px 30px 28px; color: #fff; background: linear-gradient(to top, rgba(0,0,0,.65), transparent); }
  .cover .art .lines .date { font-family: var(--ui); font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  .cover .art .lines h2 { font-family: var(--display); font-style: italic; font-weight: 700; font-size: 54px; line-height: 1; margin: 8px 0 0; }
  .cover .art .flash { position: absolute; top: 22px; right: 22px; width: 96px; height: 96px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; text-align: center; font-family: var(--ui); font-weight: 700; font-size: 12px; line-height: 1.2; transform: rotate(10deg); }
  .inside h3 { font-family: var(--ui); font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 6px; padding-bottom: 10px; border-bottom: 3px solid var(--rule); }
  .inside button { display: grid; grid-template-columns: 40px 1fr; gap: 12px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--soft); background: none; cursor: pointer; padding: 16px 0; }
  .inside button .pg { font-family: var(--display); font-weight: 900; font-size: 26px; color: var(--accent); line-height: 1; }
  .inside button b { display: block; font-family: var(--display); font-size: 21px; line-height: 1.2; margin-bottom: 4px; }
  .inside button span { font-size: 16px; color: var(--ink-2); line-height: 1.4; }
  .inside button:hover b { color: var(--accent); }
  .pull { margin: 26px 0 0; font-family: var(--display); font-style: italic; font-weight: 700; font-size: 30px; line-height: 1.2; }
  .pull cite { display: block; font-family: var(--ui); font-style: normal; font-weight: 600; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); margin-top: 10px; }

  /* Photo essay */
  .minis { display: flex; gap: 18px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 30px; }
  .mini { flex: 0 0 150px; cursor: pointer; }
  .mini div { position: relative; aspect-ratio: 3/4; overflow: hidden; background: var(--soft); }
  .mini img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mini div::after { content: attr(data-t); position: absolute; left: 10px; right: 10px; top: 10px; font-family: var(--display); font-weight: 900; font-size: 20px; color: #fff; line-height: 1; text-shadow: 0 1px 8px rgba(0,0,0,.4); }
  .mini span { font-family: var(--ui); font-size: 12px; color: var(--ink-2); }
  .jg-item.ed { margin: 0; position: relative; overflow: hidden; background: var(--soft); }
  .jg-item.ed img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .jg-item.ed i { position: absolute; left: 8px; top: 6px; font-family: var(--ui); font-style: normal; font-weight: 700; font-size: 11px; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.5); }
  .captions { columns: 3; column-gap: 30px; font-size: 15px; color: var(--ink-2); margin-top: 22px; border-top: 1px solid var(--soft); padding-top: 14px; }
  .captions b { font-family: var(--ui); font-size: 11px; color: var(--ink); margin-right: 4px; }

  /* Columns (journal) */
  .article { columns: 2; column-gap: 44px; column-rule: 1px solid var(--soft); max-width: 1000px; }
  .article p { margin: 0 0 1em; }
  .article p.first::first-letter { float: left; font-family: var(--display); font-weight: 900; font-size: 86px; line-height: .78; padding: 8px 10px 0 0; color: var(--accent); text-transform: uppercase; }
  .article blockquote { column-span: all; margin: 18px 0 26px; padding: 18px 0; border-top: 3px solid var(--rule); border-bottom: 1px solid var(--rule); font-family: var(--display); font-style: italic; font-weight: 700; font-size: 32px; line-height: 1.2; }
  .more { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; margin-top: 40px; border-top: 3px solid var(--rule); padding-top: 18px; }
  .more article b { display: block; font-family: var(--display); font-size: 22px; line-height: 1.2; margin: 4px 0 6px; }
  .more article small { font-family: var(--ui); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  .more article p { margin: 0; font-size: 16px; color: var(--ink-2); line-height: 1.45; }

  /* Features (angels) */
  .feature { display: grid; grid-template-columns: 1fr 1.1fr; gap: 44px; margin-top: 26px; align-items: start; }
  .feature .portrait { aspect-ratio: 4/5; overflow: hidden; background: var(--soft); }
  .feature .portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .feature .name { font-family: var(--display); font-weight: 900; font-size: clamp(48px, 6vw, 88px); line-height: .95; margin: 0 0 12px; letter-spacing: -0.02em; }
  .qa dt { font-family: var(--ui); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-top: 18px; }
  .qa dd { margin: 4px 0 0; font-size: 21px; line-height: 1.45; }
  .readlinks { margin-top: 26px; display: flex; flex-direction: column; border-top: 1px solid var(--rule); }
  .readlinks button { border: 0; border-bottom: 1px solid var(--soft); background: none; cursor: pointer; text-align: left; padding: 12px 0; font-family: var(--display); font-weight: 700; font-size: 22px; display: flex; justify-content: space-between; }
  .readlinks button:hover { color: var(--accent); }
  .others { display: flex; gap: 16px; margin-top: 40px; border-top: 3px solid var(--rule); padding-top: 16px; overflow-x: auto; }
  .others button { border: 0; background: none; cursor: pointer; text-align: left; flex: 0 0 120px; padding: 0; }
  .others img { width: 120px; aspect-ratio: 1; object-fit: cover; display: block; filter: grayscale(1); transition: filter .2s; }
  .others button:hover img, .others button.on img { filter: none; }
  .others b { display: block; font-family: var(--display); font-size: 17px; margin-top: 6px; }

  /* Sports + puzzles */
  table.league { width: 100%; max-width: 820px; border-collapse: collapse; font-family: var(--ui); font-size: 14px; }
  table.league th { text-align: left; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; border-bottom: 3px solid var(--rule); padding: 8px 6px; }
  table.league td { border-bottom: 1px solid var(--soft); padding: 12px 6px; color: #BDBCB6; }
  .stamp { display: inline-block; margin-top: 22px; padding: 8px 16px; border: 3px solid var(--accent); color: var(--accent); font-family: var(--ui); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 13px; transform: rotate(-3deg); }
  .xw { display: grid; grid-template-columns: repeat(9, 44px); gap: 0; border: 2px solid var(--ink); width: max-content; }
  .xw i { width: 44px; height: 44px; border: 1px solid #C9C8C2; position: relative; background: #fff; }
  .xw i.b { background: var(--ink); }
  .xw i em { position: absolute; top: 2px; left: 3px; font-family: var(--ui); font-style: normal; font-size: 9px; font-weight: 700; }

  .overlay { position: fixed; inset: 0; background: rgba(17,17,17,.55); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .overlay.open { display: flex; }
  .overlay .card { background: var(--paper); max-width: 460px; padding: 30px; border-top: 6px solid var(--accent); }
  .overlay .card h4 { font-family: var(--display); font-weight: 900; font-size: 32px; margin: 6px 0 10px; line-height: 1.05; }
  .overlay .card p { margin: 0; color: var(--ink-2); font-size: 17px; }

  @media (max-width: 860px) {
    :root { --stack-w: 52px; }
    body { font-size: 17px; }
    .stack { padding: 12px 6px 30px 4px; } .stack h6 { display: none; }
    .slab { padding: 0 4px; justify-content: center; font-size: 11px; } .slab small, .slab .f { display: none; } .slab .s { display: inline; }
    .slab[aria-pressed="true"] { transform: translateX(8px); }
    .mag { padding: 0 16px 60px; }
    .masthead { padding-top: 16px; } .masthead .logo { font-size: 42px; } .masthead .issue { font-size: 10px; }
    .cover, .feature { grid-template-columns: 1fr; gap: 22px; } .cover .art .lines h2 { font-size: 36px; }
    .article { columns: 1; } .more { grid-template-columns: 1fr; } .captions { columns: 1; }
    .xw { grid-template-columns: repeat(9, 30px); } .xw i { width: 30px; height: 30px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<aside class="stack" id="stack" aria-label="Các số báo theo năm"><h6>Các số đã ra</h6></aside>
<div class="mag">
  <header class="masthead">
    <div class="logo">Sonic<span>.</span></div>
    <div class="issue" id="issue"></div>
  </header>
  <nav class="sections" id="sections" aria-label="Chuyên mục"></nav>
  <main id="page"></main>
</div>
<div class="overlay" id="overlay"><div class="card" id="overlayCard"></div></div>

<script src="assets/photos.js"></script>
<script src="assets/justified.js"></script>
<script src="assets/data.js"></script>
<script>
  const D = window.SH_DATA;
  const state = { room: 'home', year: 2010 };
  const ISSUE = ['#E4572E', '#2D5BD3', '#1E8A5E', '#6C3FD1', '#D1377A', '#0F8B8D', '#F28C28', '#3AA0E0', '#C0392B', '#7A5CFF', '#12A579', '#E0457B', '#2F6FEB', '#9B51E0', '#FF5A5F', '#00A8A8', '#3D5AFE', '#00B37E', '#E4572E'];
  const colorOf = (y) => ISSUE[(y - 2008) % ISSUE.length];
  const issueNo = (y) => y - 2007;
  const SECTIONS = [['home', 'Bìa'], ['photos', 'Ảnh'], ['journal', 'Chuyên mục'], ['angels', 'Nhân vật'], ['fantasy', 'Thể thao'], ['games', 'Giải trí']];

  // pile — newest on top; slab thickness follows how much happened that year
  const stack = document.getElementById('stack');
  D.YEARS.slice().reverse().forEach((y, i) => {
    const weight = D.photosOf(y).length * 3 + D.notesOf(y).length * 6 + D.peopleOf(y).length * 5;
    const b = document.createElement('button'); b.className = 'slab'; b.dataset.year = y;
    b.style.background = colorOf(y); b.style.height = Math.min(46, 24 + weight) + 'px';
    b.style.setProperty('--o', ((i * 37) % 11 - 5) + 'px');
    b.innerHTML = `<span class="f">${y}</span><span class="s">'${String(y).slice(2)}</span><small>SỐ ${String(issueNo(y)).padStart(2, '0')}</small>`;
    b.onclick = () => setYear(y); stack.appendChild(b);
  });
  const sections = document.getElementById('sections');
  SECTIONS.forEach(([id, label]) => { const b = document.createElement('button'); b.dataset.room = id; b.textContent = label; b.onclick = () => go(id); sections.appendChild(b); });

  function go(room) { state.room = room; render(); window.scrollTo({ top: 0 }); }
  function setYear(y) { state.year = y; render(); }

  const V = {
    home() {
      const y = state.year, ph = D.photosOf(D.nearestYear(y)), who = D.peopleOf(y)[0] || D.PEOPLE[0], note = D.notesOf(y)[0] || D.NOTES[3];
      return `<div class="cover">
        <div class="art"><img src="${ph[0].src}" alt=""><div class="flash">Số đặc biệt<br>${ph.length} ảnh</div>
          <div class="lines"><div class="date">${D.todayVN()} · ${y}</div><h2>Ngày này,<br>năm ${y}</h2></div></div>
        <div class="inside"><h3>Trong số này</h3>
          <button data-go="photos"><span class="pg">12</span><div><b>${ph[0].caption}: ${ph.length} khung hình</b><span>Phóng sự ảnh năm ${y}, xếp theo từng bộ.</span></div></button>
          <button data-go="angels"><span class="pg">24</span><div><b>${who.name} — chương ${who.from}${who.to !== who.from ? '–' + who.to : ''}</b><span>Chân dung, kỷ niệm, và hồ sơ chat.</span></div></button>
          <button data-go="journal"><span class="pg">31</span><div><b>${note.title}</b><span>${note.body.slice(0, 70)}…</span></div></button>
          <button data-go="fantasy"><span class="pg">40</span><div><b>Mùa giải chưa lên khuôn</b><span>Chuyên mục thể thao sẽ in ở số sau.</span></div></button>
          <blockquote class="pull">“mai thi xong roi di choi nhe”<cite>${who.name} · Yahoo, 23:14</cite></blockquote>
        </div></div>`;
    },
    photos() {
      const y = state.year, list = D.photosOf(y);
      return `<div class="kicker">Phóng sự ảnh · Số ${issueNo(y)}</div><h1 class="hed">Năm ${y}, qua ống kính</h1>
      <p class="dek">${list.length ? list.length + ' khung hình, xếp theo nhịp của năm.' : 'Số này không có trang ảnh — chọn một số khác trên chồng báo.'}</p>
      <div class="minis">${D.FOLDERS.map(([n, c], i) => `<div class="mini"><div data-t="${n}"><img src="${D.photos[(i * 7) % 40].src}" alt=""></div><span>${c} ảnh</span></div>`).join('')}</div>
      <div id="jg"></div>
      ${list.length ? `<div class="captions">${list.map((p, i) => `<div><b>${String(i + 1).padStart(2, '0')}</b>${p.caption}, ${p.year}.</div>`).join('')}</div>` : ''}`;
    },
    journal() {
      const n = D.notesOf(state.year)[0] || D.NOTES[0], rest = D.NOTES.filter(x => x !== n).slice(0, 3);
      return `<div class="kicker">Chuyên mục · ${n.tags.join(', ')}</div><h1 class="hed">${n.title}</h1><p class="dek">Viết năm ${n.year}${n.mood ? ', lúc thấy ' + n.mood : ''}.</p>
      <div class="article">
        <p class="first">${n.body} Có những ngày chỉ cần ba dòng, có những ngày cần ba trang; chuyên mục này nhận cả hai. Chữ ở đây là Newsreader 19px, nền trắng sữa, dòng không quá 70 ký tự — thứ đọc được lâu mà không mỏi mắt.</p>
        <blockquote>Viết ra ngay, sắp xếp sau — tạp chí này tự đóng số theo năm.</blockquote>
        <p>Mỗi bài có thể gắn một vấn đề đang theo dõi${n.problem ? ' — bài này gắn với <b>' + n.problem + '</b>' : ''}, để các số báo sau nối thành một mạch: vấn đề bắt đầu ở số nào, và khép lại ở số nào.</p>
        <p>Ảnh dán giữa bài sẽ nằm đúng vị trí như lúc viết, tràn hết cột khi cần, kèm chú thích in nghiêng bên dưới.</p>
      </div>
      <div class="more">${rest.map(x => `<article><small>${x.tags[0]} · ${x.year}</small><b>${x.title}</b><p>${x.body.slice(0, 90)}…</p></article>`).join('')}</div>`;
    },
    angels() {
      const y = state.year, list = D.peopleOf(y), p = list[0] || D.PEOPLE[0], k = D.PEOPLE.indexOf(p);
      return `<div class="kicker">Nhân vật · Số ${issueNo(y)}</div>
      <div class="feature">
        <div class="portrait"><img src="${D.photos[(k * 5 + 3) % 40].src}" alt=""></div>
        <div><h1 class="name">${p.name}</h1><p class="dek" style="margin-bottom:10px">${p.from}${p.to !== p.from ? '–' + p.to : ''} · qua ${p.via}</p>
          <dl class="qa"><dt>Thích gì?</dt><dd>${p.like}.</dd><dt>Kỷ niệm đáng nhớ?</dt><dd>${p.memory}.</dd></dl>
          <div class="readlinks">${p.via.split(' · ').map(v => `<button data-reader="${v}">Đọc hồ sơ chat ${v} <span>→</span></button>`).join('')}</div>
        </div>
      </div>
      <div class="others">${D.PEOPLE.map((x, i) => `<button class="${x === p ? 'on' : ''}" data-year="${x.from}"><img src="${D.photos[(i * 5 + 3) % 40].src}" alt=""><b>${x.name}</b></button>`).join('')}</div>`;
    },
    fantasy() {
      return `<div class="kicker">Thể thao</div><h1 class="hed">Mùa ${state.year}/${String(state.year + 1).slice(2)}</h1><p class="dek">Bảng xếp hạng đã kẻ khung, chờ số liệu để lên khuôn.</p>
      <table class="league"><thead><tr><th>#</th><th>Đội</th><th>Trận</th><th>Hiệu số</th><th>Điểm</th></tr></thead>
      <tbody>${Array.from({ length: 6 }, (_, i) => `<tr><td>${i + 1}</td><td>————————</td><td>—</td><td>—</td><td>—</td></tr>`).join('')}</tbody></table>
      <div class="stamp">In ở số sau</div>`;
    },
    games() {
      const blacks = new Set([2, 6, 10, 16, 20, 24, 30, 34, 40, 46, 50, 56, 60, 64, 70, 74, 78]);
      return `<div class="kicker">Giải trí</div><h1 class="hed">Ô chữ số này</h1><p class="dek">Đang soạn. Mục game sẽ về đây — những trò đã chơi và sẽ tự làm.</p>
      <div class="xw">${Array.from({ length: 81 }, (_, i) => `<i class="${blacks.has(i) ? 'b' : ''}">${!blacks.has(i) && (i % 9 === 0 || i < 9) && i % 3 === 0 ? `<em>${i + 1}</em>` : ''}</i>`).join('')}</div>`;
    },
  };

  const pageEl = document.getElementById('page');
  function render() {
    document.documentElement.style.setProperty('--accent', colorOf(state.year));
    document.getElementById('issue').innerHTML = `Tạp chí cá nhân<br><b>Số ${String(issueNo(state.year)).padStart(2, '0')} · ${state.year}</b>`;
    document.querySelectorAll('.sections button').forEach(b => b.setAttribute('aria-current', String(b.dataset.room === state.room)));
    document.querySelectorAll('.slab').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.year === state.year)));
    pageEl.innerHTML = V[state.room]();
    pageEl.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
    pageEl.querySelectorAll('[data-reader]').forEach(b => b.onclick = () => openReader(b.dataset.reader));
    pageEl.querySelectorAll('.others [data-year]').forEach(b => b.onclick = () => setYear(+b.dataset.year));
    if (state.room === 'photos') {
      const list = D.photosOf(state.year);
      if (list.length) SH.justify(document.getElementById('jg'), list, { rowHeight: 280, gap: 10, render: (p) => { const f = document.createElement('figure'); f.className = 'jg-item ed'; f.innerHTML = `<img src="${p.src}" alt="${p.caption}" loading="lazy"><i>${String(list.indexOf(p) + 1).padStart(2, '0')}</i>`; return f; } });
    }
  }

  const ov = document.getElementById('overlay');
  function openReader(v) {
    document.getElementById('overlayCard').innerHTML = `<div class="kicker" style="margin:0">Phòng đọc</div><h4>${v}</h4><p>Mỗi nền tảng có một phòng đọc riêng, phục dựng đúng thời đó. Design ở một số khác.</p>`;
    ov.classList.add('open');
  }
  ov.onclick = () => ov.classList.remove('open');
  addEventListener('keydown', e => {
    if (e.key === 'Escape') ov.classList.remove('open');
    if (e.key === 'ArrowUp' && state.year < D.YEARS.at(-1)) { e.preventDefault(); setYear(state.year + 1); }
    if (e.key === 'ArrowDown' && state.year > D.YEARS[0]) { e.preventDefault(); setYear(state.year - 1); }
  });
  render();
</script>
</body>
</html>
