<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16305a">
<title>Ông Trùm 4rum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ── Ông Trùm 4rum ──
     Demo game #2 for Sonic Hub Pages: run a Vietnamese fan forum from 09/2007 into the Facebook era.
     The board is the forum itself, in a polished vBulletin 3.x skin; events arrive as messenger windows. */
  :root { box-sizing: border-box; color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    --ink: #1c2436; --muted: #5d6a83; --link: #1d3f9a; --hover: #c8102e; --line: #cdd8eb; --line2: #9fb3d6; --alt1: #f7f9fe; --alt2: #edf2fa;
    --admin: #c8102e; --mod: #17803a; --core: #7a3fb0; --amber: #7a4b00;
    --t-drama: #d6262b; --t-hot: #e06a0a; --t-quality: #a87400; --t-request: #2a76c2; --t-news: #8e44ad; --t-chat: #1f8f63; --t-spam: #6b7587; --t-normal: #7d879a; --t-ann: #b85e00;
    --ui: Tahoma, Verdana, "Noto Sans", "Segoe UI", sans-serif; --brand: Lobster, "Brush Script MT", cursive; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
  *, *::before, *::after { box-sizing: inherit; }
  body { margin: 0; min-height: 100vh; color: var(--ink); font: 13px/1.45 var(--ui); background: #0d1d3b;
    background-image: radial-gradient(1000px 480px at 50% -160px, rgba(130,180,255,.38), transparent 70%), repeating-linear-gradient(135deg, rgba(255,255,255,.028) 0 2px, transparent 2px 8px), linear-gradient(#21457d, #0d1d3b 700px);
    background-repeat: no-repeat, repeat, no-repeat; }
  a { color: var(--link); text-decoration: none; } a:hover { color: var(--hover); text-decoration: underline; }
  button { font: inherit; color: inherit; cursor: pointer; } button:disabled { cursor: not-allowed; }
  :focus-visible { outline: 2px solid #ffb400; outline-offset: 2px; }
  .muted { color: var(--muted); } .pad { padding: 10px 12px; } .pos { color: #1f7a3a; } .neg { color: #b3261e; }
  .i { width: 12px; height: 12px; vertical-align: -2px; flex: none; display: inline-block; }
  .ico { width: 22px; height: 22px; display: block; } .ico.big { width: 26px; height: 26px; }
  .burning .flick { transform-box: fill-box; transform-origin: 50% 100%; animation: flick .45s ease-in-out infinite alternate; }
  @keyframes flick { from { transform: scale(1, 1); } to { transform: scale(1.12, .88); } }

  /* page frame */
  .topbar { max-width: 1180px; margin: 0 auto; padding: 10px 12px 0; display: flex; align-items: center; gap: 8px; color: #cfe0ff; font-size: 12px; }
  .topbar .home { color: #cfe0ff; padding: 6px 8px; border-radius: 4px; } .topbar .home:hover { background: rgba(255,255,255,.1); text-decoration: none; }
  .no-home .home { display: none; }
  .topbar .game { font: 19px/1 var(--brand); color: #fff; text-shadow: 0 1px 0 #0b1a33; } .topbar .sp { flex: 1; }
  .tbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 5px 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.08); color: #e8f0ff; font-size: 12px; }
  .tbtn:hover { background: rgba(255,255,255,.16); } .tbtn .i { width: 16px; height: 14px; }
  .page { max-width: 1180px; margin: 8px auto 22px; background: #fff; border: 1px solid #07142a; box-shadow: 0 0 0 5px rgba(255,255,255,.06), 0 26px 70px rgba(0,0,0,.5); }

  /* banner */
  .banner { position: relative; height: 140px; display: flex; align-items: center; gap: 20px; padding: 0 28px; overflow: hidden; border-bottom: 1px solid #0b1a33; }
  .banner .art { position: absolute; inset: 0; width: 100%; height: 100%; }
  .gloss { position: absolute; left: 0; right: 0; top: 0; height: 52%; background: linear-gradient(rgba(255,255,255,.26), rgba(255,255,255,.05)); pointer-events: none; }
  .brand { position: relative; min-width: 0; }
  .logo { font: 56px/1.08 var(--brand); white-space: nowrap; padding: 0 6px 6px 0; background: linear-gradient(180deg, #fff 0%, #f1f6ff 44%, #b4d0ff 56%, #fff 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 0 rgba(10,26,64,.6)) drop-shadow(0 8px 14px rgba(0,0,0,.35)); }
  .banner .logo { font-size: clamp(26px, calc(880px / var(--len, 15)), 56px); }
  .tagline { color: rgba(255,255,255,.93); font-style: italic; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  .beta { position: absolute; top: -18px; right: -48px; width: 50px; height: 50px; display: grid; place-items: center; font: bold 11px/1 var(--ui); color: #fff; transform: rotate(14deg); text-shadow: 0 1px 0 rgba(0,0,0,.35);
    background: radial-gradient(circle at 40% 35%, #ffc27a, #e8590c 72%); clip-path: polygon(50% 0%, 61% 18%, 82% 10%, 80% 32%, 100% 40%, 85% 56%, 96% 76%, 74% 78%, 66% 100%, 50% 86%, 34% 100%, 26% 78%, 4% 76%, 15% 56%, 0% 40%, 20% 32%, 18% 10%, 39% 18%); }
  .recordbox { position: relative; margin-left: auto; flex: none; text-align: center; padding: 10px 18px 9px; border-radius: 10px; color: #fff; border: 1px solid rgba(255,255,255,.5);
    background: linear-gradient(rgba(255,255,255,.3), rgba(255,255,255,.08) 50%, rgba(0,0,0,.1) 51%, rgba(255,255,255,.14)); box-shadow: inset 0 1px 0 rgba(255,255,255,.65), 0 6px 18px rgba(0,0,0,.28); text-shadow: 0 1px 2px rgba(0,0,0,.45); }
  .recordbox span, .recordbox small { display: block; font-size: 11px; } .recordbox b { display: block; font: 36px/1.05 var(--brand); }

  /* navbar & welcome */
  .navbar { display: flex; align-items: stretch; background: linear-gradient(#fbfcff, #dde6f4); border-bottom: 1px solid var(--line2); }
  .navbar button { border: 0; border-right: 1px solid #c9d5ea; background: transparent; padding: 10px 15px; font-weight: bold; color: #22345a; }
  .navbar button:hover { background: rgba(255,255,255,.7); color: var(--hover); }
  .navbar button[aria-current] { background: #fff; color: var(--hover); box-shadow: inset 0 3px 0 #f0a020; }
  .when { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; justify-content: center; padding: 4px 14px; font-size: 11px; color: var(--muted); } .when b { font-size: 13px; color: #22345a; }
  .welcome { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 7px 14px; background: var(--alt2); border-bottom: 1px solid var(--line); font-size: 12px; }
  .season { display: inline-block; margin-left: 6px; padding: 0 8px; border-radius: 9px; background: #fff; border: 1px solid #c9d6ea; color: #5a3a8c; font-weight: bold; font-size: 11px; }
  .pm { border: 0; background: transparent; color: var(--hover); font-weight: bold; padding: 4px 0; display: inline-flex; align-items: center; gap: 6px; animation: blink 1.1s steps(2, jump-none) 4; }
  .pm .i { width: 16px; height: 12px; } @keyframes blink { 50% { opacity: .35; } }
  .welcome .clock { margin-left: auto; color: var(--muted); }
  .strip { display: none; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; justify-content: space-between; gap: 4px; padding: 6px 10px; background: linear-gradient(#fbfcff, #e3eaf6); border-bottom: 1px solid var(--line2); box-shadow: 0 4px 10px rgba(0,0,0,.08); }
  .strip > span { display: flex; flex-direction: column; align-items: center; font-size: 12.5px; } .strip small { font-size: 9.5px; color: var(--muted); } .strip .low b { color: #b3261e; } .strip .pips i { width: 10px; height: 10px; }

  /* layout */
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; padding: 14px; align-items: start; }
  .cp { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 10px; }
  .foot { display: flex; justify-content: space-between; gap: 10px; padding: 10px 14px; font-size: 11px; color: var(--muted); background: var(--alt2); border-top: 1px solid var(--line); }
  .subnav { display: none; gap: 6px; overflow-x: auto; margin-bottom: 10px; padding-bottom: 2px; }
  .subnav button { flex: none; min-height: 34px; padding: 6px 13px; border: 1px solid #9fb3d6; border-radius: 17px; background: #fff; font-weight: bold; font-size: 12px; color: #22345a; }
  .subnav button[aria-current] { background: #22345a; color: #fff; border-color: #22345a; }
  .mobilebar { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding-bottom: env(safe-area-inset-bottom, 0px); background: linear-gradient(#fbfcff, #dde6f4); border-top: 1px solid var(--line2); box-shadow: 0 -6px 18px rgba(0,0,0,.2); }
  .mobilebar .row { display: grid; grid-template-columns: repeat(4, 1fr) 1.35fr; }
  .mobilebar button { min-height: 54px; border: 0; background: transparent; font-size: 11.5px; font-weight: bold; color: #22345a; padding: 4px 2px; }
  .mobilebar button[aria-current] { color: var(--hover); background: #fff; box-shadow: inset 0 3px 0 #f0a020; }
  .mobilebar .end { color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.3); background: linear-gradient(#8de06b, #4fb32f 48%, #3c9d22 52%, #59c23a); }

  /* vBulletin tables */
  .tborder { border: 1px solid var(--line2); background: #fff; margin-bottom: 14px; }
  .tcat { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 7px 10px; color: #fff; background: linear-gradient(#7397d2, #4566a6 50%, #3a5a98 51%, #3f62a2); text-shadow: 0 1px 0 rgba(0,0,0,.3); border-bottom: 1px solid #2d4a80; }
  .tcat h3 { margin: 0; font-size: 13.5px; } .tcat .desc { font-size: 11.5px; opacity: .9; }
  .thead { padding: 5px 10px; font-size: 11px; font-weight: bold; color: #2a3d63; background: linear-gradient(#eef3fb, #d4dff0); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .box .tcat { flex-wrap: nowrap; } .bt { flex: 1; min-width: 0; } .bt h3 { font-size: 14px; } .bt .desc { display: block; }
  .bico { flex: none; } .bm { flex: none; font-size: 11.5px; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; } .bm b { color: #dcffe5; } .nomod { opacity: .75; }
  .issues { background: #fff; color: #b3261e; font-weight: bold; border-radius: 9px; padding: 0 8px; text-shadow: none; font-size: 11px; }
  .box.ann .tcat { background: linear-gradient(#f7b955, #e8890c 50%, #db7d05 51%, #e99325); border-bottom-color: #a35c00; }
  .empty { padding: 14px; color: var(--muted); background: #fff; }
  .trow-grid { display: grid; grid-template-columns: 38px minmax(0, 1fr) 156px 64px 72px; }
  .thead.trow-grid { padding: 4px 0; border-top: 0; } .thead.trow-grid > span { padding: 0 6px; } .thead.trow-grid > span:nth-child(n+4) { text-align: center; }
  .trow { background: #fff; border-top: 1px solid var(--line); cursor: pointer; }
  .trow > span { padding: 7px 7px; min-width: 0; }
  .c-ico { display: grid; place-items: center; } .c-stat { background: var(--alt1); font-size: 11px; } .c-num { background: var(--alt2); text-align: center; color: #3a4a6b; display: grid; place-items: center; }
  .trow:hover { background: #fbfdff; } .trow:hover .title { color: var(--hover); }
  .trow.sticky { background: #fffbe8; } .trow.sticky .c-stat, .trow.sticky .c-num { background: #fff3c6; }
  .trow.flame { background: #fff0ee; } .trow.flame .c-stat { background: #ffe3df; }
  .trow.locked .title, .trow.spamrow .title { color: #7d879a; }
  .trow.open { box-shadow: inset 4px 0 0 #f0a020; background: #fffdf4; }
  .trow.fresh { animation: fresh 1.8s ease-out; } @keyframes fresh { from { background: #ffe8a3; } }
  .annrow .c-stat, .annrow .c-num { background: #fff; }
  .title { font-weight: bold; color: var(--link); overflow-wrap: anywhere; } .pfx { color: #3a4a6b; }
  .by { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .badge-new { display: inline-block; margin-left: 6px; padding: 0 5px; border-radius: 3px; font-size: 10px; line-height: 15px; font-weight: bold; color: #fff; background: linear-gradient(#ffb347, #f07a12); vertical-align: 1px; }
  .uname { color: var(--link); } .uname.admin { color: var(--admin); font-weight: bold; } .uname.mod { color: var(--mod); font-weight: bold; } .uname.core { color: var(--core); font-weight: bold; } .uname.banned { color: #999; text-decoration: line-through; }
  .tt { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 10.5px; line-height: 17px; font-weight: bold; color: #fff; background: var(--t-normal); white-space: nowrap; }
  .tt-drama { background: var(--t-drama); } .tt-hot { background: var(--t-hot); } .tt-quality { background: var(--t-quality); } .tt-request { background: var(--t-request); } .tt-news { background: var(--t-news); } .tt-chat { background: var(--t-chat); } .tt-spam { background: var(--t-spam); } .tt-ann { background: var(--t-ann); }
  .st { display: flex; align-items: center; gap: 3px; margin-top: 4px; color: var(--muted); flex-wrap: wrap; } .st.warn { color: #b3261e; font-weight: bold; } .st.ok { color: #1f7a3a; font-weight: bold; }
  .heat .i { width: 10px; height: 12px; } .heat span { margin-left: 3px; } .heat.h3 span, .heat.h4 span { color: var(--t-drama); font-weight: bold; }
  .legend .i { width: 13px; height: 13px; }

  /* thread action panel */
  .actions { padding: 10px 12px 12px 48px; background: linear-gradient(#fffdf3, #fff7dc); border-top: 1px solid #ecd9a0; }
  .help { font-size: 12px; color: #5a4a1a; margin-bottom: 8px; } .help .tt { margin-right: 6px; }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .act { display: flex; flex-direction: column; gap: 3px; flex: 0 1 236px; text-align: left; padding: 8px 10px; border: 1px solid #b9c7df; border-radius: 5px; background: linear-gradient(#fff, #eaf0fa); }
  .act:hover:not(:disabled) { border-color: #6d8fc8; background: linear-gradient(#fff, #dfe9fa); } .act:disabled { opacity: .55; }
  .ah { display: flex; justify-content: space-between; align-items: center; gap: 8px; } .ah b { color: #1d3f9a; } .act.warn .ah b { color: #b3261e; }
  .act small { color: var(--muted); font-size: 11.5px; line-height: 1.35; } .cost { font-size: 11px; color: var(--amber); font-weight: bold; white-space: nowrap; } .cost .pips i { width: 10px; height: 10px; }
  .notice { border: 1px solid #e6c25a; background: linear-gradient(#fffbe8, #fff4cc); padding: 12px 14px; margin-bottom: 14px; color: #4a3b00; } .notice p { margin: 6px 0; max-width: 78ch; }
  .wrow { display: flex; gap: 10px; padding: 8px 12px; background: #fff; font-size: 12px; line-height: 1.65; } .wrow > .i { width: 16px; height: 16px; margin-top: 2px; }

  /* control panel */
  .cpbox { margin: 0; } .cpin { padding: 10px 12px; background: #fff; } .cpin small { color: var(--muted); font-size: 11px; display: block; margin-top: 4px; }
  .me { display: flex; gap: 10px; align-items: center; } .me .by { font-size: 11px; }
  .ava { width: 48px; height: 48px; image-rendering: pixelated; border: 1px solid #9fb2d4; background: #fff; flex: none; } .ava.s { width: 28px; height: 28px; }
  .hours { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 12px; color: #2a3d63; }
  .pips { display: inline-flex; gap: 3px; vertical-align: middle; } .pips i { width: 13px; height: 13px; border-radius: 50%; display: block; background: radial-gradient(circle at 35% 30%, #fff 0 16%, #ffd66b 22%, #f0a020 75%); border: 1px solid #b97400; } .pips i.used { background: #e6ebf3; border-color: #c4cfe0; }
  .meter { margin-top: 9px; } .ml { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12px; color: #2a3d63; } .ml b { font-size: 13px; }
  .bar { height: 9px; border-radius: 5px; background: #e4eaf4; border: 1px solid #c3cfe3; overflow: hidden; margin-top: 3px; } .bar i { display: block; height: 100%; background: linear-gradient(#9cc4ff, #3d6fd0); }
  .meter.passion .bar i { background: linear-gradient(#ffd27a, #f0761f); } .meter.vibe .bar i { background: linear-gradient(#a6e98b, #3c9d22); }
  .meter.low .ml span { color: #b3261e; font-weight: bold; } .meter.low .bar i { background: linear-gradient(#ff9b9b, #d6262b); } .face { font-weight: normal; color: var(--muted); }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); } .kv span { display: block; font-size: 11px; color: var(--muted); } .kv b { font-size: 16px; } .kv em { font-style: normal; font-size: 11px; margin-left: 5px; } .up { color: #1f7a3a; } .down { color: #b3261e; }
  .server { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); } .server .bar i { background: linear-gradient(#9fe0e0, #2fa3a3); } .server.hot .bar i { background: linear-gradient(#ffb36b, #e8590c); } .server small { color: #b3261e; }
  .funds { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); } .funds > span { color: #2a3d63; font-size: 12px; } .funds b { font-size: 19px; color: var(--amber); } .funds b.neg { color: #b3261e; } .funds small { flex-basis: 100%; margin: 0; }
  .ms { font-size: 12px; color: #2a3d63; margin-bottom: 4px; } .bar.goal i { background: linear-gradient(#ffe08a, #f0a020); }
  .fc, .fx { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; font-size: 12px; } .fc b { display: block; font-size: 11px; color: var(--muted); } .fc li.boss b { color: #b3261e; } .fc li.hype b { color: #8e44ad; } .fx small { display: inline; }
  .modrow { display: flex; gap: 8px; align-items: center; padding: 4px 0; } .modrow > div { flex: 1; min-width: 0; } .modrow small { margin: 0; }
  .bar.mini { height: 6px; } .bar.mini i { background: linear-gradient(#a6e98b, #3c9d22); } .bar.mini.low i { background: linear-gradient(#ff9b9b, #d6262b); }
  .go { width: 100%; min-height: 48px; border: 1px solid #2a7a17; border-radius: 6px; padding: 11px 16px; font-size: 15px; font-weight: bold; color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.3);
    background: linear-gradient(#8de06b 0%, #4fb32f 48%, #3c9d22 52%, #59c23a 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 2px 0 #1f5c10, 0 6px 14px rgba(40,120,20,.3); }
  .go:hover { filter: brightness(1.06); } .go:active { transform: translateY(1px); box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 1px 0 #1f5c10; }
  .go.small { width: auto; min-height: 38px; padding: 8px 20px; font-size: 14px; }
  .gohint { margin: -4px 2px 0; font-size: 11px; color: var(--muted); }

  /* buttons, cards */
  .btn { min-height: 32px; padding: 5px 12px; border: 1px solid #9fb3d6; border-radius: 4px; background: linear-gradient(#fff, #e3eaf6); color: #1d3f9a; font-weight: bold; font-size: 12px; }
  .btn:hover:not(:disabled) { border-color: #6d8fc8; background: linear-gradient(#fff, #d7e3f6); }
  .btn.primary { color: #fff; border-color: #2c5aa8; background: linear-gradient(#6f9be0, #3a6cc4 50%, #2f5fb6 51%, #4a7fd4); text-shadow: 0 1px 0 rgba(0,0,0,.25); }
  .btn.danger { color: #fff; border-color: #9c1b1b; background: linear-gradient(#f07070, #c8102e); } .btn:disabled { opacity: .5; }
  .msum { display: grid; grid-template-columns: repeat(5, 1fr); border-bottom: 1px solid var(--line); } .msum div { padding: 10px 12px; border-right: 1px solid var(--line); } .msum span { display: block; font-size: 11px; color: var(--muted); } .msum b { font-size: 16px; }
  .postbits { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; padding: 10px; background: var(--alt2); }
  .postbit { background: #fff; border: 1px solid var(--line2); display: flex; flex-direction: column; }
  .postbit header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 6px 10px; background: linear-gradient(#eef3fb, #d4dff0); border-bottom: 1px solid var(--line); }
  .postbit.mod { border-color: #9ccfab; } .postbit.mod header { background: linear-gradient(#eef9f1, #cfe9d8); } .rank { font-size: 11px; color: var(--muted); }
  .pb { display: flex; gap: 10px; padding: 10px; } .pb .ava { width: 60px; height: 60px; }
  .pinfo { min-width: 0; flex: 1; } .pinfo > b { display: block; } .pinfo > small { display: block; color: var(--muted); font-size: 11.5px; }
  .pinfo dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 6px 0 0; font-size: 12px; } .pinfo dt { color: var(--muted); } .pinfo dd { margin: 0; } .hearts .i { width: 12px; height: 11px; }
  .would { display: block; margin-top: 6px; color: #5a6b8c; font-size: 11px; }

'use strict';
/* ── Ông Trùm 4rum (Forum Tycoon) ──
   Demo game #2 for Sonic Hub Pages: you run a Vietnamese fan forum from 09/2007 into the Facebook era.
   One self-contained page: pixel avatars, banners and sounds are all generated in code.
   The engine (state in one plain object S, seeded RNG) has no DOM, so sim.js can play it headlessly. */

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const round1 = v => Math.round(v * 10) / 10;

/* mulberry32 on S.rs, so the whole run (and a saved run) is reproducible */
function rnd(S) {
  let t = (S.rs = (S.rs + 0x6D2B79F5) >>> 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rint = (S, a, b) => a + Math.floor(rnd(S) * (b - a + 1));
const chance = (S, p) => rnd(S) < p;
const pick = (S, arr) => arr[Math.floor(rnd(S) * arr.length)];
function wpick(S, entries) {
  let tot = 0;
  for (const e of entries) tot += Math.max(0, e[1]);
  if (tot <= 0) return entries[0][0];
  let r = rnd(S) * tot;
  for (const e of entries) { r -= Math.max(0, e[1]); if (r <= 0) return e[0]; }
  return entries[entries.length - 1][0];
}
function shuffled(S, arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd(S) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* Vietnamese number style: 1.234 ; money is kept in thousands of đồng (k) */
const fmtN = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
function fmtMoney(k) {
  const neg = k < 0, a = Math.abs(Math.round(k));
  const s = a >= 1000 ? (a / 1000).toFixed(a % 1000 === 0 ? 0 : 1).replace('.', ',') + 'tr' : a + 'k';
  return (neg ? '−' : '') + s;
}
const signed = (v, f = fmtN) => (v > 0 ? '+' : v < 0 ? '−' : '±') + f(Math.abs(v));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ── Content: forum types, boxes, people, rules, hacks, hosting. All text is Vietnamese (the game's language). ── */

};

const ARCH = {
  fan: {

    pitch: 'Hội fan nhóm nhạc Silverline. Tin về nhóm kéo khách ầm ầm, fan rất nhiệt tình nhưng dễ "fan war".',

function dateOf(turn) { const i = 8 + (turn - 1); return { m: (i % 12) + 1, y: 2007 + Math.floor(i / 12) }; }
const monthLabel = turn => { const d = dateOf(turn); return `Tháng ${d.m}/${d.y}`; };
const shortMonth = turn => { const d = dateOf(turn); return `${d.m}/${d.y}`; };
const ACTS = [

];
const actOf = turn => (turn <= 6 ? 0 : turn <= 12 ? 1 : turn <= 18 ? 2 : 3);
const POLICY_BY = Object.fromEntries(POLICIES.map(p => [p.id, p]));
const PLUGIN_BY = Object.fromEntries(PLUGINS.map(p => [p.id, p]));
const has = (S, id) => S.plugins.includes(id);

function seasonOf(S, turn = S.turn) {
  const { m, y } = dateOf(turn);
  const tet = (y === 2008 && m === 2) || (y === 2009 && m === 1);
  let s;
  if (tet) s = { id: 'tet', tag: 'Tết Nguyên Đán', note: 'Ai cũng về quê: ít thớt mới, nhiều lời chúc, dễ xin ủng hộ.', act: 0.8, guest: 0.9, gen: { chat: 1.7, drama: 0.7 }, donate: 1.8, vibe: 1.5 };
  else if (m === 12 || m === 1) s = { id: 'exam', tag: 'Thi học kỳ', note: 'Học sinh, sinh viên bận ôn thi.', act: 0.85, guest: 0.95, gen: { request: 1.3, chat: 0.8 }, studentAp: -1, exam: true };
  else if (m === 5) s = { id: 'exam', tag: 'Thi cuối năm', note: 'Mùa thi cuối năm: 4rum vắng hẳn.', act: 0.82, guest: 0.92, gen: { request: 1.3, chat: 0.8 }, studentAp: -1, exam: true };
  else if (m === 6) s = { id: 'summer', tag: 'Đầu hè', note: 'Nghỉ hè: khách đông dần.', act: 1.1, guest: 1.15 };
  else if (m === 7) s = { id: 'uni', tag: 'Thi đại học', note: 'Sĩ tử lên đường, ai thi xong thì online suốt ngày.', act: 1, guest: 1.12, studentAp: -1, exam: true };
  else if (m === 8) s = { id: 'summer', tag: 'Hè rực rỡ', note: 'Đỉnh hè: ai cũng rảnh, server dễ quá tải.', act: 1.22, guest: 1.3, studentAp: 1 };
  else if (m === 9) s = { id: 'school', tag: 'Khai giảng', note: 'Năm học mới, bạn mới.', act: 1.05, guest: 1.05 };
  else s = { id: 'normal', tag: '', note: '', act: 1, guest: 1 };
  const amp = ARCH[S.arch].seasonAmp || 1;
  if (amp !== 1) s = { ...s, act: 1 + (s.act - 1) * amp, guest: 1 + (s.guest - 1) * amp };
  s.gen = s.gen || {};
  return s;
}

/* ── modifiers: every rule, hack, effect, mod and the forum type feed one table ── */
const MULT_KEYS = new Set(['guest', 'signup', 'down', 'online', 'donate', 'ads', 'cap', 'hostCost', 'pluginCost', 'phay', 'qualityViews', 'act', 'fameGain', 'coreChurn']);
function emptyMods() {
  return {
    gen: { normal: 1, chat: 1, request: 1, quality: 1, hot: 1, news: 1, drama: 1, spam: 1 },
    guest: 1, signup: 1, down: 1, online: 1, donate: 1, ads: 1, cap: 1, hostCost: 1, pluginCost: 1, phay: 1, qualityViews: 1, act: 1, fameGain: 1, coreChurn: 1,
    activation: 0, churn: 0, core: 0, vibeTurn: 0, passionTurn: 0, ap: 0, security: 0, legendSpeed: 0, modMorale: 0, modCap: 0,
  };
}
function addMods(M, m) {
  if (!m) return;
  for (const k in m) {
    if (k === 'gen') { for (const g in m.gen) M.gen[g] *= m.gen[g]; }
    else if (MULT_KEYS.has(k)) M[k] *= m[k];
    else if (k in M) M[k] += m[k];
  }
}
function calcMods(S) {
  const M = emptyMods();
  addMods(M, ARCH[S.arch].mods);
  addMods(M, BGS[S.bg].mods);
  for (const id of S.policies) addMods(M, POLICY_BY[id].mods);
  for (const id of S.plugins) addMods(M, PLUGIN_BY[id].mods);
  for (const e of S.effects) addMods(M, e.mods);
  if (has(S, 'music') && S.arch === 'fan') M.guest *= 1.13;
  if (S.hosting === 'free') M.vibeTurn -= 1;
  if (S.ads.banner) M.vibeTurn -= 1;
  if (S.ads.popup) { M.vibeTurn -= 3; M.guest *= 0.95; }
  for (const n of S.notables) {
    if (n.role === 'mod') {
      const T = MODTYPES[n.modType];
      M.vibeTurn += T.vibe; M.security += T.security || 0;
      if (n.modType === 'tech') M.down *= 0.5;
    }
    if ((n.role === 'member' || n.role === 'mod') && n.trait === 'techie') M.security += 1;
  }
  if (S.flags.linked) M.guest *= 1.12;
  if (S.flags.fanpage) { M.phay *= 0.7; M.guest *= 1.1; }
  if (S.flags.pride) M.coreChurn *= 0.8;
  if (S.flags.picsDead && !has(S, 'album')) M.qualityViews *= 0.75;
  M.security += S.flags.sec || 0;
  return M;
}
const securityOf = S => calcMods(S).security;

function newGame(opts) {
  const A = ARCH[opts.arch], B = BGS[opts.bg];
  const S = {
    v: 1, seed: opts.seed >>> 0, rs: opts.seed >>> 0, name: (opts.name || A.defaultName).trim().slice(0, 28) || A.defaultName, arch: opts.arch, bg: opts.bg,
    turn: 1, ap: 0, apMax: 0, apBonus: 0, passion: B.passion, vibe: 60, fame: A.fame, funds: B.funds,
    members: 12, active: 10, core: 3, guests: 260, online: 6, record: { n: 6, turn: 1 },
    signupsLast: 0, newActiveLast: 0, lastNewest: null,
    hosting: 'free', ads: { banner: false, popup: false }, policies: [], plugins: [], shop: [],
    boxes: [], threads: {}, nextId: 1, nextBox: 1, sticky: STICKY_BASE,
    legends: [], notables: [], nextNotable: 1, inbox: [], scheduled: [], flags: { seen: {} }, effects: [], cd: {},
    history: [], log: [], report: null, debt: 0, turnFx: null,
    totals: { threads: 38, posts: 240 },
    stats: { flame: 0, bans: 0, crashes: 0, deleted: 0, biggest: null, peakMembers: 12, peakActive: 10 },
    over: null, tick: 0,
  };
  for (const t of A.boxes) addBox(S, t);
  for (const tr of A.founders) addNotable(S, tr, { founder: true });
  S.turnFx = freshTurnFx();
  const ann = boxByType(S, 'announce');
  spawnThread(S, 'ann', ann.id, { admin: true, title: `Chào mừng các bạn đến với ${S.name}!`, ann: { key: 'welcome', until: 99 } });
  for (const b of S.boxes) if (b.type !== 'announce') { const t = spawnThread(S, 'normal', b.id); t.age = 1; t.last = 0.5; t.fresh = false; }
  // a few things to do on day one: a question, a good post by a founder, and the first spammer
  spawnThread(S, 'request', bestBoxFor(S, 'request').id);
  spawnThread(S, 'quality', bestBoxFor(S, 'quality').id, { byId: S.notables[1].id });
  spawnThread(S, 'spam', pick(S, forumBoxes(S)).id);
  S.history.push(snapshot(S));
  startTurn(S);
  return S;
}
const freshTurnFx = () => ({ vibe: 0, passion: 0, answered: 0, unanswered: 0 });
const snapshot = S => ({ turn: S.turn, members: S.members, active: S.active, core: S.core, vibe: Math.round(S.vibe), funds: S.funds, online: S.online, passion: Math.round(S.passion) });

function addBox(S, type) {
  const b = { id: S.nextBox++, type, name: ARCH[S.arch].names[type] || BOXES[type].name, desc: BOXES[type].desc };
  S.boxes.push(b);
  return b;
}
const boxOf = (S, id) => S.boxes.find(b => b.id === id);
const boxByType = (S, type) => S.boxes.find(b => b.type === type);
const forumBoxes = S => S.boxes.filter(b => b.type !== 'announce');
function threadOrder(a, b) { return (b.sticky - a.sticky) || (b.last - a.last) || (b.id - a.id); }
const boxThreads = (S, boxId) => Object.values(S.threads).filter(t => t.box === boxId).sort(threadOrder);
const stickyCount = S => Object.values(S.threads).filter(t => t.sticky && t.type !== 'ann').length;

function fillTitle(S, tpl, ctx = {}) {

/* ── month start ── */

function togglePolicy(S, id) {

const pluginPrice = (S, id) => Math.round(PLUGIN_BY[id].price * calcMods(S).pluginCost);

const hostingFee = (S, tier) => Math.round(HOSTING[tier].cost * calcMods(S).hostCost);

function toggleAds(S, kind) { S.ads[kind] = !S.ads[kind]; return ok(S.ads[kind] ? 'Đã bật quảng cáo.' : 'Đã tắt quảng cáo.'); }

function activityState(S, id, arg) {

  if (S.cd[id] && S.cd[id] > S.turn) return { A, cost, blocked: `Làm lại được từ ${monthLabel(S.cd[id]).toLowerCase()}` };
  if (A.minActive && S.active < A.minActive) return { A, cost, blocked: `Cần ít nhất ${A.minActive} thành viên tích cực` };
  if (id === 'openbox' && forumBoxes(S).length >= MAX_BOXES - 1) return { A, cost, blocked: 'Đủ box rồi' };
  if (id === 'openbox' && !openableBoxes(S).length) return { A, cost, blocked: 'Không còn loại box nào để mở' };
  if (S.funds < cost) return { A, cost, blocked: `Cần ${fmtMoney(cost)}` };

}
const openableBoxes = S => ARCH[S.arch].canOpen.filter(t => !boxByType(S, t));
function runActivity(S, id, arg) {
  const st = activityState(S, id, arg);

  const A = st.A, M = calcMods(S);
  if (id === 'seed') {

    S.fame += 5 * M.fameGain;

}
function addEffect(S, e) { S.effects = S.effects.filter(x => x.id !== e.id); S.effects.push({ ...e }); }

/* ── events ── */
function queueEvents(S) {
  const due = S.scheduled.filter(e => e.turn === S.turn);

  for (const e of due) pushEvent(S, e.id, e.ctx);
  for (const e of EVENTS) if (e.at && e.at(S)) pushEvent(S, e.id);
  let k = S.inbox.length >= 2 || S.turn === 1 ? 0 : chance(S, 0.8) ? 1 : 0;
  if (k && S.turn >= 5 && !S.inbox.length && chance(S, 0.22)) k = 2;
  for (let i = 0; i < k; i++) {
    const pool = EVENTS.filter(e => !e.at && !e.scheduled && (e.repeat || !S.flags.seen[e.id]) && (!e.cond || e.cond(S)) && !S.inbox.some(x => x.id === e.id));

function pushEvent(S, id, ctx = {}) {

  if (def.prep) { const c = def.prep(S, ctx); if (c === null) return; if (c) ctx = c; }
  S.flags.seen[id] = (S.flags.seen[id] || 0) + 1;

}
function eventView(S, ev) {

  const text = typeof def.text === 'function' ? def.text(S, ev.ctx) : def.text;
  const options = def.options(S, ev.ctx).map(o => {
    let blocked = '';
    if (o.req) { const r = o.req(S, ev.ctx); if (r !== true) blocked = r || 'Không đủ điều kiện'; }

function chooseEvent(S, uid, idx) {

  const def = EVENT_BY[ev.id];
  const opt = def.options(S, ev.ctx)[idx];
  const view = eventView(S, ev).options[idx];
  if (!opt || view.blocked) return no(view ? view.blocked : '?');
  if (opt.ap) S.ap -= opt.ap;
  if (opt.cost) S.funds -= opt.cost;

}
function applyFx(S, f) {
  if (!f) return;

  if (f.passion) S.passion = clamp(S.passion + f.passion, 0, 100);
  if (f.fame) S.fame = Math.max(0, S.fame + f.fame);
  if (f.ap) S.ap = Math.max(0, S.ap + f.ap);
  if (f.security) S.flags.sec = (S.flags.sec || 0) + f.security;

/* ── month end ── */
function endTurn(S) {
  if (S.over) return no('Ván đã kết thúc.');
  if (S.inbox.some(e => !e.done)) return no('Còn tin nhắn chưa trả lời.');
  const M = calcMods(S), season = seasonOf(S), fx = S.turnFx;
  const R = { turn: S.turn, label: monthLabel(S.turn), notes: [], legends: [], flames: [], ignited: [] };
  const before = { members: S.members, active: S.active, core: S.core, funds: S.funds, vibe: S.vibe, passion: S.passion, fame: S.fame };
  let views = 0, spam = 0, flames = 0, fameGain = 0, vibeT = fx.vibe;
  const fxVibe0 = fx.vibe;
  const restHours = S.ap;

  for (const t of Object.values(S.threads)) {
    if (t.type === 'ann') continue;
    const st = t.sticky ? 1.8 : 1, box = boxOf(S, t.box);
    let v = 0;
    if (t.locked) {
      v = 25;
    } else switch (t.type) {
      case 'normal': v = 40 * st; break;
      case 'chat': v = 60 * st; vibeT += box.type === 'chat' ? 0.5 : -1; break;
      case 'request': v = 30; break;
      case 'quality':
        v = 90 * st * M.qualityViews; vibeT += t.sticky ? 1.1 : 0.5;
        if (t.sticky) { t.legend += 1 + M.legendSpeed; fameGain += 1; }
        break;
      case 'hot':
        v = 160 * st;
        if (!t.sticky && chance(S, 0.12)) { t.type = 'drama'; t.heat = 1; t.ignited = true; R.ignited.push(t.title); }
        break;
      case 'news': v = t.sticky ? 360 : 120; if (t.sticky) fameGain += 2; break;
      case 'drama':
        v = 120 * t.heat * st;
        vibeT -= t.heat * 0.8 * (t.sticky ? 1.5 : 1);
        if (t.heat >= 3) {
          flames++; R.flames.push(t.title);
          if (chance(S, 0.45)) spawnThread(S, 'drama', t.box, { spill: true, a: t.by, bump: 0.95 });
        }
        t.heat = Math.min(4, t.heat + 1);

        break;

    if (t.type === 'drama' && (!S.stats.biggest || t.views > S.stats.biggest.views)) S.stats.biggest = { title: t.title, views: t.views, turn: S.turn, by: t.by };
  }
  // legends, fuses, ageing
  for (const t of Object.values(S.threads)) {
    if (t.type === 'quality' && t.sticky && t.legend >= 3) {
      S.legends.push({ title: t.title, by: t.by, turn: S.turn });
      R.legends.push(t.title);
      bumpLoyalty(S, t.byId, 20);
      delete S.threads[t.id];
      continue;
    }
    if (t.type === 'ann') continue;
    t.age++;
    if (t.type === 'request' && t.answered) { delete S.threads[t.id]; continue; }
    if (t.type === 'request' || t.type === 'news') { t.fuse--; if (t.fuse <= 0) { sinkThread(S, t, 'age'); continue; } }
    if (!t.sticky && (t.age > 4 || (t.locked && t.age > 2))) sinkThread(S, t, 'age');
  }
  vibeT += S.turnFx.vibe - fxVibe0;          // penalties from threads that sank this month
  S.flags.extraSpam = Math.floor(spam / 3);   // broken windows: spam attracts more spam

  // traffic
  const legendViews = S.legends.length * 120 * (S.flags.picsDead && !has(S, 'album') ? 0.75 : 1);
  let guests = (views + S.fame * 10 + legendViews + 80) * M.guest * season.guest * (1 - Math.min(0.4, spam * 0.03));
  if (S.turn >= 19) guests *= Math.pow(1 - 0.12 * M.phay, S.turn - 18);
  let online = (S.active * 0.11 + (S.members - S.active) * 0.008 + guests * 0.006) * season.act * M.online * (1 + rnd(S) * 0.25);
  const H = HOSTING[S.hosting], cap = Math.round(H.cap * M.cap);
  let pDown = H.down * M.down;
  if (online > cap) pDown = Math.max(pDown, clamp((online / cap - 1) * 1.2 + 0.2, 0, 0.95) * M.down);
  const crashed = chance(S, pDown);
  if (crashed) { guests *= 0.55; online = Math.min(online, cap); S.stats.crashes++; }
  else if (online > cap) online = cap * (1 + rnd(S) * 0.05);
  guests = Math.round(guests); online = Math.round(online);

  // people
  const phayJoin = S.turn >= 19 ? Math.max(0.4, 1 - 0.07 * (S.turn - 18) * M.phay) : 1;
  const signups = Math.round(guests * 0.033 * M.signup * (crashed ? 0.5 : 1) * phayJoin);
  const rate = clamp(0.18 + 0.06 * S.turnFx.answered + M.activation + (S.vibe - 50) / 300, 0.06, 0.7);
  const newActive = Math.round(signups * rate);
  const phay = S.turn >= 19 ? (0.04 + 0.015 * (S.turn - 19)) * M.phay : 0;
  const churnRate = Math.max(0.02, 0.075 + Math.max(0, 55 - S.vibe) / 250 + 0.025 * flames + (crashed ? 0.04 : 0) + M.churn + phay);
  const nonCore = S.active - S.core;
  const lostActive = Math.round(nonCore * churnRate);
  const lostCore = Math.round(S.core * churnRate * 0.3 * M.coreChurn);
  const promo = Math.round(nonCore * Math.max(0, 0.015 + Math.max(0, S.vibe - 55) / 1500 + 0.003 * S.legends.length + M.core));
  S.members += signups;
  S.active = Math.max(0, S.active + newActive - lostActive - lostCore);
  S.core = clamp(S.core + promo - lostCore, 0, S.active);
  S.signupsLast = signups; S.newActiveLast = newActive; S.guests = guests; S.online = online;

  // mood of the place
  const excess = Math.max(0, forumBoxes(S).length - (2 + Math.floor(S.active / 25)));
  vibeT += M.vibeTurn + (season.vibe || 0) - excess - (crashed ? 6 : 0) - flames;
  S.vibe = clamp(S.vibe + vibeT + (55 - S.vibe) * 0.12, 0, 100);

  // money
  const inc = {}, exp = {};
  if (S.ads.banner) inc.ads = Math.round(guests * 0.025 * M.ads);
  if (S.ads.popup) inc.popup = Math.round(guests * 0.06 * M.ads);
  inc.donate = Math.round(S.core * 1.2 * (S.vibe / 100) * M.donate * (season.donate || 1));
  inc.allowance = BGS[S.bg].allowance;
  if (S.policies.includes('vip')) inc.vip = Math.round(S.active * POLICY_BY.vip.vip);
  if (S.policies.includes('classified')) inc.fee = Math.round(S.active * POLICY_BY.classified.fee);
  if (boxByType(S, 'market')) inc.market = Math.round(S.active * 0.15);
  exp.hosting = Math.round(H.cost * M.hostCost);
  const sumv = o => Object.values(o).reduce((a, b) => a + b, 0);
  const net = sumv(inc) - sumv(exp);
  S.funds += net;
  S.debt = S.funds < 0 ? S.debt + 1 : 0;

  // the admin

  const mess = Object.values(S.threads).filter(t => t.type === 'spam' || (t.type === 'request' && !t.answered) || (t.type === 'drama' && !t.locked && t.heat >= 2)).length;
  const rest = Math.min(2, restHours);
  let dp = (S.turn <= 8 ? -2 : S.turn <= 16 ? -3 : -4.5) + M.passionTurn + S.turnFx.passion + rest - Math.min(4, mess * 0.5);
  if (growth >= 0.1) dp += 1; else if (S.active < before.active) dp -= 2;

  if (S.vibe >= 75) dp += 1;
  dp += R.legends.length * 3 - flames * 3 - (S.vibe < 40 ? 3 : 0) - (crashed ? 4 : 0) - (S.funds < 0 ? 8 : 0);
  R.passionParts = { rest, mess: Math.min(4, mess * 0.5) };
  S.passion = clamp(S.passion + dp, 0, 100);
  S.fame = Math.max(0, S.fame * 0.97 + fameGain * M.fameGain + R.legends.length * 6);

  // staff & regulars
  for (const n of modsOf(S)) {
    const backlog = boxThreads(S, n.box).filter(t => t.type === 'spam' || (t.type === 'drama' && !t.locked && t.heat >= 2) || (t.type === 'request' && !t.answered)).length;
    n.morale = clamp(n.morale - 2 - backlog * 3 - (MODTYPES[n.modType].drain || 0) + M.modMorale + (S.vibe >= 70 ? 2 : 0), 0, 100);
    if (n.morale <= 0 && !S.scheduled.some(e => e.id === 'mod_quit' && e.ctx.n === n.id)) schedule(S, 1, 'mod_quit', { n: n.id });
  }
  for (const n of liveNotables(S)) {
    n.posts += rint(S, 4, 30);
    if (S.vibe >= 62) n.loyalty = Math.min(100, n.loyalty + 1); else if (S.vibe < 40) n.loyalty = Math.max(0, n.loyalty - 2);
    if (n.trait === 'newbie' && S.turn - n.joined >= 5 && n.loyalty >= 55 && chance(S, 0.35)) {
      n.trait = chance(S, 0.5) ? 'veteran' : 'expert';
      R.notes.push(`${n.nick} đã lớn: từ newbie thành ${TRAITS[n.trait].name.toLowerCase()}.`);
    }
    if (n.loyalty < 15 && !S.scheduled.some(e => e.id === 'leaving' && e.ctx.n === n.id)) schedule(S, 1, 'leaving', { n: n.id });
  }
  S.totals.posts += Math.round(S.active * rint(S, 6, 12) + views / 40);
  S.stats.flame += flames;
  S.stats.peakMembers = Math.max(S.stats.peakMembers, S.members);
  S.stats.peakActive = Math.max(S.stats.peakActive, S.active);
  for (const e of S.effects) e.turns--;
  S.effects = S.effects.filter(e => e.turns > 0);

  // milestone at the end of acts I–III
  const mi = [6, 12, 18].indexOf(S.turn);
  if (mi >= 0) {
    const target = ARCH[S.arch].milestones[mi];
    R.milestone = { act: ACTS[mi].name, target, members: S.members, pass: S.members >= target };
    if (R.milestone.pass) { S.passion = clamp(S.passion + 8, 0, 100); S.fame += 8; schedule(S, 1, 'milestone', { act: mi }); }
    else S.passion = clamp(S.passion - 12, 0, 100);
  }

  Object.assign(R, {
    guests, online, cap, crashed, record, signups, newActive, left: lostActive + lostCore, promo, inc, exp, net, flamesN: flames, rest: restHours,
    d: { members: S.members - before.members, active: S.active - before.active, core: S.core - before.core, vibe: S.vibe - before.vibe, passion: S.passion - before.passion, funds: S.funds - before.funds, fame: S.fame - before.fame },
    answered: S.turnFx.answered, unanswered: S.turnFx.unanswered, log: S.log.slice(),
    events: S.inbox.filter(e => e.done).map(e => ({ id: e.id, label: e.label, out: e.out })),
  });
  S.report = R;
  S.history.push(snapshot(S));

  if (S.passion <= 0) S.over = { reason: 'passion', turn: S.turn };
  else if (S.debt >= 2) S.over = { reason: 'debt', turn: S.turn };
  else if (S.turn >= 4 && S.active < 4) S.over = { reason: 'empty', turn: S.turn };
  else if (S.turn >= TURNS) S.over = { reason: 'survived', turn: S.turn };
  if (S.over) { S.over.score = finalScore(S); S.over.rank = rankOf(S.over.score); return ok('over', { report: R }); }
  S.turn++;
  startTurn(S);
  return ok('next', { report: R });
}

function financeForecast(S) {
  const M = calcMods(S), season = seasonOf(S), inc = {}, exp = {};
  const g = S.guests;
  if (S.ads.banner) inc.ads = Math.round(g * 0.025 * M.ads);
  if (S.ads.popup) inc.popup = Math.round(g * 0.06 * M.ads);
  inc.donate = Math.round(S.core * 1.2 * (S.vibe / 100) * M.donate * (season.donate || 1));
  inc.allowance = BGS[S.bg].allowance;
  if (S.policies.includes('vip')) inc.vip = Math.round(S.active * POLICY_BY.vip.vip);
  if (S.policies.includes('classified')) inc.fee = Math.round(S.active * POLICY_BY.classified.fee);
  if (boxByType(S, 'market')) inc.market = Math.round(S.active * 0.15);
  exp.hosting = Math.round(HOSTING[S.hosting].cost * M.hostCost);
  const sum = o => Object.values(o).reduce((a, b) => a + b, 0);
  return { inc, exp, net: sum(inc) - sum(exp) };
}

function forecast(S) {

  if (S.arch === 'fan') for (const t of [8, 16]) if (t > S.turn && t - S.turn <= 2) out.push({ k: 'hype', when: `Còn ${t - S.turn} tháng`, text: `Tin đồn: ${BAND.name} sắp ra album mới` });

function finalScore(S) {
  const surv = S.over && S.over.reason === 'survived';
  return Math.round(S.stats.peakMembers + S.record.n * 6 + S.core * 5 + S.legends.length * 150 + S.fame * 4 + (surv ? 800 + S.active * 2 : S.turn * 20));
}
function rankOf(score) { let r = RANKS[0][1]; for (const [s, name] of RANKS) if (score >= s) r = name; return r; }
function checkAchievements(S, got) {
  const out = [], give = id => { if (!got[id]) { got[id] = true; out.push(id); } };
  if (S.record.n >= 100) give('rec100');
  if (S.record.n >= 500) give('rec500');
  if (S.legends.length >= 1) give('legend1');
  if (S.legends.length >= 5) give('legend5');
  if (S.members >= 1000) give('mem1000');
  if (S.members >= 3000) give('mem3000');
  if (S.funds >= 3000) give('rich');
  if (S.stats.flame >= 6) give('drama');
  if (S.over && S.over.reason === 'survived') {
    give('survive');
    if (S.stats.bans === 0) give('pacifist');
    if (S.stats.crashes === 0) give('stable');
  }
  return out;
}

    deco += `<g transform="translate(1060 70)" opacity=".3" fill="none" stroke="#fff" stroke-width="3"><circle r="46"/>${[0, 60, 120, 180, 240, 300].map(a => `<path d="M0 -46L22 -10" transform="rotate(${a})"/>`).join('')}<circle r="16"/></g>`;
    return { bg: 'linear-gradient(118deg,#0e3640 0%,#1c6670 46%,#b9874a 82%,#efb766 100%)', deco };
  }
  for (let i = 0; i < 30; i++) { const x = 380 + R() * 820, y = R() * 140, s = 2 + Math.floor(R() * 3) * 2; deco += `<rect x="${x}" y="${y}" width="${s}" height="${s}" fill="${R() < .5 ? '#ffd66b' : '#fff'}" opacity="${.25 + R() * .5}"/>`; }
  deco += `<g transform="translate(1050 18) rotate(35)" opacity=".4"><rect x="0" y="0" width="8" height="70" fill="#dfe6f3"/><rect x="-10" y="70" width="28" height="7" fill="#ffd66b"/><rect x="1" y="77" width="6" height="18" fill="#8a5a20"/></g>`;
  return { bg: 'linear-gradient(118deg,#1b0f30 0%,#4a1035 50%,#b8381f 85%,#f08a24 100%)', deco };
}

/* ── Sounds: tiny synthesized cues, all generated with WebAudio ── */
const SFX = {
  ctx: null, on: true,
  init() { if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; } try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); } catch (e) { } },
  tone(f, t0, dur, type = 'sine', vol = 0.12, slide = 0) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(t0, dur, vol = 0.1, hp = 900) {
    const c = this.ctx, n = Math.floor(c.sampleRate * dur), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(), t = c.currentTime + t0;
    f.type = 'highpass'; f.frequency.value = hp; g.gain.value = vol; s.buffer = b; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
  },
  play(name) {
    if (!this.on) return;
    this.init(); if (!this.ctx) return;
    switch (name) {
      case 'click': this.tone(1400, 0, 0.04, 'square', 0.03); break;
      case 'ok': this.tone(880, 0, 0.09, 'triangle', 0.1); this.tone(1320, 0.07, 0.12, 'triangle', 0.08); break;
      case 'bad': this.tone(220, 0, 0.16, 'square', 0.05, -80); break;
      case 'delete': this.noise(0, 0.16, 0.12, 1800); this.tone(500, 0, 0.12, 'triangle', 0.05, -300); break;
      case 'lock': this.tone(300, 0, 0.05, 'square', 0.06); this.tone(180, 0.05, 0.08, 'square', 0.06); break;
      case 'pin': this.tone(1046, 0, 0.08, 'sine', 0.1); this.tone(1568, 0.05, 0.14, 'sine', 0.08); break;
      case 'coin': [988, 1318].forEach((f, i) => this.tone(f, i * 0.07, 0.14, 'square', 0.05)); break;
      case 'msg': this.tone(1175, 0, 0.12, 'sine', 0.12); this.tone(1568, 0.12, 0.2, 'sine', 0.1); break;
      case 'buzz': for (let i = 0; i < 8; i++) this.tone(70 + (i % 2) * 18, i * 0.06, 0.07, 'sawtooth', 0.07); break;
      case 'month': this.noise(0, 0.32, 0.06, 2500); this.tone(523, 0.12, 0.16, 'triangle', 0.06); this.tone(784, 0.22, 0.24, 'triangle', 0.06); break;
      case 'record': [523, 659, 784, 1046, 1318].forEach((f, i) => this.tone(f, i * 0.09, 0.3, 'triangle', 0.1)); break;
      case 'party': [659, 784, 988, 784, 1175].forEach((f, i) => this.tone(f, i * 0.08, 0.18, 'square', 0.045)); break;
      case 'over': [392, 330, 262].forEach((f, i) => this.tone(f, i * 0.22, 0.4, 'triangle', 0.1)); break;
    }
  },
};

/* ── messenger ── */
function openIM(uid) {
  const p = pending();
  const ev = uid ? S.inbox.find(e => e.uid === uid) : p[0];
  if (!ev) return;
  UI.im = ev.uid;
  if (!UI.buzzed[ev.uid]) { UI.buzzed[ev.uid] = true; const def = EVENT_BY[ev.id]; UI.buzzNow = def.buzz ? ev.uid : null; SFX.play(def.buzz ? 'buzz' : 'msg'); }
  renderIM();
  const first = document.querySelector('#im .opt:not([disabled]), #im .btn');
  if (first) first.focus({ preventScroll: true });
}
function renderIM() {
  const layer = $('#im');
  const ev = S && UI.im ? S.inbox.find(e => e.uid === UI.im) : null;
  if (!ev) { layer.innerHTML = ''; return; }
  const v = eventView(S, ev), f = v.from, idx = S.inbox.indexOf(ev) + 1;
  const ava = f.sys ? avatarURL(0, f.sys) : avatarURL(f.seed);
  const more = pending().filter(e => e.uid !== ev.uid).length;
  layer.innerHTML = `<div class="im${UI.buzzNow === ev.uid ? ' buzz' : ''}${v.boss ? ' boss' : ''}" role="dialog" aria-label="Tin nhắn từ ${esc(f.nick)}">
    <div class="imbar">${I.smile}<span class="imt">${esc(f.nick)}: tin nhắn</span><span class="cnt">${idx}/${S.inbox.length}</span>${ev.done ? '<button class="x" data-a="imclose" aria-label="Đóng">×</button>' : ''}</div>
    <div class="who"><img class="ava" src="${ava}" alt=""><div><b>${esc(f.nick)}</b><small>${esc(f.role || '')}</small></div></div>
    <div class="log">
      ${v.buzz && !ev.done ? '<div class="buzzline">BUZZ!!!</div>' : ''}
      <p class="line"><span class="n">${esc(f.nick)}</span> <span class="t">(${nowTime()})</span>: ${esc(v.text)}</p>
      ${ev.done ? `<p class="line me"><span class="n">admin</span>: ${esc(ev.label || '')}</p>${ev.out ? `<p class="line sys">${esc(ev.out)}</p>` : ''}` : ''}
    </div>

/* ── month report & memoir ── */
function showModal(html) { $('#modal').innerHTML = `<div class="overlay">${html}</div>`; const b = document.querySelector('#modal .go'); if (b) b.focus({ preventScroll: true }); }
function closeModal() { $('#modal').innerHTML = ''; }
function sparkHTML() {
  const h = S.history.map(x => x.members), max = Math.max(...h, 10), w = 280, ht = 46;
  const pts = h.map((v, i) => `${(i / Math.max(1, h.length - 1)) * w},${ht - (v / max) * (ht - 4) - 2}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${ht}" preserveAspectRatio="none" class="spark" role="img" aria-label="Số thành viên qua các tháng"><polyline points="0,${ht} ${pts} ${w},${ht}" fill="rgba(61,111,208,.12)" stroke="none"/><polyline points="${pts}" fill="none" stroke="#3d6fd0" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}

  for (const t of R.legends) story.push(`<li class="legend">Thớt huyền thoại mới: <i>${esc(t)}</i></li>`);
  for (const t of R.ignited) story.push(`<li class="bad">Thớt hot biến thành drama: <i>${esc(t)}</i></li>`);
  for (const t of R.flames) story.push(`<li class="bad">Chiến tranh nổ ra: <i>${esc(t)}</i></li>`);

  if (R.crashed) story.push('<li class="bad">Server sập vì quá tải, cả 4rum hiện "Database error" suốt mấy ngày.</li>');
  if (R.unanswered) story.push(`<li class="bad">${R.unanswered} câu hỏi bị bỏ mặc, người hỏi đã bỏ đi.</li>`);

    ${R.milestone ? `<div class="msflash ${R.milestone.pass ? 'pass' : 'fail'}">${R.milestone.pass ? `Đạt mốc ${R.milestone.act}: ${fmtN(R.milestone.members)}/${fmtN(R.milestone.target)} thành viên. Tháng sau chọn phần thưởng!` : `Trượt mốc ${R.milestone.act}: mới ${fmtN(R.milestone.members)}/${fmtN(R.milestone.target)} thành viên. Nhiệt huyết −12.`}</div>` : ''}
    <div class="rgrid">
      <div><div class="thead">Người</div>

      </div>
      <div><div class="thead">Quỹ</div>
        ${Object.entries(R.inc).filter(([, v]) => v).map(([k, v]) => row(MONEY_LABEL[k], '+' + fmtMoney(v), 'rpos')).join('')}${Object.entries(R.exp).filter(([, v]) => v).map(([k, v]) => row(MONEY_LABEL[k], '−' + fmtMoney(v), 'rneg')).join('')}${row('Cộng', signed(R.net, fmtMoney), R.net < 0 ? 'rneg' : 'rpos')}
        <div class="thead">Tinh thần</div>

  </div>`;
}

    debt: `Tháng ${end}, quỹ âm hai tháng liền, nhà host khóa 4rum.`,
    empty: `Tháng ${end}, 4rum vắng tới mức không còn ai đăng bài.`,
    survived: `4rum sống sót qua kỷ nguyên Phây. Tháng 8/2009 vẫn còn ${fmtN(S.active)} người ghé mỗi ngày.`,
  }[o.reason];
  const mods = S.notables.filter(n => n.role === 'mod');
  const star = S.notables.slice().sort((a, b) => b.posts - a.posts)[0];
  const fact = (k, v) => `<div class="rr"><span>${k}</span><b>${v}</b></div>`;
  const ach = UI.gotAch.filter(id => id !== '_game').map(id => ACHIEVEMENTS.find(a => a.id === id)).filter(Boolean);
  return `<div class="modal memoir" role="dialog" aria-labelledby="mt">
    <div class="memhead" style="background:${art.bg}"><div class="gloss"></div><div class="logo" id="mt">${esc(S.name)}</div><div class="span">9/2007 – ${end}</div></div>
    <p class="reason">${reason}</p>
    <div class="score"><span>${esc(o.rank)}</span><b>${fmtN(o.score)}</b><small>điểm huyền thoại</small></div>
    <div class="facts">
      ${fact('Kỷ lục online', `${fmtN(S.record.n)} người${S.record.turn > 1 ? ', tháng ' + shortMonth(S.record.turn) : ''}`)}
      ${fact('Thành viên nhiều nhất', fmtN(S.stats.peakMembers))}
      ${fact('Lão làng còn lại', fmtN(S.core))}
      ${fact('Thớt huyền thoại', S.legends.length ? S.legends.map(l => `<i>${esc(l.title)}</i>`).join('<br>') : 'Chưa có')}
      ${fact('Drama lớn nhất', S.stats.biggest ? `<i>${esc(S.stats.biggest.title)}</i> (${fmtN(S.stats.biggest.views)} lượt xem)` : 'Bình yên lạ thường')}
      ${fact('Ban quản trị', mods.length ? mods.map(m => esc(m.nick)).join(', ') : 'Admin một mình')}
      ${star ? fact('Thành viên đáng nhớ', `${esc(star.nick)}, ${fmtN(star.posts)} bài`) : ''}
      ${fact('Server sập', `${S.stats.crashes} lần`)}${fact('Số lần ban', `${S.stats.bans}`)}
    </div>
    ${ach.length ? `<div class="thead">Thành tựu mới</div><div class="achs pad">${ach.map(a => `<span class="achb on"><b>${esc(a.name)}</b><small>${esc(a.desc)}</small></span>`).join('')}</div>` : ''}
    ${UI.gotAch.includes('_game') ? '<div class="msflash pass">Mở khóa loại 4rum mới: Game online!</div>' : ''}
    <div class="mfoot"><button class="go" data-a="newrun">Mở 4rum mới</button></div>
  </div>`;
}

/* ── title screen ── */
function renderTitle() {
  document.body.className = 'at-title';
  const P = UI.pick, run = META.run;
  const archCard = id => {
    const A = ARCH[id], locked = A.locked && !META.unlocked[id], art = bannerArt(id);
    return `<button class="arch ${P.arch === id ? 'on' : ''}" data-a="pickarch" data-x="${id}" ${locked ? 'disabled' : ''} aria-pressed="${P.arch === id}">
      <span class="sw" style="background:${art.bg}"><span class="gloss"></span><span class="mini">${esc(A.defaultName)}</span></span>
      <b>${esc(A.name)}</b><span class="pitch">${esc(A.pitch)}</span>
      <span class="perks">${A.perks.map(p => `<span>${esc(p)}</span>`).join('')}</span>
      ${locked ? `<span class="locked">${I.lock} ${esc(A.unlockText)}</span>` : ''}</button>`;
  };
  const bgCard = id => { const B = BGS[id]; return `<button class="bgc ${P.bg === id ? 'on' : ''}" data-a="pickbg" data-x="${id}" aria-pressed="${P.bg === id}"><b>${esc(B.name)}</b><span>${esc(B.desc)}</span><small>${B.ap} giờ online mỗi tháng, quỹ ban đầu ${fmtMoney(B.funds)}, tiền túi ${fmtMoney(B.allowance)}/tháng</small></button>`; };
  const hall = META.hall.slice(0, 8);
  $('#app').innerHTML = `${topbarHTML(true)}
    <header class="hero"><div class="logo huge">Ông Trùm 4rum</div>
      <p>Năm 2007, bạn vừa cài xong vBulletin lên một cái host miễn phí. Biến nó thành 4rum đông vui nhất mạng, trước khi Phây kéo mọi người đi.</p></header>
    ${run ? `<section class="page resume"><div class="tcat"><h3>Đang làm admin dở</h3></div><div class="rs"><div><b>${esc(run.name)}</b><span>${esc(ARCH[run.arch].name)}, ${monthLabel(run.turn).toLowerCase()}, ${fmtN(run.members)} thành viên</span></div>
      <button class="go small" data-a="resume">Vào lại 4rum</button><button class="btn ${UI.confirm === 'abandon' ? 'danger' : ''}" data-a="abandon">${UI.confirm === 'abandon' ? 'Chắc chưa? Bỏ ván này' : 'Bỏ ván này'}</button></div></section>` : ''}
    <section class="page reg"><div class="tcat"><h3>Đăng ký 4rum mới</h3></div>
      <div class="form">
        <div class="frow"><label for="fname">Tên 4rum</label><input id="fname" maxlength="28" value="${esc(P.name || ARCH[P.arch].defaultName)}" autocomplete="off"></div>
        <div class="frow"><span class="lab">Loại 4rum</span><div class="archs">${ARCH_ORDER.map(archCard).join('')}</div></div>
        <div class="frow"><span class="lab">Bạn là</span><div class="bgs">${BG_ORDER.map(bgCard).join('')}</div></div>
        <div class="frow end"><span class="muted">Một ván dài 24 tháng, từ 9/2007 tới 8/2009. Tiến trình tự lưu trên máy.</span><button class="go" data-a="start">Mở 4rum</button></div>
      </div></section>
    <section class="page hall"><div class="tcat"><h3>Đại sảnh danh vọng</h3></div>
      ${hall.length ? `<div class="hall-t"><div class="thead hgrid"><span>4rum</span><span>Kết cục</span><span>Kỷ lục online</span><span>Thành viên</span><span>Điểm</span></div>${hall.map(h => `<div class="hgrid hr"><span><b>${esc(h.name)}</b><small>${esc(ARCH[h.arch].name)}</small></span><span>${esc(h.rank)}<small>${h.reason === 'survived' ? 'Sống qua thời Phây' : 'Đóng cửa ' + esc(h.end)}</small></span><span>${fmtN(h.record)}</span><span>${fmtN(h.members)}</span><span><b>${fmtN(h.score)}</b></span></div>`).join('')}</div>` : '<p class="muted pad">Chưa có 4rum nào. Mở 4rum đầu tiên nào!</p>'}
      <div class="thead">Thành tựu (${Object.keys(META.ach).length}/${ACHIEVEMENTS.length})</div>
      <div class="achs pad">${ACHIEVEMENTS.map(a => `<span class="achb ${META.ach[a.id] ? 'on' : ''}"><b>${esc(a.name)}</b><small>${esc(a.desc)}</small></span>`).join('')}</div>
    </section>
    <footer class="credit">Demo game của Sonic Hub Pages. Mọi nhân vật, nhóm nhạc và 4rum trong game đều là hư cấu.</footer>`;
}

/* ── feedback ── */
let toastTimer = 0;
function toast(msg, good = true) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'show ' + (good ? 'good' : 'bad');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = ''; }, 2600);
}
function monthFx(label) {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const fx = $('#fx');
  fx.innerHTML = `<div class="monthfx"><span>${esc(label)}</span></div>`;
  setTimeout(() => { fx.innerHTML = ''; }, 1500);
}
const FX_SOUND = { delete: 'delete', ban: 'delete', lock: 'lock', pin: 'pin', fire: 'pin', reply: 'ok', calm: 'ok', move: 'ok', buy: 'coin', coin: 'coin', party: 'party', promote: 'ok', rule: 'ok', host: 'ok', build: 'ok', promo: 'ok', heart: 'ok' };

/* ── Controller: clicks, months, saving ── */
const SAVE_KEY = 'ong-trum-4rum.v1';
function freshMeta() { return { v: 1, sound: true, tips: false, hall: [], ach: {}, unlocked: {}, played: {}, run: null }; }
function loadMeta() { try { const m = JSON.parse(localStorage.getItem(SAVE_KEY)); if (m && m.v === 1) return Object.assign(freshMeta(), m); } catch (e) { } return freshMeta(); }
function persist() { META.run = S && !S.over ? S : null; try { localStorage.setItem(SAVE_KEY, JSON.stringify(META)); } catch (e) { } }

function onClick(e) {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  SFX.init();
  const a = el.dataset.a, x = el.dataset.x, id = el.dataset.id ? +el.dataset.id : null;
  let res = null;
  switch (a) {
    case 'tab': UI.tab = x; UI.open = null; UI.confirm = null; UI.pickBox = null; render(); window.scrollTo({ top: 0 }); return;
    case 'open': UI.open = UI.open === id ? null : id; UI.confirm = null; SFX.play('click'); render(); return;
    case 'tact': res = doThreadAction(S, id, x); break;
    case 'policy': res = togglePolicy(S, x); break;
    case 'buy': res = buyPlugin(S, x); break;
    case 'reroll': res = rerollShop(S); break;
    case 'host': res = setHosting(S, x); break;
    case 'ads': res = toggleAds(S, x); break;
    case 'pickbox': UI.pickBox = UI.pickBox === x ? null : x; UI.confirm = null; render(); return;
    case 'activity': { const arg = el.dataset.arg; res = runActivity(S, x, arg == null ? undefined : /^\d+$/.test(arg) ? +arg : arg); UI.pickBox = null; break; }
    case 'promote': res = promote(S, id, +el.dataset.box); UI.pickBox = null; break;
    case 'reassign': res = reassign(S, id, +el.dataset.box); UI.pickBox = null; break;
    case 'demote': res = demote(S, id); break;
    case 'thank': res = thankMod(S, id); break;
    case 'ban': if (UI.confirm !== 'ban' + id) { UI.confirm = 'ban' + id; render(); return; } UI.confirm = null; res = banNotable(S, notableById(S, id)); break;
    case 'im': openIM(); return;
    case 'choose': {
      res = chooseEvent(S, +el.dataset.uid, +el.dataset.i);
      if (!res.ok) { toast(res.msg, false); SFX.play('bad'); return; }
      SFX.play('ok'); persist(); render();
      const b = document.querySelector('#im .btn'); if (b) b.focus({ preventScroll: true });
      return;
    }
    case 'imnext': { const p = pending(); if (p.length) openIM(p[0].uid); else { UI.im = null; renderIM(); } return; }
    case 'imclose': UI.im = null; renderIM(); return;
    case 'end': endMonth(); return;
    case 'next': closeReport(); return;
    case 'tipsok': META.tips = true; persist(); render(); return;
    case 'tips': META.tips = false; UI.tab = 'forum'; render(); window.scrollTo({ top: 0 }); return;
    case 'sound': META.sound = !META.sound; SFX.on = META.sound; persist(); render(); return;
    case 'home': persist(); S = null; UI.im = null; closeModal(); render(); window.scrollTo({ top: 0 }); return;
    case 'pickarch': { const old = ARCH[UI.pick.arch].defaultName, cur = ($('#fname') || {}).value || ''; UI.pick.name = !cur.trim() || cur === old ? '' : cur; UI.pick.arch = x; SFX.play('click'); render(); return; }
    case 'pickbg': { const cur = ($('#fname') || {}).value || ''; if (cur && cur !== ARCH[UI.pick.arch].defaultName) UI.pick.name = cur; UI.pick.bg = x; SFX.play('click'); render(); return; }
    case 'start': startRun(); return;
    case 'resume': S = META.run; UI.tab = 'forum'; UI.open = null; UI.im = null; UI.buzzed = {}; UI.gotAch = []; render(); window.scrollTo({ top: 0 }); if (pending().length) setTimeout(() => openIM(), 400); return;
    case 'abandon': if (UI.confirm !== 'abandon') { UI.confirm = 'abandon'; render(); return; } UI.confirm = null; META.run = null; try { localStorage.setItem(SAVE_KEY, JSON.stringify(META)); } catch (e2) { } render(); return;
    case 'newrun': closeModal(); S = null; UI.gotAch = []; UI.im = null; persist(); render(); window.scrollTo({ top: 0 }); return;
  }
  if (res) {
    if (res.ok) { SFX.play(FX_SOUND[res.fx] || 'click'); persist(); }
    else SFX.play('bad');
    toast(res.msg, res.ok);
    render();
  }
}
function onKey(e) {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-a]')) { e.preventDefault(); e.target.click(); return; }
  if (e.key === 'Escape' && S) {
    const ev = UI.im && S.inbox.find(x => x.uid === UI.im);
    if (ev && ev.done) { UI.im = null; renderIM(); }
    else if (UI.open) { UI.open = null; render(); }
  }
}
function startRun() {
  const input = $('#fname');
  const name = ((input && input.value) || '').trim() || ARCH[UI.pick.arch].defaultName;
  const seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
  S = newGame({ seed, arch: UI.pick.arch, bg: UI.pick.bg, name });
  UI.tab = 'forum'; UI.open = null; UI.im = null; UI.buzzed = {}; UI.fresh = true; UI.gotAch = []; UI.pick.name = '';
  persist(); render(); window.scrollTo({ top: 0 });
  SFX.play('month'); monthFx(monthLabel(S.turn));
  if (pending().length) setTimeout(() => openIM(), 1100);
}
function endMonth() {
  const p = pending();
  if (p.length) { openIM(p[0].uid); return; }
  const r = endTurn(S);
  if (!r.ok) { toast(r.msg, false); return; }
  UI.open = null; UI.confirm = null; UI.pickBox = null; UI.im = null;
  const got = checkAchievements(S, META.ach);
  if (S.stats.peakMembers >= 1500 && !META.unlocked.game) { META.unlocked.game = true; got.push('_game'); }
  UI.gotAch = UI.gotAch.concat(got);
  if (S.over) finishRun();
  persist();
  SFX.play(S.over ? 'over' : r.report.record ? 'record' : 'month');
  renderIM();
  showModal(reportHTML(r.report));
  if (!S.over) got.forEach((id, i) => { const A = ACHIEVEMENTS.find(a => a.id === id); if (A) setTimeout(() => toast('Thành tựu mới: ' + A.name), 500 + i * 2700); if (id === '_game') setTimeout(() => toast('Mở khóa loại 4rum mới: Game online!'), 500 + i * 2700); });
}
function finishRun() {
  META.played[S.arch] = true;
  if (['fan', 'teen', 'photo'].every(a => META.played[a]) && !META.ach.allthree) { META.ach.allthree = true; UI.gotAch.push('allthree'); }
  META.hall.push({ name: S.name, arch: S.arch, bg: S.bg, score: S.over.score, rank: S.over.rank, members: S.stats.peakMembers, record: S.record.n, legends: S.legends.length, reason: S.over.reason, end: shortMonth(S.over.turn), at: Date.now() });
  META.hall.sort((a, b) => b.score - a.score);
  META.hall = META.hall.slice(0, 12);
}
function closeReport() {
  closeModal();
  if (S.over) { render(); showModal(memoirHTML()); return; }
  UI.fresh = true;
  render(); window.scrollTo({ top: 0 });
  monthFx(monthLabel(S.turn));
  if (pending().length) setTimeout(() => openIM(), window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 50 : 1000);
}
function boot() {
  META = loadMeta(); SFX.on = META.sound !== false;
  if (!/game-forum-tycoon\.html$/.test(location.pathname) || /claude/.test(location.hostname)) document.documentElement.classList.add('no-home');
  document.addEventListener('click', onClick);
  document.addEventListener('keydown', onKey);
  window.matchMedia('(max-width: 860px)').addEventListener('change', () => { if (S) render(); });
  render();
}

boot();
</script>
</body>
</html>
