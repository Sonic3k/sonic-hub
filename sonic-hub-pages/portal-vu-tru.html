<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sonic Hub — Vũ trụ ký ức</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ═══════════════════════════════════════════════════════════════════════════
     PORTAL · VŨ TRỤ KÝ ỨC
     Drifting through a dreamlike cosmos made of your own memories.
     Layers, back to front:
       deep-space gradient → canvas starfield (3 depths, twinkle, drift, shooting
       stars, a warp streak when you travel between years) → nebula clouds tinted
       per year → your photos floating as soft-edged memory fragments → a giant
       planet's glowing limb → the portal itself → a faint light that follows
       the cursor. Everything back there moves with the mouse at its own depth.
     ═══════════════════════════════════════════════════════════════════════════ */
  .pt {
    --bar-h: 76px; --dock-w: 108px; --years-w: 148px; --pad-t: 34px; --pad-x: 44px;
    --text: #ECEBFF; --muted: #A4A1D0; --faint: #6F6BA0; --gold: #FFE1A0; --gold-2: #FFC977; --lilac: #B9A6FF; --cyan: #8BE7F0; --rose: #FF9AD5;
    --glass: linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
    --glass-shadow: 0 24px 60px rgba(3,2,18,.5), inset 0 1px 0 rgba(255,255,255,.07);
    --ease: cubic-bezier(.2,.7,.2,1);
    font-family: Quicksand, system-ui, sans-serif; font-weight: 500; color: var(--text);
  }
  body.pt { background: radial-gradient(120% 80% at 70% 0%, #1B1446 0%, #0B0A26 45%, #04040F 100%) fixed; overflow: hidden; }
  ::selection { background: rgba(185,166,255,.35); color: #fff; }
  .pt :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 10px; }

  /* ── the cosmos ─────────────────────────────────────────────────────────── */
  .cosmos { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  #stars { position: absolute; inset: 0; }
  .nebula { position: absolute; inset: 0; filter: hue-rotate(var(--hue, 0deg)); transition: filter 2s ease; }
  .neb { position: absolute; border-radius: 50%; filter: blur(70px); mix-blend-mode: screen; will-change: transform;
    transform: translate(calc(var(--mx, 0) * var(--d) * -46px), calc(var(--my, 0) * var(--d) * -32px)); transition: transform 1.8s var(--ease); }
  .neb i { position: absolute; inset: 0; border-radius: inherit; background: var(--c); animation: breathe var(--t, 34s) ease-in-out infinite alternate; }
  @keyframes breathe { 0% { transform: scale(1) translate(0, 0); opacity: .9; } 100% { transform: scale(1.18) translate(4%, -3%); opacity: .6; } }
  .neb.a { width: 64vw; height: 52vw; left: -16vw; top: -18vw; --d: .6; --c: radial-gradient(circle at 45% 45%, rgba(110,80,255,.62), rgba(110,80,255,0) 66%); }
  .neb.b { width: 50vw; height: 44vw; right: -14vw; top: 6vh; --d: .9; --t: 41s; --c: radial-gradient(circle at 50% 50%, rgba(226,92,192,.36), rgba(226,92,192,0) 64%); }
  .neb.c { width: 54vw; height: 40vw; left: 8vw; bottom: -16vw; --d: .4; --t: 47s; --c: radial-gradient(circle at 50% 50%, rgba(63,190,224,.30), rgba(63,190,224,0) 64%); }
  .neb.d { width: 30vw; height: 24vw; left: 42vw; top: 30vh; --d: 1.1; --t: 29s; --c: radial-gradient(circle at 50% 50%, rgba(255,214,150,.13), rgba(255,214,150,0) 66%); }

  .frags { position: absolute; inset: 0; }
  .frag { position: absolute; margin: 0; aspect-ratio: 4/3; opacity: 0; will-change: transform, opacity;
    -webkit-mask-image: radial-gradient(closest-side, #000 30%, rgba(0,0,0,.55) 62%, transparent 100%); mask-image: radial-gradient(closest-side, #000 30%, rgba(0,0,0,.55) 62%, transparent 100%);
    filter: blur(calc((1.1 - var(--d)) * 2.6px)) saturate(.85) brightness(.82);
    transform: translate(calc(var(--mx, 0) * var(--d) * -60px), calc(var(--my, 0) * var(--d) * -40px)) rotate(var(--r));
    transition: transform 2s var(--ease), opacity 1.6s ease; animation: float var(--dur) ease-in-out var(--delay) infinite alternate; }
  .frag img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .frag.in { opacity: calc(.16 + var(--d) * .22); }
  .frag.out { opacity: 0 !important; transition-duration: 1.2s; }
  @keyframes float { to { translate: 24px -30px; } }

  .limb { position: absolute; left: 50%; bottom: -139vw; width: 152vw; height: 152vw; margin-left: -76vw; border-radius: 50%;
    background: radial-gradient(circle at 50% 0%, #2A2272 0%, #120E36 14%, #07061A 40%);
    box-shadow: 0 -1px 0 rgba(214,204,255,.5), 0 -10px 40px rgba(140,118,255,.40), 0 -50px 160px rgba(110,80,255,.26);
    transform: translate(calc(var(--mx, 0) * -10px), calc(var(--my, 0) * -6px)); transition: transform 2s var(--ease); }
  .limb::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 50% 0%, rgba(139,231,240,.10), transparent 22%); }
  .glow { position: fixed; z-index: 2; left: 0; top: 0; width: 560px; height: 560px; margin: -280px 0 0 -280px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(185,166,255,.085), rgba(185,166,255,0) 62%); mix-blend-mode: screen; transform: translate(var(--gx, -999px), var(--gy, -999px)); transition: transform .25s linear; }

  /* ── glass recipe: frosted dark with a starlit hairline edge ──────────────── */
  .pt .moment, .pt .note, .pt .folder, .pt .empty, .pt .game, .pt .door, .pt .palette-box, .pt .bar .search, .pt .bar .random, .pt .btn, .pt .reader-btn {
    position: relative; background: var(--glass); backdrop-filter: blur(16px) saturate(1.25); -webkit-backdrop-filter: blur(16px) saturate(1.25); box-shadow: var(--glass-shadow); border: 0; }
  .pt .moment::before, .pt .note::before, .pt .folder::before, .pt .empty::before, .pt .game::before, .pt .door::before, .pt .palette-box::before, .pt .bar .search::before, .pt .bar .random::before, .pt .btn::before, .pt .reader-btn::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
    background: linear-gradient(140deg, rgba(255,255,255,.34), rgba(185,166,255,.12) 32%, rgba(255,255,255,.03) 58%, rgba(139,231,240,.20));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }

  /* ── top bar ───────────────────────────────────────────────────────────── */
  .pt .bar { background: linear-gradient(rgba(4,4,15,.55), rgba(4,4,15,0)); }
  .pt .bar .brand { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 21px; letter-spacing: .01em; }
  .pt .bar .brand::before { content: ""; width: 18px; height: 18px; background: radial-gradient(circle, #fff 0 18%, var(--gold) 40%, transparent 72%);
    clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%); filter: drop-shadow(0 0 8px var(--gold)); animation: pulse 4s ease-in-out infinite; }
  @keyframes pulse { 50% { filter: drop-shadow(0 0 14px var(--gold)); transform: scale(1.12); } }
  .pt .bar .search, .pt .bar .random { display: flex; align-items: center; gap: 10px; border-radius: 999px; padding: 11px 20px; color: var(--muted); font-weight: 600; font-size: 14px; transition: color .3s, box-shadow .3s; }
  .pt .bar .search { min-width: 340px; } .pt .bar .random { color: var(--gold); }
  .pt .bar .search:hover, .pt .bar .random:hover { color: var(--text); box-shadow: var(--glass-shadow), 0 0 26px rgba(185,166,255,.18); }

  /* ── dock: planets ─────────────────────────────────────────────────────── */
  .pt .dock { gap: 16px; padding-top: 22px; }
  .pt .dock button { gap: 11px; }
  .pt .dock button { position: relative; }
  .pt .dock .ico { position: relative; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; color: rgba(255,255,255,.92);
    background: radial-gradient(circle at 30% 26%, var(--p1) 0%, var(--p2) 42%, var(--p3) 74%, #05040F 100%);
    box-shadow: inset -7px -9px 14px rgba(0,0,0,.6), inset 3px 3px 8px rgba(255,255,255,.14), 0 0 14px var(--atm); transition: transform .5s var(--ease), box-shadow .5s var(--ease); }
  .pt .dock .ico svg { width: 19px; height: 19px; stroke-width: 2; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); position: relative; z-index: 1; }
  .pt .dock button:nth-child(1) { --p1: #FFF8E8; --p2: #D9CFB8; --p3: #6E6656; --atm: rgba(255,240,210,.25); }
  .pt .dock button:nth-child(2) { --p1: #FFD9A6; --p2: #E08A52; --p3: #6B3218; --atm: rgba(255,170,100,.25); }
  .pt .dock button:nth-child(3) { --p1: #B8F4EC; --p2: #3BA3A6; --p3: #123E48; --atm: rgba(120,230,220,.22); }
  .pt .dock button:nth-child(4) { --p1: #FFD0E8; --p2: #D9579B; --p3: #5A1640; --atm: rgba(255,150,200,.25); }
  .pt .dock button:nth-child(5) { --p1: #D2F5B8; --p2: #4E9E4B; --p3: #173B1C; --atm: rgba(160,240,140,.2); }
  .pt .dock button:nth-child(6) { --p1: #E2D6FF; --p2: #7155D9; --p3: #22164F; --atm: rgba(190,170,255,.25); }
  .pt .dock button:nth-child(5) .ico::before, .pt .dock button:nth-child(6) .ico::before { content: ""; position: absolute; width: 74px; height: 16px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.4); border-top-color: rgba(255,255,255,.12); transform: rotate(-16deg); }
  .pt .dock .ico::after { content: ""; position: absolute; width: 62px; height: 62px; border-radius: 50%; border: 1px solid rgba(255,225,160,.0); transition: border-color .5s; animation: orbit 14s linear infinite; }
  .pt .dock .lbl { font-size: 12.5px; font-weight: 600; color: var(--faint); letter-spacing: .02em; transition: color .4s; }
  .pt .dock button:hover .ico { transform: scale(1.08); }
  .pt .dock button:hover .lbl { color: var(--muted); }
  .pt .dock button[aria-current="true"] .ico { transform: scale(1.14); box-shadow: inset -7px -9px 14px rgba(0,0,0,.55), inset 3px 3px 8px rgba(255,255,255,.16), 0 0 24px var(--atm), 0 0 60px var(--atm); }
  .pt .dock button[aria-current="true"] .ico::after { border-color: rgba(255,225,160,.35); border-top-color: rgba(255,225,160,.85); }
  .pt .dock button[aria-current="true"] .lbl { color: var(--gold); }
  @keyframes orbit { to { transform: rotate(360deg); } }

  /* ── years: a constellation ────────────────────────────────────────────── */
  .pt .years-in { padding: 26px 0 34px; justify-content: space-between; }
  .pt .years .links { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .pt .years button { display: flex; align-items: center; gap: 14px; padding: 4px 0 4px var(--x, 30px); color: var(--faint); font-size: 13px; font-weight: 600; letter-spacing: .03em; font-variant-numeric: tabular-nums; transition: color .4s; }
  .pt .star { position: relative; flex: 0 0 auto; width: calc(4px + var(--w) * 8px); height: calc(4px + var(--w) * 8px); border-radius: 50%; background: #fff;
    box-shadow: 0 0 calc(4px + var(--w) * 12px) rgba(220,214,255,.85); animation: twinkle calc(3s + var(--i) * .37s) ease-in-out infinite; transition: transform .5s var(--ease); }
  @keyframes twinkle { 50% { opacity: .45; transform: scale(.8); } }
  .pt .years button:hover { color: var(--text); } .pt .years button:hover .star { transform: scale(1.5); animation-play-state: paused; }
  .pt .years button[aria-pressed="true"] { color: var(--gold); font-size: 18px; font-weight: 700; }
  .pt .years button[aria-pressed="true"] .star { width: 14px; height: 14px; animation: none; background: radial-gradient(circle, #fff 0 30%, var(--gold) 70%); box-shadow: 0 0 14px var(--gold), 0 0 36px rgba(255,225,160,.65); }
  .pt .years button[aria-pressed="true"] .star::before, .pt .years button[aria-pressed="true"] .star::after { content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .pt .years button[aria-pressed="true"] .star::before { width: 56px; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,225,160,.95), transparent); box-shadow: 0 0 0 0 transparent; }
  .pt .years button[aria-pressed="true"] .star::after { width: 1px; height: 56px; background: linear-gradient(transparent, rgba(255,225,160,.95), transparent); }
  .pt .years button[aria-pressed="true"] .halo { position: absolute; left: calc(var(--x, 30px) + 7px); top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; border: 1px solid rgba(255,225,160,.5); animation: halo 2.8s ease-out infinite; }
  @keyframes halo { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }

  /* ── stage & type ──────────────────────────────────────────────────────── */
  .pt .stage { z-index: 1; scrollbar-width: thin; scrollbar-color: rgba(185,166,255,.22) transparent; }
  .pt .room > section { animation: arrive .9s var(--ease) both; }
  @keyframes arrive { from { opacity: 0; transform: translateY(14px) scale(.992); filter: blur(8px); } }
  .pt .moments > *, .pt .doors > *, .pt .folders > *, .pt .people > *, .pt .notes > *, .pt .shelf > * { animation: arrive .9s var(--ease) both; }
  .pt .moments > :nth-child(2), .pt .doors > :nth-child(2), .pt .folders > :nth-child(2), .pt .people > :nth-child(2), .pt .shelf > :nth-child(2) { animation-delay: .08s; }
  .pt .moments > :nth-child(3), .pt .doors > :nth-child(3), .pt .folders > :nth-child(3), .pt .people > :nth-child(3), .pt .shelf > :nth-child(3) { animation-delay: .16s; }
  .pt .doors > :nth-child(4), .pt .folders > :nth-child(4), .pt .people > :nth-child(4), .pt .shelf > :nth-child(4) { animation-delay: .24s; }
  .pt .doors > :nth-child(5), .pt .folders > :nth-child(5), .pt .people > :nth-child(5), .pt .shelf > :nth-child(5) { animation-delay: .32s; }
  .pt .people > :nth-child(6) { animation-delay: .4s; }
  .pt .eyebrow { margin: 0 0 14px; font-size: 12.5px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--lilac); }
  .pt h1 { margin: 0 0 14px; font-weight: 300; font-size: clamp(42px, 5.6vw, 78px); line-height: 1.04; letter-spacing: -0.02em; text-wrap: balance;
    background: linear-gradient(180deg, #FFFFFF 10%, #E1DBFF 55%, #A99BFF 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 22px rgba(185,166,255,.22)); }
  .pt .yr { font-weight: 600; background: linear-gradient(180deg, #FFF6DD, var(--gold) 55%, var(--gold-2)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 18px rgba(255,225,160,.45)); }
  .pt .lede { margin: 0 0 28px; font-size: 18px; font-weight: 500; color: var(--muted); max-width: 52ch; }
  .pt h2.sec { margin: 46px 0 16px; font-size: 13px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--faint); display: flex; align-items: center; gap: 14px; }
  .pt h2.sec::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(185,166,255,.3), transparent); }

  /* ── home ──────────────────────────────────────────────────────────────── */
  .pt .home .hero { position: relative; padding: 34px 0 10px; isolation: isolate; }
  .pt .home .hero::before { content: ""; position: absolute; z-index: -1; right: -6%; top: -30px; width: 58%; height: 420px; background: var(--img) center/cover;
    filter: blur(36px) saturate(1.4); opacity: .32; -webkit-mask-image: radial-gradient(closest-side, #000 30%, transparent); mask-image: radial-gradient(closest-side, #000 30%, transparent); animation: memorybreathe 12s ease-in-out infinite alternate; }
  @keyframes memorybreathe { to { opacity: .2; transform: scale(1.06); } }
  .pt .actions { display: flex; gap: 14px; flex-wrap: wrap; }
  .pt .btn { border-radius: 999px; padding: 13px 26px; font-weight: 600; font-size: 15px; color: var(--text); transition: transform .4s var(--ease), box-shadow .4s var(--ease); }
  .pt .btn:hover { transform: translateY(-2px); box-shadow: var(--glass-shadow), 0 0 30px rgba(185,166,255,.22); }
  .pt .btn.primary { background: linear-gradient(180deg, #FFF0CC, var(--gold) 50%, var(--gold-2)); color: #2A1E4E; box-shadow: 0 10px 30px rgba(255,201,119,.25), 0 0 40px rgba(255,225,160,.25), inset 0 1px 0 rgba(255,255,255,.7); }
  .pt .btn.primary::before { display: none; }
  .pt .btn.primary:hover { box-shadow: 0 14px 36px rgba(255,201,119,.32), 0 0 60px rgba(255,225,160,.4), inset 0 1px 0 rgba(255,255,255,.7); }
  .pt .moments { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 20px; margin-top: 46px; }
  .pt .moment { padding: 20px; border-radius: 24px; transition: transform .5s var(--ease), box-shadow .5s var(--ease); }
  .pt .moment:hover { transform: translateY(-3px); box-shadow: var(--glass-shadow), 0 0 40px rgba(185,166,255,.14); }
  .pt .moment h3 { margin: 0 0 14px; font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--faint); }
  .pt .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .pt .thumbs img { width: 100%; aspect-ratio: 4/5; object-fit: cover; border-radius: 16px; box-shadow: 0 12px 30px rgba(0,0,0,.45); transition: transform .6s var(--ease), box-shadow .6s var(--ease), filter .6s; filter: saturate(.92); }
  .pt .thumbs img:hover { transform: translateY(-4px) scale(1.03); filter: saturate(1.08) brightness(1.05); box-shadow: 0 16px 40px rgba(0,0,0,.5), 0 0 34px rgba(255,225,160,.28); }
  .pt blockquote { margin: 0; padding-left: 16px; border-left: 2px solid rgba(185,166,255,.45); font-size: 18px; line-height: 1.6; color: #F2F0FF; }
  .pt cite { display: block; margin-top: 12px; font-style: normal; font-size: 13px; color: var(--muted); }
  .pt .m-note .t { margin: 0 0 8px; font-size: 19px; font-weight: 700; } .pt .m-note .d { margin: 0; color: var(--muted); font-size: 14.5px; line-height: 1.65; }
  .pt .more { margin-top: 16px; border: 0; background: none; padding: 0; color: var(--gold); font-weight: 700; font-size: 14px; letter-spacing: .01em; transition: letter-spacing .4s var(--ease); }
  .pt .more:hover { letter-spacing: .05em; }
  .pt .doors { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
  .pt .door { border-radius: 24px; padding: 20px; min-height: 160px; display: flex; flex-direction: column; justify-content: flex-end; text-align: left; overflow: hidden; transition: transform .5s var(--ease), box-shadow .5s var(--ease); }
  .pt .door:hover { transform: translateY(-4px); box-shadow: var(--glass-shadow), 0 0 44px color-mix(in srgb, var(--atm) 70%, transparent); }
  .pt .door-art { position: absolute; top: 18px; right: 18px; width: 42px; height: 42px; border-radius: 50%; background: radial-gradient(circle at 30% 26%, var(--p1), var(--p2) 45%, var(--p3) 78%, #05040F); box-shadow: inset -6px -7px 12px rgba(0,0,0,.55), 0 0 22px var(--atm); transition: transform .8s var(--ease); }
  .pt .door:hover .door-art { transform: scale(1.12) rotate(-12deg); }
  .pt .d-photos { --p1: #FFD9A6; --p2: #E08A52; --p3: #6B3218; --atm: rgba(255,170,100,.3); } .pt .d-journal { --p1: #B8F4EC; --p2: #3BA3A6; --p3: #123E48; --atm: rgba(120,230,220,.28); }
  .pt .d-angels { --p1: #FFD0E8; --p2: #D9579B; --p3: #5A1640; --atm: rgba(255,150,200,.3); } .pt .d-fantasy { --p1: #D2F5B8; --p2: #4E9E4B; --p3: #173B1C; --atm: rgba(160,240,140,.24); }
  .pt .d-games { --p1: #E2D6FF; --p2: #7155D9; --p3: #22164F; --atm: rgba(190,170,255,.3); }
  .pt .door b { font-size: 21px; font-weight: 700; } .pt .door span { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .pt .door.off { opacity: .5; } .pt .door.off:hover { opacity: .75; }

  /* ── photos ────────────────────────────────────────────────────────────── */
  .pt .head { padding-top: 6px; }
  .pt .folders { display: flex; gap: 16px; overflow-x: auto; padding: 6px 4px 18px; scrollbar-width: none; }
  .pt .folder { flex: 0 0 200px; border-radius: 22px; padding: 10px; text-align: left; transition: transform .5s var(--ease), box-shadow .5s var(--ease); }
  .pt .folder:hover { transform: translateY(-4px); box-shadow: var(--glass-shadow), 0 0 36px rgba(185,166,255,.16); }
  .pt .folder-art { display: block; border-radius: 15px; overflow: hidden; margin-bottom: 10px; }
  .pt .folder-art img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; transition: transform .8s var(--ease); }
  .pt .folder:hover .folder-art img { transform: scale(1.06); }
  .pt .folder b { display: block; font-size: 16px; font-weight: 700; padding: 0 4px; } .pt .folder span { font-size: 13px; color: var(--muted); padding: 0 4px; }
  .pt .jg-item.cosmo { border-radius: 16px; background: rgba(255,255,255,.04); box-shadow: 0 12px 32px rgba(0,0,0,.45); transition: transform .6s var(--ease), box-shadow .6s var(--ease); }
  .pt .jg-item.cosmo img { transition: transform .9s var(--ease), filter .6s; filter: saturate(.93); }
  .pt .jg-item.cosmo::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 40px rgba(10,8,34,.35), inset 0 0 0 1px rgba(255,255,255,.06); pointer-events: none; }
  .pt .jg-item.cosmo:hover { transform: translateY(-3px); box-shadow: 0 18px 44px rgba(0,0,0,.5), 0 0 40px rgba(255,225,160,.22); z-index: 2; }
  .pt .jg-item.cosmo:hover img { transform: scale(1.04); filter: saturate(1.06) brightness(1.04); }

  /* ── journal ───────────────────────────────────────────────────────────── */
  .pt .notes { columns: 2; column-gap: 20px; } .pt .notes.others { opacity: .72; }
  .pt .note { break-inside: avoid; margin-bottom: 20px; padding: 24px; border-radius: 24px; display: inline-block; width: 100%; }
  .pt .note-meta { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
  .pt .note-year { color: var(--gold); display: inline-flex; align-items: center; gap: 8px; }
  .pt .note-year::before { content: ""; width: 8px; height: 8px; background: var(--gold); clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%); filter: drop-shadow(0 0 4px var(--gold)); }
  .pt .note h3 { margin: 12px 0 8px; font-size: 23px; font-weight: 700; line-height: 1.25; }
  .pt .note p { margin: 0; font-size: 16px; line-height: 1.75; color: #D8D4F3; }
  .pt .chips { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .pt .chip { padding: 5px 12px; border-radius: 999px; background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .pt .chip.problem { background: rgba(255,225,160,.12); box-shadow: inset 0 0 0 1px rgba(255,225,160,.3); color: var(--gold); }

  /* ── angels ────────────────────────────────────────────────────────────── */
  .pt .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 30px 20px; padding-top: 6px; }
  .pt .person { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .pt .person-art { position: relative; width: 132px; height: 132px; border-radius: 50%; padding: 3px; margin-bottom: 8px;
    background: conic-gradient(from 200deg, var(--gold), var(--lilac), var(--cyan), var(--rose), var(--gold)); box-shadow: 0 0 34px rgba(185,166,255,.35); transition: box-shadow .6s var(--ease), transform .6s var(--ease); }
  .pt .person-art::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 1px dashed rgba(255,225,160,.28); animation: orbit 30s linear infinite; }
  .pt .person-art img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; box-shadow: 0 0 0 3px #0D0B2A; }
  .pt .person b { font-size: 17px; font-weight: 700; } .pt .person span { font-size: 12.5px; color: var(--muted); }
  .pt .person:hover .person-art { transform: scale(1.05); box-shadow: 0 0 54px rgba(255,225,160,.45); }
  .pt .person.dim { opacity: .4; } .pt .person.dim .person-art::after { display: none; } .pt .person.dim:hover { opacity: .8; }
  .pt .readers { display: flex; gap: 12px; flex-wrap: wrap; }
  .pt .reader-btn { display: flex; align-items: center; gap: 10px; padding: 12px 22px; border-radius: 999px; font-weight: 600; color: var(--text); transition: transform .4s var(--ease), box-shadow .4s var(--ease); }
  .pt .reader-btn:hover { transform: translateY(-2px); box-shadow: var(--glass-shadow), 0 0 26px color-mix(in srgb, var(--tone) 55%, transparent); }
  .pt .reader-btn i { width: 9px; height: 9px; border-radius: 50%; background: var(--tone); box-shadow: 0 0 12px var(--tone), 0 0 2px #fff; }

  /* ── fantasy & games ───────────────────────────────────────────────────── */
  .pt .empty { display: grid; grid-template-columns: 1fr 1.15fr; gap: 30px; align-items: center; padding: 34px; border-radius: 28px; }
  .pt .empty-art { position: relative; width: min(100%, 300px); aspect-ratio: 1; margin: 0 auto; border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #D2F5B8, #4E9E4B 46%, #173B1C 80%, #05040F); box-shadow: inset -30px -34px 60px rgba(0,0,0,.6), 0 0 70px rgba(160,240,140,.22); }
  .pt .empty-art::after { content: ""; position: absolute; left: -26%; right: -26%; top: 41%; height: 20%; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); border-top-color: rgba(255,255,255,.1); transform: rotate(-14deg); }
  .pt .empty-txt h3 { margin: 0 0 10px; font-size: 30px; font-weight: 300; } .pt .empty-txt p { margin: 0; color: var(--muted); line-height: 1.75; }
  .pt .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 18px; }
  .pt .game { text-align: center; padding: 24px 14px 20px; border-radius: 24px; transition: transform .5s var(--ease); }
  .pt .game:hover { transform: translateY(-4px); }
  .pt .game-art { display: block; width: 84px; height: 84px; margin: 0 auto 16px; border-radius: 50%;
    background: radial-gradient(circle at 30% 26%, hsl(calc(var(--i) * 64 + 200) 90% 86%), hsl(calc(var(--i) * 64 + 220) 55% 45%) 50%, hsl(calc(var(--i) * 64 + 230) 60% 14%) 85%);
    box-shadow: inset -10px -12px 18px rgba(0,0,0,.55), 0 0 30px hsl(calc(var(--i) * 64 + 220) 80% 60% / .3); }
  .pt .game b { display: block; font-size: 16px; font-weight: 700; } .pt .game span { font-size: 12.5px; color: var(--muted); }

  /* ── search & reader ───────────────────────────────────────────────────── */
  .pt .palette { background: rgba(3,2,14,.55); backdrop-filter: blur(8px); }
  .pt .palette-box { border-radius: 26px; overflow: hidden; background: linear-gradient(180deg, rgba(36,28,84,.92), rgba(16,12,44,.94)); box-shadow: 0 40px 120px rgba(0,0,0,.6), 0 0 90px rgba(185,166,255,.18); }
  .pt .palette input { padding: 20px 24px; font-size: 19px; font-weight: 500; background: transparent; color: var(--text); border-bottom: 1px solid rgba(255,255,255,.07); }
  .pt .palette input::placeholder { color: var(--faint); }
  .pt .palette input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  .pt .palette ul { padding: 10px; } .pt .palette li { padding: 12px 14px; border-radius: 14px; font-weight: 600; transition: background .25s; }
  .pt .palette li small { color: var(--faint); font-weight: 500; } .pt .palette li.sel, .pt .palette li:hover { background: rgba(185,166,255,.12); }
  .pt .palette li.sel small { color: var(--muted); }
  .pt .reader { background: radial-gradient(circle, rgba(10,6,40,.55), rgba(2,2,10,.85)); backdrop-filter: blur(6px); }
  .wormhole { position: relative; width: min(480px, 88vw); aspect-ratio: 1; display: grid; place-items: center; }
  .wormhole i { position: absolute; inset: 0; border-radius: 50%; }
  .wormhole i:nth-child(1) { background: conic-gradient(from 0deg, transparent, rgba(185,166,255,.65), transparent 30%, rgba(139,231,240,.55), transparent 60%, rgba(255,225,160,.6), transparent); filter: blur(10px); animation: orbit 14s linear infinite; }
  .wormhole i:nth-child(2) { inset: 7%; background: conic-gradient(from 90deg, transparent, rgba(255,154,213,.5), transparent 40%, rgba(185,166,255,.5), transparent 75%); filter: blur(6px); animation: orbit 9s linear infinite reverse; }
  .wormhole i:nth-child(3) { inset: 13%; background: radial-gradient(circle, #0A0824 55%, #1A1450 100%); box-shadow: inset 0 0 60px rgba(0,0,0,.9), 0 0 50px rgba(185,166,255,.4); }
  .wormhole .in { position: relative; text-align: center; padding: 0 22%; }
  .wormhole .in b { display: block; font-size: 26px; font-weight: 600; margin-bottom: 10px; text-shadow: 0 0 22px var(--tone); }
  .wormhole .in p { margin: 0; color: var(--muted); line-height: 1.65; font-size: 15px; }

  /* ── mobile ────────────────────────────────────────────────────────────── */
  @media (max-width: 860px) {
    .pt { --years-w-m: 62px; --dock-h-m: 80px; --bar-h-m: 62px; }
    .glow { display: none; }
    .pt .bar .search { min-width: 0; padding: 11px; } .pt .bar .random { padding: 11px; } .pt .bar .brand { font-size: 19px; }
    .pt .dock { background: linear-gradient(rgba(8,6,28,.55), rgba(8,6,28,.92)); backdrop-filter: blur(16px); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); }
    .pt .dock .ico { width: 36px; height: 36px; } .pt .dock .ico svg { width: 15px; height: 15px; } .pt .dock .ico::after { width: 46px; height: 46px; } .pt .dock button { gap: 7px; }
    .pt .dock button:nth-child(5) .ico::before, .pt .dock button:nth-child(6) .ico::before { width: 54px; height: 12px; } .pt .dock .lbl { font-size: 9.5px; white-space: nowrap; letter-spacing: 0; }
    .pt .years button { gap: 6px; padding-left: calc(var(--x, 30px) * .2 + 4px); font-size: 10px; } .pt .years button[aria-pressed="true"] { font-size: 11.5px; }
    .pt .years button[aria-pressed="true"] .star::before { width: 34px; } .pt .years button[aria-pressed="true"] .star::after { height: 34px; }
    .pt .years button[aria-pressed="true"] .halo { left: calc(var(--x, 30px) * .2 + 11px); }
    .pt .home .hero::before { width: 90%; right: -20%; height: 300px; }
    .pt h1 { font-size: 42px; } .pt .lede { font-size: 16px; }
    .pt .moments, .pt .empty { grid-template-columns: 1fr; } .pt .doors { grid-template-columns: 1fr 1fr; } .pt .notes { columns: 1; }
    .pt .people { grid-template-columns: repeat(2, 1fr); } .pt .person-art { width: 112px; height: 112px; }
    .limb { bottom: -170vw; width: 190vw; height: 190vw; margin-left: -95vw; }
  }
  @media (prefers-reduced-motion: reduce) {
    .neb i, .frag, .pt .star, .pt .dock .ico::after, .pt .person-art::after, .wormhole i, .pt .bar .brand::before, .pt .home .hero::before, .pt .years button[aria-pressed="true"] .halo { animation: none !important; }
    .pt .room > section, .pt .room > section * { animation: none !important; }
  }
</style>
</head>
<body>
<div class="cosmos" aria-hidden="true">
  <canvas id="stars"></canvas>
  <div class="nebula"><div class="neb a"><i></i></div><div class="neb b"><i></i></div><div class="neb c"><i></i></div><div class="neb d"><i></i></div></div>
  <div class="frags" id="frags"></div>
  <div class="limb"></div>
</div>
<div class="glow" aria-hidden="true"></div>
<div id="app"></div>
<script src="assets/photos.js"></script>
<script src="assets/justified.js"></script>
<script src="assets/data.js"></script>
<script src="assets/portal-engine.js"></script>
<script>
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const narrow = () => innerWidth < 860;

  // ── Starfield: three depths, twinkle, slow drift, shooting stars, warp ──
  const Sky = (() => {
    const cv = document.getElementById('stars'), ctx = cv.getContext('2d');
    const COL = { white: '255,255,255', gold: '255,225,160', cyan: '170,236,255', rose: '255,190,230' };
    let W = 0, H = 0, stars = [], mx = 0, my = 0, tmx = 0, tmy = 0, warp0 = 0, warp1 = 0, shoot = null, nextShoot = 2500, live = true;
    function build() {
      const dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
      cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px'; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      let seed = 1990; const r = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
      stars = Array.from({ length: narrow() ? 170 : 380 }, () => { const z = r() ** 1.6;
        const tint = r(); return { x: r() * W, y: r() * H, z, s: .35 + z * 1.45, a: .22 + z * .78, tw: .4 + r() * 2.4, ph: r() * 6.283, c: tint < .07 ? 'gold' : tint < .13 ? 'cyan' : tint < .16 ? 'rose' : 'white' }; });
    }
    function draw(t) {
      mx += (tmx - mx) * .035; my += (tmy - my) * .035;
      ctx.clearRect(0, 0, W, H);
      const warping = t < warp1, k = warping ? Math.sin(Math.min(1, (t - warp0) / (warp1 - warp0)) * Math.PI) : 0, cx = W * .52, cy = H * .48;
      for (const s of stars) {
        if (!reduce) { s.y -= .015 + s.z * .045; if (s.y < -4) { s.y = H + 4; s.x = Math.random() * W; } }
        const px = s.x - mx * s.z * 22, py = s.y - my * s.z * 14;
        const a = reduce ? s.a : s.a * (.62 + .38 * Math.sin(t / 1000 * s.tw + s.ph));
        if (k > .02) {
          const dx = px - cx, dy = py - cy, d = Math.hypot(dx, dy) || 1, len = k * (6 + s.z * 52) * (.4 + d / (W * .5));
          ctx.strokeStyle = `rgba(${COL[s.c]},${a * (.75 + k * .25)})`; ctx.lineWidth = s.s;
          ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + dx / d * len, py + dy / d * len); ctx.stroke();
        } else {
          ctx.fillStyle = `rgba(${COL[s.c]},${a})`; ctx.beginPath(); ctx.arc(px, py, s.s, 0, 6.283); ctx.fill();
          if (s.z > .82) { ctx.fillStyle = `rgba(${COL[s.c]},${a * .1})`; ctx.beginPath(); ctx.arc(px, py, s.s * 4.5, 0, 6.283); ctx.fill(); }
        }
      }
      if (!reduce) {
        if (!shoot && t > nextShoot) { shoot = { x: W * (.35 + Math.random() * .6), y: H * Math.random() * .4, vx: -(7 + Math.random() * 5), vy: 2.2 + Math.random() * 2, life: 0 }; nextShoot = t + 6500 + Math.random() * 9000; }
        if (shoot) {
          shoot.life++; shoot.x += shoot.vx; shoot.y += shoot.vy; const fade = Math.max(0, 1 - shoot.life / 65);
          const g = ctx.createLinearGradient(shoot.x, shoot.y, shoot.x - shoot.vx * 16, shoot.y - shoot.vy * 16);
          g.addColorStop(0, `rgba(255,255,255,${.95 * fade})`); g.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.strokeStyle = g; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(shoot.x, shoot.y); ctx.lineTo(shoot.x - shoot.vx * 16, shoot.y - shoot.vy * 16); ctx.stroke();
          if (shoot.life > 65) shoot = null;
        }
      }
    }
    function loop(t) { if (live) draw(t); if (!reduce) requestAnimationFrame(loop); }
    return {
      start() { build(); addEventListener('resize', build); document.addEventListener('visibilitychange', () => { live = !document.hidden; }); if (reduce) draw(0); else requestAnimationFrame(loop); },
      mouse(x, y) { tmx = x; tmy = y; },
      warp() { if (reduce) return; const t = performance.now(); warp0 = t; warp1 = t + 950; },
    };
  })();

  // ── Your photos, drifting in the dark as memory fragments ──
  const SLOTS = [[3, 14, 190], [18, 62, 150], [66, 4, 180], [74, 40, 150], [56, 70, 210], [32, 82, 130], [44, 22, 120], [8, 38, 160], [80, 72, 130]];
  function setFragments(year) {
    const D = window.SH_DATA, box = document.getElementById('frags'), n = narrow() ? 4 : 9;
    const near = D.photosOf(D.nearestYear(year)), pool = near.concat(D.photos.filter(p => !near.includes(p))).slice(0, n);
    [...box.children].forEach(el => { el.classList.add('out'); setTimeout(() => el.remove(), 1300); });
    pool.forEach((p, i) => {
      const [x, y, w] = SLOTS[i], f = document.createElement('figure'); f.className = 'frag';
      f.style.cssText = `left:${x}%;top:${y}%;width:${narrow() ? w * .7 : w}px;--d:${(.25 + ((i * 37) % 7) / 9).toFixed(2)};--dur:${38 + i * 6}s;--delay:${-i * 4.5}s;--r:${(i % 2 ? 1 : -1) * (2 + i % 4)}deg`;
      f.innerHTML = `<img src="${p.src}" alt="">`; box.appendChild(f);
      setTimeout(() => f.classList.add('in'), 120 + i * 140);
    });
  }

  // ── Depth: everything behind the glass leans with the cursor ──
  if (!reduce) addEventListener('pointermove', (e) => {
    if (narrow()) return;
    const x = e.clientX / innerWidth * 2 - 1, y = e.clientY / innerHeight * 2 - 1, r = document.documentElement.style;
    r.setProperty('--mx', x.toFixed(3)); r.setProperty('--my', y.toFixed(3));
    r.setProperty('--gx', e.clientX + 'px'); r.setProperty('--gy', e.clientY + 'px');
    Sky.mouse(x, y);
  }, { passive: true });

  const ZIG = [24, 52, 34, 62, 40, 22, 56, 30, 66, 44, 26, 58, 36, 64, 28, 50, 34, 60, 42];
  Portal({
    brand: 'sonic hub',
    justify: { rowHeight: 236, gap: 12, cls: 'cosmo' },
    lede: (y) => { const ago = new Date().getFullYear() - y; return ago > 0 ? `Trôi về đúng ngày này, ${ago} năm trước.` : 'Đêm nay.'; },
    yearItem: (y, m) => `<span class="star"></span><span class="halo"></span><span class="full">${y}</span><span class="short">${m.short}</span>`,
    device: (name, tone) => `<div class="wormhole" style="--tone:${tone}"><i></i><i></i><i></i><div class="in"><b>${name}</b><p>Một phòng đọc riêng, phục dựng đúng thời đó.<br>Sẽ mở ở đây.</p></div></div>`,
    decorate(app) {
      Sky.start();
      const inner = app.querySelector('.years-in'), btns = [...inner.querySelectorAll('button')];
      btns.forEach((b, i) => b.style.setProperty('--x', ZIG[i % ZIG.length] + 'px'));
      const NS = 'http://www.w3.org/2000/svg', svg = document.createElementNS(NS, 'svg'); svg.setAttribute('class', 'links');
      svg.innerHTML = `<defs><linearGradient id="cl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B9A6FF" stop-opacity=".55"/><stop offset=".5" stop-color="#8BE7F0" stop-opacity=".35"/><stop offset="1" stop-color="#FFE1A0" stop-opacity=".5"/></linearGradient>
        <filter id="cg" x="-50%" y="-5%" width="200%" height="110%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
        <polyline fill="none" stroke="url(#cl)" stroke-width="1" filter="url(#cg)" stroke-linejoin="round"/>`;
      inner.prepend(svg);
      const line = svg.querySelector('polyline');
      this._draw = () => {
        const r0 = inner.getBoundingClientRect(); svg.setAttribute('width', r0.width); svg.setAttribute('height', inner.scrollHeight);
        line.setAttribute('points', btns.map(b => { const r = b.querySelector('.star').getBoundingClientRect(); return `${(r.left - r0.left + r.width / 2).toFixed(1)},${(r.top - r0.top + inner.scrollTop + r.height / 2).toFixed(1)}`; }).join(' '));
      };
      addEventListener('resize', () => this._draw()); document.fonts && document.fonts.ready.then(() => this._draw());
    },
    onRender(state) {
      document.documentElement.style.setProperty('--hue', ((state.year - 2017) * 4) + 'deg');
      if (this._year !== state.year) { if (this._year !== undefined) Sky.warp(); setFragments(state.year); this._year = state.year; }
      this._draw && requestAnimationFrame(() => requestAnimationFrame(this._draw));
    },
  });
</script>
</body>
