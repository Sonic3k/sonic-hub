<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Medieval Mayhem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700;800&family=Alegreya:wght@700;800&display=swap" rel="stylesheet">

<body>
<div id="app">
  <section id="screen-menu" class="screen"></section>
  <section id="screen-select" class="screen hidden"></section>
  <section id="screen-match" class="screen hidden">
    <header id="topbar"></header>
    <div id="table">
      <div id="opps"></div>
      <aside id="events"></aside>
      <div id="stage"><div class="rose"></div><div id="stage-card"></div><div id="stage-caption"></div></div>
      <aside id="market"></aside>
      <div id="me"></div>
      <div id="handzone"><div id="prompt"></div><div id="hand"></div></div>
    </div>
    <aside id="chronicle" class="drawer" aria-label="Chronicle"></aside>
  </section>
  <svg id="fx-arrows" aria-hidden="true"></svg>
  <div id="fx-layer" aria-hidden="true"></div>
  <div id="sheet" class="sheet-wrap hidden"></div>
  <div id="tip" class="tip hidden" role="tooltip"></div>
  <div id="coach" class="coach hidden"></div>
  <div id="banner" aria-live="polite"></div>
</div>

/*__JS__*/
