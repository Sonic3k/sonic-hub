<script>
'use strict';
/* ── Lên Đời ──
   Demo game #3 for Sonic Hub Pages: a turn-based duel of medieval civilizations (400–1500) on a small map.
   Both sides give orders in secret, then the orders are revealed and resolved at the same time.
   The engine keeps the whole match in one plain object S (seeded RNG, no DOM), so sim.js can pit AIs against each other. */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
function rnd(S) {
  let t = (S.rs = (S.rs + 0x6D2B79F5) >>> 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const pick = (S, arr) => arr[Math.floor(rnd(S) * arr.length)];
function wpick(S, entries) {
  let tot = 0; for (const e of entries) tot += Math.max(0, e[1]);
  if (tot <= 0) return entries[0][0];
  let r = rnd(S) * tot;
  for (const e of entries) { r -= Math.max(0, e[1]); if (r <= 0) return e[0]; }
  return entries[entries.length - 1][0];
}
function shuffled(S, arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd(S) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ── Engine: orders are planned in secret by both sides, then resolved together ── */
const ok = (msg, x) => ({ ok: true, msg: msg || '', ...x });
const no = msg => ({ ok: false, msg });
const total = st => { let n = 0; for (const t in st) n += st[t] > 0 ? st[t] : 0; return n; };
const clean = st => { for (const t in st) if (!(st[t] > 0)) delete st[t]; return st; };
const addTo = (st, u) => { for (const t in u) if (u[t] > 0) st[t] = (st[t] || 0) + u[t]; return st; };
const emptyOrders = () => ({ train: {}, builds: [], research: null, researchCost: null, moves: [], scouts: [] });
const seasonOf = t => SEASONS[(t - 1) % 4];
const yearOf = t => Math.floor((t - 1) / 4) + 1;
const turnLabel = t => `Năm ${yearOf(t)}, ${seasonOf(t).toLowerCase()}`;
function canAfford(P, c) { for (const r in c) if ((P.res[r] || 0) < c[r]) return false; return true; }
function pay(P, c) { for (const r in c) P.res[r] -= c[r]; }
function refund(P, c) { for (const r in c) P.res[r] += c[r]; }
const costText = c => RES.filter(r => c[r]).map(r => `${c[r]} ${RES_NAME[r].toLowerCase()}`).join(', ');

function newSide(civ, side) {
  return {
    civ, side, res: { food: 200, wood: 175, gold: 80 }, age: 1, cards: [], techs: [],
    bld: { barracks: 0, range: 0, stable: 0, workshop: 0, walls: 0 }, castles: {}, towers: {}, towns: {},
    jobs: {}, idle: 0, goldLeft: {}, army: {}, orders: emptyOrders(), pendingCard: null,
    capHP: CAP_HP, relic: 0, wonder: null, intel: {}, capIntel: null, vis: {}, ai: null,
    stats: { kills: 0, lost: 0, villsKilled: 0, villsLost: 0, battlesWon: 0, battlesLost: 0 },
  };
}
function newGame(o) {
  const S = { v: 1, seed: o.seed >>> 0, rs: o.seed >>> 0, turn: 1, owner: {}, sides: [newSide(o.civ0, 0), newSide(o.civ1, 1)], diff: o.diff || 1, report: null, winner: null, over: null, history: [] };
  for (const r of REGION_IDS) S.owner[r] = REGIONS[r].side == null ? null : REGIONS[r].side;
  for (const i of [0, 1]) {
    const P = S.sides[i], c = capOf(i);
    P.jobs[c] = 4; P.jobs[i === 0 ? 'w0' : 'w1'] = 2; P.goldLeft[c + 'g'] = JOBS[c + 'g'].reserve;
    if (o['ai' + i]) P.ai = { strat: o['ai' + i] === true ? null : o['ai' + i] };
  }
  for (const i of [0, 1]) updateVision(S, i, []);
  return S;
}

/* ── modifiers ── */
function modsOf(S, i) {
  const P = S.sides[i];
  const M = { gather: { food: 0, wood: 0, gold: 0 }, str: 0, cavStr: 0, uuStr: 0, cheap: {}, costMul: {}, fort: 0, fortDef: 0, homeDef: 0, defPen: 0, attrition: 0, evac: 0, plunderBase: 0, plunder: 0, scouts: 1, sharp: 0, cheapRes: 0, cheapWonder: 0, fastWonder: 0, cheapCastle: 0, prod: 0, trebuchet: 0, soldierFarm: 0, militia: 0, relicX: 0, retreat: 0, cavMove: 0 };
  const add = e => {
    if (!e) return;
    for (const k in e) {
      if (k === 'gather') for (const r in e.gather) M.gather[r] += e.gather[r];
      else if (k === 'cheap') for (const u in e.cheap) M.cheap[u] = (M.cheap[u] || 0) + e.cheap[u];
      else if (k === 'costMul') for (const u in e.costMul) M.costMul[u] = (M.costMul[u] || 1) * e.costMul[u];
      else M[k] = (M[k] || 0) + e[k];
    }
  };
  add(CIVS[P.civ].mods);
  for (const id of P.techs) add(TECHS[id].eff);
  for (const id of P.cards) add(CARDS[id].eff);

    const c = this.ctx, n = Math.floor(c.sampleRate * dur), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);

      case 'quill': this.noise(0, 0.09, 0.05, 3500); break;
      case 'coin': [1318, 1760].forEach((f, i) => this.tone(f, i * 0.06, 0.12, 'triangle', 0.06)); break;
      case 'bad': this.tone(196, 0, 0.18, 'sawtooth', 0.04, -40); break;
      case 'drum': [0, 0.18, 0.36, 0.48].forEach(t => { this.tone(70, t, 0.22, 'sine', 0.35, -30); this.noise(t, 0.08, 0.08, 400, 'lowpass'); }); break;
      case 'horn': this.tone(196, 0, 0.9, 'sawtooth', 0.05); this.tone(294, 0.05, 0.85, 'sawtooth', 0.035); this.tone(392, 0.5, 0.6, 'triangle', 0.04); break;
      case 'clash': for (let i = 0; i < 4; i++) { this.noise(i * 0.09, 0.12, 0.12, 3000); this.tone(1200 + i * 230, i * 0.09, 0.15, 'square', 0.02); } break;

      case 'win': [392, 523, 659, 784, 1046].forEach((f, i) => this.tone(f, i * 0.14, 0.6, 'triangle', 0.09)); break;
      case 'lose': [392, 349, 311, 262].forEach((f, i) => this.tone(f, i * 0.28, 0.6, 'triangle', 0.09)); break;

};

function incomeOf(i) {

  for (const j in P.jobs) { const J = JOBS[j]; let v = P.jobs[j] * GATHER[J.res] * (1 + M.gather[J.res]); if (J.reserve != null) v = Math.min(v, P.goldLeft[j] || 0); g[J.res] += v; }
  if (M.soldierFarm) for (const r of homeOf(i)) g.food += total(P.army[r] || {}) * M.soldierFarm;
  if (S.owner.m === i && total(P.army.m || {})) g.gold += 12;
  for (const r of RES) g[r] = Math.round(g[r]);

}

/* ── the map ── */
function banner(x, y, color, text, cls = '') {
  return `<g class="banner ${cls}" transform="translate(${x} ${y})"><path d="M0 2V-36" stroke="#2b1a0d" stroke-width="2.4"/><circle cy="-38" r="2.4" fill="#c9a24a"/><path d="M1 -35h30l-7 8 7 8H1z" fill="${color}" stroke="#1d1209" stroke-width="1.2"/><text x="13" y="-22" class="bt">${text}</text></g>`;
}
function arrowPath(path, side) {
  const pts = path.map(r => CENTER[r]);
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let k = 1; k < pts.length; k++) {
    const [x0, y0] = pts[k - 1], [x1, y1] = pts[k], mx = (x0 + x1) / 2, my = (y0 + y1) / 2, nx = -(y1 - y0), ny = x1 - x0, l = Math.hypot(nx, ny) || 1;
    const bend = side === 0 ? 26 : -26;
    d += ` Q${mx + nx / l * bend} ${my + ny / l * bend} ${k === pts.length - 1 ? x1 - (x1 - x0) * 0.16 : x1} ${k === pts.length - 1 ? y1 - (y1 - y0) * 0.16 : y1}`;
  }

}
function mapSVG() {

    <rect x="4" y="4" width="992" height="632" rx="16" fill="url(#vellum)"/><rect x="4" y="4" width="992" height="632" rx="16" filter="url(#paper)"/>
    ${compassRose(84, 74, 1)}
    <g class="ink deco">${[0, 1, 2].map(k => `<path d="M${880 + k * 22} ${560 + (k % 2) * 14}l18-30 18 30" fill="#d8c08c"/>`).join('')}${[0, 1].map(k => `<path d="M${850 + k * 40} ${80 + k * 12}q12-8 24 0t24 0" fill="none"/>`).join('')}</g>
    <text x="500" y="626" class="ink-text cartouche" text-anchor="middle">Bản đồ vùng biên</text>`;
  for (const r of REGION_IDS) {

  }

  for (const r of REGION_IDS) {

/* ── chronicle ── */
function chronicle(R) {
  const out = [], nm = i => (i === ME ? 'Quân ta' : `Quân ${civOf(FOE).name}`);
  const P = S.sides[ME];
  for (const e of R.ev) {
    if (e.k === 'battle') {
      const b = e.b, where = b.where ? `giữa đường ${rname(b.where[0])} và ${rname(b.where[1])}` : rname(b.r);
      const mineIdx = b.a === ME ? 'A' : 'D', mineBefore = b.a === ME ? b.before[0] : b.before[1], foeBefore = b.a === ME ? b.before[1] : b.before[0];
      const myLoss = b.a === ME ? b.lossA : b.lossD, foeLoss = b.a === ME ? b.lossD : b.lossA;
      const forts = b.forts && b.d === FOE ? ' cùng tháp lũy' : b.forts && b.d === ME ? ' (ta có tháp lũy giữ)' : '';
      out.push({ k: b.winner === ME ? 'win' : 'loss', t: `Trận ${where}: ta ${total(mineBefore) ? stackText(mineBefore) : 'chỉ có tháp lũy và dân'}, địch ${stackText(foeBefore)}${forts}. ${b.winner === ME ? 'Ta thắng' : 'Ta thua'}; ta mất ${total(myLoss) || 'không ai'}, địch mất ${total(foeLoss)}.` });
    } else if (e.k === 'raid') out.push({ k: e.side === ME ? 'win' : 'loss', t: e.side === ME ? `Quân ta tập kích ${rname(e.r)}, ${e.kills} dân địch thiệt mạng${e.loot ? `, thu ${e.loot.food} lương thực và ${e.loot.gold} vàng` : ''}.` : `Quân ${civOf(FOE).name} tập kích ${rname(e.r)}: ${e.kills} dân ta thiệt mạng, số còn lại chạy về kinh thành.` });
    else if (e.k === 'siege') out.push({ k: e.side === ME ? 'win' : 'loss', t: e.side === ME ? `Ta công phá ${rname(capOf(FOE))}: thành mất ${e.dmg} độ bền, còn ${e.hp}.` : `${rname(capOf(ME))} bị công: thành mất ${e.dmg} độ bền, còn ${e.hp}.` });
    else if (e.k === 'capture') { if (P.vis[e.r] !== 'fog') out.push({ k: e.side === ME ? 'win' : 'loss', t: e.side === ME ? `Ta chiếm ${rname(e.r)}.` : `${civOf(FOE).name} chiếm ${rname(e.r)}.` }); }
    else if (e.k === 'relic') out.push({ k: e.side === ME ? 'win' : 'loss', t: `${e.side === ME ? 'Thầy tu của ta' : `Thầy tu ${civOf(FOE).name}`} mang thánh tích về: ${e.total}/${RELIC_WIN}.` });
    else if (e.k === 'age') out.push({ k: 'age', t: e.side === ME ? `Ta bước sang ${AGES[e.age].name}, ${AGES[e.age].title.toLowerCase()}!` : `${civOf(FOE).name} đã lên ${AGES[e.age].name}.` });
    else if (e.k === 'built' && e.side === ME) out.push({ k: 'info', t: `Xây xong ${BUILDINGS[e.kind].name.toLowerCase()}${e.kind === 'tower' || e.kind === 'castle' || e.kind === 'town' ? ` ở ${rname(e.r)}` : ''}.` });
    else if (e.k === 'tech' && e.side === ME) out.push({ k: 'info', t: `Nghiên cứu xong ${TECHS[e.id].name.toLowerCase()}.` });
    else if (e.k === 'trained' && e.side === ME) out.push({ k: 'info', t: `Luyện xong ${Object.entries(e.units).map(([t, n]) => `${n} ${t === 'vill' ? 'dân' : unitName(t).toLowerCase()}`).join(', ')}.` });
    else if (e.k === 'attrition') out.push({ k: e.side === ME ? 'loss' : 'win', t: e.side === ME ? `Vườn không nhà trống: quân ta hao ${total(e.lost)} người trên đất địch.` : `Vườn không nhà trống: quân ${civOf(FOE).name} hao ${total(e.lost)} người trên đất ta.` });
    else if (e.k === 'retreat' && e.side === ME) out.push({ k: 'info', t: `Tàn quân (${stackText(e.units)}) rút về ${rname(e.to)}.` });
    else if (e.k === 'razed') out.push({ k: e.side === ME ? 'loss' : 'win', t: `${e.what === 'castle' ? 'Lâu đài' : 'Tháp canh'} ${e.side === ME ? 'của ta' : 'địch'} ở ${rname(e.r)} bị phá.` });
    else if (e.k === 'depleted' && e.side === ME) out.push({ k: 'info', t: 'Mỏ vàng gần kinh thành đã cạn. Vàng giờ chỉ còn ở giữa bản đồ.' });
    else if (e.k === 'wonder') out.push({ k: e.side === ME ? 'win' : 'loss', t: `${e.side === ME ? 'Kỳ quan của ta' : `Kỳ quan của ${civOf(FOE).name}`} đã xây xong! Đứng vững ${WONDER_HOLD} lượt là thắng.` });
    else if (e.k === 'collapse') out.push({ k: e.side === ME ? 'loss' : 'win', t: e.side === ME ? 'Không còn quân, dân tan tác: vương quốc sụp đổ.' : `${civOf(FOE).name} không còn quân, dân tan tác.` });
  }
  return out;
}

    <button class="seal small" data-a="newgame">Ván mới</button></div>`;
}

/* ── Controller ── */
const SAVE_KEY = 'len-doi.v1';
function freshMeta() { return { v: 1, sound: true, helped: false, games: 0, wins: 0, byCiv: {}, run: null }; }
function loadMeta() { try { const m = JSON.parse(localStorage.getItem(SAVE_KEY)); if (m && m.v === 1) return Object.assign(freshMeta(), m); } catch (e) { } return freshMeta(); }
function persist() { META.run = S && !S.over ? S : null; try { localStorage.setItem(SAVE_KEY, JSON.stringify(META)); } catch (e) { } }
let toastT = 0;
function toast(msg, good = true) { if (!msg) return; const t = $('#toast'); t.textContent = msg; t.className = 'show ' + (good ? 'good' : 'bad'); clearTimeout(toastT); toastT = setTimeout(() => { t.className = ''; }, 2600); }

function onRegion(r) {
  if (UI.mode && UI.mode.kind === 'move') {
    const reach = pathsFrom(S, ME, UI.mode.from, moveRange(S, ME, UI.mode.units));
    if (reach[r]) { UI.mode.to = r; SFX.play('click'); render(); return; }
    if (r === UI.mode.from) { UI.mode = null; render(); return; }
    toast('Vùng đó quá xa với đạo quân này.', false); return;
  }
  UI.sel = r; SFX.play('click'); render();
}
function checkMoveTarget() { if (UI.mode && UI.mode.to && !pathsFrom(S, ME, UI.mode.from, moveRange(S, ME, UI.mode.units))[UI.mode.to]) UI.mode.to = null; }
function onClick(e) {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  SFX.init();
  const a = el.dataset.a, x = el.dataset.x, r = el.dataset.r;
  let res = null;
  switch (a) {
    case 'region': onRegion(r); return;
    case 'job': res = setJob(S, ME, x, +el.dataset.d); break;
    case 'train': res = planTrain(S, ME, x, +el.dataset.d); break;
    case 'untrain': res = planTrain(S, ME, x, -1); break;
    case 'build': res = planBuild(S, ME, x, r); break;
    case 'unbuild': res = cancelBuild(S, ME, +el.dataset.i); break;
    case 'research': res = planResearch(S, ME, S.sides[ME].orders.research === x ? null : x); break;
    case 'scout': res = planScout(S, ME, r); break;
    case 'captab': UI.capTab = x; SFX.play('click'); render(); return;
    case 'move': UI.mode = { kind: 'move', from: r, units: { ...availableAt(S, ME, r) }, to: null }; SFX.play('click'); render(); return;
    case 'mvu': { const av = availableAt(S, ME, UI.mode.from); UI.mode.units[x] = clamp((UI.mode.units[x] || 0) + +el.dataset.d, 0, av[x] || 0); checkMoveTarget(); render(); return; }
    case 'mvall': UI.mode.units = { ...availableAt(S, ME, UI.mode.from) }; checkMoveTarget(); render(); return;
    case 'mvmounted': { const av = availableAt(S, ME, UI.mode.from); UI.mode.units = {}; for (const t in av) if (MOUNTED.has(UNITS[t].cls)) UI.mode.units[t] = av[t]; checkMoveTarget(); render(); return; }
    case 'mvcancel': UI.mode = null; render(); return;
    case 'mvok': res = planMove(S, ME, UI.mode.from, UI.mode.to, UI.mode.units); if (res.ok) { UI.mode = null; res.msg = 'Quân đã nhận lệnh.'; } break;
    case 'unmove': res = cancelMove(S, ME, +el.dataset.i); break;
    case 'commit': commit(); return;
    case 'closechron': afterChronicle(); return;
    case 'card': { const rr = chooseCard(S, ME, x); closeModal(); SFX.play('quill'); persist(); render(); toast(rr.msg); return; }
    case 'helped': META.helped = true; persist(); render(); return;
    case 'help': META.helped = false; UI.mode = null; render(); return;
    case 'sound': META.sound = !META.sound; SFX.on = META.sound; persist(); render(); return;
    case 'home': persist(); S = null; UI.mode = null; closeModal(); render(); window.scrollTo({ top: 0 }); return;
    case 'newgame': closeModal(); S = null; persist(); render(); window.scrollTo({ top: 0 }); return;
    case 'pickciv': UI.pick.civ = x; SFX.play('click'); render(); return;
    case 'pickfoe': UI.pick.foe = x; SFX.play('click'); render(); return;
    case 'pickdiff': UI.pick.diff = +x; SFX.play('click'); render(); return;
    case 'start': startGame(); return;
    case 'resume': S = META.run; UI.sel = 'c0'; UI.mode = null; render(); if (S.sides[ME].pendingCard) showModal(cardHTML()); return;
    case 'abandon': if (UI.confirm !== 'abandon') { UI.confirm = 'abandon'; render(); return; } UI.confirm = null; META.run = null; try { localStorage.setItem(SAVE_KEY, JSON.stringify(META)); } catch (e2) { } render(); return;
  }
  if (res) {
    if (!res.ok && res.msg) toast(res.msg, false); else if (res.ok && res.msg) toast(res.msg);
    SFX.play(res.ok ? (a === 'train' || a === 'build' || a === 'research' ? 'coin' : 'quill') : 'bad');
    if (res.ok) persist();
    render();
  }
}
function onKey(e) {
  const t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t.getAttribute && t.getAttribute('data-a') === 'region') { e.preventDefault(); onRegion(t.getAttribute('data-r')); return; }
  if (e.key === 'Escape' && S) { if (UI.mode) { UI.mode = null; render(); } else if ($('#modal .overlay') && !S.sides[ME].pendingCard) afterChronicle(); }
}
function startGame() {
  const foe = UI.pick.foe === 'random' ? CIV_ORDER[Math.floor(Math.random() * CIV_ORDER.length)] : UI.pick.foe;
  const seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
  S = newGame({ seed, civ0: UI.pick.civ, civ1: foe, ai1: true, diff: UI.pick.diff });
  aiPlan(S, FOE);
  UI.sel = 'c0'; UI.mode = null; UI.capTab = 'train';
  persist(); render(); window.scrollTo({ top: 0 }); SFX.play('horn');
}
function commit() {
  if (S.over) return;
  SFX.play('drum');
  const R = resolveTurn(S);
  if (!S.over) aiPlan(S, FOE);
  UI.mode = null;
  persist(); render();
  if (R.battles.length) setTimeout(() => SFX.play('clash'), 450);
  if (R.ev.some(e => e.k === 'age' && e.side === ME)) setTimeout(() => SFX.play('age'), 700);
  showModal(reportHTML(R));
}
function afterChronicle() {
  closeModal();
  if (S.over) {
    if (!S.counted) { S.counted = true; META.games++; if (S.winner === ME) META.wins++; const b = META.byCiv[S.sides[ME].civ] || { g: 0, w: 0 }; b.g++; if (S.winner === ME) b.w++; META.byCiv[S.sides[ME].civ] = b; persist(); }
    render(); showModal(endHTML()); SFX.play(S.winner === ME ? 'win' : 'lose'); return;
  }
  if (S.sides[ME].pendingCard) showModal(cardHTML());
}
function boot() {
  META = loadMeta(); SFX.on = META.sound !== false;
  if (!/game-age-duel\.html$/.test(location.pathname) || /claude/.test(location.hostname)) document.documentElement.classList.add('no-home');
  document.addEventListener('click', onClick);
  document.addEventListener('keydown', onKey);
  render();
}

boot();
</script>
